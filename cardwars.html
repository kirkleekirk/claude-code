function starPts(r1, r2, n, ox, oy, rot) { const p = []; for (let i = 0; i < n * 2; i++) { const a = Math.PI * i / n + (rot || 0), r = i % 2 ? r2 : r1; p.push([(ox || 0) + r * Math.cos(a), (oy || 0) + r * Math.sin(a)]); } return p; }
function scallopPts(r, bump, n, k) { const p = []; const m = n * (k || 4); for (let i = 0; i < m; i++) { const a = 2 * Math.PI * i / m; const t = (i % (k || 4)) / (k || 4); const rr = r + bump * Math.sin(Math.PI * t); p.push([rr * Math.cos(a), rr * Math.sin(a)]); } return p; }
function arch(w, h, n) { const p = [[-w / 2, 0], [w / 2, 0]]; for (let i = 0; i <= (n || 8); i++) { const a = Math.PI * i / (n || 8); p.push([w / 2 * Math.cos(a), h - w / 2 + w / 2 * Math.sin(a)]); } return p.slice(0, 2).concat(p.slice(2)); }

// ---------------------------------------------------------------- rigs
// Four legs with walk channels (bones 1-4). Legs hang from hip height h at (±x, z front/back).
function legs4(b, x, zf, zb, h, r, col) {
  const L = [[1, -x, zf, 0], [2, x, zf, Math.PI], [3, -x, zb, Math.PI], [4, x, zb, 0]];
  b.push().c(col);
  for (const [bone, lx, lz, ph] of L) { b.b(bone).at(lx, h / 2, lz, q => q.cyl(r * 0.85, r, h, 7)); b.ch(bone, lx, h, lz, 'leg', 'x', 26, ph); }
  b.b(0).pop();
  return b;
}
// Two legs (bones 1,2) and two arms (bones 3,4) for bipeds. Returns hip/shoulder data.
function legs2(b, x, h, r, col, foot) {
  b.push().c(col);
  for (const [bone, lx, ph] of [[1, -x, 0], [2, x, Math.PI]]) {
    b.b(bone).at(lx, h / 2, 0, q => q.cyl(r * 0.9, r, h, 7));
    if (foot) b.at(lx, r * 0.6, r * 0.6, q => q.c(foot).ell(r * 1.3, r * 0.7, r * 1.8, 8, 5)).c(col);
    b.ch(bone, lx, h, 0, 'leg', 'x', 24, ph);
  }
  b.b(0).pop();
  return b;
}
function arm(b, bone, sx, sy, sz, pts, r, col, kind, amp, ph) {
  b.push().c(col).b(bone).tube(pts.map(p => [sx + p[0], sy + p[1], sz + p[2]]), r, 6).b(0).pop();
  b.ch(bone, sx, sy, sz, kind || 'arm', 'x', amp == null ? 18 : amp, ph || 0);
  return b;
}

function own(id) { return S.cards[id] ? S.cards[id].n : 0; }
function lvl(id) { return S.cards[id] ? S.cards[id].lvl || 1 : 1; }
function maxCopies(id) { return E.CARDS[id].r === 'L' ? 1 : 2; }
function grant(id, n) { const c = S.cards[id] || (S.cards[id] = { n: 0, lvl: 1 }); const add = Math.min(n, maxCopies(id) - c.n); c.n += Math.max(0, add); return Math.max(0, add); }
function unlockLand(land, silent) {

  for (const id in cnt) grant(id, cnt[id]);
  if (!S.decks.some(d => d.from === land)) S.decks.push({ name: st.name, lands: st.lands.slice(), cards: st.cards.slice(), from: land });
  save();

}

    else { S.stats.losses++; S.stats.streak = 0; S.stats.byLand[land].l++; sparks = 10; packN = 1; }

    '<div class="cups"><div class="cup' + (myCup === 'lose' ? ' lose mine' : '') + '" style="--liq:#6a7b2a">DWEEB</div><div class="cup' + (myCup === 'win' ? ' win mine' : '') + '" style="--liq:#5b2d0e">COOL<br>GUY</div></div>' +

    (sparks ? '<div class="rw"><span>Sparks</span><b id="sparkCount">0</b></div>' : '') + '</div>' +
    (first ? '<p class="center" style="color:#7dff9a;font-weight:900">First win against ' + esc(o.name) + '! +20 bonus Sparks</p>' : '') +
    (unlocked ? '<p class="center" style="color:#ffcf3a;font-weight:900">New deck unlocked: ' + esc(E.STARTERS[unlocked].name) + '!</p>' : '') +
    '<div class="menu" style="margin-top:.6rem">' + (packN ? '<button class="btn" data-pack>Open card pack (' + packN + ')</button>' : '') +

}
// Confetti in the colours of all six landscapes.
function confetti() {

function rollCard() {
  const pool = E.COLLECTIBLE.filter(id => { const cd = E.CARDS[id]; return cd.land === 'rainbow' || S.unlocked[cd.land]; });
  const roll = Math.random() * 100, r = roll < 2 ? 'L' : roll < 12 ? 'E' : roll < 40 ? 'R' : 'C';
  let cand = pool.filter(id => E.CARDS[id].r === r);

}

  else if (pt.cell) { const p = Scene.headPos(pt.cell[0], pt.cell[1], pt.cell[2]); tgt = { x: p.x, y: p.y - 10 }; }
  if (tgt && !s.wait) { arrow.style.display = 'block'; arrow.style.left = (tgt.x - 24) + 'px'; arrow.style.top = (tgt.y - 50) + 'px'; } else arrow.style.display = 'none';
  const ok = c.querySelector('#coachOk');
  if (ok) ok.onclick = () => { hide(); finishScript(); };
}
function finishScript() { on = false; const seat = UI.M.seats[1]; delete seat.plan; UI.toast('Wipe out Jake’s kingdom to finish the tutorial!'); }
function hide() { const c = $('#coach'); c.classList.remove('on'); c.innerHTML = ''; }
function skip() {
  on = false; hide();
  Meta.S.tutorialDone = true; Meta.save();
  UI.quit(); Meta.home();
}
window.addEventListener('resize', () => { if (on) setTimeout(show, 80); });
return { start, skip, get active() { return on; }, get step() { return step; } };
})();
/* END TUTORIAL */

/* MAIN */
// Boot: load save, start the 3D table, wire resize/orientation/visibility, run the frame loop.
(function () {
'use strict';
const cv = document.getElementById('cv'), ov = document.getElementById('ov');
let last = 0, running = true, raf = 0;
function frame(ts) {
  raf = 0;
  if (!running) return;
  const t = ts / 1000, dt = Math.min(0.05, last ? t - last : 0.016);
  last = t;
  try { UI.tick(dt); Scene.frame(ts, dt); } catch (e) { console.error(e); }
  adapt(dt);
  raf = requestAnimationFrame(frame);
}
// Adaptive quality: if a match keeps running below ~38 fps, drop to battery-saver resolution once.
let slowAcc = 0, slowN = 0, adapted = false;
function adapt(dt) {
  if (adapted || UI.screen !== 'match' || Meta.S.settings.quality < 1) return;
  slowAcc += dt; slowN++;
  if (slowN >= 180) {
    if (slowAcc / slowN > 0.026) { adapted = true; Meta.S.settings.quality = 0.75; Meta.save(); Meta.applySettings(); UI.toast('Switched to Battery saver graphics for smoother play'); }
    slowAcc = 0; slowN = 0;
  }
}
function noGL() {
  document.getElementById('app').innerHTML = '<div style="position:fixed;inset:0;display:grid;place-items:center;padding:2rem;text-align:center;background:#2f6e33;color:#fff;font:600 1rem system-ui,sans-serif">' +
    '<div><div style="font:900 2.4rem Georgia,serif;color:#ffe14a;text-shadow:0 .2rem 0 #5a0606">CARD WARS</div><p>This game draws its holographic board with WebGL, and this browser has WebGL turned off or unavailable.</p>' +
    '<p>Try a current Chrome, Safari, Firefox or Edge, or switch hardware acceleration on.</p></div></div>';
}
function boot() {
  Meta.load();
  if (!Scene.init(cv, ov)) { noGL(); return; }
  UI.init();
  Meta.applySettings();
  UI.layout();
  Meta.home();
  raf = requestAnimationFrame(frame);
  testHooks();
}
// Test hooks (used by the automated smoke test and screenshots): #match, #autoplay[=N], #tutorial, #setup
function testHooks() {
  const h = location.hash || '';
  const E = Engine, S = Meta.S;
  const ensure = () => { if (!S.started) { S.started = true; S.starter = 'blue'; Meta.unlockLand('blue', true); Meta.unlockLand('corn', true); Meta.save(); } };
  window.CW = {
    stats: { games: 0, errors: 0, rounds: [], reasons: [] },
    state: () => UI.M.st,
    autoplay(n, speed) {
      ensure();
      const keys = E.LAND_TYPES; let i = 0;
      UI.settings.speed = speed || 6; UI.D.speed = speed || 6;
      const one = () => {
        if (i >= n) { window.CW.done = true; return; }
        const a = keys[i % keys.length], b = keys[(i * 5 + 2) % keys.length]; i++;
        const seat = (land, k) => ({ kind: 'ai', name: E.STARTERS[land].name.split('’')[0], hero: Meta.HEROES[land], deck: E.STARTERS[land], difficulty: k ? 'normal' : 'hard', personality: 'balanced', lines: ['Mathematical!'] });
        UI.start({ seed: 'auto' + i, mode: 'ai', seats: [seat(a, 0), seat(b, 1)], onEnd: res => { window.CW.stats.games++; window.CW.stats.rounds.push(res.rounds); window.CW.stats.reasons.push(res.reason); setTimeout(one, 300); } });
      };
      one();
    }
  };
  window.CW.custom = function (o) {
    ensure();
    const K = E.kit;
    o = Object.assign({ hand: [], mine: [], theirs: [], bmine: [], btheirs: [], lands0: ['blue', 'blue', 'blue', 'blue'], lands1: ['corn', 'corn', 'corn', 'swamp'], ohand: ['r_bloodstorm', 'r_pancakes', 'c_husker'], keep: false }, o || {});
    UI.start({ seed: 'custom', mode: 'ai', first: 0, noMulligan: true, noSetup: true,
      seats: [Meta.mySeat({ lands: o.lands0, cards: E.STARTERS.blue.cards }), { kind: 'ai', name: 'Jake', hero: 'jake', deck: E.STARTERS.corn, difficulty: 'normal', personality: 'aggro', lines: ['Hmph.'] }],
      setup: st => {
        if (!o.keep) K.clear(st);
        K.lands(st, 0, o.lands0); K.lands(st, 1, o.lands1);
        K.hand(st, 0, o.hand); K.hand(st, 1, o.ohand);
        o.mine.forEach(([l, id, x]) => K.put(st, 0, l, id, x)); o.theirs.forEach(([l, id, x]) => K.put(st, 1, l, id, x));
        o.bmine.forEach(([l, id, x]) => K.build(st, 0, l, id, x)); o.btheirs.forEach(([l, id, x]) => K.build(st, 1, l, id, x));
        st.players[0].actions = 2;
      }, onEnd: () => Meta.home() });
  };
  const vsJake = extra => { ensure(); const o = Meta.TOUR[Meta.TOUR.length - 1]; UI.start(Object.assign({ seed: 'shot', mode: 'ai', first: 0, seats: [Meta.mySeat(Meta.activeDeck()), { kind: 'ai', name: o.name, hero: o.hero, deck: o.deck, difficulty: 'normal', personality: o.pers, lines: o.lines }], onEnd: () => Meta.home() }, extra || {})); };
  if (h.indexOf('#autoplay') === 0) { const n = +(h.split('=')[1] || 3); window.CW.autoplay(n, 6); }
  else if (h === '#match') vsJake({ noMulligan: true, noSetup: true });
  else if (h === '#setup') vsJake({ noMulligan: true });
  else if (h === '#tutorial') { ensure(); Tutorial.start(); }
}
let rt = 0;
const relayout = () => { clearTimeout(rt); rt = setTimeout(() => { UI.layout(); }, 60); };
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', () => setTimeout(() => UI.layout(), 250));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; Sound.suspend(true); }
  else { running = true; last = 0; Sound.suspend(false); if (!raf) raf = requestAnimationFrame(frame); }
});
window.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('#hand, #cv, .cgrid')) e.preventDefault(); });
window.addEventListener('error', e => { try { UI.toast('Oops: ' + (e.message || 'error')); } catch (_) { /* ignore */ } });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
/* END MAIN */

</script>

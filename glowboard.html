<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Card Wars: Glowboard</title>
<!--
CARD WARS: GLOWBOARD  (glowboard.html)
A fan-made, offline, single-file tribute to "Card Wars" from Adventure Time (S4E14). Not affiliated with
Cartoon Network. Vanilla JS + Canvas 2D + DOM/CSS. No libraries, fonts, images, audio files or network.

ASSUMPTIONS / DECISIONS
- Director's note wins: the game plays like Card Wars in the show (and its official 2014 adaptations), and
  the original GLOWBOARD brief is mapped onto it:
  * 9x13 grid, Wells, Keep/Watchposts -> 4 lanes, Landscapes, 25 hero HP (as in the show / official game).
  * Glow resource -> 2 Actions per turn (official). 1 Action draws a card or moves a creature one lane.
  * "Surge" -> FLOOP (turn the card sideways). Placing a card also "floops" it onto the board.
  * Factions -> 6 Landscapes: Blue Plains (Finn), Cornfield (Jake), Useless Swamp, IcyLands, NiceLands,
    LavaFlats, plus Rainbow neutrals. 12 signature cards each + 11 Rainbow cards + 3 tokens.
  * Champions cost 2 Actions but need 3 matching face-up Landscapes (official cost = requirement rule).
  * Structures can be attacked: an undefended lane hits the building first, excess spills to the hero
    (the show: "I'm attacking your schoolhouse with my Husker Knights").
  * Show cards: Pig (eats landscapes, gets stuck in mud), Husker Knight, Silo of Truth, Cerebral
    Bloodstorm, Field of Nightmares + Earlings, Teleport, Volcano, Reclaim Landscape, Immortal Maize Walker,
    Wandering Bald Man, Archer Dan, The Reaper, Cool Dog, Ancient Scholar, Schoolhouse, Spirit Tower,
    Cave of Solitude. Holograms glow in the controller's colour (Finn blue / Jake orange) like the episode.
- Decks are 20 cards (brief) instead of 40; first player skips the first draw and cannot floop/fight on
  turn 1; from round 15 the board overheats (growing damage) so games always end.
- The AI plans on Engine.redact(state): it never sees hidden hands, deck order or face-down traps.
- Card levels: L2 +1 DEF, L3 +1 ATK (spells +1 power), L4 +1 DEF. Balance sims use level 1.
- Character portraits and minis are simplified procedural fan art; quotes are short paraphrases.

STRUCTURE (one <script>)
  /* ENGINE */ ... /* END ENGINE */  pure deterministic rules + card data (no DOM)   <- extract for tests
  /* AI */     ... /* END AI */      beam-search opponent using only redacted states
  /* ART */ /* RENDER */ /* AUDIO */ /* UI */ /* META */ /* TUTORIAL */ /* MAIN */
Dev sources, rule tests (node test/engine.test.js) and the balance harness (node test/balance.js) live in
glowboard-dev/ next to this file; build with: node glowboard-dev/build.js

-->
<style>
:root{
  --s:1; --ts:1;
  --bg:#120d1d; --panel:#211a33; --panel2:#2d2346; --line:rgba(255,255,255,.12); --ink:#1b1424; --txt:#f6f1ff; --mut:#b6a9d6;
  --gold:#ffcf3a; --me:#3fc8ff; --opp:#ff9a2e;
  --blue:#4aa8ff; --corn:#ffcf3a; --swamp:#b077f0; --ice:#8fe9ff; --nice:#ff8fd0; --lava:#ff6b3d; --rainbow:#d9cff7;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --display: "Arial Rounded MT Bold", "Arial Black", ui-rounded, system-ui, sans-serif;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--s) * var(--ts));height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#app{position:fixed;inset:0;pointer-events:none}
#app>*{pointer-events:auto}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
#screens{position:absolute;inset:0;pointer-events:none}
#screens>.screen{pointer-events:auto}
.hide{display:none!important}

/* ---------- buttons */
.btn{font-weight:900;border:0;border-radius:.75rem;padding:.6rem 1.1rem;font-size:1rem;color:#3a1d00;cursor:pointer;
  background:linear-gradient(#ffe978,#ffb21e);box-shadow:0 .28rem 0 #b06a00,0 .5rem .9rem rgba(0,0,0,.45);
  text-shadow:0 1px 0 rgba(255,255,255,.55);letter-spacing:.02em;transition:transform .08s, filter .2s;position:relative}
.btn:active{transform:translateY(.2rem);box-shadow:0 .08rem 0 #b06a00,0 .2rem .4rem rgba(0,0,0,.4)}
.btn.blue{color:#fff;background:linear-gradient(#86dbff,#2f8ee8);box-shadow:0 .28rem 0 #1b5799,0 .5rem .9rem rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.green{color:#fff;background:linear-gradient(#8ff09a,#2fb84a);box-shadow:0 .28rem 0 #17702a,0 .5rem .9rem rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.red{color:#fff;background:linear-gradient(#ff8a8a,#e23b4b);box-shadow:0 .28rem 0 #8e1b27,0 .5rem .9rem rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.ghost{color:var(--txt);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);text-shadow:none}
.btn.small{font-size:.8rem;padding:.4rem .7rem;border-radius:.55rem}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:default}
.iconbtn{width:2.5rem;height:2.5rem;border-radius:.8rem;border:0;background:rgba(20,14,34,.78);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),0 .2rem .5rem rgba(0,0,0,.4);
  color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:1.4rem;height:1.4rem}
.iconbtn.txt{font-weight:900;font-size:.85rem}
.iconbtn:active{transform:scale(.92)}

/* ---------- seats (HUD) */
.seat{position:absolute;display:flex;align-items:center;gap:.5rem;pointer-events:auto}
.seat .pf{width:3.3rem;height:3.3rem;border-radius:50%;overflow:hidden;flex:none;position:relative;background:#2a2140;
  box-shadow:0 0 0 .18rem var(--c,#fff),0 .25rem .6rem rgba(0,0,0,.5)}
.seat .pf canvas,.seat .pf img{width:100%;height:100%;display:block}
.seat .who{flex:1;min-width:0}
.seat .nm{font-weight:900;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.seat .nm small{font-weight:700;color:var(--mut);margin-left:.3rem}
.hp{position:relative;height:1.15rem;border-radius:.6rem;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);overflow:hidden;margin-top:.2rem}
.hp .f{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff8d8d,#e3344a);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.hp .g{position:absolute;left:0;top:0;bottom:0;background:#fff;opacity:.55;transition:width .9s .35s ease-out}
.hp .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:.78rem;text-shadow:0 1px 2px #000}
.seat .chips{display:flex;gap:.35rem;margin-top:.25rem;font-size:.68rem;color:var(--mut);font-weight:800;align-items:center}
.chip{display:inline-flex;align-items:center;gap:.15rem}
.chip svg{width:.85rem;height:.85rem}
.gems{display:flex;gap:.25rem;align-items:center}
.gem{width:1.25rem;height:1.25rem;transform:rotate(45deg);border-radius:.25rem;background:#2a2140;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);transition:all .25s}
.gem.on{background:linear-gradient(135deg,#fff7a8,#ffcf3a 45%,#ff9d00);box-shadow:0 0 .6rem #ffcf3a,inset 0 0 0 2px #fff6}
.gem.pop{animation:gempop .45s}
@keyframes gempop{0%{transform:rotate(45deg) scale(.3)}60%{transform:rotate(45deg) scale(1.35)}100%{transform:rotate(45deg) scale(1)}}
.seat.turn .pf{animation:turnglow 1.6s infinite}
@keyframes turnglow{50%{box-shadow:0 0 0 .18rem var(--c,#fff),0 0 1.2rem var(--c,#fff)}}
.seat .shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-.35rem)}40%{transform:translateX(.3rem)}60%{transform:translateX(-.2rem)}80%{transform:translateX(.1rem)}}
.bubble{position:absolute;z-index:5;background:#fff;color:#1b1424;font-weight:900;padding:.35rem .6rem;border-radius:.8rem;font-size:.8rem;
  box-shadow:0 .3rem .8rem rgba(0,0,0,.5);white-space:nowrap;transform-origin:left center;animation:bub .3s;pointer-events:none}
@keyframes bub{from{transform:scale(.2);opacity:0}}
.mebtns{display:flex;gap:.45rem;align-items:center;flex:none}
body.wide #me{flex-wrap:wrap;height:auto;align-content:flex-end}
body.wide #me .mebtns{width:100%;padding-left:.2rem;margin-top:.15rem}
.card .nm.long{font-size:.43em}
.card .nm.xl{font-size:.38em}
.drawbtn{display:flex;flex-direction:column;align-items:center;gap:.05rem;font-size:.62rem;padding:.35rem .5rem;line-height:1}
.drawbtn b{font-size:.78rem}
.nextcard{width:1.9rem;height:2.6rem;border-radius:.3rem;background-size:cover;background-position:center;box-shadow:0 0 0 2px var(--c,#fff),0 .2rem .4rem rgba(0,0,0,.5);position:relative;flex:none}
.nextcard i{position:absolute;bottom:-.75rem;left:50%;transform:translateX(-50%);font-size:.5rem;font-style:normal;font-weight:900;color:var(--mut);white-space:nowrap}

/* ---------- match layout: portrait */
body.portrait #opp{top:calc(env(safe-area-inset-top) + .4rem);left:.5rem;right:3.4rem;height:3.6rem}
body.portrait #me{bottom:calc(env(safe-area-inset-bottom) + 9.4rem);left:.5rem;right:7rem;height:3.6rem}
body.portrait #hand{left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + .2rem);height:9rem}
body.portrait #fightWrap{right:.5rem;bottom:calc(env(safe-area-inset-bottom) + 9.5rem)}
body.portrait #board-area{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 4.2rem);bottom:calc(env(safe-area-inset-bottom) + 13.3rem)}
body.portrait #sideBtns{top:calc(env(safe-area-inset-top) + .45rem);right:.45rem;flex-direction:column}
body.portrait #undoBtn{left:.5rem;bottom:calc(env(safe-area-inset-bottom) + 13.5rem)}
body.portrait #tip{left:.6rem;right:.6rem;bottom:calc(env(safe-area-inset-bottom) + 13.6rem)}
/* ---------- match layout: wide (landscape + desktop) */
body.wide #opp{top:.5rem;left:.5rem;width:12.6rem;height:4rem}
body.wide #me{bottom:3.3rem;left:.5rem;width:12.6rem;height:4rem}
body.wide #hand{top:.5rem;right:.5rem;bottom:5.2rem;width:15rem}
body.wide #fightWrap{right:.5rem;bottom:.5rem;width:15rem}
body.wide #fightWrap .fight{width:100%}
body.wide #board-area{position:absolute;left:13.4rem;right:15.8rem;top:0;bottom:0}
body.wide #sideBtns{left:.5rem;top:5rem;flex-direction:row}
body.wide #undoBtn{left:.5rem;bottom:.5rem}
body.wide #tip{left:.5rem;width:12.6rem;top:8.2rem;font-size:.7rem}
#board-area{pointer-events:none}
#match{pointer-events:none!important}
#match .seat,#match #fightWrap,#match #sideBtns,#match #undoBtn,#match .panel,#match #timer{pointer-events:auto}
#sideBtns{position:absolute;display:flex;gap:.4rem;z-index:6}
#undoBtn{position:absolute;z-index:6}
#undoBtn.off{opacity:0;pointer-events:none}
#fightWrap{position:absolute;z-index:6}
.fight{min-width:6.2rem;height:3.5rem;font-size:1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.2rem .8rem;line-height:1}
.fight small{font-size:.58rem;font-weight:800;opacity:.85;margin-top:.15rem;white-space:nowrap}
.fight.ready{animation:fightpulse 1.1s infinite}
@keyframes fightpulse{50%{box-shadow:0 .28rem 0 #b06a00,0 0 1.4rem #ffd54a,0 0 2.6rem #ff9d00}}
.fight.wait{filter:grayscale(.9) brightness(.65)}

/* ---------- hand */
#hand{position:absolute;z-index:5;pointer-events:none}
#hand .card{position:absolute;pointer-events:auto;transition:transform .22s cubic-bezier(.2,.8,.2,1),left .22s,top .22s,filter .2s,opacity .2s;cursor:grab}
#hand .card.sel{z-index:20}
#hand .card.drag{opacity:.25}
.dragghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%) scale(.9);opacity:.92;filter:drop-shadow(0 .6rem .8rem rgba(0,0,0,.6))}

/* ---------- card face (em-based, scales with font-size) */
.card{--fc:#888;font-size:1rem;width:4.9em;height:6.9em;border-radius:.5em;position:relative;color:#fff;
  background:linear-gradient(160deg,color-mix(in srgb,var(--fc) 70%,#fff 10%),color-mix(in srgb,var(--fc) 55%,#120c22));
  box-shadow:0 .25em .5em rgba(0,0,0,.55),inset 0 0 0 .14em rgba(255,255,255,.35);overflow:hidden;flex:none}
.card .in{position:absolute;inset:.18em;border-radius:.38em;background:linear-gradient(#251d3a,#140f22);overflow:hidden}
.card .art{position:absolute;left:.12em;right:.12em;top:1.05em;height:3.25em;border-radius:.25em;background-size:cover;background-position:center bottom;
  box-shadow:inset 0 0 0 .07em rgba(255,255,255,.18)}
.card .nm{position:absolute;left:2.45em;right:.5em;top:.32em;font-weight:900;font-size:.5em;line-height:1.05;height:2.1em;display:flex;align-items:center;
  text-shadow:0 1px 1px #000;overflow:hidden}
.card .cost{position:absolute;left:-.04em;top:-.04em;width:1.2em;height:1.2em;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1em;
  background:radial-gradient(circle at 35% 30%,#fff,var(--fc) 45%,color-mix(in srgb,var(--fc) 50%,#000));color:#1b1424;box-shadow:0 0 0 .1em #1b1424,0 .1em .2em rgba(0,0,0,.5);z-index:2}
.card .cost span{font-size:.72em}
.card .req{position:absolute;left:.08em;top:1.18em;display:flex;flex-direction:column;gap:.04em;z-index:2}
.card .req i{width:.36em;height:.36em;border-radius:50%;background:var(--fc);box-shadow:0 0 0 .05em #1b1424}
.card .ty{position:absolute;left:.2em;right:.2em;top:4.36em;font-size:.36em;font-weight:800;color:#d8cdf7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;text-transform:uppercase}
.card .tx{position:absolute;left:.25em;right:.25em;top:4.75em;bottom:.62em;font-size:.38em;line-height:1.2;color:#efe9ff;overflow:hidden}
.card .tx b{color:#fff3a6}
.card .st{position:absolute;bottom:.08em;height:.95em;min-width:.95em;padding:0 .14em;border-radius:.35em;display:grid;place-items:center;font-weight:900;font-size:.82em;
  box-shadow:0 0 0 .08em #1b1424;text-shadow:0 1px 1px #0008;z-index:2}
.card .st.a{left:.08em;background:linear-gradient(#ffd27a,#f08a1c);color:#fff}
.card .st.d{right:.08em;background:linear-gradient(#ff8f9a,#d92f4a);color:#fff}
.card .st.b{right:.08em;background:linear-gradient(#b8c7ff,#5a6fd6);color:#fff}
.card .rar{position:absolute;right:.1em;top:.12em;width:.5em;height:.5em;transform:rotate(45deg);z-index:2}
.card.r-C .rar{background:#cfd6e2}
.card.r-R .rar{background:#8fe4ff;box-shadow:0 0 .2em #8fe4ff}
.card.r-E .rar{background:#d58bff;box-shadow:0 0 .25em #d58bff}
.card.r-L .rar{background:#ffd23f;box-shadow:0 0 .3em #ffd23f}
.card.r-E{box-shadow:0 .25em .5em rgba(0,0,0,.55),inset 0 0 0 .14em #d58bff,0 0 .5em rgba(213,139,255,.45)}
.card.r-L{box-shadow:0 .25em .5em rgba(0,0,0,.55),inset 0 0 0 .14em #ffd23f,0 0 .7em rgba(255,210,63,.6)}
.card.r-L::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.2s infinite;pointer-events:none}
@keyframes shine{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.card .lvl{position:absolute;left:50%;bottom:.1em;transform:translateX(-50%);font-size:.34em;font-weight:900;background:#000a;padding:.05em .35em;border-radius:.4em;color:#ffe48a;z-index:2}
.card .cnt{position:absolute;right:.25em;top:2em;font-size:.45em;font-weight:900;background:#000b;padding:.05em .35em;border-radius:.4em;z-index:3}
.card.dim{filter:grayscale(.75) brightness(.62)}
.card.sel{box-shadow:0 0 0 .14em #fff,0 0 1em #fff8,0 .6em 1em rgba(0,0,0,.6)}
.card.back{background:repeating-linear-gradient(45deg,#2c2150 0 .4em,#241a43 .4em .8em);box-shadow:0 .25em .5em rgba(0,0,0,.5),inset 0 0 0 .14em #8a7bd9}
.card.back::before{content:"CW";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:1.4em;color:#b9adf0;text-shadow:0 0 .4em #8a7bd9}
.card.mini .tx,.card.mini .ty{display:none}
.card.big{font-size:2.55rem}
.card.big .nm{font-size:.42em}
.card.big .tx{font-size:.3em}
.card.big .ty{font-size:.28em;top:5.6em}
.card.big .tx{top:6.15em}

/* ---------- panels, tips, banner */
.panel{position:absolute;z-index:30;background:rgba(24,18,40,.95);border-radius:1rem;box-shadow:0 0 0 2px rgba(255,255,255,.12),0 1rem 2rem rgba(0,0,0,.6);display:none}
.panel.on{display:block;animation:pop .18s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.tip{position:absolute;z-index:8;pointer-events:none;background:rgba(18,13,30,.92);border-radius:.8rem;padding:.45rem .6rem;font-size:.74rem;line-height:1.3;
  box-shadow:0 0 0 2px rgba(255,255,255,.12),0 .4rem 1rem rgba(0,0,0,.5);display:none}
.tip.on{display:block;animation:pop .15s}
.tip h4{margin:0 0 .15rem;font-size:.85rem}
.tip .warn{color:#ffb4b4;font-weight:800}
.tip .kw{color:#fff3a6;font-weight:800}
#banner{position:absolute;left:0;right:0;top:40%;z-index:40;text-align:center;pointer-events:none;display:none}
#banner.on{display:block}
#banner div{display:inline-block;font-family:var(--display);font-weight:900;font-size:2.3rem;letter-spacing:.06em;color:#fff;padding:.4rem 2rem;
  background:linear-gradient(90deg,transparent,rgba(30,20,60,.92) 15%,rgba(30,20,60,.92) 85%,transparent);
  text-shadow:0 0 .6rem var(--bc,#3fc8ff),0 .15rem 0 #000;animation:bannerin 1.25s cubic-bezier(.2,.8,.2,1) forwards}
#banner small{display:block;font-size:.8rem;letter-spacing:.1em;opacity:.8}
@keyframes bannerin{0%{transform:translateX(-120%)}22%{transform:translateX(0)}78%{transform:translateX(0);opacity:1}100%{transform:translateX(120%);opacity:0}}
#info{left:50%;transform:translateX(-50%);bottom:13.6rem;width:min(23rem,94vw);padding:.7rem}
body.wide #info{bottom:.6rem;left:auto;right:16rem;transform:none;width:21rem}
@media (min-height:560px){body.wide #info{left:.5rem;right:auto;top:8.2rem;bottom:auto;width:12.6rem;transform:none}
  body.wide #info .row{flex-direction:column;align-items:center}body.wide #info .card{font-size:1.15rem}}
#info .row{display:flex;gap:.6rem;align-items:flex-start}
#info .card{font-size:1.3rem}
#info .desc{flex:1;font-size:.76rem;line-height:1.3}
#info .desc h3{margin:0 0 .2rem;font-size:.95rem}
#info .stats{display:flex;gap:.3rem;flex-wrap:wrap;margin:.25rem 0}
#info .pill{font-size:.66rem;font-weight:800;padding:.12rem .4rem;border-radius:.5rem;background:rgba(255,255,255,.1)}
#info .acts{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
#info .x{position:absolute;right:.4rem;top:.3rem;background:none;border:0;color:#fff;font-size:1.2rem;cursor:pointer}
#logDrawer{right:.5rem;top:4.6rem;width:min(20rem,92vw);max-height:60%;overflow:auto;padding:.6rem;font-size:.72rem;line-height:1.35}
body.wide #logDrawer{left:13.6rem;right:auto;top:.5rem}
#logDrawer .l{padding:.18rem 0;border-bottom:1px solid rgba(255,255,255,.07)}
#logDrawer .l.t0{color:#9fe1ff}#logDrawer .l.t1{color:#ffc58a}#logDrawer .l.sys{color:#fff3a6;font-weight:800}
#emotes{right:3.3rem;top:4.6rem;padding:.5rem;display:none;gap:.4rem;grid-template-columns:1fr 1fr}
#emotes.on{display:grid}
body.wide #emotes{left:5rem;right:auto;top:8rem}
#emotes button{border:0;border-radius:.7rem;padding:.4rem .5rem;font-weight:900;background:#fff;color:#1b1424;font-size:.78rem;cursor:pointer;display:flex;align-items:center;gap:.3rem}
#emotes button canvas{width:1.6rem;height:1.6rem;border-radius:50%}
#coach{position:absolute;z-index:45;display:none;pointer-events:none}
#coach.on{display:block}
#coach .say{position:absolute;pointer-events:auto;background:#fff;color:#1b1424;border-radius:1rem;padding:.6rem .8rem;font-size:.85rem;font-weight:700;line-height:1.35;
  box-shadow:0 .5rem 1.4rem rgba(0,0,0,.55);width:min(21rem,90vw);display:flex;gap:.6rem;align-items:flex-start;font-size:.8rem}
#coach .say canvas{width:2.6rem;height:2.6rem;flex:none}
#coach .say b{color:#7a2fd0}
#coach .arrow{position:absolute;width:3rem;height:3rem;pointer-events:none;animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translateY(-.5rem)}}
#timer{position:absolute;z-index:7;right:.6rem;font-weight:900;font-size:.8rem;display:none;background:#000a;padding:.15rem .45rem;border-radius:.5rem}
body.portrait #timer{bottom:calc(env(safe-area-inset-bottom) + 13.4rem)}
body.wide #timer{right:16rem;top:.5rem}
#timer.on{display:block}
#timer.low{color:#ff8080;animation:shake .5s infinite}

/* ---------- modal & toast */
#modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(8,5,16,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);align-items:center;justify-content:center}

.dlg{background:linear-gradient(#2a2042,#1b1430);border-radius:1.2rem;padding:1rem 1.1rem;width:min(25rem,92vw);max-height:92vh;overflow:auto;
  box-shadow:0 0 0 2px rgba(255,255,255,.14),0 1.5rem 3rem rgba(0,0,0,.7);animation:pop .2s;position:relative}
.dlg h2{margin:.1rem 0 .6rem;font-family:var(--display);font-size:1.35rem;text-align:center;text-shadow:0 .1rem 0 #000}

.dlg .x{position:absolute;right:.5rem;top:.4rem;background:none;border:0;color:#fff;font-size:1.3rem;cursor:pointer}
.dlg.wide{width:min(46rem,96vw)}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:120;pointer-events:none;display:flex;flex-direction:column;gap:.4rem;align-items:center}
#toast div{background:rgba(20,14,34,.95);padding:.5rem .9rem;border-radius:.8rem;font-weight:800;font-size:.85rem;box-shadow:0 0 0 2px rgba(255,255,255,.15),0 .5rem 1rem rgba(0,0,0,.5);animation:toast 2.4s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(.6rem)}10%,80%{opacity:1;transform:none}100%{opacity:0}}

/* ---------- meta screens */
.scr{position:absolute;inset:0;overflow:auto;background:linear-gradient(rgba(14,10,24,.62),rgba(14,10,24,.8));padding:calc(env(safe-area-inset-top) + .8rem) .8rem calc(env(safe-area-inset-bottom) + 1rem);-webkit-overflow-scrolling:touch;touch-action:pan-y}
.scr .top{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.scr .top h1{flex:1;margin:0;font-family:var(--display);font-size:1.5rem;text-shadow:0 .12rem 0 #000,0 0 .8rem rgba(255,207,58,.5)}
.sparks{display:inline-flex;align-items:center;gap:.25rem;font-weight:900;background:rgba(0,0,0,.45);padding:.3rem .65rem;border-radius:1rem;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);font-size:.85rem}
.sparks svg{width:1rem;height:1rem}
.logo{text-align:center;margin:1.4rem 0 .4rem}
.logo .cw{font-family:var(--display);font-weight:900;font-size:3.1rem;line-height:.9;letter-spacing:.02em;color:#fff4b8;
  text-shadow:0 .25rem 0 #8a3a00,0 .45rem 0 #4a1d00,0 0 1.4rem rgba(255,190,60,.7);transform:rotate(-3deg)}
.logo .sub{margin-top:.5rem;font-weight:900;letter-spacing:.32em;color:#9fe8ff;text-shadow:0 0 .7rem #3fc8ff;font-size:.85rem}
.logo .fan{margin-top:.35rem;font-size:.62rem;color:var(--mut);letter-spacing:.06em}
.menu{display:flex;flex-direction:column;gap:.75rem;align-items:stretch;width:min(19rem,88vw);margin:1.1rem auto 0}
.menu .btn{font-size:1.15rem;padding:.75rem 1rem}
.menu .two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.menu .two .btn{font-size:.9rem}
#scr-home .scr{background:none}
body.wide .homewrap{display:grid;grid-template-columns:1fr 1fr;align-items:center;min-height:100%}
.stat-line{text-align:center;font-size:.75rem;color:var(--mut);margin-top:.8rem;font-weight:700}
.list{display:flex;flex-direction:column;gap:.55rem;max-width:34rem;margin:0 auto}
.opp{display:flex;align-items:center;gap:.7rem;padding:.55rem .7rem;border-radius:1rem;background:rgba(30,22,50,.9);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);cursor:pointer}
.opp.lock{opacity:.45;cursor:default}
.opp.done{box-shadow:inset 0 0 0 2px rgba(120,255,160,.35)}
.opp.cur{box-shadow:inset 0 0 0 2px #ffcf3a,0 0 1rem rgba(255,207,58,.25)}
.opp canvas{width:3rem;height:3rem;border-radius:50%;flex:none;background:#2a2140}
.opp .o{flex:1;min-width:0}
.opp .o b{display:block;font-size:.95rem}
.opp .o span{font-size:.7rem;color:var(--mut)}
.opp .badge{font-size:.65rem;font-weight:900;padding:.2rem .45rem;border-radius:.5rem;background:#000a}
.tag{display:inline-block;font-size:.62rem;font-weight:900;padding:.08rem .4rem;border-radius:.4rem;margin-right:.25rem;color:#1b1424}
.tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin:.2rem 0 .7rem}
.tabs button{border:0;border-radius:.6rem;padding:.35rem .6rem;font-weight:900;font-size:.75rem;cursor:pointer;background:rgba(255,255,255,.08);color:#fff}
.tabs button.on{background:#ffcf3a;color:#2a1600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.55rem;justify-items:center}
.cgrid .card{cursor:pointer}
.cgrid .card.locked{filter:grayscale(1) brightness(.4)}
.deckrow{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border-radius:1rem;background:rgba(30,22,50,.9);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.deckrow.act{box-shadow:inset 0 0 0 2px #ffcf3a}
.deckrow .o{flex:1}
.deckrow .o b{display:block}
.deckrow .o span{font-size:.7rem;color:var(--mut)}
.lands{display:flex;gap:.25rem}
.landchip{width:1.55rem;height:1.55rem;border-radius:.4rem;display:grid;place-items:center;box-shadow:0 0 0 2px #1b1424}
.landchip canvas{width:1.2rem;height:1.2rem}
.editor{display:flex;flex-direction:column-reverse;gap:.7rem}
body.wide .editor{display:grid;grid-template-columns:1fr 1fr}
.dl{display:flex;flex-direction:column;gap:.25rem;max-height:52vh;overflow:auto;touch-action:pan-y}
.dl .li{display:flex;align-items:center;gap:.4rem;padding:.25rem .45rem;border-radius:.5rem;background:rgba(255,255,255,.06);font-size:.78rem;font-weight:800;cursor:pointer}
.dl .li i{font-style:normal;width:1.2rem;height:1.2rem;border-radius:50%;display:grid;place-items:center;font-size:.7rem;color:#1b1424}
.dl .li span{flex:1}
.dl .li em{font-style:normal;color:var(--mut)}
.msg{font-size:.72rem;line-height:1.3;padding:.4rem .55rem;border-radius:.6rem;background:rgba(255,255,255,.06)}
.msg.bad{background:rgba(255,80,100,.18);color:#ffc5cc}
.msg.ok{background:rgba(80,255,140,.12);color:#c8ffd9}
.set{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.6rem .2rem;border-bottom:1px solid rgba(255,255,255,.08);font-weight:800;font-size:.88rem}
.set input[type=range]{width:9rem;accent-color:#ffcf3a}
.seg{display:flex;border-radius:.6rem;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.seg button{border:0;background:transparent;color:#fff;font-weight:900;padding:.35rem .6rem;cursor:pointer;font-size:.75rem}
.seg button.on{background:#ffcf3a;color:#2a1600}
.toggle{width:3rem;height:1.6rem;border-radius:1rem;background:#3a3054;position:relative;cursor:pointer;border:0;flex:none}
.toggle::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on{background:#2fb84a}
.toggle.on::after{left:1.6rem}
.starter{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.6rem}
.starter .pick{border-radius:1rem;padding:.6rem;background:rgba(30,22,50,.9);box-shadow:inset 0 0 0 2px var(--fc);cursor:pointer;text-align:center}
.starter .pick canvas{width:3.6rem;height:3.6rem;border-radius:50%}
.starter .pick b{display:block;margin-top:.3rem}
.starter .pick span{font-size:.68rem;color:var(--mut);display:block;margin-top:.2rem;line-height:1.3}
/* result */
.result{text-align:center;padding-top:8vh}
.result .big{font-family:var(--display);font-size:2.6rem;line-height:1;text-shadow:0 .2rem 0 #000,0 0 1.2rem var(--rc,#ffcf3a);animation:pop .5s}
.cups{display:flex;justify-content:center;gap:1.6rem;margin:1.2rem 0 .6rem}
.cup{width:5.2rem;height:6.6rem;position:relative;border-radius:.4rem .4rem 1.4rem 1.4rem;background:linear-gradient(90deg,#e8f4ff,#bcd6ef);box-shadow:inset 0 -.6rem 0 rgba(0,0,0,.08),0 .5rem 1rem rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.7rem;color:#1b1424;text-align:center}
.cup::before{content:"";position:absolute;left:.3rem;right:.3rem;top:.45rem;height:1.4rem;border-radius:50%;background:var(--liq,#7a4a1a);opacity:.9}
.cup.win{animation:cupwin 1s .3s both}
.cup.lose{animation:cuplose 1s .3s both}
@keyframes cupwin{0%{transform:scale(.6)}60%{transform:scale(1.18) rotate(-6deg)}100%{transform:scale(1.08)}}
@keyframes cuplose{0%{transform:scale(.6)}50%{transform:rotate(12deg)}100%{transform:scale(.92) rotate(4deg);filter:saturate(.6)}}
.rewards{display:flex;justify-content:center;gap:.8rem;margin:.8rem 0;flex-wrap:wrap}
.rw{background:rgba(255,255,255,.07);border-radius:.9rem;padding:.5rem .8rem;font-weight:900;min-width:6rem}
.rw span{display:block;font-size:.65rem;color:var(--mut)}
.rw b{font-size:1.4rem}
.packrow{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin:1rem 0;perspective:40rem}
.flip{width:7.4rem;height:10.4rem;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.flip.open{transform:rotateY(180deg)}
.flip>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip .card{font-size:1.5rem}
.flip .newtag{position:absolute;top:-.5rem;right:-.4rem;z-index:5;background:#ff4f6a;color:#fff;font-size:.62rem;font-weight:900;padding:.1rem .35rem;border-radius:.4rem;transform:rotateY(180deg)}
.pack{width:9rem;height:12rem;margin:2rem auto;border-radius:1rem;cursor:pointer;position:relative;
  background:linear-gradient(140deg,#ffcf3a,#ff7a2b 50%,#c43d9c);box-shadow:0 1rem 2rem rgba(0,0,0,.6),inset 0 0 0 .3rem rgba(255,255,255,.35);animation:packbob 1.4s infinite alternate}
.pack::after{content:"CARD\A WARS";white-space:pre;position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:900;font-size:1.6rem;color:#fff;text-shadow:0 .2rem 0 #8a2a00}
@keyframes packbob{to{transform:translateY(-.5rem) rotate(2deg)}}
.pack.burst{animation:burst .5s forwards}
@keyframes burst{to{transform:scale(1.6);opacity:0;filter:brightness(3)}}
.kwlist{font-size:.72rem;line-height:1.35;color:#ddd3ff;margin-top:.5rem}
.kwlist div{margin:.2rem 0}
.kwlist b{color:#fff3a6}
.center{text-align:center}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body.rm *{animation-duration:.01ms!important;transition-duration:.01ms!important}

</style>

<body>
<canvas id="cv"></canvas>
<div id="app">
  <div id="match" class="screen">
    <div id="board-area"></div>
    <div id="opp" class="seat"></div>
    <div id="me" class="seat"></div>
    <div id="hand"></div>
    <div id="fightWrap"><button id="fightBtn" class="btn big fight"><span class="t">FIGHT!</span><small></small></button></div>
    <div id="sideBtns">
      <button id="menuBtn" class="iconbtn" aria-label="Menu"></button>
      <button id="logBtn" class="iconbtn" aria-label="Battle log"></button>
      <button id="emoteBtn" class="iconbtn" aria-label="Emotes"></button>
      <button id="speedBtn" class="iconbtn txt" aria-label="Game speed">1x</button>
    </div>
    <button id="undoBtn" class="iconbtn undo" aria-label="Undo"></button>
    <div id="tip" class="tip"></div>
    <div id="banner"></div>
    <div id="info" class="panel"></div>
    <div id="logDrawer" class="panel"></div>
    <div id="emotes" class="panel"></div>
    <div id="coach"></div>
    <div id="timer"></div>
  </div>
  <div id="screens"></div>
  <div id="modal"></div>
  <div id="toast"></div>
</div>
<script>
/* ENGINE */
// Pure, deterministic Card Wars rules engine. No DOM access. State is plain JSON.
// apply(state, command) -> { state, events, error }. Seeded PRNG lives inside the state.
var Engine = (function () {
'use strict';

const LANES = 4, START_HP = 25, ACTIONS = 2, HAND_MAX = 8, START_HAND = 5;
const DECK_SIZE = 20, MAX_COPIES = 2, OVERTIME = 15, MAX_ROUNDS = 40, SHIELD_CAP = 5;

const LANDS = {
  blue:  { name: 'Blue Plains',   hero: 'finn',      color: '#4aa8ff', home: 'Breezy: moving costs 0 Actions.', sig: 'Floop tricks & mobility' },
  corn:  { name: 'Cornfield',     hero: 'jake',      color: '#ffcf3a', home: 'Corn-Powered: +1 ATK.', sig: 'Swarm & growth' },
  swamp: { name: 'Useless Swamp', hero: 'marceline', color: '#b077f0', home: 'Grave Muck: a 1/1 Zombie rises in its lane when it is destroyed.', sig: 'Rot, Zombies & soul-stealing' },
  ice:   { name: 'IcyLands',      hero: 'iceking',   color: '#8fe9ff', home: 'Frostbite: creatures it damages in fights get Chilled.', sig: 'Chill, Freeze & control' },
  nice:  { name: 'NiceLands',     hero: 'pb',        color: '#ff8fd0', home: 'Nice Day: heals 1 at the start of your turn.', sig: 'Shields, buildings & spells' },
  lava:  { name: 'LavaFlats',     hero: 'fp',        color: '#ff6b3d', home: 'Scorch: creatures it damages in fights Burn 1.', sig: 'Burn, siege & aggro' },
  rainbow: { name: 'Rainbow', hero: null, color: '#f4f0ff', home: '', sig: 'Neutral' }
};
const LAND_TYPES = ['blue', 'corn', 'swamp', 'ice', 'nice', 'lava'];
const RARITY = { C: 'Common', R: 'Rare', E: 'Epic', L: 'Champion', T: 'Token' };

const KEYWORDS = {
  floop: 'FLOOP: turn the card sideways to use its ability. Once per turn. A flooped creature does not attack, but still defends.',
  guard: 'Guard: enemy attacks into your adjacent empty lanes hit this creature instead.',
  flying: 'Flying: ignores non-flying defenders and Guards when it attacks, and takes no damage back.',
  ranged: 'Ranged: takes no damage back when it attacks (unless the defender is Ranged).',
  siege: 'Siege: deals extra damage to buildings.',
  lifesteal: 'Lifesteal: fight damage it deals heals your hero.',
  shield: 'Shield: absorbs that much damage.',
  burn: 'Burn: takes Burn damage at the end of its controller\'s turn, then Burn goes down by 1.',
  chill: 'Chill: -1 ATK per stack. 2 stacks = Frozen. Wears off at the end of its controller\'s turn.',
  frozen: 'Frozen: can\'t attack, floop, move or hit back. Thaws at the end of its controller\'s next turn.',
  rot: 'Rot: takes 1 damage at the end of its controller\'s turn and can\'t be healed. Spreads to adjacent allies when it dies.',
  stuck: 'Stuck: can\'t move or be moved.',
  ripen: 'Ripen: at the end of your turn, if it didn\'t floop or move and stands on a face-up Cornfield, it grows +1/+1 (once).',
  immortal: 'Immortal: returns to its owner\'s hand when destroyed.',
  trap: 'Trap: played face-down. Springs when an enemy creature enters the opposing lane.',
  token: 'Token: vanishes when it leaves play.'
};

// ---------------------------------------------------------------- CARD DATA
// Every card is data. Abilities name an effect handler (fx) and a trigger (on). Targets (tg) are
// resolved by the target system. Adding a card only needs a new row (and an fx if the effect is new).
const CARDS = {};
function def(o) {
  o.req = o.req == null ? o.cost : o.req;
  o.kw = o.kw || {}; o.ab = o.ab || []; o.r = o.r || 'C';
  if (o.type === 'creature') { o.atk = o.atk || 0; o.def = o.def || 1; }
  if (o.type === 'building') { o.def = o.def || 1; }
  o.floop = o.ab.find(a => a.on === 'floop') || null;
  CARDS[o.id] = o;
}

// ---- BLUE PLAINS (Finn)
def({ id: 'b_hotdog', name: 'Hot Dog Knight', land: 'blue', type: 'creature', cost: 0, atk: 1, def: 2, r: 'C', art: 'hotdog',
  ab: [{ on: 'death', fx: 'drawCards', n: 1 }], text: 'When destroyed, draw a card.', flavor: 'Brave. Bun-armored. Mostly mustard.' });
def({ id: 'b_cooldog', name: 'Cool Dog', land: 'blue', type: 'creature', cost: 1, atk: 3, def: 5, r: 'C', art: 'cooldog',
  ab: [{ on: 'floop', fx: 'coolStare', n: 2 }], text: 'FLOOP: The enemy creature across gets -2 ATK until your next turn.', flavor: '"Cool Dog? That\'s a cool dog."' });
def({ id: 'b_scholar', name: 'Ancient Scholar', land: 'blue', type: 'creature', cost: 1, atk: 2, def: 5, r: 'R', art: 'scholar',
  ab: [{ on: 'floop', fx: 'study', plan: 'scholar' }], text: 'FLOOP: Study (+2 with a Schoolhouse here). At 3 Study: Raise the Dead - put a creature from your discard pile into an empty lane.', flavor: '"My Ancient Scholar\'s been studying the Raise the Dead ability."' });
def({ id: 'b_skypup', name: 'Sky Pup', land: 'blue', type: 'creature', cost: 1, atk: 2, def: 4, r: 'C', art: 'skypup',
  kw: { flying: 1 }, text: 'Flying.', flavor: 'Floats on pure enthusiasm.' });
def({ id: 'b_ranger', name: 'Cloud Ranger', land: 'blue', type: 'creature', cost: 2, atk: 4, def: 6, r: 'R', art: 'ranger',
  ab: [{ on: 'moved', fx: 'buffSelfTurn', n: 2 }], text: 'Whenever it moves, it gets +2 ATK this turn.', flavor: 'Rides the Blue Plains breeze into empty lanes.' });
def({ id: 'b_pig', name: 'The Pig', land: 'blue', type: 'creature', cost: 2, req: 3, atk: 4, def: 7, r: 'L', art: 'pig',
  kw: { muddy: 1 }, ab: [{ on: 'floop', fx: 'eatLand' }],
  text: 'FLOOP: Eat the landscape across (flip it face-down) and deal 1 damage to the creature on it. Muddy: if the Pig attacks and destroys a creature on a Useless Swamp, it gets stuck in the mud - that swamp\'s owner takes control of it.',
  flavor: '"What do you expect if all your power comes from corn? Pigs EAT corn, dude."' });
def({ id: 'b_school', name: 'Schoolhouse', land: 'blue', type: 'building', cost: 1, def: 5, r: 'C', art: 'school',
  ab: [{ on: 'start', fx: 'schoolLearn' }], text: 'At the start of your turn, your creature here gains +1 DEF permanently (max +2). Ancient Scholar studies twice as fast here.', flavor: 'Homework is a kind of armor.' });
def({ id: 'b_spirit', name: 'Spirit Tower', land: 'blue', type: 'building', cost: 2, def: 6, r: 'E', art: 'spirit',
  kw: { spirit: 5 }, text: 'When an enemy creature with 5+ ATK attacks this lane, cancel the attack and take control of it. Then the Spirit Tower fades.', flavor: '"Look! My Tower\'s doin\' a thing!"' });
def({ id: 'b_cave', name: 'Cave of Solitude', land: 'blue', type: 'building', cost: 1, def: 6, r: 'R', art: 'cave',
  kw: { cave: 1 }, text: 'Your flooped creature here naps inside: it can\'t be attacked, targeted or damaged by enemies.', flavor: '"I move my Pig to the Cave of Solitude so he can take a nap."' });
def({ id: 'b_math', name: 'Mathematical!', land: 'blue', type: 'spell', cost: 0, r: 'R', art: 'math',
  ab: [{ on: 'cast', fx: 'readyCreature', tg: ['myFlooped'] }], text: 'Ready one of your flooped creatures. It can floop or fight again.', flavor: 'Algebraic!' });
def({ id: 'b_adv', name: 'Adventure Time!', land: 'blue', type: 'spell', cost: 2, r: 'E', art: 'advtime',
  ab: [{ on: 'cast', fx: 'teamBuffTurn', n: 2, draw: 1 }], text: 'Your creatures get +2 ATK this turn. Draw a card.', flavor: 'Come on, grab your friends.' });
def({ id: 'b_ride', name: 'Rainicorn Ride', land: 'blue', type: 'spell', cost: 1, r: 'C', art: 'rainicorn',
  ab: [{ on: 'cast', fx: 'relocate', tg: ['anyMovable', 'emptyLaneSameSide'] }], text: 'Move any creature (yours or an enemy\'s) to an empty lane on its side.', flavor: 'Lady Rainicorn won\'t play Card Wars. She will give rides.' });

// ---- CORNFIELD (Jake)
def({ id: 'c_cornball', name: 'Cornball', land: 'corn', type: 'creature', cost: 0, atk: 1, def: 2, r: 'C', art: 'cornball',
  kw: { ripen: 1 }, text: 'Ripen.', flavor: 'Just a little guy. Growing.' });
def({ id: 'c_husker', name: 'Husker Knight', land: 'corn', type: 'creature', cost: 1, atk: 2, def: 4, r: 'C', art: 'husker',
  kw: { ripen: 1, collapse: 1 }, text: 'Ripen. Collapses (can\'t attack) while its landscape is face-down.', flavor: '"My Husker Knights draw energy from corn!"' });
def({ id: 'c_scarecrow', name: 'Scarecrow', land: 'corn', type: 'creature', cost: 1, atk: 1, def: 6, r: 'C', art: 'scarecrow',
  kw: { guard: 1 }, text: 'Guard.', flavor: 'Scares crows. And Pigs, sometimes.' });
def({ id: 'c_worm', name: 'Husker Worm', land: 'corn', type: 'creature', cost: 2, atk: 3, def: 5, r: 'R', art: 'worm',
  ab: [{ on: 'play', fx: 'tokensAdj', token: 't_earling' }], text: 'When played, put a 1/1 Earling into each adjacent empty lane.', flavor: 'It burrows. They follow.' });
def({ id: 'c_ronin', name: 'Corn Ronin', land: 'corn', type: 'creature', cost: 2, atk: 2, def: 5, r: 'R', art: 'ronin',
  kw: { swarm: 1 }, text: '+1 ATK for each other creature you control.', flavor: 'A masterless kernel. Strongest in a crowd.' });
def({ id: 'c_maize', name: 'Immortal Maize Walker', land: 'corn', type: 'creature', cost: 2, req: 3, atk: 1, def: 7, r: 'L', art: 'maize',
  kw: { triple: 1, immortal: 1 }, text: 'Deals triple damage while you control 3+ face-up Cornfields. Immortal.', flavor: '"I LOVE CORN!"' });
def({ id: 'c_silo', name: 'Silo of Truth', land: 'corn', type: 'building', cost: 2, def: 5, r: 'E', art: 'silo',
  ab: [{ on: 'floop', fx: 'siloPeek' }], text: 'FLOOP: See your opponent\'s hand and face-down buildings, then steal a Spell from their hand.', flavor: '"Pfff, you got really lame cards. I\'ll take the Cerebral Bloodstorm, though."' });
def({ id: 'c_cornucopia', name: 'Cornucopia', land: 'corn', type: 'building', cost: 1, def: 4, r: 'R', art: 'cornucopia',

CARDS['?'] = { id: '?', name: 'Unknown', land: 'rainbow', type: 'unknown', cost: 99, req: 99, kw: {}, ab: [], r: 'T', floop: null, art: 'back', text: '' };
// Inside a redacted state an unknown face-down building is assumed to sting for 2 (expected value).
CARDS['?trap'] = { id: '?trap', name: 'Face-down building', land: 'rainbow', type: 'building', cost: 0, req: 0, def: 2, kw: { trap: 1 }, ab: [{ on: 'trap', fx: 'boobyTrap', n: 2 }], r: 'T', floop: null, art: 'back', text: 'A mystery.' };

const COLLECTIBLE = Object.keys(CARDS).filter(id => !CARDS[id].token && CARDS[id].r !== 'T' && id[0] !== '?');

// ---------------------------------------------------------------- PRNG
function hashSeed(x) {
  const s = String(x == null ? 'glow' : x);
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h || 1;
}
function rand(st) {
  let t = (st.rng = (st.rng + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function randInt(st, n) { return Math.floor(rand(st) * n); }
function shuffle(st, a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(st, i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function clone(o) {
  if (o === null || typeof o !== 'object') return o;
  if (Array.isArray(o)) { const a = new Array(o.length); for (let i = 0; i < o.length; i++) a[i] = clone(o[i]); return a; }
  const r = {}; for (const k in o) r[k] = clone(o[k]); return r;
}

// ---------------------------------------------------------------- HELPERS
const lvlAtk = l => (l >= 3 ? 1 : 0);
const lvlDef = l => (l >= 2 ? 1 : 0) + (l >= 4 ? 1 : 0);
const card = id => CARDS[id] || CARDS['?'];
const inLane = l => l >= 0 && l < LANES;
function cr(st, side, lane) { return inLane(lane) ? st.players[side].lanes[lane].creature : null; }
function bl(st, side, lane) { return inLane(lane) ? st.players[side].lanes[lane].building : null; }
function land(st, side, lane) { return st.players[side].lanes[lane].land; }
function abN(ab, lvl) { return (ab.n || 0) + (lvl >= 3 && ab.n ? 1 : 0); }
function countLand(st, side, type) {
  let n = 0; const L = st.players[side].lanes;
  for (let i = 0; i < LANES; i++) if (!L[i].land.down && L[i].land.type === type) n++;
  return n;
}
function findCreature(st, uid) {
  for (let s = 0; s < 2; s++) for (let l = 0; l < LANES; l++) { const c = st.players[s].lanes[l].creature; if (c && c.uid === uid) return { side: s, lane: l, c }; }
  return null;
}
function emptyLanes(st, side) { const r = []; for (let l = 0; l < LANES; l++) if (!st.players[side].lanes[l].creature) r.push(l); return r; }
function onHome(st, side, lane) {
  const c = cr(st, side, lane); if (!c || c.token) return false;
  const L = land(st, side, lane); return !L.down && L.type === card(c.id).land;
}
// A flooped creature in a lane with a face-up Cave of Solitude is napping: enemies can't touch it.
function napping(st, side, lane) {
  const c = cr(st, side, lane); if (!c || !c.flooped) return false;
  const b = bl(st, side, lane); return !!(b && !b.hidden && card(b.id).kw.cave);
}
function targetable(st, side, lane, bySide) { const c = cr(st, side, lane); return !!c && (side === bySide || !napping(st, side, lane)); }

function cStats(st, side, lane) {
  const P = st.players[side], c = P.lanes[lane].creature; if (!c) return null;
  const cd = card(c.id);
  const base = (cd.atk || 0) + lvlAtk(c.lvl);
  let atk = base + (c.pAtk || 0) + (c.tAtk || 0);
  if (cd.kw.triple && countLand(st, side, 'corn') >= 3) atk += base * 2;
  const def = (cd.def || 1) + lvlDef(c.lvl) + (c.pDef || 0);
  const home = onHome(st, side, lane);
  if (home && cd.land === 'corn') atk += 1;
  for (let l = lane - 1; l <= lane + 1; l++) { const b = bl(st, side, l); if (b && !b.hidden && card(b.id).kw.aura) atk += 1; }
  if (cd.kw.swarm) { for (let l = 0; l < LANES; l++) if (l !== lane && P.lanes[l].creature) atk += 1; }
  if (c.debuffs) for (const d of c.debuffs) atk += d.atk;
  atk -= (c.chill || 0);
  if (atk < 0) atk = 0;
  return { atk, def, hp: def - c.dmg, home };
}
function bDef(b) { return (card(b.id).def || 1) + Math.max(0, (b.lvl || 1) - 1); }

function mkInst(st, id, lvl, owner) { return { uid: st.uid++, id, lvl: lvl || 1, owner }; }
function mkCreature(st, inst, side) {
  return { uid: inst.uid, id: inst.id, lvl: inst.lvl || 1, owner: inst.owner == null ? side : inst.owner, dmg: 0, flooped: false, fl: false,
    moved: false, frozen: false, thawAt: 0, chill: 0, burn: 0, rot: false, shield: 0, stuck: false, pAtk: 0, pDef: 0, tAtk: 0,
    debuffs: [], study: 0, ripen: 0, forge: 0, school: 0, gob: 0, born: st.turn, token: !!card(inst.id).token, lastHit: null };
}

// ---------------------------------------------------------------- GAME SETUP
function makePlayer(st, cfg, side) {
  const lands = (cfg.deck && cfg.deck.lands) || ['blue', 'blue', 'blue', 'blue'];
  const levels = cfg.levels || {};
  const deck = ((cfg.deck && cfg.deck.cards) || []).map(id => mkInst(st, id, levels[id] || cfg.level || 1, side));
  shuffle(st, deck);
  return {
    name: cfg.name || ('Player ' + (side + 1)), hero: cfg.hero || 'finn', hp: cfg.hp || START_HP, maxHp: cfg.hp || START_HP,
    deck, hand: [], discard: [], actions: 0, mulled: null, spells: 0, bonusActions: cfg.bonusActions || 0,
    revealTurn: -1, peekTurn: -1, burn: 0,
    lanes: [0, 1, 2, 3].map(i => ({ land: { type: lands[i] || 'blue', orig: lands[i] || 'blue', down: false, by: null }, creature: null, building: null }))
  };
}

function newGame(cfg) {
  cfg = cfg || {};
  const st = { v: 1, rng: hashSeed(cfg.seed), turn: 0, round: 0, active: 0, first: 0, phase: 'mulligan', winner: null,
    reason: '', uid: 1, pending: null, players: [], ot: cfg.overtime || OVERTIME, noMulligan: !!cfg.noMulligan };
  const pc = cfg.players || [{}, {}];
  st.players = [makePlayer(st, pc[0] || {}, 0), makePlayer(st, pc[1] || {}, 1)];
  st.first = cfg.first === 0 || cfg.first === 1 ? cfg.first : randInt(st, 2);
  st.active = st.first;
  const ev = [];
  for (let p = 0; p < 2; p++) {
    const pre = (pc[p] && pc[p].startBuildings) || [];
    for (const sb of pre) { st.players[p].lanes[sb.lane].building = Object.assign(mkInst(st, sb.id, sb.lvl || 1, p), { dmg: 0, flooped: false, fl: false, hidden: !!card(sb.id).kw.trap, born: 0 }); }
    for (let i = 0; i < START_HAND; i++) drawCard(st, p, ev, true);
  }
  ev.push({ t: 'setup', first: st.first });
  if (st.noMulligan) { st.players[0].mulled = false; st.players[1].mulled = false; startGame(st, ev); }
  return { state: st, events: ev };
}

function startGame(st, ev) {
  st.phase = 'main';
  st.turn = 0;
  beginTurn(st, ev);
}

// ---------------------------------------------------------------- CORE MUTATIONS
function drawCard(st, side, ev, silent) {
  const P = st.players[side];
  if (P.hand.length >= HAND_MAX) { ev.push({ t: 'handFull', side }); return null; }
  if (!P.deck.length) {
    if (!P.discard.length) return null;
    P.deck = P.discard.filter(c => !card(c.id).token); P.discard = [];
    shuffle(st, P.deck);
    ev.push({ t: 'reshuffle', side, n: P.deck.length });
    if (!P.deck.length) return null;
  }
  const c = P.deck.pop();
  P.hand.push(c);
  ev.push({ t: 'draw', side, uid: c.uid, id: c.id, silent: !!silent, rng: 1 });
  return c;
}

function toDiscard(st, inst) {
  if (card(inst.id).token) return;
  const owner = inst.owner == null ? 0 : inst.owner;
  st.players[owner].discard.push({ uid: inst.uid, id: inst.id, lvl: inst.lvl || 1, owner });
}

function damageCreature(st, side, lane, n, src, ev, kind) {
  const c = cr(st, side, lane);
  if (!c || n <= 0) return 0;
  if (src && src.side != null && src.side !== side && napping(st, side, lane)) { ev.push({ t: 'immune', side, lane }); return 0; }
  let absorbed = 0;
  if (c.shield > 0) { absorbed = Math.min(c.shield, n); c.shield -= absorbed; n -= absorbed; }
  if (n > 0) c.dmg += n;
  if (src && src.uid != null) c.lastHit = { side: src.side, uid: src.uid, atk: src.atk ? 1 : 0 };
  ev.push({ t: 'damage', side, lane, n, absorbed, kind: kind || 'fx', hp: cStats(st, side, lane).hp });
  return n;
}
function healCreature(st, side, lane, n, ev) {
  const c = cr(st, side, lane); if (!c || n <= 0 || c.rot || c.dmg <= 0) return 0;
  const h = Math.min(n, c.dmg); c.dmg -= h;
  ev.push({ t: 'heal', side, lane, n: h });
  return h;
}
function damageBuilding(st, side, lane, n, ev) {
  const b = bl(st, side, lane); if (!b || n <= 0) return 0;
  b.dmg += n;
  ev.push({ t: 'bdamage', side, lane, n, hp: bDef(b) - b.dmg });
  return n;
}
function damageHero(st, side, n, ev, kind) {
  if (n <= 0 || st.winner != null) return 0;
  const P = st.players[side];
  P.hp -= n;
  ev.push({ t: 'hero', side, n, hp: P.hp, kind: kind || 'fight' });
  return n;
}
function healHero(st, side, n, ev) {
  const P = st.players[side]; const h = Math.max(0, Math.min(n, P.maxHp - P.hp));
  if (h > 0) { P.hp += h; ev.push({ t: 'heroHeal', side, n: h, hp: P.hp }); }
  return h;
}
function addShield(st, side, lane, n, ev) {
  const c = cr(st, side, lane); if (!c) return;
  c.shield = Math.min(SHIELD_CAP, (c.shield || 0) + n);
  ev.push({ t: 'status', side, lane, s: 'shield', n: c.shield });
}
function applyBurn(st, side, lane, n, ev) {
  const c = cr(st, side, lane); if (!c || n <= 0) return;
  c.burn = Math.min(9, (c.burn || 0) + n);
  ev.push({ t: 'status', side, lane, s: 'burn', n: c.burn });
}
function applyRot(st, side, lane, ev) {
  const c = cr(st, side, lane); if (!c || c.rot) return;
  c.rot = true; ev.push({ t: 'status', side, lane, s: 'rot', n: 1 });
}
function freeze(st, side, lane, ev) {
  const c = cr(st, side, lane); if (!c) return;
  c.frozen = true; c.chill = 0;
  c.thawAt = st.active === side ? st.turn + 2 : st.turn + 1;
  ev.push({ t: 'status', side, lane, s: 'freeze', n: 1 });
}
function chill(st, side, lane, n, ev) {
  const c = cr(st, side, lane); if (!c || n <= 0) return;
  if (c.frozen) return;
  c.chill = (c.chill || 0) + n;
  if (c.chill >= 2) freeze(st, side, lane, ev);
  else ev.push({ t: 'status', side, lane, s: 'chill', n: c.chill });
}

function spawnToken(st, side, lane, id, ev) {
  if (!inLane(lane) || cr(st, side, lane)) return false;
  const inst = mkInst(st, id, 1, side);
  st.players[side].lanes[lane].creature = mkCreature(st, inst, side);
  ev.push({ t: 'summon', side, lane, uid: inst.uid, id, token: 1 });
  enterLane(st, side, lane, ev);
  return true;
}

// A creature entered a lane (played, put, raised, moved or stolen): enemy traps across spring.
function enterLane(st, side, lane, ev) {
  const o = 1 - side, b = bl(st, o, lane), c = cr(st, side, lane);
  if (!b || !b.hidden || !c) return;
  const cd = card(b.id);
  b.hidden = false;
  ev.push({ t: 'trap', side: o, lane, id: b.id, uid: b.uid });
  const ab = cd.ab.find(a => a.on === 'trap');
  if (ab) FX[ab.fx](st, ab, { side: o, lane, slot: 'b', uid: b.uid, id: b.id, lvl: b.lvl }, [{ side, lane }], ev);
  // traps are one-shot
  if (st.players[o].lanes[lane].building === b) {
    st.players[o].lanes[lane].building = null;
    toDiscard(st, b);
    ev.push({ t: 'bdeath', side: o, lane, uid: b.uid, id: b.id, spent: 1 });
  }
}

function placeCreature(st, side, lane, inst, ev, how) {
  const c = mkCreature(st, inst, side);
  st.players[side].lanes[lane].creature = c;
  ev.push({ t: 'summon', side, lane, uid: c.uid, id: c.id, how: how || 'play' });
  return c;
}

function moveCreature(st, side, from, to, ev, forced) {
  const L = st.players[side].lanes;
  const a = L[from].creature, b = L[to].creature;
  if (!a) return false;
  L[to].creature = a; L[from].creature = b;
  if (!forced) { a.moved = true; if (b) b.moved = true; }
  ev.push({ t: 'move', side, from, to, swap: !!b, forced: !!forced, uid: a.uid });
  if (!forced) {
    for (const [cc, ln] of [[a, to], [b, from]]) {
      if (!cc) continue;
      const ab = card(cc.id).ab.find(x => x.on === 'moved');
      if (ab) FX[ab.fx](st, ab, srcOf(st, side, ln, 'c'), [], ev);
    }
  }
  enterLane(st, side, to, ev);
  if (b) enterLane(st, side, from, ev);
  return true;
}

// Steal: creature moves to the other side. Lands in the same lane if free, else the nearest free lane,
// else it is destroyed. Stolen creatures arrive flooped (exhausted).
function takeControl(st, fromSide, lane, ev, prefLane) {
  const c = cr(st, fromSide, lane); if (!c) return false;
  const to = 1 - fromSide;
  st.players[fromSide].lanes[lane].creature = null;
  let dest = null;
  const pref = prefLane == null ? lane : prefLane;
  if (!cr(st, to, pref)) dest = pref;
  else {
    let best = 99;
    for (const l of emptyLanes(st, to)) if (Math.abs(l - pref) < best) { best = Math.abs(l - pref); dest = l; }
  }
  if (dest == null) {
    ev.push({ t: 'death', side: fromSide, lane, uid: c.uid, id: c.id, token: c.token ? 1 : 0, cause: 'nowhere' });
    toDiscard(st, c);
    return false;
  }
  c.flooped = true; c.fl = true; c.debuffs = []; c.chill = 0; c.tAtk = 0;
  st.players[to].lanes[dest].creature = c;
  ev.push({ t: 'steal', from: fromSide, lane, to, toLane: dest, uid: c.uid, id: c.id });
  enterLane(st, to, dest, ev);
  return true;
}

function srcOf(st, side, lane, slot) {
  const x = slot === 'b' ? bl(st, side, lane) : cr(st, side, lane);
  return x ? { side, lane, slot, uid: x.uid, id: x.id, lvl: x.lvl } : { side, lane, slot };
}

function destroyCreature(st, side, lane, ev, cause) {
  const P = st.players[side];
  const c = P.lanes[lane].creature; if (!c) return;
  const cd = card(c.id);
  const L = P.lanes[lane].land;
  P.lanes[lane].creature = null;
  ev.push({ t: 'death', side, lane, uid: c.uid, id: c.id, token: cd.token ? 1 : 0, cause: cause || 'killed' });
  // where the card goes
  if (!cd.token) {
    const owner = st.players[c.owner];
    if (cd.kw.immortal && owner.hand.length < HAND_MAX) {
      owner.hand.push({ uid: c.uid, id: c.id, lvl: c.lvl, owner: c.owner });
      ev.push({ t: 'immortal', side: c.owner, uid: c.uid, id: c.id });
    } else toDiscard(st, c);
  }
  const src = { side, lane, slot: 'c', uid: c.uid, id: c.id, lvl: c.lvl };
  for (const ab of cd.ab) if (ab.on === 'death') FX[ab.fx](st, ab, src, [], ev);
  // Muddy Pig: killing a creature that stood on a Useless Swamp gets the Pig stuck there.
  if (c.lastHit && c.lastHit.atk && cause === 'killed' && !L.down && L.type === 'swamp') {
    const k = findCreature(st, c.lastHit.uid);
    if (k && k.side !== side && card(k.c.id).kw.muddy) {
      const pigUid = k.c.uid;
      ev.push({ t: 'say', side: k.side, text: 'The Pig is stuck in the mud!' });
      takeControl(st, k.side, k.lane, ev, lane);
      const f = findCreature(st, pigUid); if (f) f.c.stuck = true;
    }
  }
  // Grave Muck (Useless Swamp home advantage)
  if (!cd.token && cd.land === 'swamp' && !L.down && L.type === 'swamp' && cause !== 'replace') spawnToken(st, side, lane, 't_zombie', ev);
  // Rot spreads to adjacent allies
  if (c.rot) for (const l of [lane - 1, lane + 1]) if (cr(st, side, l)) applyRot(st, side, l, ev);
  // allied-death triggers (Crypt)
  for (let l = lane - 1; l <= lane + 1; l++) {
    const b = bl(st, side, l);
    if (b && !b.hidden) for (const ab of card(b.id).ab) if (ab.on === 'allyDeath') FX[ab.fx](st, ab, srcOf(st, side, l, 'b'), [{ side, lane }], ev);
  }
  // any-death triggers (Grave Gobbler)
  for (let s = 0; s < 2; s++) for (let l = 0; l < LANES; l++) {
    const x = cr(st, s, l);
    if (x) for (const ab of card(x.id).ab) if (ab.on === 'anyDeath') FX[ab.fx](st, ab, srcOf(st, s, l, 'c'), [], ev);
  }
}

function destroyBuilding(st, side, lane, ev, cause) {
  const b = bl(st, side, lane); if (!b) return;
  st.players[side].lanes[lane].building = null;
  toDiscard(st, b);
  ev.push({ t: 'bdeath', side, lane, uid: b.uid, id: b.id, cause: cause || 'destroyed' });
}

function checkDeaths(st, ev) {
  for (let guard = 0; guard < 40; guard++) {
    let found = false;
    for (const side of [st.active, 1 - st.active]) {
      for (let l = 0; l < LANES; l++) {
        const c = cr(st, side, l);
        if (c && c.dmg >= cStats(st, side, l).def) { destroyCreature(st, side, l, ev, 'killed'); found = true; }
        const b = bl(st, side, l);
        if (b && b.dmg >= bDef(b)) { destroyBuilding(st, side, l, ev); found = true; }
      }
    }
    if (!found) break;
  }
  checkWin(st, ev);
}

function checkWin(st, ev) {
  if (st.winner != null) return true;
  const a = st.players[0].hp <= 0, b = st.players[1].hp <= 0;
  if (!a && !b) return false;
  st.winner = a && b ? st.active : (a ? 1 : 0);
  st.reason = 'hp';
  st.phase = 'over';
  ev.push({ t: 'gameOver', winner: st.winner, reason: 'hp' });
  return true;
}

// ---------------------------------------------------------------- EFFECTS (fx handlers)
// Signature: (state, ability, source, targets, events). Targets are {side,lane} or {uid}.
const FX = {
  noop() {},
  drawCards(st, ab, s, t, ev) { for (let i = 0; i < (ab.n || 1); i++) drawCard(st, s.side, ev); },
  coolStare(st, ab, s, t, ev) {
    const o = 1 - s.side, c = cr(st, o, s.lane);
    if (!c || napping(st, o, s.lane)) return;
    c.debuffs.push({ atk: -ab.n, exp: st.turn + 2 });
    ev.push({ t: 'buff', side: o, lane: s.lane, atk: -ab.n, temp: 1 });
  },
  study(st, ab, s, t, ev) {
    const c = cr(st, s.side, s.lane); if (!c) return;
    const b = bl(st, s.side, s.lane);
    c.study += (b && !b.hidden && b.id === 'b_school') ? 2 : 1;
    ev.push({ t: 'study', side: s.side, lane: s.lane, n: c.study });
    if (c.study >= 3 && t.length === 2) {
      c.study -= 3;
      ev.push({ t: 'say', side: s.side, text: 'Raise the Dead!' });
      raise(st, s.side, t[0].uid, t[1].lane, ev, false);
    }
  },
  buffSelfTurn(st, ab, s, t, ev) { const c = cr(st, s.side, s.lane); if (c) { c.tAtk += ab.n; ev.push({ t: 'buff', side: s.side, lane: s.lane, atk: ab.n, temp: 1 }); } },
  eatLand(st, ab, s, t, ev) {
    const o = 1 - s.side, L = land(st, o, s.lane);
    if (!L.down) { L.down = true; ev.push({ t: 'land', side: o, lane: s.lane, type: L.type, down: true, cause: 'eat' }); }
    if (cr(st, o, s.lane)) damageCreature(st, o, s.lane, 1, s, ev);
  },
  schoolLearn(st, ab, s, t, ev) {
    const c = cr(st, s.side, s.lane);
    if (c && c.school < 2) { c.school++; c.pDef++; ev.push({ t: 'buff', side: s.side, lane: s.lane, def: 1, perm: 1 }); }
  },
  readyCreature(st, ab, s, t, ev) {
    const c = cr(st, t[0].side, t[0].lane); if (!c) return;
    c.flooped = false; ev.push({ t: 'ready', side: t[0].side, lane: t[0].lane });
  },
  teamBuffTurn(st, ab, s, t, ev) {
    const n = abN(ab, s.lvl);
    for (let l = 0; l < LANES; l++) { const c = cr(st, s.side, l); if (c) { c.tAtk += n; ev.push({ t: 'buff', side: s.side, lane: l, atk: n, temp: 1 }); } }
    for (let i = 0; i < (ab.draw || 0); i++) drawCard(st, s.side, ev);
  },
  relocate(st, ab, s, t, ev) {
    const a = t[0], b = t[1];
    if (!cr(st, a.side, a.lane) || cr(st, a.side, b.lane)) return;
    moveCreature(st, a.side, a.lane, b.lane, ev, true);
  },
  tokensAdj(st, ab, s, t, ev) { for (const l of [s.lane - 1, s.lane + 1]) spawnToken(st, s.side, l, ab.token, ev); },
  tokenRandomEmpty(st, ab, s, t, ev) {
    const e = emptyLanes(st, s.side); if (!e.length) return;
    spawnToken(st, s.side, e[randInt(st, e.length)], ab.token, ev);
  },
  tokensAllEmpty(st, ab, s, t, ev) { for (const l of emptyLanes(st, s.side)) spawnToken(st, s.side, l, ab.token, ev); },
  tokenAt(st, ab, s, t, ev) { spawnToken(st, s.side, t[0].lane, ab.token, ev); },
  tokenHere(st, ab, s, t, ev) { spawnToken(st, s.side, s.lane, ab.token, ev); },
  bloodstorm(st, ab, s, t, ev) {
    const n = abN(ab, s.lvl);
    for (let side = 0; side < 2; side++) for (let l = 0; l < LANES; l++) {
      const c = cr(st, side, l); if (c && !c.flooped) damageCreature(st, side, l, n, { side: s.side }, ev);
    }
  },
  convertLand(st, ab, s, t, ev) {
    const L = land(st, t[0].side, t[0].lane);
    L.type = ab.land; L.down = false; L.by = t[0].side === s.side ? null : s.side;
    ev.push({ t: 'land', side: t[0].side, lane: t[0].lane, type: ab.land, down: false, cause: 'convert' });
    if (ab.chill && cr(st, t[0].side, t[0].lane)) chill(st, t[0].side, t[0].lane, ab.chill, ev);
    if (ab.dmg && cr(st, t[0].side, t[0].lane)) damageCreature(st, t[0].side, t[0].lane, ab.dmg + (s.lvl >= 3 ? 1 : 0), { side: s.side }, ev);
  },
  siloPeek(st, ab, s, t, ev) {
    const o = 1 - s.side, O = st.players[o];
    O.revealTurn = st.turn; O.peekTurn = st.turn;
    const traps = [];
    for (let l = 0; l < LANES; l++) { const b = bl(st, o, l); if (b && b.hidden) traps.push({ lane: l, id: b.id }); }
    ev.push({ t: 'reveal', side: o, to: s.side, cards: O.hand.map(c => c.id), traps, info: 1 });
    const opts = O.hand.filter(c => card(c.id).type === 'spell').map(c => c.uid);
    if (opts.length) { st.pending = { kind: 'steal', side: s.side, from: o, options: opts }; ev.push({ t: 'pending', side: s.side, kind: 'steal' }); }
  },
  gobble(st, ab, s, t, ev) {
    const c = cr(st, s.side, s.lane);
    if (c && c.gob < (ab.n || 3)) { c.gob++; c.pAtk++; ev.push({ t: 'buff', side: s.side, lane: s.lane, atk: 1, perm: 1 }); }
  },
  rotAllEnemies(st, ab, s, t, ev) { const o = 1 - s.side; for (let l = 0; l < LANES; l++) if (targetable(st, o, l, s.side)) applyRot(st, o, l, ev); },
  cryptRaise(st, ab, s, t, ev) { spawnToken(st, s.side, s.lane, ab.token, ev); },

function raise(st, side, uid, lane, ev, rot) {

// ---------------------------------------------------------------- TARGETING
// Target kinds -> option lists. Options: {side,lane} for creatures/lanes/lands, {uid} for cards.
const TG = {
  enemyCreature(st, p) { const o = 1 - p, r = []; for (let l = 0; l < LANES; l++) if (targetable(st, o, l, p)) r.push({ side: o, lane: l }); return r; },
  allyCreature(st, p) { const r = []; for (let l = 0; l < LANES; l++) if (cr(st, p, l)) r.push({ side: p, lane: l }); return r; },
  anyCreature(st, p) { return TG.allyCreature(st, p).concat(TG.enemyCreature(st, p)); },
  myFlooped(st, p) { const r = []; for (let l = 0; l < LANES; l++) { const c = cr(st, p, l); if (c && c.flooped && !c.frozen) r.push({ side: p, lane: l }); } return r; },
  anyMovable(st, p) {
    const r = [];

      if (!emptyLanes(st, s).length) continue;
      for (let l = 0; l < LANES; l++) { const c = cr(st, s, l); if (c && !c.stuck && targetable(st, s, l, p)) r.push({ side: s, lane: l }); }
    }
    return r;
  },
  emptyLaneSameSide(st, p, src, ch) { return emptyLanes(st, ch[0].side).map(l => ({ side: ch[0].side, lane: l })); },
  myLand(st, p) { return [0, 1, 2, 3].map(l => ({ side: p, lane: l, land: 1 })); },
  anyLand(st, p) { const r = []; for (let s of [p, 1 - p]) for (let l = 0; l < LANES; l++) r.push({ side: s, lane: l, land: 1 }); return r; },
  adjEmptyLane(st, p, src) { return [src.lane - 1, src.lane + 1].filter(l => inLane(l) && !cr(st, p, l)).map(l => ({ side: p, lane: l })); },
  myDiscardCreature(st, p) {
    const seen = {}, r = [];
    for (const c of st.players[p].discard) { const cd = card(c.id); if (cd.type === 'creature' && !cd.token && !seen[c.id + ':' + c.lvl]) { seen[c.id + ':' + c.lvl] = 1; r.push({ uid: c.uid, id: c.id }); } }
    return r;
  },
  myEmptyLane(st, p) { return emptyLanes(st, p).map(l => ({ side: p, lane: l })); },
  myMovable(st, p) { const r = []; for (let l = 0; l < LANES; l++) { const c = cr(st, p, l); if (c && !c.stuck) r.push({ side: p, lane: l }); } return r; },
  myOtherLane(st, p, src, ch) {
    const r = [];
    for (let l = 0; l < LANES; l++) { if (l === ch[0].lane) continue; const c = cr(st, p, l); if (!c || !c.stuck) r.push({ side: p, lane: l }); }

  pushDir(st, p, src) {

  enemyNearMyBuilding(st, p) { const o = 1 - p, r = []; for (let l = 0; l < LANES; l++) if (bl(st, p, l) && targetable(st, o, l, p)) r.push({ side: o, lane: l }); return r; }

// Dynamic target plans (targets depend on the state).
const PLANS = {
  scholar(st, p, src) {
    const c = cr(st, p, src.lane); if (!c) return [];
    const b = bl(st, p, src.lane);
    const gain = (b && !b.hidden && b.id === 'b_school') ? 2 : 1;
    if (c.study + gain >= 3 && TG.myDiscardCreature(st, p).length && emptyLanes(st, p).length) return ['myDiscardCreature', 'myEmptyLane'];
    return [];
  }

function abilityOf(st, p, src) {
  if (src.uid != null && src.lane == null) {
    const inst = st.players[p].hand.find(c => c.uid === src.uid); if (!inst) return null;
    const cd = card(inst.id);
    if (cd.type === 'spell') return cd.ab.find(a => a.on === 'cast') || null;
    return null;
  }
  const x = src.slot === 'b' ? bl(st, p, src.lane) : cr(st, p, src.lane);
  return x ? card(x.id).floop : null;
}
function targetSteps(st, p, src) {
  const ab = abilityOf(st, p, src); if (!ab) return [];
  if (ab.plan) return PLANS[ab.plan](st, p, src);
  return ab.tg || [];
}
// Options for the next target step, given choices made so far. Returns null when no more steps.
function targetOptions(st, p, src, chosen) {
  const steps = targetSteps(st, p, src);
  chosen = chosen || [];
  if (chosen.length >= steps.length) return null;
  return TG[steps[chosen.length]](st, p, src, chosen);
}
function sameOpt(a, b) {
  if (a.uid != null || b.uid != null) return a.uid === b.uid;
  return a.side === b.side && a.lane === b.lane;
}

  const steps = targetSteps(st, p, src);
  targets = targets || [];
  if (targets.length !== steps.length) return false;
  for (let i = 0; i < steps.length; i++) {
    const opts = TG[steps[i]](st, p, src, targets.slice(0, i));
    if (!opts.some(o => sameOpt(o, targets[i]))) return false;
  }
  return true;
}

// ---------------------------------------------------------------- RULE QUERIES
function spellCost(st, p, cd) {
  let c = cd.cost;
  if (cd.type === 'spell' && st.players[p].spells === 0) {
    for (let l = 0; l < LANES; l++) { const b = bl(st, p, l); if (b && !b.hidden && card(b.id).kw.spellDiscount) { c = Math.max(0, c - 1); break; } }
  }
  return c;
}
function costOf(st, p, uid) {
  const inst = st.players[p].hand.find(c => c.uid === uid); if (!inst) return 99;
  return spellCost(st, p, card(inst.id));
}
function meetsReq(st, p, cd) { return cd.land === 'rainbow' || cd.req <= 0 || countLand(st, p, cd.land) >= cd.req; }

// Why a card can't be played (or '' if it can, ignoring targets/lanes).
function playBlock(st, p, uid) {
  if (st.winner != null) return 'The game is over';
  if (st.pending) return 'Finish your choice first';
  if (st.phase !== 'main' || st.active !== p) return 'Not your turn';
  const inst = st.players[p].hand.find(c => c.uid === uid); if (!inst) return 'Not in hand';
  const cd = card(inst.id);
  if (cd.type === 'unknown') return 'Unknown card';
  const cost = spellCost(st, p, cd);
  if (cost > st.players[p].actions) return 'Needs ' + cost + ' Action' + (cost > 1 ? 's' : '');
  if (!meetsReq(st, p, cd)) return 'Needs ' + cd.req + ' face-up ' + LANDS[cd.land].name;
  return '';
}
function playLanes(st, p, uid) {
  const inst = st.players[p].hand.find(c => c.uid === uid); if (!inst) return [];
  const cd = card(inst.id), r = [];
  for (let l = 0; l < LANES; l++) {
    if (cd.type === 'creature') { const c = cr(st, p, l); if (!c || !c.flooped) r.push(l); }
    else if (cd.type === 'building') r.push(l);
  }
  return r;
}
function floopBlock(st, p, lane, slot) {
  if (st.winner != null) return 'The game is over';
  if (st.pending) return 'Finish your choice first';
  if (st.phase !== 'main' || st.active !== p) return 'Not your turn';
  if (st.turn === 1) return 'The first player can\'t floop on turn 1';
  const x = slot === 'b' ? bl(st, p, lane) : cr(st, p, lane);
  if (!x) return 'Nothing there';
  const cd = card(x.id), ab = cd.floop;
  if (!ab) return 'No FLOOP ability';
  if (x.hidden) return 'Traps spring on their own';
  if (x.flooped) return 'Already flooped';
  if (slot !== 'b' && x.frozen) return 'Frozen';
  if ((ab.cost || 0) > st.players[p].actions) return 'Needs ' + ab.cost + ' Action';
  if (ab.cond === 'notFresh' && x.born === st.turn) return 'Needs a turn to rumble';
  if (ab.cond === 'myCreatureHere' && !cr(st, p, lane)) return 'Needs your creature in this lane';
  const steps = targetSteps(st, p, { lane, slot });
  if (steps.length && !hasTargetChain(st, p, { lane, slot }, [])) return 'No valid target';
  return '';
}
function hasTargetChain(st, p, src, chosen) {
  const opts = targetOptions(st, p, src, chosen);
  if (opts === null) return true;
  for (const o of opts) if (hasTargetChain(st, p, src, chosen.concat([o]))) return true;
  return false;
}
function moveCost(st, p, from, to) {
  const c = cr(st, p, from); if (!c) return 99;
  const bf = bl(st, p, from), bt = bl(st, p, to);
  if (bf && bt && !bf.hidden && !bt.hidden && card(bf.id).kw.portal && card(bt.id).kw.portal) return 0;
  if (Math.abs(from - to) !== 1) return 99;
  const L = land(st, p, from);
  if (card(c.id).land === 'blue' && !L.down && L.type === 'blue') return 0;
  return 1;
}
function moveOptions(st, p, from) {
  const c = cr(st, p, from), r = [];
  if (!c || st.active !== p || st.phase !== 'main' || st.pending || st.winner != null) return r;
  if (c.frozen || c.stuck || c.moved) return r;
  for (let to = 0; to < LANES; to++) {
    if (to === from) continue;
    const cost = moveCost(st, p, from, to);
    if (cost > st.players[p].actions) continue;
    const o = cr(st, p, to);
    if (o && (o.frozen || o.stuck || o.moved)) continue;
    r.push({ to, cost, swap: !!o });

}
function canAttack(st, side, lane) {

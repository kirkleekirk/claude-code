  if (card(c.id).kw.collapse && land(st, side, lane).down) return false;
  return cStats(st, side, lane).atk > 0;
}

// ---------------------------------------------------------------- TURN FLOW
function beginTurn(st, ev) {
  st.turn += 1;
  st.round = Math.ceil(st.turn / 2);
  const p = st.active, P = st.players[p];
  P.actions = ACTIONS + (st.turn <= 2 ? P.bonusActions : 0);
  P.spells = 0;
  for (let s = 0; s < 2; s++) for (let l = 0; l < LANES; l++) {
    const c = cr(st, s, l);
    if (c && c.debuffs.length) c.debuffs = c.debuffs.filter(d => d.exp > st.turn);
  }
  for (let l = 0; l < LANES; l++) {
    const c = cr(st, p, l); if (c) { c.flooped = false; c.fl = false; c.moved = false; }
    const b = bl(st, p, l); if (b) { b.flooped = false; b.fl = false; }
  }
  ev.push({ t: 'turn', side: p, turn: st.turn, round: st.round });
  if (st.round > MAX_ROUNDS) { endByRounds(st, ev); return; }
  if (st.round >= st.ot) {
    const n = st.round - st.ot + 1;
    ev.push({ t: 'overtime', side: p, n });
    damageHero(st, p, n, ev, 'overtime');
    if (checkWin(st, ev)) return;
  }
  // start-of-turn effects: home heals, then buildings, then creatures (left to right)
  for (let l = 0; l < LANES; l++) {
    const c = cr(st, p, l);
    if (c && card(c.id).land === 'nice' && onHome(st, p, l)) healCreature(st, p, l, 1, ev);
  }
  for (let l = 0; l < LANES; l++) {
    const b = bl(st, p, l);
    if (b && !b.hidden) for (const ab of card(b.id).ab) if (ab.on === 'start') FX[ab.fx](st, ab, srcOf(st, p, l, 'b'), [], ev);
  }
  const uids = [];
  for (let l = 0; l < LANES; l++) { const c = cr(st, p, l); if (c) uids.push(c.uid); }
  for (const uid of uids) {
    const f = findCreature(st, uid); if (!f || f.side !== p) continue;
    for (const ab of card(f.c.id).ab) if (ab.on === 'start') FX[ab.fx](st, ab, srcOf(st, p, f.lane, 'c'), [], ev);
  }
  checkDeaths(st, ev);
  if (st.winner != null) return;
  if (st.turn > 1) drawCard(st, p, ev);   // the first player skips their first draw
}

function endByRounds(st, ev) {
  const a = st.players[0].hp, b = st.players[1].hp;
  st.winner = a === b ? -1 : (a > b ? 0 : 1);
  st.reason = 'rounds'; st.phase = 'over';
  ev.push({ t: 'gameOver', winner: st.winner, reason: 'rounds' });
}

function resolveAttack(st, p, lane, ev) {
  const o = 1 - p, A = cr(st, p, lane), ak = card(A.id).kw;
  const atk = cStats(st, p, lane).atk;
  if (atk <= 0) return;
  const ob = bl(st, o, lane);
  // Spirit Tower: big attackers get possessed
  if (ob && !ob.hidden && card(ob.id).kw.spirit && atk >= card(ob.id).kw.spirit) {
    ev.push({ t: 'spirit', side: o, lane, uid: A.uid });
    takeControl(st, p, lane, ev, lane);
    destroyBuilding(st, o, lane, ev, 'faded');
    return;
  }
  let D = cr(st, o, lane), dLane = lane;
  if (D && napping(st, o, lane)) D = null;
  if (D && ak.flying && !card(D.id).kw.flying) D = null;
  if (!D && !ak.flying) {
    let best = -1, bestHp = -1;
    for (const l of [lane - 1, lane + 1]) {
      const g = cr(st, o, l);
      if (g && card(g.id).kw.guard && !g.frozen && !napping(st, o, l)) { const hp = cStats(st, o, l).hp; if (hp > bestHp) { bestHp = hp; best = l; } }
    }
    if (best >= 0) { D = cr(st, o, best); dLane = best; }
  }
  const src = { side: p, lane, uid: A.uid, atk: 1 };
  if (D) {
    const dk = card(D.id).kw, ds = cStats(st, o, dLane);
    let toD = atk + (ak.vsChill && (D.chill > 0 || D.frozen) ? ak.vsChill : 0);
    let back = 0;
    if (!(ak.ranged && !dk.ranged) && !D.frozen) back = ds.atk + (dk.vsChill && (A.chill > 0 || A.frozen) ? dk.vsChill : 0);
    ev.push({ t: 'attack', side: p, lane, toSide: o, toLane: dLane, kind: 'creature', guard: dLane !== lane ? 1 : 0, ranged: ak.ranged ? 1 : 0, flying: ak.flying ? 1 : 0, back });
    const dealtD = damageCreature(st, o, dLane, toD, src, ev, 'fight');
    const dealtA = back > 0 ? damageCreature(st, p, lane, back, { side: o, lane: dLane, uid: D.uid }, ev, 'fight') : 0;
    if (dealtD > 0) onFightHit(st, p, lane, o, dLane, ev);
    if (dealtA > 0) onFightHit(st, o, dLane, p, lane, ev);
    if (ak.lifesteal && dealtD > 0) healHero(st, p, dealtD, ev);
    if (dk.lifesteal && dealtA > 0) healHero(st, o, dealtA, ev);
    return;
  }
  const B = bl(st, o, lane);
  if (B && !B.hidden) {
    const rem = bDef(B) - B.dmg;
    const hit = atk + (ak.siege || 0);
    ev.push({ t: 'attack', side: p, lane, toSide: o, toLane: lane, kind: 'building', flying: ak.flying ? 1 : 0, ranged: ak.ranged ? 1 : 0 });
    damageBuilding(st, o, lane, hit, ev);
    const th = card(B.id).kw.thorns;
    if (th && !ak.ranged) damageCreature(st, p, lane, th, { side: o }, ev, 'thorns');
    const spill = Math.min(atk, Math.max(0, hit - rem));
    if (spill > 0) damageHero(st, o, spill, ev, 'fight');
    if (ak.lifesteal) healHero(st, p, Math.min(atk, rem) + spill, ev);
    return;
  }
  ev.push({ t: 'attack', side: p, lane, toSide: o, toLane: lane, kind: 'hero', flying: ak.flying ? 1 : 0, ranged: ak.ranged ? 1 : 0 });
  damageHero(st, o, atk, ev, 'fight');
  if (ak.lifesteal) healHero(st, p, atk, ev);
}

function onFightHit(st, aSide, aLane, dSide, dLane, ev) {
  const A = cr(st, aSide, aLane), D = cr(st, dSide, dLane); if (!A || !D) return;
  const ak = card(A.id).kw, home = onHome(st, aSide, aLane), land0 = card(A.id).land;
  if (ak.rotter) applyRot(st, dSide, dLane, ev);
  if (ak.chiller || (home && land0 === 'ice')) chill(st, dSide, dLane, 1, ev);
  if (home && land0 === 'lava') applyBurn(st, dSide, dLane, 1, ev);
}

function fightPhase(st, ev) {
  const p = st.active;
  ev.push({ t: 'fightPhase', side: p });
  for (let lane = 0; lane < LANES; lane++) {
    if (!canAttack(st, p, lane)) continue;
    resolveAttack(st, p, lane, ev);
    checkDeaths(st, ev);
    if (st.winner != null) return;
  }
}

function endTurn(st, ev) {
  const p = st.active, P = st.players[p];
  if (st.turn > 1) fightPhase(st, ev);
  if (st.winner != null) return;
  // end-of-turn building effects
  for (let l = 0; l < LANES; l++) {
    const b = bl(st, p, l);
    if (b && !b.hidden) for (const ab of card(b.id).ab) if (ab.on === 'end') FX[ab.fx](st, ab, srcOf(st, p, l, 'b'), [], ev);
  }
  checkDeaths(st, ev); if (st.winner != null) return;
  // Ripen
  for (let l = 0; l < LANES; l++) {
    const c = cr(st, p, l);
    if (c && card(c.id).kw.ripen && !c.fl && !c.moved && c.ripen < 1) {
      const L = land(st, p, l);
      if (!L.down && L.type === 'corn') { c.ripen++; c.pAtk++; c.pDef++; ev.push({ t: 'buff', side: p, lane: l, atk: 1, def: 1, perm: 1, ripen: 1 }); }
    }
  }
  // Burn & Rot tick on the active player's creatures
  for (let l = 0; l < LANES; l++) {
    const c = cr(st, p, l); if (!c) continue;
    if (c.burn > 0) { const n = c.burn; c.burn--; damageCreature(st, p, l, n, null, ev, 'burn'); }
    if (cr(st, p, l) && c.rot) damageCreature(st, p, l, 1, null, ev, 'rot');
  }
  checkDeaths(st, ev); if (st.winner != null) return;
  // Thaw & chill wear-off
  for (let l = 0; l < LANES; l++) {
    const c = cr(st, p, l); if (!c) continue;
    if (c.frozen && c.thawAt <= st.turn) { c.frozen = false; ev.push({ t: 'status', side: p, lane: l, s: 'thaw', n: 0 }); }
    if (c.chill) { c.chill = 0; ev.push({ t: 'status', side: p, lane: l, s: 'chill', n: 0 }); }
  }
  for (let s = 0; s < 2; s++) for (let l = 0; l < LANES; l++) { const c = cr(st, s, l); if (c) c.tAtk = 0; }
  ev.push({ t: 'endTurn', side: p });
  st.active = 1 - p;
  beginTurn(st, ev);
}

// ---------------------------------------------------------------- COMMANDS
function exec(st, cmd, ev) {
  if (!cmd || !cmd.t) return 'Bad command';
  if (cmd.t === 'concede') {
    if (st.winner != null) return 'The game is over';
    st.winner = 1 - cmd.p; st.reason = 'concede'; st.phase = 'over';
    ev.push({ t: 'gameOver', winner: st.winner, reason: 'concede' });
    return null;
  }
  if (st.winner != null) return 'The game is over';
  if (cmd.t === 'mulligan') {
    if (st.phase !== 'mulligan') return 'Not mulligan time';
    const P = st.players[cmd.p];
    if (P.mulled != null) return 'Already decided';
    P.mulled = !!cmd.redraw;
    if (cmd.redraw) {
      P.deck = P.deck.concat(P.hand); P.hand = [];
      shuffle(st, P.deck);
      for (let i = 0; i < START_HAND; i++) drawCard(st, cmd.p, ev, true);
      ev.push({ t: 'mulligan', side: cmd.p, rng: 1 });
    }
    if (st.players[0].mulled != null && st.players[1].mulled != null) startGame(st, ev);
    return null;
  }
  if (cmd.t === 'choose') {
    const pd = st.pending;
    if (!pd || pd.side !== cmd.p) return 'Nothing to choose';
    st.pending = null;
    if (pd.kind === 'steal' && cmd.uid != null) {
      if (!pd.options.includes(cmd.uid)) return 'Not an option';
      const O = st.players[pd.from], i = O.hand.findIndex(c => c.uid === cmd.uid);
      if (i >= 0) {
        const inst = O.hand.splice(i, 1)[0];
        inst.owner = pd.side;
        st.players[pd.side].hand.push(inst);
        ev.push({ t: 'stealCard', from: pd.from, to: pd.side, uid: inst.uid, id: inst.id });
      }
    }
    return null;
  }
  if (st.phase !== 'main') return 'Not playing yet';
  if (cmd.p !== st.active) return 'Not your turn';
  if (st.pending) return 'Finish your choice first';
  const p = cmd.p, P = st.players[p];
  switch (cmd.t) {
    case 'end': endTurn(st, ev); return null;
    case 'draw': {
      if (P.actions < 1) return 'Needs 1 Action';
      if (P.hand.length >= HAND_MAX) return 'Hand is full';
      if (!P.deck.length && !P.discard.some(c => !card(c.id).token)) return 'No cards left';
      P.actions -= 1;
      ev.push({ t: 'buyDraw', side: p });
      drawCard(st, p, ev);
      return null;
    }
    case 'move': {
      const opts = moveOptions(st, p, cmd.from);
      const m = opts.find(o => o.to === cmd.to);
      if (!m) return 'Can\'t move there';
      P.actions -= m.cost;
      moveCreature(st, p, cmd.from, cmd.to, ev, false);
      checkDeaths(st, ev);
      return null;
    }
    case 'floop': {
      const slot = cmd.slot === 'b' ? 'b' : 'c';
      const why = floopBlock(st, p, cmd.lane, slot);
      if (why) return why;
      const src = srcOf(st, p, cmd.lane, slot);
      const targets = cmd.targets || [];
      if (!validTargets(st, p, { lane: cmd.lane, slot }, targets)) return 'Invalid target';
      const x = slot === 'b' ? bl(st, p, cmd.lane) : cr(st, p, cmd.lane);
      const ab = card(x.id).floop;
      P.actions -= ab.cost || 0;
      x.flooped = true; x.fl = true;
      ev.push({ t: 'floop', side: p, lane: cmd.lane, slot, id: x.id, uid: x.uid });
      FX[ab.fx](st, ab, src, targets, ev);
      checkDeaths(st, ev);
      return null;
    }
    case 'play': {
      const why = playBlock(st, p, cmd.uid);
      if (why) return why;
      const idx = P.hand.findIndex(c => c.uid === cmd.uid);
      const inst = P.hand[idx], cd = card(inst.id);
      const cost = spellCost(st, p, cd);
      if (cd.type === 'spell') {
        const ab = cd.ab.find(a => a.on === 'cast');
        const targets = cmd.targets || [];
        if (!validTargets(st, p, { uid: cmd.uid }, targets)) return 'Invalid target';
        P.hand.splice(idx, 1); P.actions -= cost; P.spells += 1;
        ev.push({ t: 'cast', side: p, uid: inst.uid, id: inst.id, targets });
        if (ab) FX[ab.fx](st, ab, { side: p, lane: null, slot: null, uid: inst.uid, id: inst.id, lvl: inst.lvl }, targets, ev);
        toDiscard(st, Object.assign({}, inst, { owner: p }));
        checkDeaths(st, ev);
        return null;
      }
      const lane = cmd.lane;
      if (!playLanes(st, p, cmd.uid).includes(lane)) return 'Can\'t play there';
      P.hand.splice(idx, 1); P.actions -= cost;
      inst.owner = inst.owner == null ? p : inst.owner;
      if (cd.type === 'creature') {
        const old = cr(st, p, lane);
        if (old) { P.lanes[lane].creature = null; ev.push({ t: 'replace', side: p, lane, slot: 'c', uid: old.uid, id: old.id }); toDiscard(st, old); }
        placeCreature(st, p, lane, inst, ev, 'play');
        if (cd.id === 'c_maize') ev.push({ t: 'say', side: p, text: 'I LOVE CORN!' });
        for (const ab of cd.ab) if (ab.on === 'play') FX[ab.fx](st, ab, srcOf(st, p, lane, 'c'), [], ev);
        enterLane(st, p, lane, ev);
      } else {
        const old = bl(st, p, lane);
        if (old) { P.lanes[lane].building = null; ev.push({ t: 'replace', side: p, lane, slot: 'b', uid: old.uid, id: old.id }); toDiscard(st, old); }
        P.lanes[lane].building = Object.assign({ uid: inst.uid, id: inst.id, lvl: inst.lvl, owner: inst.owner }, { dmg: 0, flooped: false, fl: false, hidden: !!cd.kw.trap, born: st.turn });
        ev.push({ t: 'build', side: p, lane, uid: inst.uid, id: inst.id, hidden: !!cd.kw.trap });
        for (const ab of cd.ab) if (ab.on === 'play') FX[ab.fx](st, ab, srcOf(st, p, lane, 'b'), [], ev);
      }
      checkDeaths(st, ev);
      return null;
    }
  }
  return 'Unknown command';
}

function apply(state, cmd, opts) {
  const st = opts && opts.inPlace ? state : clone(state);
  const ev = (opts && opts.events) || [];
  const err = exec(st, cmd, ev);
  return { state: st, events: ev, error: err || null };
}

// Enumerate every legal command for player p (used by AI and tests).
function legalActions(st, p, opts) {
  const out = [];
  if (st.winner != null) return out;
  if (st.pending) {
    if (st.pending.side === p) { for (const u of st.pending.options) out.push({ t: 'choose', p, uid: u }); out.push({ t: 'choose', p, uid: null }); }
    return out;
  }
  if (st.phase === 'mulligan') { if (st.players[p].mulled == null) { out.push({ t: 'mulligan', p, redraw: false }, { t: 'mulligan', p, redraw: true }); } return out; }
  if (st.active !== p) return out;
  out.push({ t: 'end', p });
  const P = st.players[p];
  const seen = {};
  for (const inst of P.hand) {
    const key = inst.id + ':' + inst.lvl; if (seen[key]) continue; seen[key] = 1;
    if (playBlock(st, p, inst.uid)) continue;
    const cd = card(inst.id);
    if (cd.type === 'spell') {
      const src = { uid: inst.uid };
      const chains = [];
      (function walk(ch) {
        const o = targetOptions(st, p, src, ch);
        if (o === null) { chains.push(ch); return; }
        for (const x of o) walk(ch.concat([x]));
      })([]);
      for (const ch of chains) out.push({ t: 'play', p, uid: inst.uid, targets: ch });
    } else {
      for (const l of playLanes(st, p, inst.uid)) out.push({ t: 'play', p, uid: inst.uid, lane: l });
    }
  }
  for (let l = 0; l < LANES; l++) for (const slot of ['c', 'b']) {
    if (floopBlock(st, p, l, slot)) continue;
    const src = { lane: l, slot }, chains = [];
    (function walk(ch) {
      const o = targetOptions(st, p, src, ch);
      if (o === null) { chains.push(ch); return; }
      for (const x of o) walk(ch.concat([x]));
    })([]);
    for (const ch of chains) out.push({ t: 'floop', p, lane: l, slot, targets: ch });
  }
  for (let l = 0; l < LANES; l++) for (const m of moveOptions(st, p, l)) out.push({ t: 'move', p, from: l, to: m.to });
  if (P.actions >= 1 && P.hand.length < HAND_MAX && (P.deck.length || P.discard.some(c => !card(c.id).token))) out.push({ t: 'draw', p });
  return out;
}

// What a player is allowed to know. Hidden cards become '?' so the AI can't peek.
function redact(st, viewer) {
  const s = clone(st), o = 1 - viewer, O = s.players[o];
  const revealed = O.revealTurn === s.turn;
  if (!revealed) O.hand = O.hand.map(c => ({ uid: c.uid, id: '?', lvl: 1, owner: c.owner }));
  O.deck = O.deck.map(c => ({ uid: c.uid, id: '?', lvl: 1, owner: c.owner }));
  // your own deck order is unknown to you, except the top card (shown as "Next card" in the UI)
  s.players[viewer].deck = s.players[viewer].deck.map((c, i, a) => (i === a.length - 1 ? c : { uid: c.uid, id: '?', lvl: 1, owner: c.owner }));
  if (O.peekTurn !== s.turn) for (let l = 0; l < LANES; l++) { const b = O.lanes[l].building; if (b && b.hidden) b.id = '?trap'; }
  s.rng = (s.rng ^ 0x5bd1e995) >>> 0;
  return s;
}

// Fight preview for the active player: per-lane outcome of ending the turn now (no turn switch).
function previewFights(st) {
  const s = clone(st), ev = [];
  if (s.winner != null || s.phase !== 'main') return { events: [], lanes: [] };
  const p = s.active;
  if (s.turn > 1) fightPhase(s, ev);
  return { events: ev, state: s, side: p };
}

function validateDeck(deck) {
  const errs = [], warn = [];
  if (!deck || !Array.isArray(deck.cards)) return { ok: false, errs: ['No cards'], warn };
  if (deck.cards.length !== DECK_SIZE) errs.push('Deck needs exactly ' + DECK_SIZE + ' cards (' + deck.cards.length + ')');
  const cnt = {}; let champs = 0;
  for (const id of deck.cards) {
    const cd = CARDS[id];
    if (!cd || cd.token || id[0] === '?') { errs.push('Unknown card ' + id); continue; }
    cnt[id] = (cnt[id] || 0) + 1;
    if (cd.r === 'L') champs++;
  }
  for (const id in cnt) if (cnt[id] > (CARDS[id].r === 'L' ? 1 : MAX_COPIES)) errs.push('Too many copies of ' + CARDS[id].name);
  if (champs > 1) errs.push('Only 1 Champion per deck');
  if (!Array.isArray(deck.lands) || deck.lands.length !== LANES || deck.lands.some(t => !LAND_TYPES.includes(t))) errs.push('Pick 4 landscapes');
  else {
    const have = {}; for (const t of deck.lands) have[t] = (have[t] || 0) + 1;
    for (const id in cnt) { const cd = CARDS[id]; if (cd.land !== 'rainbow' && cd.req > (have[cd.land] || 0)) warn.push(cd.name + ' needs ' + cd.req + ' ' + LANDS[cd.land].name); }
  }
  return { ok: errs.length === 0, errs, warn };
}

function actionsLeftSummary(st, p) {
  // Counts things the player could still do (for the End Turn button hint).
  if (st.active !== p || st.phase !== 'main' || st.winner != null) return { cards: 0, floops: 0, moves: 0, total: 0 };
  let cards = 0, floops = 0, moves = 0;
  const seen = {};
  for (const inst of st.players[p].hand) {
    if (seen[inst.uid]) continue; seen[inst.uid] = 1;
    if (playBlock(st, p, inst.uid)) continue;
    const cd = card(inst.id);
    if (cd.type === 'spell' && !hasTargetChain(st, p, { uid: inst.uid }, [])) continue;
    cards++;
  }
  for (let l = 0; l < LANES; l++) { if (!floopBlock(st, p, l, 'c')) floops++; if (!floopBlock(st, p, l, 'b')) floops++; }
  return { cards, floops, moves, total: cards + floops };
}

const STARTERS = {

    ['s_cauldron', 1], ['s_reaper', 1], ['s_unearth', 1], ['s_breath', 2], ['r_booby', 1], ['r_pancakes', 1], ['r_treefort', 1]]) },
  ice: { name: 'Ice King\'s IcyLands', hero: 'iceking', lands: ['ice', 'ice', 'ice', 'ice'], cards: expand([
    ['i_gunter', 2], ['i_golem', 2], ['i_sprite', 2], ['i_yeti', 2], ['i_wizard', 1], ['i_king', 1], ['i_castle', 1], ['i_lake', 1],

// ------------------------------------------------------------------ HOLOGRAM BAKER
const cache = new Map();
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(rgb, t, to) { to = to || [255, 255, 255]; return rgb.map((v, i) => Math.round(v + (to[i] - v) * t)); }
const css = (rgb, a) => 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (a == null ? 1 : a) + ')';
function recipe(id) { const g = new G(); (R[id] || R.back)(g); return g; }

// Bake a hologram sprite: returns { body, glow, w, h } canvases (w x h pixels, 100x120 art units).
function holo(id, color, h) {
  h = Math.max(24, Math.round(h));
  const key = id + '|' + color + '|' + h;
  let v = cache.get(key); if (v) return v;
  const w = Math.round(h * 100 / 120), s = h / 120, pad = Math.round(h * 0.12);
  const rgb = hexToRgb(color), lite = mix(rgb, 0.65), deep = mix(rgb, 0.65, [6, 8, 24]);
  const g = recipe(id);
  const fills = g.ops.filter(o => o.kind === 'fill');
  const body = document.createElement('canvas'); body.width = w + pad * 2; body.height = h + pad * 2;
  const x = body.getContext('2d');
  x.translate(pad, pad); x.scale(s, s);
  // dark translucent base so stacked parts read
  x.fillStyle = css(deep, 0.55); for (const o of fills) x.fill(o.p);
  // tone fills
  for (const o of fills) { x.fillStyle = css(mix(rgb, o.tone * 0.55), 0.22 + o.tone * 0.5); x.fill(o.p); }
  // neon outlines
  x.lineJoin = 'round'; x.lineCap = 'round';
  x.strokeStyle = css(lite, 0.95); x.lineWidth = 1.7 / Math.max(0.6, s) * 0.62 + 0.9;
  for (const o of fills) x.stroke(o.p);
  // details
  for (const o of g.ops) {
    if (o.kind === 'line') { x.strokeStyle = css(o.tone > 0.5 ? mix(rgb, 0.85) : deep, 0.95); x.lineWidth = o.w; x.stroke(o.p); }
    else if (o.kind === 'dot') { x.fillStyle = css(mix(rgb, 0.92), 1); x.fill(o.p); }
    else if (o.kind === 'pupil') { x.fillStyle = css(deep, 1); x.fill(o.p); }
  }
  // scanlines + top sheen (only where the sprite has pixels)
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = 'rgba(0,0,0,0.16)';
  for (let yy = 0; yy < body.height; yy += 3) x.fillRect(0, yy, body.width, 1);
  const gr = x.createLinearGradient(0, 0, 0, body.height); gr.addColorStop(0, 'rgba(255,255,255,0.28)'); gr.addColorStop(0.45, 'rgba(255,255,255,0)'); gr.addColorStop(1, css(rgb, 0.12));
  x.fillStyle = gr; x.fillRect(0, 0, body.width, body.height);
  x.globalCompositeOperation = 'source-over';
  // soft glow halo
  const glow = document.createElement('canvas'); glow.width = body.width; glow.height = body.height;
  const y = glow.getContext('2d');
  y.translate(pad, pad); y.scale(s, s);
  y.shadowColor = css(rgb, 1); y.shadowBlur = 10 * s * 2.2; y.fillStyle = css(rgb, 0.85);
  for (const o of fills) y.fill(o.p);
  v = { body, glow, w: body.width, h: body.height, pad, artW: w, artH: h };
  cache.set(key, v);
  if (cache.size > 900) { const k = cache.keys().next().value; cache.delete(k); }
  return v;
}

// Card art: hologram over a faction-tinted grid, returned as a cached data URL.
const urlCache = new Map();
function cardArtURL(id, color, w, h) {
  const key = id + '|' + color + '|' + w + 'x' + h;
  if (urlCache.has(key)) return urlCache.get(key);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), rgb = hexToRgb(color);
  const bg = x.createRadialGradient(w / 2, h * 0.75, 4, w / 2, h * 0.6, w * 0.8);
  bg.addColorStop(0, css(mix(rgb, 0.1, [10, 12, 30]), 1)); bg.addColorStop(1, css(mix(rgb, 0.82, [6, 6, 18]), 1));
  x.fillStyle = bg; x.fillRect(0, 0, w, h);
  x.strokeStyle = css(rgb, 0.16); x.lineWidth = 1;
  for (let i = 0; i < w; i += Math.max(6, w / 10)) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
  for (let j = 0; j < h; j += Math.max(6, w / 10)) { x.beginPath(); x.moveTo(0, j); x.lineTo(w, j); x.stroke(); }
  x.fillStyle = css(rgb, 0.35); x.beginPath(); x.ellipse(w / 2, h * 0.9, w * 0.32, h * 0.07, 0, 0, 7); x.fill();
  const sh = h * 0.98, sp = holo(id, color, sh);

  x.globalAlpha = 0.6; x.globalCompositeOperation = 'lighter'; x.drawImage(sp.glow, dx, dy); x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  x.drawImage(sp.body, dx, dy);
  const url = c.toDataURL();
  urlCache.set(key, url);
  return url;
}

// ------------------------------------------------------------------ LANDSCAPE ICONS (vector, for felt + UI)
function landIcon(x, type, cx, cy, r, color, alpha) {
  x.save(); x.translate(cx, cy); x.scale(r / 10, r / 10);
  x.globalAlpha = alpha == null ? 1 : alpha;
  x.fillStyle = color; x.strokeStyle = color; x.lineWidth = 1.8; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath();
  if (type === 'corn') { x.ellipse(0, 1, 3.6, 7.5, 0, 0, 7); x.fill(); x.beginPath(); x.moveTo(-1, 8); x.quadraticCurveTo(-8, 4, -7, -3); x.moveTo(1, 8); x.quadraticCurveTo(8, 4, 7, -3); x.stroke(); }
  else if (type === 'blue') { x.moveTo(-8, 7); x.quadraticCurveTo(-6, -2, -2, -8); x.moveTo(-2, 8); x.quadraticCurveTo(0, 0, 1, -9); x.moveTo(4, 8); x.quadraticCurveTo(6, 0, 9, -5); x.stroke(); }
  else if (type === 'swamp') { x.arc(-3, 3, 4.5, 0, 7); x.moveTo(7.5, -3); x.arc(4.5, -3, 3, 0, 7); x.moveTo(4, -8); x.arc(2.5, -8.5, 1.6, 0, 7); x.stroke(); }
  else if (type === 'ice') { for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; x.moveTo(Math.cos(a) * 9, Math.sin(a) * 9); x.lineTo(-Math.cos(a) * 9, -Math.sin(a) * 9); } x.stroke(); x.beginPath(); x.arc(0, 0, 2.2, 0, 7); x.fill(); }
  else if (type === 'nice') { x.moveTo(0, 8); x.bezierCurveTo(-11, 0, -7, -9, 0, -4); x.bezierCurveTo(7, -9, 11, 0, 0, 8); x.fill(); }
  else if (type === 'lava') { x.moveTo(-6, 8); x.quadraticCurveTo(-9, -1, -2, -4); x.quadraticCurveTo(-3, -8, 1, -10); x.quadraticCurveTo(2, -4, 5, -5); x.quadraticCurveTo(9, 1, 6, 8); x.closePath(); x.fill(); }
  else { x.lineWidth = 2.4; x.arc(0, 6, 9, Math.PI, 0); x.stroke(); x.beginPath(); x.arc(0, 6, 4.5, Math.PI, 0); x.stroke(); }
  x.restore();
}

  if (R.cbIcons && !isB) { const q = P(gx + 0.36, 0.01, gz + sideSign(side) * 0.3), r0 = Math.max(3, q.s * 0.05); x.save(); x.fillStyle = team; x.strokeStyle = '#120a1c'; x.lineWidth = 1.5; x.beginPath(); if (mine) x.arc(q.x, q.y, r0, 0, 7); else { x.moveTo(q.x, q.y - r0 * 1.2); x.lineTo(q.x + r0 * 1.2, q.y); x.lineTo(q.x, q.y + r0 * 1.2); x.lineTo(q.x - r0 * 1.2, q.y); x.closePath(); } x.fill(); x.stroke(); x.restore(); }

    turn: 950, draw: 110, cast: 620, summon: 640, build: 640, replace: 180, floop: 430, ready: 260, move: 400, attack: 420, damage: 170, bdamage: 150,
    hero: 330, heal: 220, heroHeal: 260, death: 430, bdeath: 460, status: 150, buff: 150, land: 680, steal: 700, trap: 650, spirit: 760,
    reveal: 1500, stealCard: 800, study: 320, zap: 360, crash: 260, say: 950, volcano: 1300, immortal: 420, immune: 300, fightPhase: 420,
    endTurn: 120, overtime: 800, reshuffle: 450, handFull: 300, buyDraw: 60, mulligan: 0, setup: 0, gameOver: 200, pending: 0, actions: 0, _sync: 0

  let d = T[ev.t] != null ? T[ev.t] : 120;

      D.cur = D.q.shift();

let handSig = '';
function renderHand() {
  const st = M.disp; if (!st) return;
  if (drag && drag.moved) { handSig = ''; return; }   // never rebuild under a live drag
  const me = M.viewer, P = st.players[me];
  const human = M.seats[me].kind === 'human';
  const hidden = !human || M.waitingPass;
  const sig = P.hand.map(c => c.uid).join(',') + '|' + (M.sel && M.sel.uid) + '|' + P.actions + '|' + isMyTurn() + hidden + document.body.className + window.innerWidth + 'x' + window.innerHeight + countLandsSig(st, me);
  if (sig === handSig) return;
  handSig = sig;
  const h = $('#hand'); h.innerHTML = '';
  const n = P.hand.length; if (!n) return;
  const wide = document.body.classList.contains('wide');
  const box = h.getBoundingClientRect();
  const fs = parseFloat(getComputedStyle(document.documentElement).fontSize);
  let cw, chh, positions = [];
  if (!wide) {
    cw = 4.9 * fs; chh = 6.9 * fs;
    const maxW = box.width - 12, step = n > 1 ? Math.min(cw * 0.92, (maxW - cw) / (n - 1)) : 0;
    const total = cw + step * (n - 1), x0 = (box.width - total) / 2;
    for (let i = 0; i < n; i++) { const c = i - (n - 1) / 2; positions.push({ x: x0 + i * step, y: box.height - chh - 10 + Math.abs(c) * c * 0 + c * c * 2.2, rot: c * 3.2, fs: 1 }); }
  } else {
    let cols = n <= 4 ? 2 : 3, rows = Math.ceil(n / cols);
    let wpx = (box.width - (cols - 1) * 8) / cols, hpx = wpx * 6.9 / 4.9;
    if (rows * (hpx + 8) > box.height) { hpx = (box.height - (rows - 1) * 8) / rows; wpx = hpx * 4.9 / 6.9; }
    const sc = wpx / (4.9 * fs);
    cw = wpx; chh = hpx;
    for (let i = 0; i < n; i++) { const r = Math.floor(i / cols), c = i % cols; const rowCount = Math.min(cols, n - r * cols); const off = (box.width - (rowCount * wpx + (rowCount - 1) * 8)) / 2; positions.push({ x: off + c * (wpx + 8), y: r * (hpx + 8), rot: 0, fs: sc }); }
  }
  P.hand.forEach((inst, i) => {
    const why = hidden ? 'hidden' : E.playBlock(st, me, inst.uid);
    const cost = E.spellCost(st, me, E.CARDS[inst.id]);
    const el = hidden ? cardEl('?', { back: true }) : cardEl(inst.id, { lvl: inst.lvl, mini: !wide || positions[i].fs < 1.4, dim: !!why, cost });
    const pos = positions[i];
    el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px'; el.style.fontSize = pos.fs + 'rem';
    const selected = M.sel && M.sel.uid === inst.uid;
    el.style.transform = selected ? 'translateY(-' + (wide ? 0.4 : 1.6) + 'rem) scale(' + (wide ? 1.04 : 1.12) + ')' : 'rotate(' + pos.rot + 'deg)';
    if (selected) el.classList.add('sel');
    el.dataset.uid = inst.uid;
    if (!hidden) attachCardInput(el, inst);
    h.appendChild(el);
  });
}

function updateHL() {

// ------------------------------------------------------------------ commands
function snapApply(st, cmd) {
  const s = E.clone(st), ev = [];
  ev.push = function (e) { e.snap = E.clone(s); return Array.prototype.push.call(this, e); };
  const r = E.apply(s, cmd, { inPlace: true, events: ev });
  return { state: s, events: ev, error: r.error };
}
function exec(cmd, who) {

  const reveals = r.events.some(e => e.rng || e.info || e.t === 'draw' || e.t === 'trap' || e.t === 'reveal' || e.t === 'turn' || e.t === 'stealCard');
  if (who === 'human') M.undo = reveals || cmd.t === 'end' ? null : { state: M.st, log: M.log.length };
  else M.undo = null;
  M.st = r.state;
  pushEvents(r.events);
  if (M.tutorial && M.tutorial.onCmd) M.tutorial.onCmd(cmd, r);
  return r;
}
function humanCmd(cmd) {

  const r = exec(cmd, 'human');
  if (r.error) { Sound.play('error'); toast(r.error); return false; }
  if (cmd.t === 'end') Sound.play('click');

}
function doUndo() {

// ------------------------------------------------------------------ idle / AI / turn flow
let aiTimer = 0;
function onIdle() {
  if (!M.on) return;
  M.disp = M.st; R.setState(M.st, M.viewer);
  if (M.st.winner != null && !M.ended) { M.ended = true; R.preview = null; R.hl = []; setTimeout(() => finish(), 700); refreshHUD(); return; }
  if (M.ended) return;
  const st = M.st;
  if (st.phase !== 'main') return;
  if (st.pending) {
    const pd = st.pending;
    if (M.seats[pd.side].kind === 'human') { if (!M.choosing) humanChooseSteal(pd); }
    else if (aiTimer <= 0) { aiTimer = 0.4; exec({ t: 'choose', p: pd.side, uid: AI.chooseSteal(st, pd.side) }, 'ai'); }
    return;
  }
  const seat = M.seats[st.active];
  if (seat.kind === 'ai') {
    if (aiTimer > 0) return;
    aiStep();
    return;
  }
  // human seat to act
  if (M.mode === 'pvp' && st.active !== M.viewer && !M.waitingPass) { passDevice(st.active); return; }
  if (!M.idleShown && isMyTurn()) { M.idleShown = true; updateHL(); refreshHUD(); startTimer(); if (M.tutorial && M.tutorial.onIdle) M.tutorial.onIdle(); }
}
function aiStep() {

    const scripted = seat.plan ? seat.plan(st, me) : null;
    M.aiPlan = scripted || AI.planTurn(st, me, { difficulty: seat.difficulty, personality: seat.personality, seed: (E.hashSeed(M.cfg.seed) + st.turn * 977 + M.aiGuard) >>> 0 });
    if (!M.aiPlan.length) M.aiPlan = [{ t: 'end', p: me }];
  }
  const cmd = M.aiPlan.shift();
  const r = exec(cmd, 'ai');
  M.aiGuard++;
  if (r.error) { M.aiPlan = []; if (M.aiGuard > 60) exec({ t: 'end', p: me }, 'ai'); aiTimer = 0.05; return; }
  if (cmd.t === 'end') { M.aiPlan = null; M.aiGuard = 0; aiTimer = 0.2; maybeAITaunt(me); return; }
  if (r.events.some(e => e.rng || e.t === 'draw' || e.t === 'trap' || e.t === 'reveal' || e.t === 'pending')) M.aiPlan = [];
  aiTimer = 0.35 / D.speed;

}

}

  const d = modal('<h2>Silo of Truth</h2><p class="center">You see ' + esc(O.name) + '\u2019s whole hand. Tap a <b>Spell</b> to steal it:</p><div class="row" id="stealRow"></div><div class="row"><button class="btn ghost small" data-skip>Take nothing</button></div>', { noClose: true, wide: true });
  const row = d.querySelector('#stealRow');

  if (traps.length) row.insertAdjacentHTML('beforebegin', '<p class="center" style="color:#ffe27a;font-size:.8rem">Face-down: ' + esc(traps.join(', ')) + '</p>');

// ------------------------------------------------------------------ fight preview
function fightPreview() {
  const st = M.st, me = M.viewer; if (!st || st.active !== me || st.turn === 1) return null;
  const red = E.redact(st, me);
  const pv = E.previewFights(red); if (!pv.state) return null;
  const items = [], arrows = [];
  const o = 1 - me;
  for (let l = 0; l < 4; l++) {
    for (const side of [o, me]) {
      const a = st.players[side].lanes[l].creature, b = pv.state.players[side].lanes[l].creature;
      if (!a) continue;
      if (!b || b.uid !== a.uid) items.push({ side, lane: l, dmg: E.cStats(st, side, l).hp, lethal: true });
      else if (b.dmg > a.dmg && side === o) items.push({ side, lane: l, dmg: b.dmg - a.dmg, lethal: false });
    }
    const ba = st.players[o].lanes[l].building, bb = pv.state.players[o].lanes[l].building;
    if (ba && (!bb || bb.dmg > ba.dmg)) items.push({ side: o, lane: l, slot: 'b', dmg: bb ? bb.dmg - ba.dmg : E.bDef(ba) - ba.dmg, lethal: !bb });
  }
  const dh = st.players[o].hp - pv.state.players[o].hp;
  if (dh > 0) items.push({ hero: true, side: o, dmg: dh, lethal: pv.state.players[o].hp <= 0 });
  for (const e of pv.events) if (e.t === 'attack') arrows.push({ side: e.side, lane: e.lane, toSide: e.toSide, toLane: e.toLane, toSlot: e.kind === 'building' ? 'b' : 'c', hero: e.kind === 'hero' });

  const g = E.newGame({ seed: cfg.seed, first: cfg.first, overtime: cfg.overtime, noMulligan: !!cfg.noMulligan, players: cfg.seats.map(s => ({ name: s.name, hero: s.hero, deck: s.deck, levels: s.levels, hp: s.hp, startBuildings: s.startBuildings, bonusActions: s.bonusActions })) });

  if (M.mode === 'pvp') M.viewer = M.st.first;
  R.colors = M.mode === 'pvp' ? [R.TEAM[0], R.TEAM[1]] : (M.viewer === 0 ? [R.TEAM[0], R.TEAM[1]] : [R.TEAM[1], R.TEAM[0]]);
  M.disp = M.st;

  R.intro = settings.reduceMotion ? null : { t: 0 }; let pops = 0;

  R.setState(M.st, M.viewer);

  if (M.st.phase === 'mulligan') doMulligans(); else afterSetup();
}
function doMulligans() {
  for (let p = 0; p < 2; p++) if (M.seats[p].kind === 'ai') M.st = E.apply(M.st, AI.decide(M.st, p, {})).state;
  const humans = [0, 1].filter(p => M.seats[p].kind === 'human' && M.st.players[p].mulled == null);
  const next = () => {
    const p = humans.shift();
    if (p == null) { afterSetup(); return; }
    if (M.mode === 'pvp') M.viewer = p;
    const P = M.st.players[p];
    const d = modal('<h2>' + esc(P.name) + ': opening hand</h2><p class="center">Keep these 5 cards, or shuffle them back and draw 5 new ones (once).<br><small>Tip: you want at least two creatures you can play.</small></p><div class="row" id="mullRow"></div><div class="row"><button class="btn" data-keep>Keep</button><button class="btn blue" data-mull>Mulligan</button></div>', { noClose: true });
    const row = d.querySelector('#mullRow');
    for (const c of P.hand) { const el = cardEl(c.id, { lvl: c.lvl, mini: true }); el.style.fontSize = '1.05rem'; el.onclick = () => {}; row.appendChild(el); }
    d.querySelector('[data-keep]').onclick = () => { closeModal(); M.st = E.apply(M.st, { t: 'mulligan', p, redraw: false }).state; next(); };
    d.querySelector('[data-mull]').onclick = () => { closeModal(); M.st = E.apply(M.st, { t: 'mulligan', p, redraw: true }).state; Sound.play('whoosh'); next(); };
  };

  M.disp = M.st; R.setState(M.st, M.viewer);

  // opening: everyone floops their land cards, then the first turn banner

  pushEvents([{ t: '_pause', ms: R.intro ? 1500 : 0 }, { t: 'turn', side: M.st.active, turn: M.st.turn, round: M.st.round, snap: E.clone(M.st) }]);

}

function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  const wide = W / H > 0.95;
  document.body.classList.toggle('wide', wide); document.body.classList.toggle('portrait', !wide);
  const s = wide ? Math.max(0.72, Math.min(1.9, Math.min(W / 844, H / 390))) : Math.max(0.78, Math.min(1.5, Math.min(W / 390, H / 760)));
  document.documentElement.style.setProperty('--s', s.toFixed(3));
  R.resize();
  const ba = $('#board-area').getBoundingClientRect();
  if (ba.width > 0) R.setRect({ x: ba.left, y: ba.top, w: ba.width, h: ba.height });
  else R.setRect({ x: 0, y: H * 0.1, w: W, h: H * 0.6 });

// ------------------------------------------------------------------ collection helpers
function own(id) { return S.cards[id] ? S.cards[id].n : 0; }
function lvl(id) { return S.cards[id] ? S.cards[id].lvl || 1 : 1; }
function maxCopies(id) { return E.CARDS[id].r === 'L' ? 1 : 2; }
function grant(id, n) { const c = S.cards[id] || (S.cards[id] = { n: 0, lvl: 1 }); const add = Math.min(n, maxCopies(id) - c.n); c.n += Math.max(0, add); return Math.max(0, add); }
function unlockLand(land, silent) {
  if (S.unlocked[land]) return false;
  S.unlocked[land] = true;
  const st = E.STARTERS[land];
  const cnt = {}; st.cards.forEach(id => (cnt[id] = (cnt[id] || 0) + 1));
  for (const id in cnt) grant(id, cnt[id]);
  if (!S.decks.some(d => d.from === land)) S.decks.push({ name: st.name, lands: st.lands.slice(), cards: st.cards.slice(), from: land });
  save();
  if (!silent) UI.toast('New deck unlocked: ' + st.name + '!');
  return true;
}
function levelsFor() { const o = {}; for (const id in S.cards) o[id] = S.cards[id].lvl || 1; return o; }
function activeDeck() { const d = S.decks[S.active] || S.decks[0]; return d; }
function deckHero(d) {
  const cnt = {}; for (const t of d.lands) cnt[t] = (cnt[t] || 0) + 1;
  let best = d.lands[0], bn = 0; for (const t in cnt) if (cnt[t] > bn) { bn = cnt[t]; best = t; }
  return HEROES[best] || 'finn';
}
function deckValid(d) { const v = E.validateDeck(d); for (const id of d.cards) { const n = d.cards.filter(x => x === id).length; if (n > own(id)) { v.ok = false; v.errs.push('You only own ' + own(id) + ' ' + E.CARDS[id].name); break; } } return v; }

  { name: 'Overtime Early', text: 'The board overheats from round 8.', overtime: 8 },

function daily() {

  $('#modal [data-go]').onclick = () => {

function pvp() {

    '<p><b style="color:#ff9a2e">Player 2</b> <input data-n="1" value="Jake" style="width:7rem;padding:.3rem;border-radius:.4rem"><br>' + sel(1, Math.max(0, options.findIndex(o => o.deck === E.STARTERS.corn))) + '</p>' +

// ------------------------------------------------------------------ results & packs
function results(res, o, ctx) {
  const won = ctx.pvp ? null : res.winner === res.viewer;
  let sparks = 0, packN = 0, unlocked = null, first = false;
  if (!ctx.pvp && !ctx.tutorial) {
    S.stats.games++;
    const land = o ? o.land : 'blue';
    S.stats.byLand[land] = S.stats.byLand[land] || { w: 0, l: 0 };
    if (won) { S.stats.wins++; S.stats.streak++; S.stats.best = Math.max(S.stats.best, S.stats.streak); S.stats.byLand[land].w++; sparks = 30; packN = 3; }
    else { S.stats.losses++; S.stats.streak = 0; S.stats.byLand[land].l++; sparks = 10; packN = 1; }
    if (won && ctx.tour != null && !S.tour.beaten.includes(o.id)) { S.tour.beaten.push(o.id); first = true; sparks += 20; }
    if (won && o && !S.unlocked[o.land]) unlocked = o.land;
    if (won && ctx.daily && !(S.daily.date === ctx.daily && S.daily.done)) { S.daily = { date: ctx.daily, done: true }; sparks += 100; }
    S.sparks += sparks;
    if (unlocked) unlockLand(unlocked, true);
    save();
  }
  const title = ctx.pvp ? (res.winner >= 0 ? esc(res.names[res.winner]) + ' is the COOL GUY!' : 'Both dweebs! (draw)') : (won ? 'YOU’RE THE COOL GUY!' : 'DWEEB!');
  const sub = ctx.pvp ? '' : (won ? 'You win! Drink from the Cool Guy cup.' : 'You lose… drink the Dweeb cup (coffee grounds, kimchi, ham chunk juice).');
  const el = screen('result', '<div class="result"><div class="big" style="--rc:' + (won === false ? '#ff6a6a' : '#ffcf3a') + '">' + title + '</div><p>' + esc(sub) + '</p>' +
    '<div class="cups"><div class="cup ' + (won === false ? 'lose' : 'win') + '" style="--liq:' + (won === false ? '#6a7b2a' : '#5b2d0e') + '">' + (won === false ? 'DWEEB' : 'COOL GUY') + '</div></div>' +
    '<div class="rewards"><div class="rw"><span>Rounds</span><b>' + res.rounds + '</b></div><div class="rw"><span>Damage dealt</span><b>' + (res.stats ? res.stats.dealt : 0) + '</b></div><div class="rw"><span>Creatures destroyed</span><b>' + (res.stats ? res.stats.killed : 0) + '</b></div>' +
    (sparks ? '<div class="rw"><span>Sparks</span><b id="sparkCount">0</b></div>' : '') + '</div>' +
    (first ? '<p class="center" style="color:#7dff9a;font-weight:900">First win against ' + esc(o.name) + '! +20 bonus Sparks</p>' : '') +
    (unlocked ? '<p class="center" style="color:#ffcf3a;font-weight:900">New deck unlocked: ' + esc(E.STARTERS[unlocked].name) + '!</p>' : '') +
    '<div class="menu" style="margin-top:.6rem">' + (packN ? '<button class="btn" data-pack>Open card pack (' + packN + ')</button>' : '') +
    (o && !ctx.daily ? '<button class="btn blue" data-again>Rematch</button>' : '') +
    (ctx.tour != null && won && ctx.tour + 1 < TOUR.length ? '<button class="btn green" data-next>Next opponent</button>' : '') +
    '<button class="btn ghost" data-home>Home</button></div></div>');
  if (sparks) { let n = 0; const tgt = sparks; const t = setInterval(() => { n = Math.min(tgt, n + Math.ceil(tgt / 25)); const s = el.querySelector('#sparkCount'); if (s) s.textContent = '+' + n; if (n % 3 === 0) Sound.play('coin'); if (n >= tgt) clearInterval(t); }, 40); }
  const pk = el.querySelector('[data-pack]'); if (pk) pk.onclick = () => openPack(packN, () => results(res, o, Object.assign({}, ctx, { opened: true })));
  if (ctx.opened && pk) pk.remove();
  const ag = el.querySelector('[data-again]'); if (ag) ag.onclick = () => playVs(o, ctx);
  const nx = el.querySelector('[data-next]'); if (nx) nx.onclick = () => prematch(TOUR[ctx.tour + 1], ctx.tour + 1);
  el.querySelector('[data-home]').onclick = () => home();
  if (S.tour.beaten.length === TOUR.length && first && o && o.boss) setTimeout(() => UI.modal('<h2>Card Wars Champion!</h2><div class="center">' + portraitImg('jake', '4.5rem') + '</div><p class="center">“You beat me... fair and square. That’s... that’s cool, man. Want a sip of the Dweeb cup? It’s actually not that bad.”</p><div class="row"><button class="btn" data-close>Mathematical!</button></div>'), 900);
}
function rollCard() {
  const pool = E.COLLECTIBLE.filter(id => { const cd = E.CARDS[id]; return cd.land === 'rainbow' || S.unlocked[cd.land]; });
  const roll = Math.random() * 100, r = roll < 2 ? 'L' : roll < 12 ? 'E' : roll < 40 ? 'R' : 'C';
  let cand = pool.filter(id => E.CARDS[id].r === r);
  if (!cand.length) cand = pool;
  return cand[Math.floor(Math.random() * cand.length)];
}
function openPack(n, done) {
  const cards = []; for (let i = 0; i < n; i++) cards.push(rollCard());
  const el = screen('pack', topbar('Card Pack', false) + '<p class="center">Tap the pack!</p><div class="pack" id="pk"></div><div class="packrow" id="pr"></div><div class="menu hide" id="pd"><button class="btn" data-done>Continue</button></div>');
  const pk = el.querySelector('#pk'), pr = el.querySelector('#pr');
  pk.onclick = () => {
    Sound.play('pack'); pk.classList.add('burst');
    setTimeout(() => {
      pk.remove();
      let flipped = 0;
      cards.forEach((id, i) => {
        const f = document.createElement('div'); f.className = 'flip';
        const back = UI.cardEl('?', { back: true }); back.style.fontSize = '1.5rem';
        const front = UI.cardEl(id, { lvl: lvl(id) }); front.style.fontSize = '1.5rem';
        const fw = document.createElement('div'); fw.className = 'front'; fw.appendChild(front);
        const bw = document.createElement('div'); bw.appendChild(back);
        f.appendChild(bw); f.appendChild(fw);
        f.onclick = () => {
          if (f.classList.contains('open')) { UI.inspect(id, lvl(id)); return; }
          f.classList.add('open'); Sound.play(E.CARDS[id].r === 'L' || E.CARDS[id].r === 'E' ? 'win' : 'coin');
          const added = grant(id, 1);
          const tag = document.createElement('div'); tag.className = 'newtag';
          if (added) tag.textContent = own(id) === 1 ? 'NEW!' : '+1 COPY'; else { tag.textContent = 'MAXED +8✦'; tag.style.background = '#2f8ee8'; S.sparks += 8; }
          f.appendChild(tag); save();
          if (++flipped === cards.length) el.querySelector('#pd').classList.remove('hide');
        };
        pr.appendChild(f);
        setTimeout(() => f.animate([{ transform: 'translateY(2rem) scale(.6)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 350, easing: 'ease-out' }), i * 120);
      });
    }, 450);
  };
  el.querySelector('[data-done]').onclick = () => done();
}

}

const LVL_COST = [0, 30, 80, 160];
function collection() {
  let filter = 'all';
  const el = screen('collection', topbar('Collection', true) + '<div class="tabs" id="tabs"></div><p style="font-size:.75rem;color:#b6a9d6;margin:.2rem 0 .6rem">Tap a card to inspect it and level it up with Sparks (+stats per level, max level 4).</p><div class="cgrid" id="grid"></div>');
  wireBack(el);
  function render() {
    const tabs = el.querySelector('#tabs'); tabs.innerHTML = '';
    ['all'].concat(E.LAND_TYPES, ['rainbow']).forEach(t => { const b = document.createElement('button'); b.textContent = t === 'all' ? 'All' : E.LANDS[t].name; if (t === filter) b.classList.add('on'); b.onclick = () => { filter = t; render(); }; tabs.appendChild(b); });
    const grid = el.querySelector('#grid'); grid.innerHTML = '';
    const ids = E.COLLECTIBLE.filter(id => filter === 'all' || E.CARDS[id].land === filter);
    let owned = 0;
    for (const id of ids) {
      const n = own(id); if (n) owned++;
      const c = UI.cardEl(id, { lvl: lvl(id), mini: true, locked: !n, count: n || null });
      c.onclick = () => openCard(id);
      grid.appendChild(c);
    }
    el.querySelector('h1').textContent = 'Collection ' + owned + '/' + ids.length;
  }
  function openCard(id) {
    const n = own(id), L = lvl(id), cost = LVL_COST[L];
    const extra = n ? (L < 4 ? '<div class="row"><button class="btn" data-up ' + (S.sparks < cost ? 'disabled' : '') + '>Level up → ' + (L + 1) + ' (' + cost + '✦)</button></div><p class="center" style="font-size:.72rem;color:#b6a9d6">You have ' + S.sparks + ' Sparks. Level 2: +1 DEF, Level 3: +1 ATK (spells +1 power), Level 4: +1 DEF.</p>' : '<p class="center">Max level!</p>')
      : '<p class="center" style="color:#b6a9d6">Not owned yet. ' + (E.CARDS[id].land === 'rainbow' || S.unlocked[E.CARDS[id].land] ? 'Find it in card packs.' : 'Beat a ' + E.LANDS[E.CARDS[id].land].name + ' player on the Table Tour to unlock.') + '</p>';

    const up = $('#modal [data-up]');
    if (up) up.onclick = () => { if (S.sparks < cost) return; S.sparks -= cost; S.cards[id].lvl = L + 1; save(); Sound.play('win'); UI.closeModal(); UI.toast(E.CARDS[id].name + ' is now level ' + (L + 1) + '!'); render(); };
  }
  render();
}

    tg('haptics', 'Haptics (vibration)') + tg('reduceMotion', 'Reduce motion') + tg('cbIcons', 'Colour-blind icons on landscapes') +
    seg('text', 'Text size', [[0.9, 'S'], [1, 'M'], [1.12, 'L']]) + seg('speed', 'Game speed', [[1, '1x'], [2, '2x']]) +
    tg('timer', '45-second turn timer') + tg('confirm', 'Confirm targeted actions on touch') + seg('quality', 'Graphics', [[1, 'Crisp'], [0.75, 'Battery saver']]) +
    (inMatch ? '' : '<div class="set">Replay the tutorial<button class="btn small" data-tut>Start</button></div><div class="set">Reset all progress<button class="btn red small" data-reset>Reset</button></div>');
  let root;
  if (inMatch) { root = UI.modal('<h2>Settings</h2>' + html + '<div class="row"><button class="btn" data-close>Done</button></div>'); }
  else { root = screen('settings', topbar('Settings', true) + '<div style="max-width:30rem;margin:0 auto">' + html + '</div>'); wireBack(root, back || home); }
  root.querySelectorAll('[data-r]').forEach(r => r.oninput = () => { st[r.dataset.r] = +r.value; save(); applySettings(); });
  root.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { st[b.dataset.t] = !st[b.dataset.t]; b.classList.toggle('on', st[b.dataset.t]); save(); applySettings(); Sound.play('click'); });
  root.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { st[b.dataset.s] = +b.dataset.v; save(); applySettings(); Sound.play('click'); root.querySelectorAll('[data-s="' + b.dataset.s + '"]').forEach(x => x.classList.toggle('on', x === b)); });
  const t = root.querySelector('[data-tut]'); if (t) t.onclick = () => Tutorial.start();

    $('#modal [data-y]').onclick = () => { UI.closeModal(); const keep = S.settings; S = defaults(); S.settings = keep; save(); home(); };

UI.onSettings = () => { S.settings.speed = UI.settings.speed; save(); };

// ------------------------------------------------------------------ rules / pause menu
const RULES = '<div style="font-size:.82rem;line-height:1.45">' +

  '<p><b>Landscapes:</b> a card of cost N needs N face-up landscapes of its type. Champions need 3. Rainbow cards need none. The Pig can eat landscapes!</p>' +
  '<p><b>FLOOP:</b> many cards have a FLOOP ability. Flooping turns the card sideways: the creature skips its attack this turn but still defends.</p>' +

})();
/* END META */

/* TUTORIAL */
// Scripted first match: BMO coaches you against Jake. Teaches playing cards, Actions, flying,
// fighting, flooping (the Pig eats a Cornfield), free Blue Plains moves and buildings.
var Tutorial = (function () {
'use strict';
const E = Engine, K = Engine.kit;
let step = 0, on = false, waitTurn = 0;
const $ = s => document.querySelector(s);
const idOf = (st, uid) => { const c = st.players[0].hand.find(x => x.uid === uid); return c ? c.id : null; };

const STEPS = [
  { say: 'Welcome to <b>Card Wars</b>! This holo-board has 4 lanes. Your <b>Blue Plains</b> are the felt patches at the bottom, Jake’s Cornfields are at the top.<br>Drag <b>Cool Dog</b> onto the glowing slot in <b>lane 2</b>.', point: { hand: 'b_cooldog' }, allow: (c, st) => c.t === 'play' && idOf(st, c.uid) === 'b_cooldog' && c.lane === 1 },
  { say: 'Mathematical! Placing a card flips it sideways and its hologram springs up. Cards cost <b>Actions</b> (the gems): you get 2 a turn.<br>Now drag <b>Sky Pup</b> into <b>lane 3</b>. It has <b>Flying</b>: it soars over ground blockers.', point: { hand: 'b_skypup' }, allow: (c, st) => c.t === 'play' && idOf(st, c.uid) === 'b_skypup' && c.lane === 2 },
  { say: 'Out of Actions! Tap <b>FIGHT!</b> to end your turn. (Whoever goes first can’t fight on turn 1.)', point: { btn: '#fightBtn' }, allow: c => c.t === 'end' },
  { wait: true, say: 'Jake’s turn. When a turn ends, every ready creature attacks <b>across its lane</b>. Watch!' },
  { say: 'Jake’s Husker Knight crashed into Cool Dog: <b>both creatures hit at the same time</b>. His Scarecrow is a <b>Guard</b> that protects the lanes beside it.<br>Drag <b>The Pig</b> into <b>lane 1</b>, across from the Scarecrow.', point: { hand: 'b_pig' }, allow: (c, st) => c.t === 'play' && idOf(st, c.uid) === 'b_pig' && c.lane === 0 },
  { say: 'Now tap <b>your Pig</b> and press <b>FLOOP</b>. Flooping turns the card sideways to use its power!', point: { cell: [0, 0, 'c'] }, allow: c => c.t === 'floop' && c.lane === 0 && c.slot === 'c' },
  { say: 'CHOMP! <b>The Pig ate a Cornfield.</b> Face-down landscapes don’t count when Jake pays for cards. A flooped creature skips its attack but still defends.<br>Tap <b>FIGHT!</b>', point: { btn: '#fightBtn' }, allow: c => c.t === 'end' },
  { wait: true, say: 'Jake strikes back…' },
  { say: 'Blue Plains creatures move for <b>free</b> on Blue Plains (that’s their Home Advantage). Tap <b>Sky Pup</b>, then tap a <b>blue lane</b> to move it.', point: { cell: [0, 2, 'c'] }, allow: c => c.t === 'move' },
  { say: '<b>Buildings</b> stand behind your creatures. Drag the <b>Cave of Solitude</b> behind the Pig (lane 1). A flooped creature naps inside, safe from attacks.', point: { hand: 'b_cave' }, allow: (c, st) => c.t === 'play' && idOf(st, c.uid) === 'b_cave' && c.lane === 0 },
  { done: true, say: 'You’ve got it! Floop the Pig again to eat more corn, then FIGHT. From now on Jake plays for real. Knock him from <b>25 HP to 0</b> and you’re the Cool Guy!' }
];

function plan(st, me) {
  if (!on) return null;
  const h = id => st.players[me].hand.find(c => c.id === id), empty = l => !st.players[me].lanes[l].creature;
  if (st.turn === 2) {
    if (h('c_husker') && empty(1)) return [{ t: 'play', p: me, uid: h('c_husker').uid, lane: 1 }];
    if (h('c_scarecrow') && empty(0)) return [{ t: 'play', p: me, uid: h('c_scarecrow').uid, lane: 0 }];
    return [{ t: 'end', p: me }];
  }
  if (st.turn === 4) {
    if (h('c_cornball') && empty(3)) return [{ t: 'play', p: me, uid: h('c_cornball').uid, lane: 3 }];
    return [{ t: 'end', p: me }];
  }
  return null;
}

function start() {
  on = true; step = 0;
  const p0 = { lands: ['blue', 'blue', 'blue', 'blue'], cards: E.STARTERS.blue.cards };
  const p1 = { lands: ['corn', 'corn', 'swamp', 'corn'], cards: E.STARTERS.corn.cards };
  const S = Meta.S;
  UI.start({
    seed: 'tutorial', mode: 'tutorial', noMulligan: true, first: 0,
    seats: [{ kind: 'human', name: S.name || 'Finn', hero: 'finn', deck: p0 },
      { kind: 'ai', name: 'Jake', hero: 'jake', deck: p1, difficulty: 'easy', personality: 'aggro', lines: ['Cornfields are awesome!', 'You’re a babe in the woods!', 'FOR THE GLORY!'], plan }],
    setup: st => {
      K.hand(st, 0, ['b_cooldog', 'b_skypup', 'b_pig', 'b_cave', 'r_teleport']);
      K.deck(st, 0, ['b_ranger', 'b_hotdog', 'b_adv', 'b_school', 'b_cooldog', 'r_poundcake', 'b_ranger', 'b_hotdog', 'b_skypup', 'b_math', 'r_pancakes', 'b_ride', 'b_math', 'b_spirit', 'b_scholar']);
      K.hand(st, 1, ['c_husker', 'c_scarecrow', 'c_cornball', 'r_baldman', 'c_bloodstorm']);
      K.deck(st, 1, ['c_husker', 'c_cornball', 'c_worm', 'r_teleport', 'c_dome', 'c_plant', 'r_dan', 'c_ronin', 'c_worm', 'c_cornucopia', 'c_nightmares', 'r_reclaim', 'c_scarecrow', 'c_silo', 'c_maize']);
    },
    tutorial: { allow, onCmd, onIdle },
    onEnd: res => {
      on = false; hide();
      const S2 = Meta.S, first = !S2.tutorialDone;
      S2.tutorialDone = true;
      if (first && res.winner === 0) { S2.sparks += 40; }
      Meta.save();
      Meta.results(res, null, { tutorial: true, pvp: false });
    }
  });
  setTimeout(show, 1400);
}
function allow(cmd) {
  if (!on) return true;
  const s = STEPS[step]; if (!s || s.done) return true;
  if (s.wait) return false;
  const ok = s.allow ? s.allow(cmd, UI.M.st) : true;
  if (!ok) { UI.toast('Follow BMO’s tip!'); bubbleShake(); }
  return ok;
}
function onCmd(cmd) {
  // humanCmd only runs commands that allow() accepted, so any human command here completes the step
  if (!on || cmd.p !== 0 || cmd.t === 'choose') return;
  const s = STEPS[step];
  if (s && !s.wait && !s.done) next();
}
function next() {
  step++;
  const s = STEPS[step];
  if (s && s.wait) waitTurn = UI.M.st.turn;
  setTimeout(show, 450);
}
function onIdle() {
  if (!on) return;
  const s = STEPS[step];
  if (s && s.wait && UI.M.st.active === 0) { step++; show(); }
  else show();
}
function bubbleShake() { const b = $('#coach .say'); if (b) b.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 300 }); }
function show() {
  if (!on || UI.screen !== 'match') return;
  const s = STEPS[step]; const c = $('#coach');
  if (!s) { hide(); return; }
  c.innerHTML = '<div class="say"><img src="' + Art.portraitURL('bmo', 96) + '" style="width:2.6rem;height:2.6rem;flex:none"><div><b>BMO:</b> ' + s.say + (s.done ? '<div style="margin-top:.4rem"><button class="btn small" id="coachOk">Let’s go!</button></div>' : '') + '</div></div><div class="arrow"><svg viewBox="0 0 24 24"><path d="M12 22L3 10h6V2h6v8h6z" fill="#ffcf3a" stroke="#1b1424" stroke-width="1.5"/></svg></div>';
  c.classList.add('on');
  const say = c.querySelector('.say'), arrow = c.querySelector('.arrow');
  const ba = $('#board-area').getBoundingClientRect();
  const wide = document.body.classList.contains('wide');
  say.style.left = (wide ? ba.left + ba.width / 2 : window.innerWidth / 2) + 'px'; say.style.transform = 'translateX(-50%)';
  say.style.top = (wide ? 8 : 4) + 'px';
  let tgt = null;
  if (s.point && s.point.hand) { const st = UI.M.disp || UI.M.st; const inst = st.players[0].hand.find(x => x.id === s.point.hand); const el = inst && document.querySelector('#hand .card[data-uid="' + inst.uid + '"]'); if (el) { const r = el.getBoundingClientRect(); tgt = { x: r.left + r.width / 2, y: r.top }; } }
  else if (s.point && s.point.btn) { const r = $(s.point.btn).getBoundingClientRect(); tgt = { x: r.left + r.width / 2, y: r.top }; }
  else if (s.point && s.point.cell) { const p = Render.headPos(s.point.cell[0], s.point.cell[1], s.point.cell[2]); tgt = { x: p.x, y: p.y - 20 }; }
  if (tgt && !s.wait) { arrow.style.display = 'block'; arrow.style.left = (tgt.x - 24) + 'px'; arrow.style.top = (tgt.y - 50) + 'px'; } else arrow.style.display = 'none';
  const ok = c.querySelector('#coachOk');
  if (ok) ok.onclick = () => { hide(); finishScript(); };
}
function finishScript() { on = false; const seat = UI.M.seats[1]; delete seat.plan; UI.toast('Beat Jake to finish the tutorial!'); }
function hide() { const c = $('#coach'); c.classList.remove('on'); c.innerHTML = ''; }
function skip() {
  on = false; hide();
  Meta.S.tutorialDone = true; Meta.save();
  UI.quit(); Meta.home();
}
window.addEventListener('resize', () => { if (on) setTimeout(show, 50); });
return { start, skip, get active() { return on; } };
})();
/* END TUTORIAL */

/* MAIN */
// Boot: load save, wire resize/orientation/visibility, run the frame loop.
(function () {
'use strict';
const cv = document.getElementById('cv');
let last = 0, running = true, raf = 0;
function frame(ts) {
  raf = 0;
  if (!running) return;
  const t = ts / 1000, dt = Math.min(0.05, last ? t - last : 0.016);
  last = t;
  try { UI.tick(dt); Render.frame(t, dt); } catch (e) { console.error(e); }
  raf = requestAnimationFrame(frame);
}
function boot() {
  Meta.load();
  Render.init(cv);
  UI.init();
  Meta.applySettings();
  UI.layout();
  Meta.home();
  raf = requestAnimationFrame(frame);
  testHooks();
}
// Test hooks (used by the automated smoke test and screenshots): #match, #autoplay[=N], #tutorial
function testHooks() {
  const h = location.hash || '';
  const E = Engine, S = Meta.S;
  const ensure = () => { if (!S.started) { S.started = true; S.starter = 'blue'; Meta.unlockLand('blue', true); Meta.unlockLand('corn', true); Meta.save(); } };
  window.CW = {
    stats: { games: 0, errors: 0, rounds: [] },
    autoplay(n, speed) {
      ensure();
      const keys = E.LAND_TYPES; let i = 0;
      UI.settings.speed = speed || 6; UI.D.speed = speed || 6;
      const one = () => {
        if (i >= n) { window.CW.done = true; return; }
        const a = keys[i % keys.length], b = keys[(i * 5 + 2) % keys.length]; i++;
        const seat = (land, k) => ({ kind: 'ai', name: E.STARTERS[land].name.split('\u2019')[0], hero: Meta.HEROES[land], deck: E.STARTERS[land], difficulty: k ? 'normal' : 'hard', personality: 'balanced', lines: ['Mathematical!'] });
        UI.start({ seed: 'auto' + i, mode: 'ai', seats: [seat(a, 0), seat(b, 1)], onEnd: res => { window.CW.stats.games++; window.CW.stats.rounds.push(res.rounds); setTimeout(one, 300); } });
      };
      one();
    }
  };
  window.CW.custom = function (o) {
    ensure();
    const K = E.kit;
    o = Object.assign({ hand: [], mine: [], theirs: [], bmine: [], btheirs: [], lands0: ['blue', 'blue', 'blue', 'blue'], lands1: ['corn', 'corn', 'corn', 'corn'], ohand: ['c_bloodstorm', 'r_pancakes', 'c_husker'] }, o || {});
    UI.start({ seed: 'custom', mode: 'ai', first: 0, noMulligan: true,
      seats: [Meta.mySeat({ lands: o.lands0, cards: E.STARTERS.blue.cards }), { kind: 'ai', name: 'Jake', hero: 'jake', deck: E.STARTERS.corn, difficulty: 'normal', personality: 'aggro', lines: ['Hmph.'] }],
      setup: st => {
        K.clear(st); K.lands(st, 0, o.lands0); K.lands(st, 1, o.lands1);
        K.hand(st, 0, o.hand); K.hand(st, 1, o.ohand);
        o.mine.forEach(([l, id, x]) => K.put(st, 0, l, id, x)); o.theirs.forEach(([l, id, x]) => K.put(st, 1, l, id, x));
        o.bmine.forEach(([l, id, x]) => K.build(st, 0, l, id, x)); o.btheirs.forEach(([l, id, x]) => K.build(st, 1, l, id, x));
        st.turn = 3; st.round = 2; st.players[0].actions = 2;
      }, onEnd: () => Meta.home() });
  };
  if (h.indexOf('#autoplay') === 0) { const n = +(h.split('=')[1] || 3); window.CW.autoplay(n, 6); }
  else if (h === '#match') { ensure(); const o = Meta.TOUR[3]; UI.start({ seed: 'shot', mode: 'ai', first: 0, seats: [Meta.mySeat(Meta.activeDeck()), { kind: 'ai', name: o.name, hero: o.hero, deck: o.deck, difficulty: 'normal', personality: o.pers, lines: o.lines }], onEnd: () => Meta.home() }); }
  else if (h === '#tutorial') { ensure(); Tutorial.start(); }
}
let rt = 0;
const relayout = () => { clearTimeout(rt); rt = setTimeout(() => { UI.layout(); }, 60); };
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', () => setTimeout(() => UI.layout(), 250));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; Sound.suspend(true); }
  else { running = true; last = 0; Sound.suspend(false); if (!raf) raf = requestAnimationFrame(frame); }
});
window.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('#hand, #cv, .cgrid')) e.preventDefault(); });
window.addEventListener('error', e => { try { UI.toast('Oops: ' + (e.message || 'error')); } catch (_) { /* ignore */ } });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
/* END MAIN */

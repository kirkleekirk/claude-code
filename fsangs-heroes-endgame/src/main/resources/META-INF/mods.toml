modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/kirkleekirk/claude-code/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Built as an addon for FSang18's Heroes by FSang18 (a Palladium addon by Threetag). Optional integrations: Ad Astra (Terrarians), Rick's Portal Gun (JamesLeDolphin)."
description='''${mod_description}

Every power family in FSang18's Heroes gets a canon nemesis that shows up once you are strong enough to deserve it - and every nemesis scales to the hero it hunts.
 - Viltrumites: the coming-of-age trial at 18 days old, then Conquest, then Grand Regent Thragg.
 - The Infinity Saga: Loki, the Black Order and Thanos race you for the six Infinity Stones (Vormir on Ad Astra's Glacio, the Power Stone on Mars).
 - Doctor Doom, Doomsday (Kryptonians), Zoom (speedsters), the Sentinels and Master Mold (mutants), the Spirit of Vengeance (karma), Dormammu.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: the superpower framework FSang18's Heroes runs on. Power-based triggers need it.
[[dependencies.${mod_id}]]
    modId="palladium"
    mandatory=false
    versionRange="[4.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Optional (but this is an addon for it): FSang18's Heroes.
[[dependencies.${mod_id}]]
    modId="fsang"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="BOTH"

# Optional: Ad Astra - Vormir (Glacio), the Morag temple (Mars Temple), space-capable nemeses.
[[dependencies.${mod_id}]]
    modId="ad_astra"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="BOTH"

# Optional: Rick's Portal Gun by JamesLeDolphin - jammed during nemesis fights, refuelled by the Tesseract.
[[dependencies.${mod_id}]]
    modId="ricksportalgun"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="BOTH"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Card Wars: Glowboard</title>

<body>
<canvas id="cv"></canvas>
<div id="app">
  <div id="match" class="screen">
    <div id="board-area"></div>
    <div id="opp" class="seat"></div>
    <div id="me" class="seat"></div>
    <div id="hand"></div>
    <div id="fightWrap"><button id="fightBtn" class="btn big fight"><span class="t">FIGHT!</span><small></small></button></div>
    <div id="sideBtns">
      <button id="menuBtn" class="iconbtn" aria-label="Menu"></button>
      <button id="logBtn" class="iconbtn" aria-label="Battle log"></button>
      <button id="emoteBtn" class="iconbtn" aria-label="Emotes"></button>
      <button id="speedBtn" class="iconbtn txt" aria-label="Game speed">1x</button>
    </div>
    <button id="undoBtn" class="iconbtn undo" aria-label="Undo"></button>
    <div id="tip" class="tip"></div>
    <div id="banner"></div>
    <div id="info" class="panel"></div>
    <div id="logDrawer" class="panel"></div>
    <div id="emotes" class="panel"></div>
    <div id="coach"></div>
    <div id="timer"></div>
  </div>
  <div id="screens"></div>
  <div id="modal"></div>
  <div id="toast"></div>
</div>

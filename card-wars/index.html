<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120a08">
<title>Card Wars</title>
<!--
  CARD WARS — a fan-made tabletop card game inspired by Adventure Time ("Card Wars", S4E14 / "Daddy-Daughter Card Wars", S8E11).
  One self-contained file. The only external dependency is Three.js r128 (pinned CDN) for the cel-shaded diorama; if it fails to
  load, a built-in 2D software renderer draws the same models. Architecture: see the block comments at the top of each script.
  Dev flags: ?sim=1 (headless AI-vs-AI balance simulator), ?gallery=1 (model gallery), ?debug=1 (log events).
-->
<style>
:root{
  --ink:#1c1520; --cream:#fff4dc; --paper:#f7e6c4; --wood:#5b3419; --gold:#ffd23a; --red:#e0384f; --blue:#4fb3ff; --green:#7fe07a;
  --corn:#f0c93a; --nice:#7fe07a; --sand:#f4a45c; --blueland:#62cdf9; --swamp:#b07de6;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:"Baloo 2","Nunito","Varela Round","SF Pro Rounded",ui-rounded,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#120a08;color:var(--cream);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none;position:fixed;inset:0}
#bg{position:fixed;inset:0;background:#d6cf7a;z-index:0}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#board2d{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:1}
#app{position:fixed;inset:0;z-index:2;pointer-events:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;pointer-events:auto;padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px)}
.screen.on{display:flex}
.screen.dim{background:rgba(12,6,4,.78)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:0;padding-bottom:12px}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:.5px}
h2{font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
h3{font-size:16px}
p{margin:6px 0;line-height:1.35}
small,.muted{opacity:.75;font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.center{text-align:center;justify-content:center}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
/* ----- chunky cartoon buttons ----- */
.btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;min-height:48px;min-width:48px;font:inherit;font-weight:900;font-size:17px;letter-spacing:.4px;color:var(--ink);background:var(--gold);
  box-shadow:0 5px 0 #a8801c,0 8px 14px rgba(0,0,0,.35),inset 0 -2px 0 rgba(0,0,0,.08);cursor:pointer;position:relative;text-transform:uppercase;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;pointer-events:auto}
.btn:active,.btn.down{transform:translateY(4px);box-shadow:0 1px 0 #a8801c,0 3px 6px rgba(0,0,0,.35)}
.btn.blue{background:#4fb3ff;box-shadow:0 5px 0 #1f5f9c,0 8px 14px rgba(0,0,0,.35)}.btn.blue:active{box-shadow:0 1px 0 #1f5f9c}
.btn.green{background:#7fe07a;box-shadow:0 5px 0 #2f7a34,0 8px 14px rgba(0,0,0,.35)}.btn.green:active{box-shadow:0 1px 0 #2f7a34}
.btn.red{background:#ff6b6b;box-shadow:0 5px 0 #8a2222,0 8px 14px rgba(0,0,0,.35)}.btn.red:active{box-shadow:0 1px 0 #8a2222}
.btn.pink{background:#ff8fd0;box-shadow:0 5px 0 #9a3a76,0 8px 14px rgba(0,0,0,.35)}.btn.pink:active{box-shadow:0 1px 0 #9a3a76}
.btn.ghost{background:rgba(255,244,220,.12);color:var(--cream);box-shadow:0 4px 0 rgba(0,0,0,.35);border:2px solid rgba(255,244,220,.25)}.btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.big{font-size:22px;padding:16px 26px;min-height:60px;border-radius:18px}
.btn.sm{font-size:14px;padding:8px 12px;min-height:44px;border-radius:12px}
.btn.icon{width:48px;height:48px;padding:0;border-radius:50%;font-size:22px}
.btn:disabled,.btn.dis{filter:grayscale(.8) brightness(.7);pointer-events:none}
.btn .sub{display:block;font-size:11px;font-weight:700;opacity:.8;text-transform:none;letter-spacing:0}
/* ----- panels ----- */
.panel{background:linear-gradient(180deg,rgba(60,36,24,.92),rgba(30,18,12,.94));border:3px solid #2a1810;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);padding:12px}
.panel.paper{background:linear-gradient(180deg,#fbf0d5,#ecd9b0);color:var(--ink);border-color:#b08a55}
.topbar{display:flex;align-items:center;gap:8px;padding:4px 0 10px}
.topbar h2{flex:1;text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.12);border-radius:20px;padding:4px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.pill i{font-style:normal;font-size:14px}
.chip{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.14);min-height:36px}
.chip.on{background:var(--gold);color:var(--ink);border-color:#b08a2a}
.land-ic{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;border:2px solid rgba(0,0,0,.35)}
.land-corn{background:var(--corn)}.land-nice{background:var(--nice)}.land-sand{background:var(--sand)}.land-blue{background:var(--blueland)}.land-swamp{background:var(--swamp)}
/* ----- title ----- */
#s-title{justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(10,5,3,.35),rgba(10,5,3,.15) 40%,rgba(10,5,3,.75))}
.logo{margin-top:8vh;text-align:center;line-height:.9;cursor:pointer;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.logo .l1,.logo .l2{display:block;font-weight:900;text-transform:uppercase;letter-spacing:2px}
.logo .l1{font-size:min(19vw,74px);color:#fff1c4;-webkit-text-stroke:2px #3a1c10;text-shadow:0 5px 0 #3a1c10,0 9px 0 #7a3a12,0 12px 0 #3a1c10}
.logo .l2{font-size:min(23vw,92px);color:#ffd23a;-webkit-text-stroke:2px #3a1c10;text-shadow:0 6px 0 #3a1c10,0 11px 0 #b8341f,0 15px 0 #3a1c10;transform:rotate(-3deg)}
.logo .tag{display:block;margin-top:14px;font-size:14px;font-weight:800;letter-spacing:3px;color:#ffe7b0;opacity:.9}
.menu{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);margin-bottom:6vh}
.menu > .btn{width:100%}
.menu .row .btn{flex:1;min-width:0;padding-left:8px;padding-right:8px}
.menu .row .btn.icon{flex:0 0 48px}
.statbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* ----- cards ----- */
.card{--w:88px;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.07);position:relative;background:linear-gradient(180deg,#f3dfae,#e2c27c);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.4),inset 0 0 0 calc(var(--w)*.025) #7a4a1c;border:calc(var(--w)*.035) solid var(--rar,#c9d3da);overflow:hidden;flex:none;transition:transform .15s;touch-action:none;pointer-events:auto}
.card.rar-c{--rar:#c9d3da}.card.rar-r{--rar:#4fb4ff}.card.rar-e{--rar:#d16cff}.card.rar-l{--rar:#ffbe3c;box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 14px rgba(255,190,60,.6)}
.card .art{position:absolute;left:calc(var(--w)*.07);right:calc(var(--w)*.07);top:calc(var(--w)*.2);height:calc(var(--w)*.72);border-radius:calc(var(--w)*.04);background:var(--landc,#888);overflow:hidden;border:calc(var(--w)*.025) solid #5a3a1c;box-shadow:inset 0 0 0 calc(var(--w)*.02) var(--landc)}
.card .art canvas,.card .art img{width:100%;height:100%;display:block}
.card .name{position:absolute;left:calc(var(--w)*.07);right:calc(var(--w)*.07);top:calc(var(--w)*.94);padding:0 calc(var(--w)*.03);font-size:calc(var(--w)*.105);font-weight:900;line-height:1.3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(122,74,28,.16);border-radius:calc(var(--w)*.03)}
.card .txt{position:absolute;left:calc(var(--w)*.06);right:calc(var(--w)*.06);top:calc(var(--w)*1.07);font-size:calc(var(--w)*.085);line-height:1.12;text-align:center;opacity:.9;max-height:calc(var(--w)*.2);overflow:hidden;font-weight:700}
.card .cost{position:absolute;left:calc(var(--w)*.03);top:calc(var(--w)*.03);width:calc(var(--w)*.24);height:calc(var(--w)*.24);border-radius:50%;background:var(--gold);border:calc(var(--w)*.025) solid #7a5a12;font-weight:900;font-size:calc(var(--w)*.15);display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.card .cost.disc{background:#7fe07a}
.card .land{position:absolute;right:calc(var(--w)*.04);top:calc(var(--w)*.04);width:calc(var(--w)*.2);height:calc(var(--w)*.2);border-radius:50%;background:var(--landc);border:calc(var(--w)*.025) solid rgba(0,0,0,.4);z-index:2}
.card .land svg{width:100%;height:100%;display:block}
.card .type{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--w)*.06);font-size:calc(var(--w)*.08);font-weight:900;letter-spacing:.5px;text-transform:uppercase;opacity:.7}
.card .atk,.card .def{position:absolute;bottom:calc(var(--w)*.03);width:calc(var(--w)*.26);height:calc(var(--w)*.22);border-radius:calc(var(--w)*.08);font-weight:900;font-size:calc(var(--w)*.14);display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.6);border:calc(var(--w)*.02) solid rgba(0,0,0,.4)}
.card .atk{left:calc(var(--w)*.03);background:#e0384f}.card .def{right:calc(var(--w)*.03);background:#3f8fe0}
.card .lvl{position:absolute;bottom:calc(var(--w)*.06);left:50%;transform:translateX(-50%);font-size:calc(var(--w)*.08);font-weight:900;opacity:.6}
.card.sel{transform:translateY(-14px) scale(1.06);box-shadow:0 0 0 3px #fff,0 0 22px rgba(255,210,58,.9)}
.card.unplayable{filter:brightness(.62) saturate(.7)}
.card.locked{filter:grayscale(1) brightness(.5)}
.card.ghostcard{position:fixed;z-index:50;pointer-events:none;transform:scale(1.12) rotate(-3deg);opacity:.95}
.card.big{--w:min(74vw,290px)}
.card.big .txt{font-size:calc(var(--w)*.075);max-height:calc(var(--w)*.24);line-height:1.2}
.card.big .name{font-size:calc(var(--w)*.1)}
.hand-next .card{--w:54px}
/* ----- match HUD ----- */
#s-match{padding:0}
.hud{position:absolute;left:0;right:0;pointer-events:none}
#hud-top{top:0;padding:calc(var(--sat) + 6px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(10,5,3,.9),rgba(10,5,3,0))}
#hud-bot{bottom:0;padding:0 calc(var(--sar) + 8px) calc(var(--sab) + 6px) calc(var(--sal) + 8px);display:flex;flex-direction:column;gap:6px;background:linear-gradient(0deg,rgba(10,5,3,.96) 60%,rgba(10,5,3,0))}
.hud *{pointer-events:auto}
.portrait{width:48px;height:48px;border-radius:14px;border:3px solid var(--hc,#fff);background:#2a1a12;overflow:hidden;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.portrait canvas,.portrait img{width:100%;height:100%;display:block}
.portrait.lg{width:64px;height:64px}
.hpwrap{flex:1;min-width:0}
.hpname{font-weight:900;font-size:13px;display:flex;justify-content:space-between;text-shadow:0 1px 0 #000}
.hpbar{height:14px;border-radius:8px;background:#2a1a12;border:2px solid #000;overflow:hidden;position:relative}
.hpbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#8dff8a,#37b34a);transition:width .35s;border-radius:6px}
.hpbar .fill.low{background:linear-gradient(180deg,#ff8a8a,#d02a2a)}
.hpbar .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 0 #000}
.appips{display:flex;gap:3px;margin-top:3px}
.appips i{width:9px;height:9px;border-radius:50%;background:#3a2a1a;border:1px solid #000}
.appips i.on{background:var(--gold);box-shadow:0 0 5px var(--gold)}
#timer{width:46px;height:46px;border-radius:50%;background:#1a0f0a;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;position:relative;flex:none}
#timer.warn{color:#ff6b6b;animation:pulse .6s infinite}
#timer svg{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);transform:rotate(-90deg)}
#timer circle{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#apmeter{display:flex;align-items:center;gap:8px;padding:0 4px}
#apbar{flex:1;height:26px;border-radius:14px;background:#1a0f0a;border:3px solid #000;position:relative;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#apbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#fff2a8,#ffb300);transition:width .3s;border-radius:10px;box-shadow:0 0 12px rgba(255,200,60,.7)}
#apbar .segs{position:absolute;inset:0;display:flex}
#apbar .segs i{flex:1;border-right:2px solid rgba(0,0,0,.45)}
#apbar .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#1c1520;text-shadow:0 1px 0 rgba(255,255,255,.5)}
#aplabel{font-weight:900;font-size:14px;color:var(--gold);text-shadow:0 1px 0 #000;width:28px;text-align:center}
#hand{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:136px;padding:6px 4px 2px;position:relative}
#hand .cards{display:flex;gap:6px;align-items:flex-end;justify-content:center}
.hand-next{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:900;opacity:.9;letter-spacing:.5px}
#botbar{display:flex;align-items:center;gap:8px}
#btn-attack{flex:1;min-height:52px;font-size:20px}
#btn-attack.end{background:#c9d3da;box-shadow:0 5px 0 #6a7580,0 8px 14px rgba(0,0,0,.35)}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:5}
#banner .b{display:inline-block;font-size:34px;font-weight:900;color:#fff1c4;-webkit-text-stroke:1.5px #3a1c10;text-shadow:0 4px 0 #3a1c10,0 8px 18px rgba(0,0,0,.6);letter-spacing:1px;transform:scale(0);animation:bannerIn 1.5s forwards;text-transform:uppercase;padding:6px 14px}
#banner .b.small{font-size:24px}
@keyframes bannerIn{0%{transform:scale(0) rotate(-6deg);opacity:0}18%{transform:scale(1.15) rotate(2deg);opacity:1}30%{transform:scale(1) rotate(0)}80%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.dmg{position:absolute;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:#ff5a5a;-webkit-text-stroke:1.5px #2a0a0a;text-shadow:0 3px 0 #2a0a0a,0 6px 12px rgba(0,0,0,.6);animation:dmgUp 1s forwards;white-space:nowrap}
.dmg.heal{color:#8dff8a;-webkit-text-stroke:1.5px #0a2a0a;text-shadow:0 3px 0 #0a2a0a}
.dmg.buff{color:#ffe36a;font-size:22px;-webkit-text-stroke:1px #3a2a00}
.dmg.info{color:#bff4ff;font-size:18px;-webkit-text-stroke:1px #0a2a3a}
@keyframes dmgUp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-70%) scale(1.25);opacity:1}70%{transform:translate(-50%,-110%) scale(1);opacity:1}100%{transform:translate(-50%,-140%) scale(.9);opacity:0}}
.piecelabel{position:absolute;transform:translate(-50%,0);transform-origin:50% 0;display:flex;gap:2px;pointer-events:none;font-size:12px;font-weight:900;transition:opacity .2s}
.piecelabel b{min-width:22px;height:20px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 0 #000;border:2px solid rgba(0,0,0,.6);padding:0 3px;box-shadow:0 2px 3px rgba(0,0,0,.4)}
.piecelabel .a{background:#e0384f}.piecelabel .h{background:#3f8fe0}.piecelabel .h.hurt{background:#e08a2a}.piecelabel .z{background:#6a6a8a;font-size:10px}.piecelabel .f{background:#7fe0ff;color:#123;font-size:10px}
.piecelabel.enemy b{opacity:.95}
.piecelabel.home:after{content:"";position:absolute;left:50%;bottom:-6px;width:6px;height:6px;border-radius:50%;background:var(--gold);transform:translateX(-50%);box-shadow:0 0 6px var(--gold)}
#sheet{position:absolute;left:8px;right:8px;bottom:calc(var(--sab) + 214px);z-index:7;display:none}
#sheet.on{display:block}
#sheet .panel{display:flex;flex-direction:column;gap:8px;padding:10px}
#sheet .title{font-weight:900;font-size:16px;display:flex;justify-content:space-between;align-items:center}
#sheet .desc{font-size:13px;line-height:1.3;opacity:.95}
#sheet .acts{display:flex;gap:8px}
#sheet .acts .btn{flex:1;font-size:14px;padding:8px 6px;min-height:50px;flex-direction:column;gap:0}
#hint{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 222px);text-align:center;pointer-events:none;z-index:5}
#hint span{display:inline-block;background:rgba(10,5,3,.8);border:2px solid rgba(255,244,220,.25);border-radius:12px;padding:6px 12px;font-weight:800;font-size:13px}
.emote{position:absolute;z-index:8;background:#fff;color:var(--ink);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.5);border:3px solid var(--ink);animation:emoteIn 2.8s forwards;max-width:230px;pointer-events:none}
.emote svg{width:34px;height:34px;flex:none}
.emote:after{content:"";position:absolute;width:14px;height:14px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg);bottom:-9px;left:24px}
.emote.top:after{bottom:auto;top:-9px;transform:rotate(-135deg)}
@keyframes emoteIn{0%{transform:scale(0);opacity:0}10%{transform:scale(1.1);opacity:1}18%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.9)}}
#emotepick{position:absolute;left:8px;bottom:calc(var(--sab) + 214px);z-index:9;display:none;gap:6px;flex-wrap:wrap;width:230px}
#emotepick.on{display:flex}
#emotepick .btn{padding:6px;min-height:44px;font-size:12px;flex:1 1 40%;text-transform:none}
#emotepick svg{width:26px;height:26px}
/* ----- modal ----- */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,4,3,.72);padding:16px;pointer-events:auto}
#modal.on{display:flex}
#modal .box{width:min(440px,94vw);max-height:88vh;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.inspector{display:flex;flex-direction:column;align-items:center;gap:10px}
.inspector .flavor{font-style:italic;opacity:.8;font-size:13px;text-align:center}
.inspector .kw{font-size:12px;opacity:.9;text-align:center}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:rgba(20,10,6,.92);border:2px solid var(--gold);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;animation:toastIn 2.4s forwards;white-space:nowrap}
@keyframes toastIn{0%{opacity:0;transform:translateY(-10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* ----- hero select ----- */
.herogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.herotile{background:rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.12);border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;cursor:pointer;position:relative}
.herotile.on{border-color:var(--gold);background:rgba(255,210,58,.15);box-shadow:0 0 14px rgba(255,210,58,.5)}
.herotile.locked{opacity:.5;filter:grayscale(.9)}
.herotile .portrait{width:72px;height:72px;border-radius:18px}
.herotile .n{font-weight:900;font-size:12px;text-align:center;line-height:1.1}
.herotile .lock{position:absolute;top:6px;right:6px;font-size:14px}
.herodetail{display:flex;gap:10px;align-items:flex-start}
.herodetail .portrait{width:84px;height:84px;border-radius:20px}
.passive{background:rgba(0,0,0,.3);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.3}
.passive b{color:var(--gold)}
/* ----- map ----- */
#mapwrap{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;border:3px solid #2a1810;background:#0f1a2a}
#mapwrap svg{width:100%;height:100%;display:block}
.region{position:absolute;transform:translate(-50%,-50%);width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto;cursor:pointer}
.region .portrait{width:52px;height:52px;border-radius:50%;border-width:3px}
.region .n{font-size:10px;font-weight:900;text-align:center;text-shadow:0 1px 0 #000,0 0 6px #000;line-height:1.05;white-space:nowrap}
.region.owned .portrait{border-color:var(--green);box-shadow:0 0 12px var(--green)}
.region.avail .portrait{border-color:var(--gold);box-shadow:0 0 12px var(--gold);animation:pulse 1.4s infinite}
.region.locked{opacity:.55;filter:grayscale(.9)}
.region .flag{position:absolute;top:-6px;right:-2px;font-size:16px}
/* ----- deck builder ----- */
.deckrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.slot{width:60px;height:84px;border-radius:8px;border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6;position:relative}
.slot .card{--w:60px}
.landslots{display:flex;gap:8px;justify-content:center}
.landslot{width:64px;height:48px;border-radius:12px;border:3px solid rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.collgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 0}
.collgrid .card{--w:76px}
.collgrid .card .cnt{position:absolute;left:50%;bottom:calc(var(--w)*.28);transform:translateX(-50%);font-size:10px;font-weight:900;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:1px 6px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0;touch-action:pan-x;flex:none}
.scroll.stack > *{flex-shrink:0}
.filters .chip{flex:none}
/* ----- tech ----- */
.techgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.technode{border-radius:12px;padding:6px 4px;text-align:center;font-weight:900;font-size:11px;border:3px solid rgba(0,0,0,.4);min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.technode.locked{filter:grayscale(.7) brightness(.6)}
.technode.avail{outline:3px solid var(--gold);animation:pulse 1.4s infinite}
/* ----- result / chest ----- */
.result-title{font-size:44px;font-weight:900;text-transform:uppercase;text-align:center;-webkit-text-stroke:2px #3a1c10;text-shadow:0 6px 0 #3a1c10,0 10px 20px rgba(0,0,0,.6);color:#ffd23a;animation:titleIn .9s both;letter-spacing:2px}
@keyframes titleIn{0%{transform:scale(0) rotate(-6deg);opacity:0}60%{transform:scale(1.15) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.result-title.lose{color:#9aa7b5}
.chest{width:150px;height:130px;margin:10px auto;cursor:pointer;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));animation:pulse 1.6s infinite}
.reveal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:120px}
.reveal .card{animation:popIn .5s backwards}
@keyframes popIn{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.1) rotate(3deg)}100%{transform:none}}
.reveal .gain{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:900;font-size:12px;border-radius:10px;padding:2px 8px;border:2px solid #7a5a12}
/* ----- tutorial ----- */
#tut{position:absolute;left:10px;right:10px;top:calc(var(--sat) + 64px);z-index:12;pointer-events:none}
#tut .panel{pointer-events:auto;display:flex;flex-direction:column;gap:8px;border-color:var(--gold)}
#tut .panel p{font-size:14px;font-weight:700;margin:0}
/* ----- gallery ----- */
#s-gallery{justify-content:space-between;background:linear-gradient(180deg,rgba(10,5,3,.6),transparent 30%,transparent 70%,rgba(10,5,3,.7))}
#gal-name{font-size:22px;font-weight:900;text-align:center;text-shadow:0 2px 0 #000}
#gal-meta{font-size:12px;text-align:center;opacity:.8}
select{font:inherit;font-weight:800;padding:8px;border-radius:10px;background:#2a1a12;color:var(--cream);border:2px solid rgba(255,255,255,.2);min-height:44px}
/* ----- settings ----- */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
input[type=range]{width:140px;accent-color:var(--gold)}
.toggle{width:58px;height:32px;border-radius:16px;background:#3a2a1a;border:2px solid #000;position:relative;cursor:pointer}
.toggle:after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#aaa;transition:.15s}
.toggle.on{background:#4fb3ff}.toggle.on:after{left:28px;background:#fff}
/* ----- 2D fallback board ----- */
#board2d .lane{position:absolute}
.spin{display:inline-block;width:22px;height:22px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#loading{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#120a08;font-weight:900}
@media (min-width:700px){ .card{--w:96px} #hand{height:150px} #sheet{left:50%;right:auto;width:420px;transform:translateX(-50%)} #emotepick{left:calc(50% - 210px)} }
@media (max-height:700px){ #hand{height:118px} .card{--w:76px} }
</style>
</head>

<script id="engine">

// ---------------------------------------------------------------- deterministic RNG (state lives in st.rngS)
function rnd(st){ let s=(st.rngS+0x6D2B79F5)>>>0; st.rngS=s; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }
function rint(st,n){ return Math.floor(rnd(st)*n); }
function shuffle(st,a){ for(let i=a.length-1;i>0;i--){ const j=rint(st,i+1); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

const HERO_IDS = ['finn','jake','pb','marcy','iceking','lsp','bmo','fp','lemongrab','rainicorn'];

// ---------------------------------------------------------------- helpers
const has = (c,k) => (CARD[c.id].kw||[]).indexOf(k)>=0;

// ---------------------------------------------------------------- game creation

// ---------------------------------------------------------------- drawing

// ---------------------------------------------------------------- damage / heal / death
function gameOver(st,winner,reason){ if(st.winner!==null) return; st.winner=winner; st.reason=reason; emit(st,{type:'gameOver',winner,reason}); }

function healCreature(st,c,n){ const real=Math.min(n,c.dmg); if(real<=0) return 0; c.dmg-=real; emit(st,{type:'heal',uid:c.uid,n:real,hp:hpOf(st,c),maxHp:maxDefOf(st,c)}); return real; }

function checkDeaths(st){ let again=true; while(again){ again=false; for(const pl of st.players) for(const c of pl.slots) if(c&&hpOf(st,c)<=0){ killCreature(st,c,null); again=true; } } }

// ---------------------------------------------------------------- effects DSL
function sel(st,ctx,to,f){

function num(st,f,ctx){ let n=f.n+(f.scale===false?0:(ctx.pow||0)); if(f.op==='dmg'&&!ctx.attack&&!ctx.passive&&st.players[ctx.p].hero==='fp') n+=TUNE.fp; return n; }

// ---------------------------------------------------------------- turn structure
function startTurn(st){

  emit(st,{type:'turnStart',p,turn:st.turn,ap:pl.ap,apMax:pl.apMax});
  for(const c of pl.slots){ if(!c) continue; if(c.frozen){ c.frozen=false; emit(st,{type:'thaw',uid:c.uid}); } else if(c.flooped){ c.flooped=false; emit(st,{type:'unfloop',uid:c.uid}); } c.sleepy=false; c.shield=0; c.moved=false; c.quick=false; }
  for(const c of pl.slots.slice()){ if(c&&c.poison>0&&!c.dead){ emit(st,{type:'poisonTick',uid:c.uid,n:c.poison}); dealDamage(st,c,c.poison,{p:1-p,poison:true}); } }
  if(pl.hero==='lich'){ const t=sel(st,{p,lane:0},'highestAtkEnemy'); for(const c of t){ emit(st,{type:'passive',p,hero:'lich'}); dealDamage(st,c,TUNE.lich,{p,passive:'lich'}); } }
  if(pl.hero==='iceking'&&TUNE.iceking&&pl.turns%2===1){ const t=sel(st,{p,lane:0},'highestAtkEnemy').filter(c=>!c.frozen); for(const c of t){ emit(st,{type:'passive',p,hero:'iceking'}); c.flooped=true; c.frozen=true; emit(st,{type:'freeze',uid:c.uid}); } }
  for(let lane=0;lane<TUNE.LANES;lane++){ const b=pl.builds[lane]; if(b){ const d=CARD[b.id]; if(d.trig&&d.trig.turnStart){ emit(st,{type:'trigger',uid:b.uid,lane,owner:p}); resolveFx(st,d.trig.turnStart,{p,src:null,lane,building:b}); } } }

function resolveAttacks(st,p){
  const me=st.players[p], en=st.players[1-p];
  for(let lane=0;lane<TUNE.LANES;lane++){
    if(st.winner!==null) return;

    const ctx={p,src:c,lane,attack:true,pow:powOf(c.lvl)};
    const d=CARD[c.id]; if(d.on&&d.on.attack) resolveFx(st,d.on.attack,ctx);

// ---------------------------------------------------------------- targets / legality
function enumTargets(st,p,tt,src){

    case 'any': return mine.concat(theirs).map(c=>({uid:c.uid}));
    case 'ownEmptyLane': return emptyLanes(st,p).map(l=>({p,lane:l}));
    case 'ownLane': return [0,1,2,3].map(l=>({p,lane:l}));
    case 'enemyLane': return [0,1,2,3].map(l=>({p:1-p,lane:l}));

function legalActions(st,p){

    else if(d.type==='building'){ for(let l=0;l<TUNE.LANES;l++) if(!pl.builds[l]) acts.push({t:'play',uid:card.uid,lane:l}); }
    else if(d.type==='spell'){ for(const t of enumTargets(st,p,d.target,null)) acts.push({t:'play',uid:card.uid,target:t}); }
    else if(d.type==='land'){ for(const t of enumTargets(st,p,d.target,null)) if(st.players[t.p].lands[t.lane]!==d.land) acts.push({t:'play',uid:card.uid,target:t}); }

function canLandFloop(st,p){ const pl=st.players[p]; return st.active===p&&st.winner===null&&!pl.landFlooped&&pl.ap>=TUNE.LAND_FLOOP_COST; }
function resolveTargetObj(st,t){

// ---------------------------------------------------------------- act
function act(st,a){

// ---------------------------------------------------------------- AI
const W={hp:1.0,atk:1.0,def:0.65,face:0.9,build:0.7};

function scoreAction(st,p,a){ const c=clone(st); act(c,a); if(c.lastError) return -1e9; if(a.t!=='endTurn'&&c.winner===null){ const c2=clone(c); resolveAttacks(c2,p); return evaluate(c2,p); } return evaluate(c,p); }
function bestAction(st,p,depth,noise){

function aiAction(st,p,level){

// ---------------------------------------------------------------- simulation
function playMatch(cfg){

function runSuite(o){
  o=o||{}; const heroes=o.heroes||HERO_IDS; const n=o.n||100; const level=o.level||'medium'; const seed0=o.seed||12345;
  const wins={}, games={}, firstWins={n:0,w:0}; const pairs=[]; let turnsSum=0, total=0;

    let wi=0; for(let k=0;k<n;k++){ const first=k&1; const seed=(seed0+i*7919+j*104729+k*31)>>>0;

function addPiece(uid,cardId,side,lane,o){ o=o||{}; removePiece(uid); const r=laneScreen(side,lane); const p={uid,id:cardId,side,lane,x:r.x+(o.building?(side===0?18:-18):0),y:r.y+(o.building?(side===0?16:-14):6),h:r.w*(o.building?0.9:1.1),scale:o.silent?1:0.01,rot:0,building:!!o.building,st:{},hl:false,tilt:0}; pieces.set(uid,p); if(!o.silent) GFX.anim(400,k=>{ p.scale=k*(1+Math.sin(k*Math.PI)*0.2); },GFX.ease.out).then(()=>{ p.scale=1; }); }
function removePiece(uid,death){ const p=pieces.get(uid); if(!p) return Promise.resolve(); if(!death){ pieces.delete(uid); return Promise.resolve(); } return GFX.anim(400,k=>{ p.scale=1-k*0.9; p.rot=k*1.2; }).then(()=>pieces.delete(uid)); }
function setFlooped(uid,on,instant){ const p=pieces.get(uid); if(!p) return Promise.resolve(); const to=on?-1.2:0; if(instant){ p.tilt=to; return Promise.resolve(); } const from=p.tilt; return GFX.anim(400,k=>{ p.tilt=from+(to-from)*k; }); }
function setStatus(uid,s){ const p=pieces.get(uid); if(p) Object.assign(p.st,s); }
function movePiece(uid,side,lane){ const p=pieces.get(uid); if(!p) return Promise.resolve(); const r=laneScreen(side,lane); const x0=p.x,y0=p.y; p.lane=lane; return GFX.anim(380,k=>{ p.x=x0+(r.x-x0)*k; p.y=y0+(r.y+6-y0)*k-Math.sin(k*Math.PI)*30; }); }
function attackAnim(uid,tuid,tside,lane,hit){ const p=pieces.get(uid); if(!p) return Promise.resolve(); const y0=p.y; const dir=p.side===0?-1:1; return GFX.anim(200,k=>{ p.y=y0-dir*14*k; }).then(()=>GFX.anim(140,k=>{ p.y=y0-dir*14+dir*(H*0.12)*k; })).then(()=>{ hit&&hit(); return GFX.anim(300,k=>{ p.y=y0+dir*(H*0.12-14)*(1-k); }); }); }
function hitAnim(uid,big){ const p=pieces.get(uid); if(!p) return; const x0=p.x; sparks(p.x,p.y-20,big?'#ffd23a':'#fff',big?14:8); GFX.anim(300,k=>{ p.x=x0+Math.sin(k*Math.PI*4)*6*(1-k); }); }

function sparks(x,y,col,n,g){ for(let i=0;i<n;i++){ const a=Math.random()*6.28; parts.push({x,y,vx:Math.cos(a)*(60+Math.random()*80),vy:Math.sin(a)*(60+Math.random()*80)-60,life:0,max:0.5,col,g:g||1}); } }
function sparksAt(uid,col){ const p=pieces.get(uid); if(p) sparks(p.x,p.y-20,'#fff',10); void col; }
function shake(a){ shakeA=Math.max(shakeA,typeof a==='number'&&a<2?a*14:a); shakeT=0; }

function drawSlab(side,lane){ const r=laneScreen(side,lane); const land=lands[side][lane]; const L=CW.LANDS[land]; const w=r.w,hh=r.h; const sk=w*0.18; ctx.save(); ctx.translate(r.x,r.y); const m=hl[side][lane]; if(m){ ctx.fillStyle=m==='ok'?'rgba(127,224,122,.5)':m==='hot'?'rgba(255,227,106,.7)':'rgba(255,90,90,.5)'; ctx.beginPath(); ctx.moveTo(-w/2-sk-6,-hh/2-6); ctx.lineTo(w/2+sk+6,-hh/2-6); ctx.lineTo(w/2+6,hh/2+6); ctx.lineTo(-w/2-6,hh/2+6); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle=MODELS.shade(L.color,0.55); ctx.beginPath(); ctx.moveTo(-w/2,hh/2); ctx.lineTo(w/2,hh/2); ctx.lineTo(w/2,hh/2+12); ctx.lineTo(-w/2,hh/2+12); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#1c1520'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=L.color; ctx.beginPath(); ctx.moveTo(-w/2-sk,-hh/2); ctx.lineTo(w/2+sk,-hh/2); ctx.lineTo(w/2,hh/2); ctx.lineTo(-w/2,hh/2); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.font=`bold ${Math.round(w*0.12)}px sans-serif`; ctx.textAlign='center'; ctx.fillText(L.short.toUpperCase(),0,hh/2-4); ctx.restore(); }
function draw(dt){ tt+=dt; ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); let ox=0,oy=0; if(shakeA>0){ shakeT+=dt; const a=shakeA*Math.max(0,1-shakeT/0.4); ox=(Math.random()-0.5)*a; oy=(Math.random()-0.5)*a; if(shakeT>0.4) shakeA=0; } ctx.translate(ox,oy);
  if(gal){ const sp=sprite(gal); const s=Math.min(W,H)*0.7; ctx.drawImage(sp,W/2-s*0.4,H/2-s*0.5,s*0.8,s); return; }
  // table
  ctx.fillStyle=theme.table||'#5b3419'; ctx.beginPath(); ctx.moveTo(W*0.02,H*0.62); ctx.lineTo(W*0.98,H*0.62); ctx.lineTo(W*0.9,H*0.22); ctx.lineTo(W*0.1,H*0.22); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#1c1520'; ctx.lineWidth=3; ctx.stroke(); ctx.fillStyle=theme.mat||'#2f4a3a'; ctx.fillRect(W*0.12,H*0.26,W*0.76,H*0.34);
  for(const side of [1,0]) for(let l=0;l<4;l++) drawSlab(side,l);
  for(const side of [1,0]){ if(heroes[side]){ const sp=sprite('hero:'+heroes[side]); const s=Math.min(W,H)*0.28; const y=side===0?H*0.6:H*0.02; ctx.drawImage(sp,W/2-s*0.4,y,s*0.8,s); } }
  const order=Array.from(pieces.values()).sort((a,b)=>(a.side===b.side?0:a.side-b.side)||a.y-b.y);
  for(const p of order){ const sp=sprite('card:'+p.id); const s=p.h*p.scale; ctx.save(); ctx.translate(p.x,p.y); if(p.hl){ ctx.strokeStyle='#ffe36a'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(0,4,s*0.45,s*0.16,0,0,6.283); ctx.stroke(); } ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0,4,s*0.36,s*0.12,0,0,6.283); ctx.fill(); ctx.rotate(p.tilt+p.rot); if(p.st.frozen){ ctx.fillStyle='rgba(191,244,255,.45)'; ctx.fillRect(-s*0.35,-s*1.05,s*0.7,s*1.1); } ctx.drawImage(sp,-s*0.4,-s*1.0,s*0.8,s); if(p.st.shield||p.st.poison){ ctx.strokeStyle=p.st.shield?'#ffd23a':'#9ee06a'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(0,2,s*0.4,s*0.14,0,0,6.283); ctx.stroke(); } ctx.restore(); }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.life+=dt; if(q.life>q.max){ parts.splice(i,1); continue; } q.vy+=300*q.g*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; ctx.globalAlpha=1-q.life/q.max; ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,4,0,6.283); ctx.fill(); } ctx.globalAlpha=1; }

(function boot(){

  document.getElementById('app').style.display='none'; document.getElementById('gl').style.display='none';
  const pre=document.createElement('pre'); pre.style.cssText='position:fixed;inset:0;overflow:auto;padding:16px;margin:0;background:#111;color:#9f9;font:12px/1.4 monospace;z-index:100;white-space:pre-wrap'; document.body.appendChild(pre); finish();
  const n=parseInt(q.get('n')||'200'), level=q.get('level')||'medium', heroes=(q.get('heroes')||'').split(',').filter(Boolean);
  const src=document.getElementById('engine').textContent;
  const worker=`self.onmessage=function(e){ const o=e.data; const heroes=o.heroes.length?o.heroes:CW.HERO_IDS; const t0=Date.now(); const wins={},games={}; let first=0,firstN=0,turns=0,total=0; for(const h of heroes){ wins[h]=0; games[h]=0; } const pairs=[];
    for(let i=0;i<heroes.length;i++) for(let j=i;j<heroes.length;j++){ let wi=0; for(let k=0;k<o.n;k++){ const f=k&1; const r=CW.playMatch({heroes:[heroes[i],heroes[j]],first:f,seed:(o.seed+i*7919+j*104729+k*31)>>>0,ai:[o.level,o.level]}); total++; turns+=r.turns; if(r.winner===0){ wins[heroes[i]]++; if(i!==j) wi++; } if(r.winner===1) wins[heroes[j]]++; if(i!==j){ games[heroes[i]]++; games[heroes[j]]++; } else games[heroes[i]]+=2; if(r.winner===f) first++; if(r.winner!==-1) firstN++; }
      pairs.push({a:heroes[i],b:heroes[j],aWin:i===j?null:wi/o.n}); self.postMessage({progress:total,secs:(Date.now()-t0)/1000}); }
    const rates={}; for(const h of heroes) rates[h]=wins[h]/games[h]; self.postMessage({done:true,rates,pairs,firstRate:first/Math.max(1,firstN),avgTurns:turns/total,total,secs:(Date.now()-t0)/1000}); };`;
  try{ const w=new Worker(URL.createObjectURL(new Blob([src+'\n'+worker],{type:'text/javascript'}))); pre.textContent=`CARD WARS headless simulator\nlevel=${level} n=${n} per pairing (${heroes.length||10} heroes)\nrunning…\n`;
    w.onmessage=e=>{ const d=e.data; if(d.progress){ pre.textContent=pre.textContent.replace(/running….*$/s,`running… ${d.progress} matches, ${d.secs.toFixed(0)}s`); return; } if(d.done){ let out=`\nDONE ${d.total} matches in ${d.secs.toFixed(0)}s\nfirst-player win rate ${(d.firstRate*100).toFixed(1)}%  avg turns ${d.avgTurns.toFixed(1)}\n\nHERO WIN RATES\n`; for(const [h,r] of Object.entries(d.rates).sort((a,b)=>b[1]-a[1])) out+=`${h.padEnd(10)} ${(r*100).toFixed(1)}%\n`; out+='\nPAIRINGS (row hero win %)\n'; for(const p of d.pairs) if(p.aWin!==null) out+=`${p.a.padEnd(10)} vs ${p.b.padEnd(10)} ${(p.aWin*100).toFixed(0)}%\n`; pre.textContent+=out; } };
    w.postMessage({n,level,heroes,seed:777}); }catch(e){ pre.textContent+='\nWorker failed: '+e.message; }
  return;
}
// ---- normal boot
STORE.load(); const settings=STORE.d.settings; AUDIO.setMute(!!settings.mute); AUDIO.setVolumes(settings.music,settings.sfx);
msg('Setting the table…');
const gl=document.getElementById('gl'); const ok=GFX.init(gl); if(ok&&settings.quality==='low') GFX.setQuality('low');
if(ok){ BOARD=GFX; } else { BOARD=BOARD2D; BOARD2D.init(document.getElementById('board2d')); gl.style.display='none'; }
window.BOARD=BOARD;
gl.addEventListener('webglcontextlost',e=>{ e.preventDefault(); UI.toast('Graphics context lost — reload the page if the board stops drawing'); });
// audio unlock on first interaction
const unlock=()=>{ AUDIO.unlock(); document.removeEventListener('pointerdown',unlock); document.removeEventListener('touchstart',unlock); document.removeEventListener('keydown',unlock); if(UI.screen==='s-title'||UI.screen==='s-heroes') AUDIO.music('treehouse'); };
document.addEventListener('pointerdown',unlock); document.addEventListener('touchstart',unlock); document.addEventListener('keydown',unlock);
document.addEventListener('gesturestart',e=>e.preventDefault()); document.addEventListener('dblclick',e=>e.preventDefault());

msg('Painting the cards…');
setTimeout(()=>{ try{ if(q.get('gallery')==='1'){ UI.gallery(); } else { UI.title(); } }catch(e){ console.error(e); } finish();
  let i=0; const ids=CW.CARDS.filter(c=>!c.token).map(c=>c.id); const warm=()=>{ const t=performance.now(); while(i<ids.length&&performance.now()-t<8){ UI.artFor(ids[i++]); } if(i<ids.length) setTimeout(warm,30); }; setTimeout(warm,600); },30);
})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetherkin</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Eczar:wght@500;600;700&family=Sometype+Mono:wght@400;500;700&display=swap">
<style>
/* ===========================================================================
   AETHERKIN — a Binder's field instrument. One committed dark world: slate
   and brass, with the thirteen aspect hues doing all the semantic work.
   =========================================================================== */
:root {
  --ink:        #0E1220;
  --ink-2:      #151A2B;
  --ink-3:      #1D2338;
  --ink-4:      #272F4A;
  --line:       #2C3450;
  --line-soft:  #212842;
  --vellum:     #E9E3D3;
  --vellum-2:   #AEB6CC;
  --vellum-3:   #767E96;
  --brass:      #D9A441;
  --brass-hi:   #F2CE83;
  --brass-deep: #6B4F1C;
  --ok:         #62C295;
  --warn:       #E0A038;
  --crit:       #E4594C;
  --shadow:     0 12px 34px rgba(0,0,0,.5);
  --edge:       1px solid var(--line);
  --font-d: 'Eczar', 'Iowan Old Style', Georgia, serif;
  --font-u: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-m: 'Sometype Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --stage-h: 560px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ink); color: var(--vellum);
  font-family: var(--font-u); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-d); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .005em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: var(--ink); }
::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 9px; }
::-webkit-scrollbar-thumb:hover { background: #38426a; }

/* ---------- frame ---------- */
.app {
  max-width: 1160px; margin: 0 auto; min-height: 100vh;
  display: flex; flex-direction: column;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(217,164,65,.09), transparent 60%),
    linear-gradient(var(--ink-2), var(--ink));
  border-left: var(--edge); border-right: var(--edge);
}
.rail {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 18px; border-bottom: var(--edge);
  background: linear-gradient(var(--ink-3), var(--ink-2));
  position: sticky; top: 0; z-index: 40;
}
.mark { display: flex; align-items: baseline; gap: 9px; margin-right: auto; }
.mark b { font-family: var(--font-d); font-size: 20px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-hi); }
.mark span { font-family: var(--font-m); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--vellum-3); }
.readout { display: flex; align-items: center; gap: 6px; font-family: var(--font-m); font-size: 12.5px; color: var(--vellum-2); font-variant-numeric: tabular-nums; }
.readout i { width: 7px; height: 7px; background: var(--brass); transform: rotate(45deg); font-style: normal; }
.readout.gold i { background: var(--brass); }
.railbtns { display: flex; gap: 6px; }

/* ---------- controls ---------- */
.btn {
  appearance: none; background: var(--ink-3); border: 1px solid var(--line);
  color: var(--vellum); padding: 7px 14px; border-radius: 2px; cursor: pointer;
  font-size: 13.5px; font-weight: 500; letter-spacing: .01em;
  transition: background .14s, border-color .14s, color .14s, transform .1s;
}
.btn:hover:not(:disabled) { background: var(--ink-4); border-color: var(--brass-deep); color: var(--brass-hi); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.primary { background: linear-gradient(#3a2f13, #241d0c); border-color: var(--brass-deep); color: var(--brass-hi); }
.btn.primary:hover:not(:disabled) { background: linear-gradient(#4b3c17, #2f2610); border-color: var(--brass); }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.danger:hover:not(:disabled) { border-color: var(--crit); color: var(--crit); }
.btn.wide { width: 100%; text-align: left; }
.tabs { display: flex; gap: 4px; border-bottom: var(--edge); padding: 0 18px; background: var(--ink-2); overflow-x: auto; }
.tab {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 11px 14px; cursor: pointer; color: var(--vellum-3); white-space: nowrap;
  font-size: 12px; letter-spacing: .13em; text-transform: uppercase; font-weight: 600;
}
.tab:hover { color: var(--vellum-2); }
.tab[aria-selected="true"] { color: var(--brass-hi); border-bottom-color: var(--brass); }

/* ---------- stage ---------- */
.stage { flex: 1; padding: 22px 18px 30px; }
.screen { display: flex; flex-direction: column; gap: 18px; animation: rise .26s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.eyebrow { font-family: var(--font-m); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--vellum-3); }
.lede { color: var(--vellum-2); max-width: 66ch; }
.panel { background: var(--ink-2); border: var(--edge); border-radius: 3px; padding: 16px 18px; }
.panel.flush { padding: 0; overflow: hidden; }
.grid { display: grid; gap: 12px; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.cols { display: flex; gap: 12px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--vellum-3); }
.mono { font-family: var(--font-m); font-variant-numeric: tabular-nums; }
hr.rule { border: 0; border-top: var(--edge); margin: 4px 0; }

/* ---------- kin ---------- */
.glyph { display: block; image-rendering: auto; }
.glyph.flip { transform: scaleX(-1); }
.glyph-wrap { display: grid; place-items: center; }
@media (prefers-reduced-motion: no-preference) {
  .float { animation: bob 4.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
}
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 2px;
  font-family: var(--font-m); font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase;
  border: 1px solid currentColor; background: color-mix(in srgb, currentColor 12%, transparent);
}
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.bar { height: 7px; background: var(--ink-4); border-radius: 2px; overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; background: var(--ok); transition: width .45s cubic-bezier(.3,.8,.4,1); }
.bar.low > i { background: var(--warn); }
.bar.crit > i { background: var(--crit); }
.bar.xp { height: 4px; }
.bar.xp > i { background: var(--brass); }
.bar.focus { height: 5px; }
.bar.focus > i { background: #4FA8DE; }

.kincard { display: grid; grid-template-columns: 66px 1fr; gap: 12px; align-items: center;
  background: var(--ink-2); border: var(--edge); border-radius: 3px; padding: 11px 13px; text-align: left; width: 100%; cursor: pointer; }
.kincard:hover { border-color: var(--brass-deep); background: var(--ink-3); }
.kincard[aria-current="true"] { border-color: var(--brass); box-shadow: inset 0 0 0 1px rgba(217,164,65,.25); }
.kincard.down { opacity: .5; }
.kincard h4 { font-size: 16px; }
.kinmeta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lv { font-family: var(--font-m); font-size: 11.5px; color: var(--brass); letter-spacing: .08em; }
.motepip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-m); font-size: 11px; color: var(--brass-hi); }
.motepip::before { content: ''; width: 6px; height: 6px; background: var(--brass); transform: rotate(45deg); box-shadow: 0 0 6px var(--brass); }

/* ---------- lattice ---------- */
.latticebox { position: relative; background:
    radial-gradient(80% 60% at 50% 0%, rgba(217,164,65,.06), transparent 70%), var(--ink);
  border: var(--edge); border-radius: 3px; overflow: auto; }
.latticefield { position: relative; margin: 0 auto; }
.latticefield svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ringlabel { position: absolute; left: 10px; text-align: right; font-family: var(--font-m); font-size: 9.5px;
  letter-spacing: .14em; text-transform: uppercase; transform: translateY(-50%); pointer-events: none;
  display: flex; flex-direction: column; gap: 1px; }
.ringlabel b { color: #626C93; font-weight: 500; }
.ringlabel span { color: #414A6C; }
.lnode {
  position: absolute; width: 42px; height: 42px; transform: translate(-50%, -50%);
  border-radius: 50%; border: 1.5px solid var(--line); background: var(--ink-2);
  display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--vellum-2);
  transition: transform .14s, box-shadow .2s, border-color .2s, background .2s;
}
.lnode:hover { transform: translate(-50%, -50%) scale(1.14); z-index: 6; }
.lnode .sig { width: 18px; height: 18px; display: block; }
.lnode.evo .sig { width: 21px; height: 21px; }
.lnode[data-state="owned"] { background: var(--ink-3); color: var(--vellum); }
.lnode[data-state="open"] { border-color: var(--brass); color: var(--brass-hi); box-shadow: 0 0 0 3px rgba(217,164,65,.13); }
.lnode[data-state="short"] { border-color: var(--brass-deep); color: var(--vellum-3); }
.lnode[data-state="early"], .lnode[data-state="locked"] { opacity: .5; }
.lnode[data-state="sealed"] { opacity: .26; cursor: not-allowed; filter: saturate(.2); }
.lnode[aria-current="true"] { box-shadow: 0 0 0 3px rgba(217,164,65,.4); z-index: 7; }
.lnode.evo { width: 54px; height: 54px; border-radius: 4px; transform: translate(-50%, -50%) rotate(45deg); }
.lnode.evo:hover { transform: translate(-50%, -50%) rotate(45deg) scale(1.12); }
.lnode.evo > * { transform: rotate(-45deg); }
.lnode.cap { width: 50px; height: 50px; }
@media (prefers-reduced-motion: no-preference) {
  .lnode[data-state="open"] { animation: ping 2.6s ease-in-out infinite; }
  @keyframes ping { 0%,100% { box-shadow: 0 0 0 3px rgba(217,164,65,.10); } 50% { box-shadow: 0 0 0 6px rgba(217,164,65,.03); } }
  .lnode.justlit { animation: lit .55s ease both; }
  @keyframes lit { 0% { box-shadow: 0 0 0 0 rgba(217,164,65,.65); } 100% { box-shadow: 0 0 0 26px rgba(217,164,65,0); } }
}
.nodesheet { display: flex; flex-direction: column; gap: 10px; }
.nodesheet .why { font-size: 13px; }
.costtag { font-family: var(--font-m); font-size: 11.5px; color: var(--brass-hi); letter-spacing: .06em; }

/* ---------- battle ---------- */
.arena {
  position: relative; border: var(--edge); border-radius: 3px; padding: 16px;
  background: linear-gradient(180deg, var(--ink-3), var(--ink)); overflow: hidden;
}
.arena::after { content: ''; position: absolute; left: 0; right: 0; top: 52%; border-top: 1px dashed var(--line); pointer-events: none; }
.fieldbanner { position: absolute; top: 0; left: 0; right: 0; padding: 4px 14px; font-family: var(--font-m);
  font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; text-align: center; }
.combat { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 18px 16px; margin-top: 12px; }
.slot { display: flex; flex-direction: row; align-items: center; gap: 12px; }
.slot.theirs { grid-column: 2; grid-row: 1; justify-content: flex-end; text-align: right; }
.slot.mine { grid-column: 1; grid-row: 2; justify-content: flex-start; }
.nameplate { background: rgba(14,18,32,.72); border: var(--edge); border-radius: 3px; padding: 8px 11px; min-width: 200px; flex: 0 1 auto; backdrop-filter: blur(3px); }
.nameplate h4 { font-size: 15px; }
.hpline { display: flex; align-items: center; gap: 8px; font-family: var(--font-m); font-size: 11px; color: var(--vellum-2); }
.hpline .bar { flex: 1; }
.statuspips { display: flex; gap: 4px; flex-wrap: wrap; min-height: 16px; }
.pip { font-family: var(--font-m); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; padding: 1px 5px; border: 1px solid currentColor; border-radius: 2px; }
.stagepips { display: flex; gap: 3px; flex-wrap: wrap; }
.stagepip { font-family: var(--font-m); font-size: 9.5px; padding: 0 4px; border-radius: 2px; }
.stagepip.up { color: var(--ok); background: rgba(98,194,149,.12); }
.stagepip.dn { color: var(--crit); background: rgba(228,89,76,.12); }
.dmgfloat { position: absolute; font-family: var(--font-d); font-size: 26px; font-weight: 700; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
@media (prefers-reduced-motion: no-preference) {
  .dmgfloat { animation: floatup 1s ease-out both; }
  @keyframes floatup { 0% { opacity: 0; transform: translateY(6px) scale(.9); } 18% { opacity: 1; transform: translateY(-4px) scale(1.06); } 100% { opacity: 0; transform: translateY(-40px); } }
  .shake { animation: shake .34s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
}
.cmd { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.movebtn {
  display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left;
  padding: 9px 11px; border: 1px solid var(--line); background: var(--ink-2); border-radius: 3px; cursor: pointer;
  border-left-width: 3px; transition: background .14s, border-color .14s, transform .1s;
}
.movebtn:hover:not(:disabled) { background: var(--ink-3); }
.movebtn:active:not(:disabled) { transform: translateY(1px); }
.movebtn:disabled { opacity: .4; cursor: not-allowed; }
.movebtn b { font-size: 14px; font-weight: 600; }
.movebtn .meta { display: flex; gap: 8px; align-items: center; font-family: var(--font-m); font-size: 10.5px; color: var(--vellum-3); }
.eff { font-family: var(--font-m); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; }
.eff.super { color: var(--ok); } .eff.weak { color: var(--crit); } .eff.null { color: var(--vellum-3); }
.log {
  height: 168px; overflow-y: auto; padding: 10px 13px; background: var(--ink);
  border: var(--edge); border-radius: 3px; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px;
}
.log p { margin: 0; color: var(--vellum-2); }
.log p.act { color: var(--vellum); }
.log p.good { color: var(--ok); } .log p.bad { color: var(--crit); }
.log p.crit { color: var(--brass-hi); font-weight: 600; }
.log p.weak { color: var(--vellum-3); }
.log p.sys { color: var(--vellum-3); font-style: italic; }

/* ---------- codex / lists ---------- */
.dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
.dexcell { background: var(--ink-2); border: var(--edge); border-radius: 3px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; text-align: center; }
.dexcell:hover { border-color: var(--brass-deep); }
.dexcell.unknown { opacity: .34; }
.itemrow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.itemrow:last-child { border-bottom: 0; }
.slotrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line-soft); border-radius: 3px; background: var(--ink-2); }
.slotrow.on { border-color: var(--brass-deep); background: var(--ink-3); }
.slotrow.on .slottitle { color: var(--brass-hi); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 7px 16px; }
.statrow { display: grid; grid-template-columns: 44px 1fr 40px; gap: 8px; align-items: center; font-family: var(--font-m); font-size: 11.5px; }
.statrow .bar { height: 5px; }
.statrow em { font-style: normal; color: var(--vellum-3); letter-spacing: .08em; }
.statrow b { text-align: right; font-weight: 500; }

/* ---------- modal & toast ---------- */
.veil { position: fixed; inset: 0; background: rgba(6,8,14,.76); display: grid; place-items: center; z-index: 90; padding: 20px; animation: fade .18s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--ink-2); border: 1px solid var(--line); border-top: 2px solid var(--brass); border-radius: 3px;
  box-shadow: var(--shadow); max-width: 560px; width: 100%; max-height: 84vh; overflow-y: auto; padding: 20px 22px; }
.toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 95; display: flex; flex-direction: column; gap: 7px; align-items: center; pointer-events: none; }
.toast { background: var(--ink-3); border: 1px solid var(--brass-deep); border-radius: 2px; padding: 8px 15px; font-size: 13.5px; box-shadow: var(--shadow); animation: rise .2s ease both; }
.toast.good { border-color: var(--ok); } .toast.bad { border-color: var(--crit); }
.ticker { border-top: var(--edge); padding: 7px 18px; font-family: var(--font-m); font-size: 11px; color: var(--vellum-3); background: var(--ink-2); display: flex; justify-content: space-between; gap: 12px; }

/* ---------- title ---------- */
.title { display: grid; place-items: center; gap: 22px; padding: 40px 10px 30px; text-align: center; }
.title h1 { font-size: clamp(46px, 10vw, 86px); font-weight: 700; letter-spacing: .17em; color: var(--brass-hi); text-transform: uppercase; line-height: .95; }
.title .sub { font-family: var(--font-m); font-size: 11.5px; letter-spacing: .34em; text-transform: uppercase; color: var(--vellum-3); }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; width: 100%; }
.starter { background: var(--ink-2); border: var(--edge); border-radius: 3px; padding: 15px; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: border-color .16s, transform .16s, background .16s; }
.starter:hover { border-color: var(--brass); transform: translateY(-3px); background: var(--ink-3); }
.starter[aria-current="true"] { border-color: var(--brass); box-shadow: inset 0 0 0 1px rgba(217,164,65,.3); }

@media (max-width: 720px) {
  .combat { grid-template-columns: 1fr; gap: 12px; }
  .slot { gap: 9px; }
  .slot.theirs { grid-column: 1; grid-row: 1; flex-direction: row-reverse; justify-content: flex-end; text-align: left; }
  .slot.mine { grid-column: 1; grid-row: 2; }
  .nameplate { min-width: 0; flex: 1 1 auto; }
  .rail { gap: 9px; padding: 9px 12px; }
  .stage { padding: 16px 12px 24px; }
  .mark span { display: none; }
}

</style>
</head>
<body>
<div class="app">
  <header class="rail">
    <div class="mark"><b>Aetherkin</b><span>Binder's Instrument</span></div>
    <div class="readout gold" id="r-gold" hidden><i></i><span>0</span></div>
    <div class="readout" id="r-zone" hidden></div>
    <div class="railbtns" id="railbtns"></div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="ticker">
    <span id="tick-left">Aetherkin — an original creature-binding game.</span>
    <span id="tick-right" class="mono"></span>
  </footer>
</div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
"use strict";

/* ==== 00-util.js ================================================== */
/* ---------- random ---------- */
let _seed = (Math.random() * 4294967296) >>> 0;
function srand(s) { _seed = (s >>> 0) || 1; }
function rnd() {
  _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const chance = p => rnd() < p;
const pick = arr => arr[Math.floor(rnd() * arr.length)];
function weighted(entries) {
  let total = 0; for (const e of entries) total += e[1];
  let r = rnd() * total;
  for (const e of entries) { r -= e[1]; if (r <= 0) return e[0]; }
  return entries[entries.length - 1][0];
}
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* ---------- math ---------- */
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const pctOf = (a, b) => b <= 0 ? 0 : clamp(a / b, 0, 1);

/* ---------- dom ---------- */
const $ = (sel, ctx) => (ctx || document).querySelector(sel);
const $$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));

function el(tag, props, ...kids) {
  const parts = String(tag).split(/(?=[.#])/);
  const node = document.createElement(parts[0] || 'div');
  for (let i = 1; i < parts.length; i++) {
    if (parts[i][0] === '.') node.classList.add(parts[i].slice(1));
    else node.id = parts[i].slice(1);
  }
  if (props) for (const k in props) {
    const v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.classList.add(...String(v).split(/\s+/).filter(Boolean));
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(4)) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}
const clearNode = node => { while (node && node.firstChild) node.removeChild(node.firstChild); return node; };

function typeMult(atkType, defTypes) {
  const t = TYPES[atkType] || TYPES.aether;
  let m = 1;
  for (const d of defTypes) {
    if (t.voids.includes(d)) return 0;
    if (t.beats.includes(d)) m *= 2;
    else if (t.bends.includes(d)) m *= 0.5;
  }
  return m;
}
function effLabel(m) {
  if (m === 0) return { text: 'It passes straight through.', tone: 'null' };
  if (m >= 4) return { text: 'Devastating resonance!', tone: 'super' };
  if (m > 1) return { text: 'It resonates!', tone: 'super' };
  if (m <= 0.25) return { text: 'Almost nothing gets through.', tone: 'weak' };
  if (m < 1) return { text: 'The aspect is dulled.', tone: 'weak' };
  return { text: '', tone: 'even' };
}

/* ============================================================================
   PASSIVES — always on, but slots are scarce. A kin starts with 2 slots and
   earns a third on evolving, so a full lattice always outgrows what it can wear.
   Hooks (all optional, all receive c = { self, foe, bt, log, ...extra }):
     onEnter, onTurnEnd, afterDeal, afterTake, onKO
     dmgOut -> multiplier   dmgIn -> multiplier   statMult(c.stat) -> multiplier
     survive -> bool        blockStatus(c.status) -> bool
     critBonus -> stages    accMult -> multiplier   focusRegen -> extra Focus
   ========================================================================== */

/* node cost / level gate, derived from ring unless overridden */
function nodeCost(fam, node) {
  if (node.cost != null) return node.cost;
  const c = (LATTICES[fam].solo ? SOLO_COST : RING_COST)[node.r];
  return c === undefined ? 2 : c;
}
function nodeLevel(fam, node) {
  if (node.lv != null) return node.lv;
  const v = (LATTICES[fam].solo ? SOLO_LV : RING_LV)[node.r];
  return v === undefined ? 1 : v;
}


/* ==== 07-kin.js =================================================== */
/* ============================================================================
   KIN — a bound creature: its level, its Motes, and the nodes it has lit.
   ========================================================================== */
const LV_CAP = 50;
const MOVE_SLOTS = 4;
const ABIL_SLOTS = 2;
const passiveSlots = kin => 2 + (SPECIES[kin.sp].stage >= 2 ? 1 : 0);

const totalXpFor = lv => Math.round(1.2 * Math.pow(lv, 3));
const xpToNext = lv => (lv >= LV_CAP ? 0 : totalXpFor(lv + 1) - totalXpFor(lv));
/* one Mote per level, and a bonus Mote every tenth */
const motesForLevel = lv => (lv - 1) + Math.floor(lv / 10);

let _uid = 1;
function makeKin(speciesId, level, opts) {
  const o = opts || {};
  const sp = SPECIES[speciesId];
  const kin = {
    uid: _uid++, sp: speciesId, nick: o.nick || null, lv: clamp(level, 1, LV_CAP), xp: 0,
    res: {}, nodes: [], moves: [], abil: [], pass: [], hp: 0, spent: 0, bonusMotes: 0, caught: o.caught || null,
  };
  for (const k of STATS) kin.res[k] = o.perfect ? 15 : ri(0, 15);
  kin.xp = totalXpFor(kin.lv);
  /* the core node is lit for free */
  const lat = LATTICES[sp.fam];
  const core = lat.nodes.find(n => n.k === 'core');
  if (core) kin.nodes.push(core.id);
  kin.moves = [sp.innate, 'rend'].slice(0, MOVE_SLOTS);
  kin.hp = statsFor(kin).hp;
  if (o.build) for (const id of o.build) buyNode(kin, id, true);
  kin.hp = statsFor(kin).hp;
  return kin;
}

const kinName = kin => kin.nick || SPECIES[kin.sp].n;
const kinSpecies = kin => SPECIES[kin.sp];
const kinLattice = kin => LATTICES[SPECIES[kin.sp].fam];
const findNode = (kin, id) => kinLattice(kin).nodes.find(n => n.id === id);

/* flat stat bonuses granted by lit stat-nodes */
function latticeBonus(kin) {
  const out = { hp: 0, frc: 0, grd: 0, arc: 0, wrd: 0, swf: 0 };
  for (const id of kin.nodes) {
    const n = findNode(kin, id);
    if (n && n.stat) for (const k in n.stat) out[k] += n.stat[k];
  }
  return out;
}

function statsFor(kin) {
  const sp = SPECIES[kin.sp], lv = kin.lv, bonus = latticeBonus(kin), out = {};
  out.hp = Math.floor((2 * sp.base.hp + kin.res.hp) * lv / 100) + lv + 10 + bonus.hp;
  for (const k of ['frc', 'grd', 'arc', 'wrd', 'swf'])
    out[k] = Math.floor((2 * sp.base[k] + kin.res[k]) * lv / 100) + 5 + bonus[k];
  return out;
}
/* 0-100: how cleanly this individual resonates with its species */
const resonance = kin => Math.round(STATS.reduce((n, k) => n + kin.res[k], 0) / (STATS.length * 15) * 100);

/* ---------------- the lattice ------------------------------------------- */
function latticeState(kin) {
  const owned = new Set(kin.nodes);
  let spent = 0;
  const fam = SPECIES[kin.sp].fam;
  for (const id of kin.nodes) { const n = findNode(kin, id); if (n) spent += nodeCost(fam, n); }
  const total = motesForLevel(kin.lv) + (kin.bonusMotes || 0);
  return { owned, spent, total, free: total - spent };
}

/* Walk back up the requirement chain: if any ancestor sits on a branch this
   kin has closed off, the whole limb below it is closed too. */
function sealedBy(kin, node, lat, owned, depth) {
  if ((depth || 0) > 12) return null;
  if (node.excl) {
    const clash = lat.nodes.find(n => n.excl === node.excl && n.id !== node.id && owned.has(n.id));
    if (clash) return clash;
  }
  for (const r of (node.req || [])) {
    if (owned.has(r)) continue;
    const parent = lat.nodes.find(n => n.id === r);
    if (!parent) continue;
    const s = sealedBy(kin, parent, lat, owned, (depth || 0) + 1);
    if (s) return s;
  }
  return null;
}

function canBuy(kin, nodeId) {
  const fam = SPECIES[kin.sp].fam, lat = LATTICES[fam];
  const node = lat.nodes.find(n => n.id === nodeId);
  if (!node) return { ok: false, why: 'No such node.' };
  const st = latticeState(kin);
  if (st.owned.has(nodeId)) return { ok: false, why: 'Already lit.' };
  const seal = sealedBy(kin, node, lat, st.owned);
  if (seal) return { ok: false, why: 'Closed off for good by ' + nodeLabel(seal) + '.', sealed: true };
  const missing = (node.req || []).filter(r => !st.owned.has(r));
  if (missing.length) {
    const names = missing.map(r => nodeLabel(lat.nodes.find(n => n.id === r)));
    return { ok: false, why: 'Needs ' + names.join(' and ') + ' first.', locked: true };
  }
  const lv = nodeLevel(fam, node);
  if (kin.lv < lv) return { ok: false, why: 'Opens at level ' + lv + '.', early: true };
  if (node.k === 'evolve' && SPECIES[node.ref].from !== kin.sp)
    return { ok: false, why: 'Only ' + SPECIES[SPECIES[node.ref].from].n + ' can take this shape.', sealed: true };
  const cost = nodeCost(fam, node);
  if (st.free < cost) return { ok: false, why: 'Needs ' + cost + ' ' + plural(cost, 'Mote') + ' — ' + st.free + ' free.', poor: true };
  return { ok: true, cost };
}

function buyNode(kin, nodeId, force) {
  if (!force) { const c = canBuy(kin, nodeId); if (!c.ok) return c; }
  const lat = kinLattice(kin);
  const node = lat.nodes.find(n => n.id === nodeId);
  if (!node || kin.nodes.includes(nodeId)) return { ok: false, why: 'No such node.' };
  kin.nodes.push(nodeId);
  const events = [];
  if (node.k === 'move' || node.k === 'core') {
    if (kin.moves.length < MOVE_SLOTS && !kin.moves.includes(node.ref)) kin.moves.push(node.ref);
    events.push({ kind: 'move', ref: node.ref });
  } else if (node.k === 'ability') {
    if (kin.abil.length < ABIL_SLOTS && !kin.abil.includes(node.ref)) kin.abil.push(node.ref);
    events.push({ kind: 'ability', ref: node.ref });
  } else if (node.k === 'passive') {
    if (kin.pass.length < passiveSlots(kin) && !kin.pass.includes(node.ref)) kin.pass.push(node.ref);
    events.push({ kind: 'passive', ref: node.ref });
  } else if (node.k === 'evolve') {
    const before = statsFor(kin), ratio = kin.hp / before.hp;
    kin.sp = node.ref;
    kin.hp = Math.max(1, Math.round(statsFor(kin).hp * ratio));
    events.push({ kind: 'evolve', ref: node.ref });
  } else if (node.k === 'stat') {
    const gained = statsFor(kin).hp;
    kin.hp = Math.min(gained, kin.hp + (node.stat.hp || 0));
    events.push({ kind: 'stat', ref: node.n });
  }
  return { ok: true, events, node };
}

/* Reforging returns every Mote and puts the kin back in its first shape. */
function reforge(kin) {
  const lat = kinLattice(kin);
  const core = lat.nodes.find(n => n.k === 'core');
  let base = SPECIES[kin.sp];
  while (base.from) base = SPECIES[base.from];
  kin.sp = base.id;
  kin.nodes = core ? [core.id] : [];
  kin.moves = [base.innate, 'rend'];
  kin.abil = []; kin.pass = [];
  kin.hp = statsFor(kin).hp;
  return kin;
}

/* ---------------- learned pools & loadout ------------------------------- */
const UNIVERSAL_MOVES = ['rend', 'pulse', 'brace', 'quickstep'];
function loadoutOf(kin) {
  const moves = new Set(UNIVERSAL_MOVES), abil = new Set(), pass = new Set();
  for (const id of kin.nodes) {
    const n = findNode(kin, id); if (!n) continue;
    if (n.k === 'move' || n.k === 'core') moves.add(n.ref);
    else if (n.k === 'ability') abil.add(n.ref);

/* ---------------- experience -------------------------------------------- */

  if (node.k === 'evolve') return typeHue(SPECIES[node.ref].t[0]);

/* ==== 08-battle.js ================================================ */
/* ============================================================================
   BATTLE — turn resolution, damage, statuses, fields, Focus, and the foe's AI.
   ========================================================================== */
function toFighter(kin, sideKey) {
  const sp = SPECIES[kin.sp], st = statsFor(kin);
  const f = {
    kin, sideKey, sp: kin.sp, name: kinName(kin), types: sp.t.slice(), lv: kin.lv,
    maxhp: st.hp, hp: clamp(kin.hp, 0, st.hp), base: st,
    stages: { frc: 0, grd: 0, arc: 0, wrd: 0, swf: 0, acc: 0, eva: 0, crit: 0 },
    status: null, statusTurns: 0, marks: {}, counters: {}, timers: {}, flags: {},
    moves: kin.moves.slice(), abil: kin.abil.slice(), pass: kin.pass.slice(),
    cds: {}, focusMax: 5, focus: 2, justSwitchedIn: true, tookHitThisTurn: false,
  };
  for (const id of f.pass) { const p = PASSIVES[id]; if (p && p.focusMaxBonus) f.focusMax += p.focusMaxBonus; }
  f.focus = Math.min(f.focusMax, 2);
  f.spd = f.base.swf;
  return f;
}
const isDown = f => !f || f.hp <= 0;
const passOf = f => f.pass.map(id => PASSIVES[id]).filter(Boolean);

function newBattle(playerKin, foeKin, opts) {
  const o = opts || {};
  const bt = {
    you: { key: 'you', party: playerKin.map(k => toFighter(k, 'you')), idx: 0, player: true, label: 'Your kin' },
    foe: { key: 'foe', party: foeKin.map(k => toFighter(k, 'foe')), idx: 0, player: false, label: o.foeLabel || 'Wild kin' },
    field: null, fieldTurns: 0, turn: 0, log: [], over: false, result: null,
    wild: o.wild !== false, warden: o.warden || null, canFlee: o.wild !== false, escapes: 0, pending: null,
  };
  bt.you.idx = bt.you.party.findIndex(f => !isDown(f));
  if (bt.you.idx < 0) bt.you.idx = 0;
  bt.say = (s, tone) => { bt.log.push({ s, tone: tone || 'plain' }); if (bt.log.length > 200) bt.log.shift(); };
  return bt;
}
const active = side => side.party[side.idx];
const sideOf = (bt, f) => (f.sideKey === 'you' ? bt.you : bt.foe);
const oppSide = (bt, f) => (f.sideKey === 'you' ? bt.foe : bt.you);
const oppOf = (bt, f) => active(oppSide(bt, f));

/* ---------------- shared effect context --------------------------------- */
function ctxFor(bt, self, foe, extra) {
  const c = {
    bt, self, foe, atk: self, def: foe,
    log: s => bt.say(s),
    healRaw: (t, n) => healFighter(bt, t, n),
    heal: (t, n) => healFighter(bt, t, n),
    dealTo: (t, n) => damageFighter(bt, t, n),
    hurtSelf: n => damageFighter(bt, self, n),
    hurtFoe: n => damageFighter(bt, foe, n),
    stageTo: (t, d) => applyStages(bt, t, d, self),
    stage: (t, d) => applyStages(bt, t, d, self),
    inflictTo: (t, s) => inflict(bt, t, s, self),
    inflict: (t, s) => inflict(bt, t, s, self),
    mark: (t, m, n) => { t.marks[m] = n || (m === 'bleed' ? 3 : 4); bt.say(t.name + ' is ' + STATUSES[m].name + 'ed.', 'bad'); },
    cure: t => { if (t.status) { bt.say(t.name + ' shakes off ' + STATUSES[t.status].name + '.', 'good'); t.status = null; t.statusTurns = 0; } },
    clearStatus: t => { t.status = null; t.statusTurns = 0; },
    give: (t, k, n) => { t.counters[k] = clamp((t.counters[k] || 0) + n, 0, 8); },
    addCounter: (t, k, n) => { t.counters[k] = clamp((t.counters[k] || 0) + n, 0, 8); },
    setField: id => setField(bt, id),
    wipeStages: () => { for (const s of [active(bt.you), active(bt.foe)]) for (const k in s.stages) s.stages[k] = 0; },
  };
  return Object.assign(c, extra || {});
}
function hookMult(bt, f, name, extra) {
  let m = 1;
  for (const p of passOf(f)) if (p[name]) { const v = p[name](ctxFor(bt, f, oppOf(bt, f), extra)); if (typeof v === 'number') m *= v; }
  return m;
}
function hookAny(bt, f, name, extra) {
  for (const p of passOf(f)) if (p[name] && p[name](ctxFor(bt, f, oppOf(bt, f), extra))) return p;
  return null;
}
function hookRun(bt, f, name, extra) {
  for (const p of passOf(f)) if (p[name]) p[name](ctxFor(bt, f, oppOf(bt, f), extra));
}
function hookSum(bt, f, name, extra) {
  let n = 0;
  for (const p of passOf(f)) if (p[name]) { const v = p[name](ctxFor(bt, f, oppOf(bt, f), extra)); if (typeof v === 'number') n += v; }
  return n;
}

/* ---------------- stats in battle --------------------------------------- */
function statOf(bt, f, key, stageOverride) {
  const stage = stageOverride === undefined ? (f.stages[key] || 0) : stageOverride;
  let v = f.base[key] * stageMult(stage);
  if (key === 'frc' && f.status === 'burn') v *= 0.75;
  if (key === 'swf' && f.status === 'chill') v *= 0.6;
  if (key === 'swf' && f.status === 'shock') v *= 0.85;

  return Math.max(1, v);
}
function refreshSpeed(bt) {
  for (const s of [bt.you, bt.foe]) { const f = active(s); if (f) f.spd = statOf(bt, f, 'swf'); }
}

/* ---------------- health, stages, statuses ------------------------------ */
function damageFighter(bt, f, n) {
  if (isDown(f) || n <= 0) return 0;
  const fullBefore = f.hp >= f.maxhp;
  const dealt = Math.min(f.hp, Math.round(n));
  f.hp -= dealt;
  f.tookHitThisTurn = true;
  if (f.hp <= 0) {
    f.hp = 0;
    for (const p of passOf(f)) {
      if (!p.survive) continue;
      if (p.survive(ctxFor(bt, f, oppOf(bt, f), { fullBefore }))) break;
    }
    if (f.hp < 0) f.hp = 0;
  }
  return dealt;
}
function healFighter(bt, f, n) {
  if (isDown(f) || n <= 0) return 0;
  const before = f.hp;
  f.hp = Math.min(f.maxhp, f.hp + Math.round(n));
  const got = f.hp - before;
  if (got > 0) bt.say(f.name + ' mends ' + got + '.', 'good');
  return got;
}
function applyStages(bt, f, deltas, source) {
  if (isDown(f)) return;

    let d = deltas[k];

    if (d < 0 && hookAny(bt, f, 'guardStage', { stat: k, delta: d })) { bt.say(f.name + '’s ' + STAGE_NAME[k] + ' will not drop.', 'good'); continue; }
    const before = f.stages[k] || 0;
    f.stages[k] = clamp(before + d, -6, 6);
    const moved = f.stages[k] - before;
    if (moved === 0) { bt.say(f.name + '’s ' + STAGE_NAME[k] + ' can go no ' + (d > 0 ? 'higher' : 'lower') + '.'); continue; }
    const word = Math.abs(moved) >= 2 ? (moved > 0 ? ' rises sharply.' : ' falls sharply.') : (moved > 0 ? ' rises.' : ' falls.');
    bt.say(f.name + '’s ' + STAGE_NAME[k] + word, moved > 0 ? (f.sideKey === 'you' ? 'good' : 'bad') : (f.sideKey === 'you' ? 'bad' : 'good'));

let _statusDepth = 0;
function inflict(bt, f, statusId, source) {
  if (isDown(f) || !statusId || _statusDepth > 2) return false;
  const def = STATUSES[statusId];
  if (!def) return false;
  if (def.major) {
    if (f.status) return false;
    if (f.timers.wardStatus > 0) { bt.say(f.name + ' is warded against it.', 'good'); return false; }
    if (statusId === 'burn' && f.types.includes('ember')) return false;
    if (statusId === 'chill' && f.types.includes('frost')) return false;
    if (statusId === 'shock' && f.types.includes('storm')) return false;
    if (statusId === 'poison' && f.types.includes('venom')) return false;
    _statusDepth++;
    const blocked = hookAny(bt, f, 'blockStatus', { status: statusId });
    _statusDepth--;
    if (blocked) { bt.say(f.name + ' shrugs it off.', 'good'); return false; }
    f.status = statusId; f.statusTurns = 0;
    if (statusId === 'poison' && source) { const boost = passOf(source).find(p => p.poisonBoost); f.poisonScale = boost ? boost.poisonBoost : 1; }
    bt.say(f.name + ' is ' + def.name.toLowerCase() + 'ed.', f.sideKey === 'you' ? 'bad' : 'good');
    return true;
  }
  if (def.stacks) { f.marks[statusId] = clamp((f.marks[statusId] || 0) + 1, 0, 6); bt.say(f.name + ' takes another ' + def.name + ' (x' + f.marks[statusId] + ').', f.sideKey === 'you' ? 'bad' : 'good'); return true; }
  f.marks[statusId] = statusId === 'bleed' ? 3 : 4;
  bt.say(f.name + ' is ' + def.name.toLowerCase() + 'ed.', f.sideKey === 'you' ? 'bad' : 'good');

}
function setField(bt, id) {

  bt.say(fd.name + ' rises. ' + fd.blurb, 'sys');
}
function fieldMult(bt, moveType) {
  const fd = FIELDS[bt.field];

}

/* ---------------- damage ------------------------------------------------ */
function movePower(bt, atk, def, move) {
  return move.pw ? move.pw(ctxFor(bt, atk, def, { move })) : (move.p || 0);
}
function critChance(bt, atk, def) {

}
function accuracyOf(bt, atk, def, move) {
  if (!move.a) return 1;

  acc *= hookMult(bt, atk, 'accSelf', { move });
  acc *= hookMult(bt, def, 'accMult', { move });

  let aStage = atk.stages[offK] || 0, dStage = def.stages[defK] || 0;
  if (crit) { if (aStage < 0) aStage = 0; if (dStage > 0) dStage = 0; }
  if (move.bypass && dStage > 0) dStage = 0;

  const eff = typeMult(move.t, def.types);

/* ---------------- performing a move ------------------------------------- */
function useMove(bt, atk, def, moveId) {
  const move = MOVES[moveId];
  if (!move) return;
  bt.say(atk.name + ' uses ' + move.n + '.', 'act');
  if (move.cd) atk.cds[moveId] = move.cd + 1;

  if (move.c !== 'stat' && hookAny(bt, def, 'dodge', { move })) { bt.say('It passes straight through ' + def.name + '.', 'weak'); return; }
  if (!chance(accuracyOf(bt, atk, def, move))) { bt.say(atk.name + ' misses.', 'weak'); return; }
  if (atk.timers.sureStrike > 0) atk.timers.sureStrike = 0;

  let total = 0, eff = 1, anyCrit = false;
  if (move.c === 'stat') {
    eff = typeMult(move.t, def.types);
  } else {
    const shots = move.hits ? ri(move.hits[0], move.hits[1]) : 1;
    for (let i = 0; i < shots; i++) {
      if (isDown(def)) break;
      const crit = chance(critChance(bt, atk, def));
      const r = calcDamage(bt, atk, def, move, crit);
      eff = r.eff;
      if (r.eff === 0) { bt.say(effLabel(0).text, 'weak'); return; }
      anyCrit = anyCrit || crit;
      const dealt = damageFighter(bt, def, r.dmg);
      total += dealt;
      (bt.hits || (bt.hits = [])).push({ target: def.sideKey, amount: dealt, crit, eff: r.eff });
    }
    if (shots > 1) bt.say('It lands ' + shots + ' times.', 'plain');
    if (anyCrit) bt.say('A clean strike!', 'crit');
    const lab = effLabel(eff);
    if (lab.text) bt.say(lab.text, lab.tone === 'super' ? 'crit' : 'weak');
  }

  /* riders */
  if (total > 0 || move.c === 'stat') {
    if (move.drain) healFighter(bt, atk, Math.round(total * move.drain));
    if (move.recoil) { const r = Math.round(total * move.recoil); if (r > 0) { damageFighter(bt, atk, r); bt.say(atk.name + ' takes ' + r + ' in backlash.', 'bad'); } }
    if (move.heal) healFighter(bt, atk, Math.round(atk.maxhp * move.heal));
    if (move.self) applyStages(bt, atk, move.self, atk);
    if (move.foe && !isDown(def)) applyStages(bt, def, move.foe, atk);
    if (move.st && chance(move.st[1])) inflict(bt, def, move.st[0], atk);
    if (move.mk && chance(move.mk[1])) inflict(bt, def, move.mk[0], atk);
    if (move.fld) setField(bt, move.fld);

      damageFighter(bt, atk, back);

    }
    if (def.timers.answer > 0) { const back = Math.max(1, Math.round(total * 0.25)); damageFighter(bt, atk, back); bt.say(def.name + ' answers for ' + back + '.', 'good'); }
    if (def.timers.frostcoat > 0 && move.c === 'phys') inflict(bt, atk, 'chill', def);

}

  const ab = ABILITIES[abilId];
  if (!ab) return;
  self.focus -= ab.cost;
  if (ab.cd) self.cds['@' + abilId] = ab.cd + 1;
  bt.say(self.name + ' calls ' + ab.n + '.', 'act');
  ab.use(ctxFor(bt, self, foe, { ability: ab }));
}

/* ---------------- turn ordering & resolution ---------------------------- */
const actionPriority = (bt, f, a) => {
  if (!a) return -99;

  return 0;
};

  if (f.status === 'chill' && chance(0.15)) { bt.say(f.name + ' is frozen stiff.', 'weak'); return false; }
  if (f.status === 'shock' && chance(0.25)) { bt.say(f.name + ' locks up mid-motion.', 'weak'); return false; }
  if (f.status === 'daze' && chance(0.33)) {
    const self = Math.max(1, Math.round(f.maxhp * 0.08));

  if (act.type === 'item') { useItemInBattle(bt, act.id, act.targetIdx); return; }

    if (cur.marks.root) { bt.say(cur.name + ' is rooted and cannot be recalled.', 'weak'); return false; }
    bt.say(cur.name + ' is recalled.', 'sys');

const STRAIN_FROM = 24;
function endOfTurn(bt) {

  if (strain === 1) bt.say('The rift begins to close. It is taking a toll on both sides.', 'sys');
  for (const side of [bt.you, bt.foe]) {
    const f = active(side);
    if (!f || isDown(f)) continue;
    if (strain > 0) {
      const n = Math.max(1, Math.round(f.maxhp * (0.02 + 0.015 * strain)));
      f.hp = Math.max(0, f.hp - n);

    if (f.status === 'burn') {
      let n = Math.round(f.maxhp * (bt.field === 'emberstorm' ? 0.09 : 0.06));
      const wick = oppOf(bt, f) && passOf(oppOf(bt, f)).some(p => p.id === 'wickburn');
      if (wick) n *= 2;
      damageFighter(bt, f, n); bt.say(f.name + ' burns for ' + n + '.', 'bad');
    } else if (f.status === 'poison') {
      f.statusTurns++;
      let rate = Math.min(0.15, 0.05 + 0.02 * (f.statusTurns - 1)) * (f.poisonScale || 1);
      if (f.timers.venomBloom > 0) rate *= 2;
      const n = Math.round(f.maxhp * rate);
      damageFighter(bt, f, n); bt.say(f.name + ' is eaten from within for ' + n + '.', 'bad');
    }
    if (f.marks.root > 0) f.marks.root--;
    if (f.marks.bleed > 0) { const n = Math.round(f.maxhp * 0.07); damageFighter(bt, f, n); bt.say(f.name + ' bleeds for ' + n + '.', 'bad'); f.marks.bleed--; }
    if (f.marks.smolder > 0) { const n = Math.round(f.maxhp * 0.03 * f.marks.smolder); damageFighter(bt, f, n); bt.say(f.name + ' smoulders for ' + n + '.', 'bad'); }
    if (f.timers.seedbank === 1) { healFighter(bt, f, Math.round(f.maxhp * 0.6)); bt.say('The seed bursts open.', 'good'); }
    hookRun(bt, f, 'onTurnEnd');
    /* focus, cooldowns, timers */
    f.focus = Math.min(f.focusMax, f.focus + 1 + hookSum(bt, f, 'focusRegen') + (f.timers.overclock > 0 ? 1 : 0));
    for (const k in f.cds) if (f.cds[k] > 0) f.cds[k]--;
    for (const k in f.timers) if (f.timers[k] > 0) f.timers[k]--;
    f.justSwitchedIn = false;
    f.tookHitThisTurn = false;
  }
  if (bt.field && --bt.fieldTurns <= 0) { bt.say(FIELDS[bt.field].name + ' fades.', 'sys'); bt.field = null; }
  refreshSpeed(bt);
}

function checkFaints(bt) {
  for (const side of [bt.you, bt.foe]) {
    const f = active(side);
    if (f && f.hp <= 0 && !f.down) {
      f.down = true;
      hookRun(bt, f, 'onFaint');
      bt.say(f.name + ' is unbound.', side.player ? 'bad' : 'good');
      const winner = active(oppSide(bt, f));
      if (winner && !isDown(winner)) hookRun(bt, winner, 'onKO');
    }
  }
  for (const side of [bt.you, bt.foe]) {
    if (side.party.every(isDown)) { bt.over = true; bt.result = side.player ? 'lost' : 'won'; return; }
  }
  const foeF = active(bt.foe);
  if (isDown(foeF)) { const nxt = bt.foe.party.findIndex(f => !isDown(f)); if (nxt >= 0) { bt.foe.idx = nxt; active(bt.foe).justSwitchedIn = true; bt.say(active(bt.foe).name + ' takes the field.', 'sys'); hookRun(bt, active(bt.foe), 'onEnter'); } }
  const youF = active(bt.you);
  if (isDown(youF) && !bt.over) bt.pending = 'replace';
}

function resolveTurn(bt, playerAction) {
  if (bt.over) return;
  bt.turn++;
  bt.hits = [];
  refreshSpeed(bt);
  const foeAction = aiChoose(bt);
  const entries = [
    { side: bt.you, act: playerAction, f: active(bt.you) },
    { side: bt.foe, act: foeAction, f: active(bt.foe) },
  ].filter(e => e.act && e.f);
  entries.sort((a, b) => {
    const pa = actionPriority(bt, a.f, a.act), pb = actionPriority(bt, b.f, b.act);
    if (pa !== pb) return pb - pa;
    if (a.f.spd !== b.f.spd) return b.f.spd - a.f.spd;
    return chance(0.5) ? -1 : 1;
  });
  for (const e of entries) {
    if (bt.over) break;
    if (isDown(active(e.side))) continue;
    performAction(bt, e.side, e.act);
    checkFaints(bt);
    if (bt.over || bt.pending) break;
  }
  if (!bt.over && !bt.pending) { endOfTurn(bt); checkFaints(bt); }
  return bt;
}

/* ---------------- the foe's judgement ----------------------------------- */
function estimate(bt, atk, def, move) {
  if (move.c === 'stat') {
    let v = 12;
    if (move.st && !def.status) v += 34 * move.st[1];
    if (move.foe) v += 16 * Object.values(move.foe).reduce((n, x) => n + Math.abs(x), 0);
    if (move.self) v += 13 * Object.values(move.self).reduce((n, x) => n + x, 0);
    if (move.heal) v += (1 - def.hp / def.maxhp) * 5 + (atk.maxhp - atk.hp) / atk.maxhp * 55;
    if (move.fld && bt.field !== move.fld) v += 10;
    return v * (0.85 + rnd() * 0.3);
  }
  const r = calcDamage(bt, atk, def, move, false);
  let v = Math.min(r.dmg, def.hp) / def.maxhp * 100;
  if (r.dmg >= def.hp) v += 60;
  if (move.hits) v *= (move.hits[0] + move.hits[1]) / 2;
  if (move.st && !def.status) v += 18 * move.st[1];
  if (move.drain) v += r.dmg * move.drain / atk.maxhp * 30;
  if (move.recoil) v -= r.dmg * move.recoil / atk.maxhp * 25;
  v *= (move.a ? clamp(move.a / 100, 0.5, 1) : 1.05);
  return v * (0.88 + rnd() * 0.24);
}
function aiChoose(bt) {
  const f = active(bt.foe), foe = active(bt.you);
  if (!f || isDown(f) || !foe) return null;

  /* wardens rotate out of a losing matchup */
  if (bt.warden && f.hp < f.maxhp * 0.32 && !f.marks.root) {
    const bench = bt.foe.party.map((k, i) => ({ k, i })).filter(x => !isDown(x.k) && x.i !== bt.foe.idx);
    if (bench.length && chance(0.45)) {
      const best = bench.map(x => {
        const off = Math.max(...x.k.moves.map(m => MOVES[m] ? typeMult(MOVES[m].t, foe.types) : 1));
        const def = Math.max(...foe.moves.map(m => MOVES[m] ? typeMult(MOVES[m].t, x.k.types) : 1));
        return { i: x.i, score: off - def };
      }).sort((a, b) => b.score - a.score)[0];
      if (best.score > 0.6) return { type: 'switch', idx: best.i };
    }
  }
  /* abilities, when they are worth the Focus */
  const usable = f.abil.filter(id => { const a = ABILITIES[id]; return a && f.focus >= a.cost && !(f.cds['@' + id] > 0); });
  if (usable.length && chance(bt.warden ? 0.42 : 0.22)) {
    const id = pick(usable), a = ABILITIES[id];
    const healy = /mends|heal/i.test(a.d);
    if (!healy || f.hp < f.maxhp * 0.6) return { type: 'ability', id };
  }
  const ready = f.moves.filter(id => MOVES[id] && !(f.cds[id] > 0));
  const pool = ready.length ? ready : ['rend'];
  const scored = pool.map(id => ({ id, v: estimate(bt, f, foe, MOVES[id]) })).sort((a, b) => b.v - a.v);
  const top = bt.warden ? scored[0] : (chance(0.78) ? scored[0] : pick(scored.slice(0, Math.min(3, scored.length))));
  return { type: 'move', id: top.id };
}

/* ---------------- automatic lattice builds ------------------------------ */
/* Wild kin and warden kin light their own lattices, so a level-30 wild is a
   real build and not a bag of base stats. */
function autoBuild(kin, prefer) {
  const lat = kinLattice(kin);
  const side = prefer === 'B' ? 1 : -1;
  for (let guard = 0; guard < 120; guard++) {
    const st = latticeState(kin);
    const options = lat.nodes.filter(n => !st.owned.has(n.id) && canBuy(kin, n.id).ok);
    if (!options.length) break;
    const score = n => {
      let s = (6 - n.r) * 6 + rnd() * 4;
      if (n.k === 'evolve') s += (SPECIES[n.ref].branch === (prefer || 'A')) ? 400 : -900;
      if (Math.sign(n.c) === side || n.c === 0) s += 14;
      return s;
    };
    const best = options.sort((a, b) => score(b) - score(a))[0];
    if (score(best) < -100) break;
    if (!buyNode(kin, best.id).ok) break;
  }
  autoEquip(kin);
  kin.hp = statsFor(kin).hp;
  return kin;
}
function autoEquip(kin) {
  const pool = loadoutOf(kin);
  const rank = id => { const m = MOVES[id]; if (!m) return 0; return (m.c === 'stat' ? 55 : (m.p || 0)) + (m.t !== 'aether' ? 25 : 0); };
  const wanted = pool.moves.slice().sort((a, b) => rank(b) - rank(a)).slice(0, MOVE_SLOTS);
  if (!wanted.includes(SPECIES[kin.sp].innate)) wanted[wanted.length - 1] = SPECIES[kin.sp].innate;
  kin.moves = wanted.length ? wanted : ['rend'];
  kin.abil = pool.abil.slice(0, ABIL_SLOTS);
  kin.pass = pool.pass.slice(0, passiveSlots(kin));
  return kin;
}
function wildKin(speciesId, level) {
  const kin = makeKin(speciesId, level);
  autoBuild(kin, chance(0.5) ? 'A' : 'B');
  return kin;
}
function wardenTeam(id) {
  const w = WARDENS[id];
  return w.team.map(m => { const k = makeKin(m.sp, m.lv, { perfect: false }); k.bonusMotes = 4; autoBuild(k, m.prefer); k.hp = statsFor(k).hp; return k; });
}

/* ---------------- capture ----------------------------------------------- */
function catchOdds(bt, stoneId) {
  const f = active(bt.foe), sp = SPECIES[f.sp], stone = ITEMS[stoneId];
  const hpFactor = (3 * f.maxhp - 2 * f.hp) / (3 * f.maxhp);
  let bonus = 1;
  if (f.status === 'chill' || f.status === 'shock') bonus = 2;
  else if (f.status) bonus = 1.5;
  if (f.marks.root) bonus *= 1.15;
  const a = sp.catch * stone.power * hpFactor * bonus * 3.2;
  return clamp(a / 255, 0.02, 0.96);
}
function useItemInBattle(bt, itemId, targetIdx) {
  const item = ITEMS[itemId];
  if (!item) return;
  const you = bt.you;
  if (item.kind === 'stone') {
    if (!bt.wild) { bt.say('A warden’s kin cannot be bound.', 'weak'); return; }
    const f = active(bt.foe);
    const p = catchOdds(bt, itemId);
    bt.say('You throw a ' + item.n + ' at ' + f.name + '.', 'act');
    const per = Math.pow(p, 1 / 3);
    let shakes = 0;
    while (shakes < 3 && chance(per)) shakes++;
    bt.shakes = shakes;
    if (shakes >= 3) {
      bt.over = true; bt.result = 'caught';
      f.kin.hp = f.hp;
      bt.caught = f.kin;
      bt.say(f.name + ' is bound.', 'crit');
    } else {
      bt.say(['It does not even settle.', 'One turn — and it is out.', 'Two turns. So close.'][shakes], 'weak');
    }
    return;
  }
  const target = you.party[targetIdx === undefined ? you.idx : targetIdx];
  if (!target) return;
  if (item.kind === 'heal') { if (isDown(target)) { bt.say(target.name + ' is past a salve.', 'weak'); return; } healFighter(bt, target, item.amount); }
  else if (item.kind === 'cure') { target.status = null; target.statusTurns = 0; target.marks = {}; bt.say(target.name + ' is cleared.', 'good'); }
  else if (item.kind === 'focus') { target.focus = Math.min(target.focusMax, target.focus + item.amount); bt.say(target.name + ' steadies — Focus ' + target.focus + '.', 'good'); }
  else if (item.kind === 'revive') {
    if (!isDown(target)) { bt.say(target.name + ' is still standing.', 'weak'); return; }
    target.hp = Math.round(target.maxhp * item.frac); target.down = false;
    bt.say(target.name + ' is bound back into the world.', 'good');
  }
}

/* ============================================================================
   GLYPHS — kin are drawn, not stored as images: a silhouette assembled from
   parametric parts, then filled with the same constellation of nodes and
   hairlines the Growth Lattice is drawn with. A kin looks like its lattice.
   ========================================================================== */
function glyphRng(seed) {
  let s = (seed * 2654435761) >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
/* a tapered limb: quad between two points, w1 wide at the base, w2 at the tip */
function limb(p, x1, y1, x2, y2, w1, w2) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  p.moveTo(x1 + nx * w1, y1 + ny * w1);
  p.lineTo(x2 + nx * w2, y2 + ny * w2);
  p.lineTo(x2 - nx * w2, y2 - ny * w2);
  p.lineTo(x1 - nx * w1, y1 - ny * w1);
  p.closePath();
}
const blob = (p, x, y, rx, ry, rot) => { p.moveTo(x + rx, y); p.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); };

/* Each form returns the silhouette plus where the face and crest belong.
   Coordinates are normalised 0..1 and drawn facing right. */
const FORMS = {
  quad(p, r) {
    const bx = 0.44, by = 0.55;
    for (let i = 0; i < 4; i++) {
      const lx = bx - 0.17 + i * 0.115, sh = 0.02 * r();
      limb(p, lx, by + 0.06, lx + (i > 1 ? 0.02 : -0.02), 0.88 + sh, 0.045, 0.028);
    }
    limb(p, bx - 0.22, by - 0.02, 0.10, 0.30 + 0.06 * r(), 0.05, 0.015);
    blob(p, bx, by, 0.25, 0.16);
    limb(p, bx + 0.16, by - 0.06, 0.68, 0.40, 0.10, 0.08);
    blob(p, 0.73, 0.37, 0.135, 0.115);
    return { face: { x: 0.79, y: 0.35 }, crest: { x: 0.72, y: 0.25, a: -0.35 }, top: 0.2 };
  },
  bulk(p, r) {
    for (let i = 0; i < 4; i++) {
      const lx = 0.36 + i * 0.13;
      limb(p, lx, 0.68, lx + (i > 1 ? 0.015 : -0.015), 0.90, 0.062, 0.05);
    }
    blob(p, 0.5, 0.55, 0.31, 0.22);
    blob(p, 0.36, 0.44, 0.16, 0.12, -0.3);
    limb(p, 0.68, 0.5, 0.80, 0.47, 0.13, 0.11);
    blob(p, 0.79, 0.46, 0.14, 0.13);
    return { face: { x: 0.85, y: 0.44 }, crest: { x: 0.76, y: 0.34, a: -0.2 }, top: 0.3 };
  },
  biped(p, r) {
    limb(p, 0.43, 0.62, 0.40, 0.90, 0.055, 0.04);
    limb(p, 0.57, 0.62, 0.60, 0.90, 0.055, 0.04);
    limb(p, 0.36, 0.42, 0.26, 0.62 + 0.05 * r(), 0.05, 0.03);
    limb(p, 0.64, 0.42, 0.74, 0.62 + 0.05 * r(), 0.05, 0.03);
    blob(p, 0.5, 0.48, 0.17, 0.21);
    blob(p, 0.5, 0.23, 0.135, 0.13);
    return { face: { x: 0.5, y: 0.22 }, crest: { x: 0.5, y: 0.11, a: 0 }, top: 0.06 };
  },
  wisp(p, r) {
    for (let i = 0; i < 3; i++) {
      const x = 0.38 + i * 0.12;
      limb(p, x, 0.55, x + (i - 1) * 0.07, 0.80 + 0.09 * r(), 0.045, 0.012);
    }
    blob(p, 0.5, 0.42, 0.19, 0.235);
    blob(p, 0.5, 0.30, 0.135, 0.12);
    return { face: { x: 0.5, y: 0.32 }, crest: { x: 0.5, y: 0.17, a: 0 }, top: 0.14 };
  },
  serpent(p, r) {
    for (let i = 0; i < 7; i++) {
      const t = i / 6;
      const x = 0.14 + t * 0.62, y = 0.62 - Math.sin(t * 3.1) * 0.24;
      blob(p, x, y, 0.10 - t * 0.028, 0.085 - t * 0.02, Math.sin(t * 3) * 0.6);
    }
    blob(p, 0.80, 0.37, 0.115, 0.10, -0.3);
    return { face: { x: 0.85, y: 0.35 }, crest: { x: 0.74, y: 0.26, a: -0.4 }, top: 0.16 };
  },
  winged(p, r) {
    p.moveTo(0.46, 0.46); p.quadraticCurveTo(0.14, 0.16, 0.06, 0.44); p.quadraticCurveTo(0.20, 0.52, 0.46, 0.60); p.closePath();
    p.moveTo(0.54, 0.46); p.quadraticCurveTo(0.86, 0.16, 0.94, 0.44); p.quadraticCurveTo(0.80, 0.52, 0.54, 0.60); p.closePath();
    limb(p, 0.5, 0.62, 0.5, 0.84, 0.05, 0.02);
    blob(p, 0.5, 0.52, 0.115, 0.165);
    blob(p, 0.5, 0.33, 0.105, 0.10);
    return { face: { x: 0.5, y: 0.32 }, crest: { x: 0.5, y: 0.22, a: 0 }, top: 0.14 };
  },
  insect(p, r) {
    p.moveTo(0.47, 0.42); p.quadraticCurveTo(0.10, 0.18, 0.10, 0.52); p.quadraticCurveTo(0.24, 0.66, 0.47, 0.58); p.closePath();
    p.moveTo(0.53, 0.42); p.quadraticCurveTo(0.90, 0.18, 0.90, 0.52); p.quadraticCurveTo(0.76, 0.66, 0.53, 0.58); p.closePath();
    blob(p, 0.5, 0.66, 0.085, 0.13);
    blob(p, 0.5, 0.48, 0.10, 0.13);
    blob(p, 0.5, 0.31, 0.095, 0.09);
    return { face: { x: 0.5, y: 0.30 }, crest: { x: 0.5, y: 0.21, a: 0 }, top: 0.12 };
  },
  blob(p, r) {
    blob(p, 0.5, 0.60, 0.26, 0.24);
    blob(p, 0.36, 0.50, 0.14, 0.13);
    blob(p, 0.64, 0.52, 0.15, 0.14);
    blob(p, 0.5, 0.40, 0.17, 0.14);
    return { face: { x: 0.5, y: 0.46 }, crest: { x: 0.5, y: 0.26, a: 0 }, top: 0.22 };
  },
};

const CRESTS = {
  flame(ctx, s, c, hue) {
    for (let i = 0; i < 3; i++) {
      const off = (i - 1) * 0.055 * s, h = (0.13 - Math.abs(i - 1) * 0.035) * s;
      ctx.beginPath();
      ctx.moveTo(c.x + off - 0.022 * s, c.y);
      ctx.quadraticCurveTo(c.x + off, c.y - h * 1.5, c.x + off + 0.018 * s, c.y - h);
      ctx.quadraticCurveTo(c.x + off + 0.006 * s, c.y - h * 0.3, c.x + off + 0.022 * s, c.y);
      ctx.closePath(); ctx.fillStyle = hue; ctx.fill();
    }
  },
  horn(ctx, s, c, hue) {
    for (const d of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(c.x + d * 0.02 * s, c.y + 0.02 * s);
      ctx.quadraticCurveTo(c.x + d * 0.10 * s, c.y - 0.05 * s, c.x + d * 0.085 * s, c.y - 0.13 * s);
      ctx.lineTo(c.x + d * 0.045 * s, c.y - 0.02 * s);
      ctx.closePath(); ctx.fillStyle = hue; ctx.fill();
    }
  },
  crystal(ctx, s, c, hue) {
    for (let i = 0; i < 3; i++) {
      const d = (i - 1), h = (0.13 - Math.abs(d) * 0.04) * s;
      ctx.beginPath();
      ctx.moveTo(c.x + d * 0.055 * s, c.y + 0.02 * s);
      ctx.lineTo(c.x + d * 0.055 * s - 0.022 * s, c.y - h * 0.4);
      ctx.lineTo(c.x + d * 0.055 * s, c.y - h);
      ctx.lineTo(c.x + d * 0.055 * s + 0.022 * s, c.y - h * 0.4);
      ctx.closePath(); ctx.fillStyle = hue; ctx.fill();
    }
  },
  fin(ctx, s, c, hue) {
    ctx.beginPath();
    ctx.moveTo(c.x - 0.10 * s, c.y + 0.05 * s);
    ctx.quadraticCurveTo(c.x - 0.02 * s, c.y - 0.14 * s, c.x + 0.09 * s, c.y + 0.01 * s);
    ctx.quadraticCurveTo(c.x, c.y + 0.02 * s, c.x - 0.10 * s, c.y + 0.05 * s);
    ctx.closePath(); ctx.fillStyle = hue; ctx.fill();
  },
  antenna(ctx, s, c, hue) {
    ctx.strokeStyle = hue; ctx.lineWidth = Math.max(1, 0.013 * s); ctx.lineCap = 'round';
    for (const d of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(c.x + d * 0.02 * s, c.y + 0.03 * s);
      ctx.quadraticCurveTo(c.x + d * 0.10 * s, c.y - 0.06 * s, c.x + d * 0.07 * s, c.y - 0.15 * s);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(c.x + d * 0.07 * s, c.y - 0.15 * s, 0.022 * s, 0, 7); ctx.fillStyle = hue; ctx.fill();
    }
  },
  plume(ctx, s, c, hue) {
    ctx.strokeStyle = hue; ctx.lineWidth = Math.max(1.2, 0.02 * s); ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const d = i - 1;
      ctx.beginPath();
      ctx.moveTo(c.x + d * 0.035 * s, c.y + 0.03 * s);
      ctx.quadraticCurveTo(c.x + d * 0.11 * s, c.y - 0.06 * s, c.x + d * 0.13 * s, c.y - 0.15 * s);
      ctx.stroke();
    }
  },
  none() {},
};

function mixHex(a, bcol, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(bcol.substr(i, 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

function drawGlyph(canvas, speciesId, opts) {
  const o = opts || {};
  const sp = SPECIES[speciesId];
  if (!sp || !canvas) return;
  const art = sp.art;
  const dpr = Math.min(3, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
  const cssW = canvas.clientWidth || o.size || 160, cssH = canvas.clientHeight || o.size || 160;
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const s = Math.min(cssW, cssH);
  const r = glyphRng(art.seed || 7);
  const path = new Path2D();
  const unit = new Path2D();
  const meta = FORMS[art.form] ? FORMS[art.form](unit, r) : FORMS.quad(unit, r);
  const m = new DOMMatrix();
  const wScale = (art.w || 1);
  m.a = s * wScale; m.d = s; m.e = (cssW - s * wScale) / 2; m.f = (cssH - s) / 2;
  path.addPath(unit, m);
  const px = v => v * s * wScale + (cssW - s * wScale) / 2;
  const py = v => v * s + (cssH - s) / 2;

  /* rim: the same silhouette, a touch larger, behind */
  ctx.save();
  ctx.translate(cssW / 2, cssH / 2); ctx.scale(1.045, 1.045); ctx.translate(-cssW / 2, -cssH / 2);
  ctx.fillStyle = mixHex(art.a, '#FFFFFF', 0.28);
  ctx.globalAlpha = o.silhouette ? 0.25 : 0.5;
  ctx.fill(path, 'nonzero');
  ctx.restore();

  /* body */
  const g = ctx.createLinearGradient(0, py(meta.top), 0, py(0.95));
  g.addColorStop(0, mixHex(art.a, '#FFFFFF', 0.16));
  g.addColorStop(0.55, art.a);
  g.addColorStop(1, mixHex(art.b, '#0B0E18', 0.45));
  ctx.fillStyle = o.silhouette ? '#0B0E18' : g;
  ctx.fill(path, 'nonzero');

  if (!o.silhouette) {
    /* constellation, clipped inside the body */
    ctx.save();
    ctx.clip(path, 'nonzero');
    const stars = [];
    for (let i = 0; i < 220 && stars.length < (o.dense === false ? 9 : 15); i++) {
      const x = px(0.08 + r() * 0.84), y = py(0.10 + r() * 0.82);
      if (ctx.isPointInPath(path, x * dpr, y * dpr)) stars.push({ x, y });
    }
    ctx.strokeStyle = mixHex(art.b, '#FFFFFF', 0.4);
    ctx.globalAlpha = 0.5; ctx.lineWidth = Math.max(0.6, s * 0.004);
    for (let i = 0; i < stars.length; i++) {
      const near = stars.map((q, j) => ({ j, d: Math.hypot(q.x - stars[i].x, q.y - stars[i].y) }))
        .filter(q => q.j !== i).sort((a2, b2) => a2.d - b2.d).slice(0, 2);
      for (const q of near) { ctx.beginPath(); ctx.moveTo(stars[i].x, stars[i].y); ctx.lineTo(stars[q.j].x, stars[q.j].y); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = mixHex(art.b, '#FFFFFF', 0.7);
    for (const st of stars) { ctx.beginPath(); ctx.arc(st.x, st.y, Math.max(0.9, s * 0.008), 0, 7); ctx.fill(); }
    ctx.restore();

    /* crest */
    (CRESTS[art.crest] || CRESTS.none)(ctx, s, { x: px(meta.crest.x), y: py(meta.crest.y) }, mixHex(art.b, '#FFFFFF', 0.2));

    /* eyes */
    const eyes = art.eyes || 2;
    ctx.save();
    ctx.shadowColor = mixHex(art.b, '#FFFFFF', 0.6); ctx.shadowBlur = s * 0.06;
    ctx.fillStyle = '#F6F2E6';
    for (let i = 0; i < eyes; i++) {
      const spread = eyes === 1 ? 0 : (i - (eyes - 1) / 2) * 0.052;
      const ex = px(meta.face.x + (art.form === 'quad' || art.form === 'bulk' || art.form === 'serpent' ? 0 : spread));
      const ey = py(meta.face.y + (art.form === 'quad' || art.form === 'bulk' || art.form === 'serpent' ? spread * 0.8 : 0));
      ctx.beginPath(); ctx.arc(ex, ey, s * 0.019, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* a canvas that redraws itself when the layout changes */
function glyphEl(speciesId, size, opts) {
  const c = el('canvas.glyph' + (opts && opts.flip ? '.flip' : ''), { width: size, height: size, style: { width: size + 'px', height: size + 'px' }, 'aria-hidden': 'true' });
  requestAnimationFrame(() => drawGlyph(c, speciesId, opts));
  c._species = speciesId; c._opts = opts;
  return c;
}

/* ==== 12-ui-lattice.js ============================================ */
/* ============================================================================
   THE GROWTH LATTICE, drawn as a constellation chart.
   ========================================================================== */
const COL_W = 96, ROW_H = 102, PAD_X = 54, PAD_Y = 58, GUTTER = 126;

function latticeView(kin, rerender) {
  const lat = kinLattice(kin), fam = SPECIES[kin.sp].fam;
  const cs = lat.nodes.map(n => n.c);
  const minC = Math.min(...cs), maxC = Math.max(...cs);
  const rows = Math.max(...lat.nodes.map(n => n.r)) + 1;
  const W = (maxC - minC) * COL_W + PAD_X * 2 + GUTTER * 2;
  const H = (rows - 1) * ROW_H + PAD_Y * 2;
  const at = n => ({ x: GUTTER + PAD_X + (n.c - minC) * COL_W, y: PAD_Y + n.r * ROW_H });

  const state = latticeState(kin);
  const stateOf = n => {
    if (state.owned.has(n.id)) return 'owned';
    const c = canBuy(kin, n.id);
    if (c.ok) return 'open';
    if (c.sealed) return 'sealed';
    if (c.poor) return 'short';
    if (c.early) return 'early';
    return 'locked';
  };

  const field = el('div.latticefield', { style: { width: W + 'px', height: H + 'px' } });

  /* connectors */
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  for (const n of lat.nodes) {
    const a = at(n);
    for (const rid of (n.req || [])) {
      const p = lat.nodes.find(x => x.id === rid);
      if (!p) continue;
      const b = at(p);
      const line = document.createElementNS(NS, 'path');
      const midY = (a.y + b.y) / 2;
      line.setAttribute('d', `M${b.x} ${b.y} C ${b.x} ${midY}, ${a.x} ${midY}, ${a.x} ${a.y}`);
      line.setAttribute('fill', 'none');
      const st = stateOf(n), parentOwned = state.owned.has(rid);
      if (st === 'owned') { line.setAttribute('stroke', nodeHue(kin, n)); line.setAttribute('stroke-width', '2'); line.setAttribute('opacity', '.6'); }
      else if (parentOwned && st === 'open') { line.setAttribute('stroke', '#D9A441'); line.setAttribute('stroke-width', '1.6'); line.setAttribute('stroke-dasharray', '4 4'); line.setAttribute('opacity', '.75'); }
      else if (st === 'sealed') { line.setAttribute('stroke', '#2C3450'); line.setAttribute('stroke-width', '1'); line.setAttribute('opacity', '.35'); }
      else { line.setAttribute('stroke', '#2C3450'); line.setAttribute('stroke-width', '1.2'); }
      svg.append(line);
    }
  }
  field.append(svg);

  /* ring labels */
  for (let r = 0; r < rows; r++) {
    const cost = nodeCost(fam, { r }), lv = nodeLevel(fam, { r });
    field.append(el('div.ringlabel', { style: { top: (PAD_Y + r * ROW_H) + 'px', width: (GUTTER - 22) + 'px' } },
      el('b', null, r === 0 ? 'Root' : 'Ring ' + r),
      el('span', null, r === 0 ? 'free' : 'Lv ' + lv + ' · ' + cost + ' motes')));
  }

  /* nodes */
  const sheet = el('div.panel.nodesheet');
  let selected = null;
  const buttons = {};
  for (const n of lat.nodes) {
    const p = at(n);
    const st = stateOf(n);
    const hue = nodeHue(kin, n);
    const extra = n.k === 'evolve' ? '.evo' : (n.r >= (lat.solo ? 4 : 5) ? '.cap' : '');
    const btn = el('button.lnode' + extra, {
      type: 'button', 'data-state': st, title: nodeLabel(n),
      'aria-label': nodeLabel(n) + ' — ' + (st === 'owned' ? 'lit' : st),
      style: { left: p.x + 'px', top: p.y + 'px',
        borderColor: st === 'owned' ? hue : undefined,
        background: st === 'owned' ? 'color-mix(in srgb, ' + hue + ' 24%, var(--ink-2))' : undefined,
        boxShadow: st === 'owned' ? '0 0 14px -2px ' + hue : undefined },
      onclick: () => select(n),
    }, nodeSigil(n.k, st === 'owned' ? hue : 'currentColor'));
    buttons[n.id] = btn;
    field.append(btn);
  }

  function select(n) {
    selected = n;
    for (const id in buttons) buttons[id].setAttribute('aria-current', id === n.id ? 'true' : 'false');
    paintSheet();
  }
  function paintSheet() {
    clearNode(sheet);
    if (!selected) {
      sheet.append(
        el('div.eyebrow', null, lat.title),
        el('p.lede', { style: { margin: '6px 0 0' } }, lat.blurb),
        el('p.muted', { style: { margin: '10px 0 0', fontSize: '13px' } },
          'Pick any node on the chart to read it. Rings open as the kin levels; the two diamonds are evolutions, and taking one closes the other for good.'));
      return;
    }
    const n = selected, st = stateOf(n), c = canBuy(kin, n.id);
    const kindWord = { core: 'Root', move: 'Move', passive: 'Passive', ability: 'Ability', stat: 'Growth', evolve: 'Evolution' }[n.k];
    const cost = nodeCost(fam, n);
    const extras = [];
    if (n.k === 'move' && MOVES[n.ref]) extras.push(el('div.cols', { style: { gap: '7px', alignItems: 'center' } }, typeChip(MOVES[n.ref].t), el('span.mono.muted', { style: { fontSize: '11.5px' } }, moveMeta(MOVES[n.ref]))));
    if (n.k === 'core' && MOVES[n.ref]) extras.push(el('div.cols', { style: { gap: '7px', alignItems: 'center' } }, typeChip(MOVES[n.ref].t), el('span.mono.muted', { style: { fontSize: '11.5px' } }, moveMeta(MOVES[n.ref]))));
    if (n.k === 'ability') extras.push(el('span.mono.muted', { style: { fontSize: '11.5px' } }, 'Costs ' + ABILITIES[n.ref].cost + ' Focus · ' + ABILITIES[n.ref].cd + '-turn cooldown'));
    if (n.k === 'evolve') { const s2 = SPECIES[n.ref]; extras.push(el('div.cols', { style: { gap: '7px', alignItems: 'center' } }, typeChips(s2.t), el('span.mono.muted', { style: { fontSize: '11.5px' } }, 'Stat total ' + bst(s2)))); }

    sheet.append(
      el('div.spread', null,
        el('div.rows', { style: { gap: '3px' } },
          el('div.eyebrow', null, kindWord + (n.r === 0 ? '' : ' · Ring ' + n.r)),
          el('h3', { style: { fontSize: '19px' } }, nodeLabel(n))),
        el('span.costtag', null, st === 'owned' ? 'Lit' : cost + ' ' + plural(cost, 'Mote'))),
      extras,
      el('p', { style: { margin: '2px 0', color: 'var(--vellum-2)' } }, nodeBlurb(n)),
      st === 'owned'
        ? el('p.muted.why', { style: { margin: 0 } }, 'Already part of this kin.')
        : c.ok
          ? el('button.btn.primary', { style: { alignSelf: 'flex-start' }, onclick: () => light(n) }, 'Light it — ' + cost + ' ' + plural(cost, 'Mote'))
          : el('p.why', { style: { margin: 0, color: c.sealed ? 'var(--crit)' : 'var(--vellum-3)' } }, c.why));
  }
  function light(n) {
    if (n.k === 'evolve') {
      const s2 = SPECIES[n.ref];
      const other = lat.nodes.find(x => x.k === 'evolve' && x.id !== n.id);
      modal('Take a new shape?',
        el('div.rows', null,
          el('div.cols', { style: { alignItems: 'center', gap: '16px' } },
            el('div.glyph-wrap', null, glyphEl(n.ref, 108)),
            el('div.rows', { style: { gap: '6px' } }, el('h3', null, s2.n), typeChips(s2.t), el('p.muted', { style: { margin: 0, fontSize: '13px' } }, s2.dex))),
          el('p', { style: { margin: 0 } }, kinName(kin) + ' becomes ' + s2.n + ', gains a third passive slot, and opens the ' + (s2.branch === 'A' ? 'left' : 'right') + ' limb of the lattice.'),
          other ? el('p', { style: { margin: 0, color: 'var(--crit)' } }, 'This closes ' + nodeLabel(other) + ' and everything below it. There is no way back except a full Reforge.') : null),
        [{ label: 'Not yet' }, { label: 'Become ' + s2.n, primary: true, run: () => commit(n) }]);
      return;
    }
    commit(n);
  }
  function commit(n) {
    const res = buyNode(kin, n.id);
    if (!res.ok) { toast(res.why || 'Cannot light that node.', 'bad'); return; }
    for (const ev of res.events) {
      if (ev.kind === 'evolve') toast(kinName(kin) + ' is now ' + SPECIES[ev.ref].n + '.', 'good');
      else if (ev.kind === 'move') toast('Learned ' + MOVES[ev.ref].n + '.', 'good');
      else if (ev.kind === 'ability') toast('Learned ' + ABILITIES[ev.ref].n + '.', 'good');
      else if (ev.kind === 'passive') toast('Gained ' + PASSIVES[ev.ref].n + '.', 'good');
      else if (ev.kind === 'stat') toast(ev.ref + ' takes hold.', 'good');
    }
    saveGame();
    rerender(n.id);
  }

  const box = el('div.latticebox', { style: { maxHeight: 'min(68vh, 600px)' } }, field);
  requestAnimationFrame(() => { box.scrollLeft = Math.max(0, (W - box.clientWidth) / 2); box.scrollTop = 0; });
  /* drag to pan */
  let drag = null;
  box.addEventListener('pointerdown', e => {
    if (e.target.closest('.lnode')) return;
    drag = { x: e.clientX, y: e.clientY, l: box.scrollLeft, t: box.scrollTop };
    box.setPointerCapture(e.pointerId); box.style.cursor = 'grabbing';
  });
  box.addEventListener('pointermove', e => {
    if (!drag) return;
    box.scrollLeft = drag.l - (e.clientX - drag.x);
    box.scrollTop = drag.t - (e.clientY - drag.y);
  });
  const stop = () => { drag = null; box.style.cursor = ''; };
  box.addEventListener('pointerup', stop); box.addEventListener('pointercancel', stop);

  paintSheet();
  return { box, sheet, select, buttons };
}

function loadoutView(kin, rerender) {
  const pool = loadoutOf(kin);
  const wrap = el('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', alignItems: 'start' } });

  const group = (title, note, items, kind, equipped, cap) => {
    const rows = items.map(ref => {
      const on = equipped.includes(ref);
      const info = kind === 'move' ? MOVES[ref] : kind === 'ability' ? ABILITIES[ref] : PASSIVES[ref];
      if (!info) return null;
      return el('div.slotrow' + (on ? '.on' : ''), null,
        el('div.rows', { style: { gap: '2px' } },
          el('div.cols', { style: { gap: '7px', alignItems: 'center' } },
            el('b.slottitle', { style: { fontSize: '13.5px' } }, info.n),
            kind === 'move' ? typeChip(info.t) : null,
            kind === 'ability' ? el('span.mono.muted', { style: { fontSize: '10.5px' } }, info.cost + ' Focus') : null),
          el('span.muted', { style: { fontSize: '12px', lineHeight: 1.4 } }, kind === 'move' ? moveMeta(info) : info.d)),
        el('button.btn.small' + (on ? '' : '.ghost'), {
          onclick: () => {
            if (!equip(kin, kind, ref)) { toast(on ? 'A kin must keep at least one move.' : 'No free slot — take something out first.', 'bad'); return; }
            saveGame(); rerender();
          }
        }, on ? 'Remove' : 'Equip'));
    }).filter(Boolean);
    return el('div.rows', null,
      el('div.spread', null, el('div.eyebrow', null, title), el('span.mono.muted', { style: { fontSize: '11px' } }, equipped.length + '/' + cap)),
      note ? el('p.muted', { style: { margin: '0 0 2px', fontSize: '12.5px' } }, note) : null,
      rows.length ? rows : el('p.muted', { style: { margin: 0, fontSize: '13px' } }, 'Nothing learned yet. Light nodes on the lattice.'));
  };

  wrap.append(
    group('Moves', 'Four slots. Universal moves are always available.', pool.moves, 'move', kin.moves, MOVE_SLOTS),
    group('Abilities', 'Two slots. Using one takes the turn and spends Focus.', pool.abil, 'ability', kin.abil, ABIL_SLOTS),
    group('Passives', 'Always on — but the lattice will always teach more than a kin can wear.', pool.pass, 'passive', kin.pass, passiveSlots(kin)));
  return wrap;
}

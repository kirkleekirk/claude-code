<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Second Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a night-shift dispatch desk. Three working columns (team · map · calls),
   comic-panel framing (hard outlines, offset shadows, halftone) over deep navy. One committed dark look. */
:root {
  --ink: #090d1f; --ink2: #0e1430; --panel: #141c3f; --panel2: #1b2658; --panel3: #243172; --line: #34459a; --line2: #4a5fc4;
  --text: #f1f4ff; --muted: #9aa8dc; --dim: #6d7cb6;
  --amber: #ffc53d; --amber2: #ff9a1f; --cyan: #3de0ff; --magenta: #ff4d8d; --lime: #5ee08a; --red: #ff5252; --violet: #a98bff;
  --c-combat: #ff6b4a; --c-vigor: #5ee08a; --c-mobility: #3de0ff; --c-charisma: #ff8ad8; --c-intellect: #a98bff;
  --out: #04060f;
  --f-disp: 'Bangers', Impact, 'Arial Black', sans-serif;
  --f-ui: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --pad-x: max(12px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.35; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { font-family: var(--f-ui); font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
.muted { color: var(--muted); }
kbd { font-family: var(--f-ui); font-size: 11px; font-weight: 800; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.25); border-radius: 4px; padding: 0 5px; line-height: 16px; }

#app { position: relative; height: 100%; overflow: hidden; background:
  radial-gradient(1200px 600px at 20% -10%, #1c2a6a55, transparent 60%), radial-gradient(900px 500px at 100% 100%, #5a1f6a44, transparent 60%), var(--ink); }
.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: flex; flex-direction: column; }
.ico { display: inline-flex; width: 1em; height: 1em; flex: none; vertical-align: -0.15em; }
.ico svg { width: 100%; height: 100%; display: block; }
.avatar { border-radius: 12px; overflow: hidden; border: 2px solid var(--out); background: var(--panel2); flex: none; box-shadow: 0 0 0 1px var(--line); }
.avatar img, .portrait { display: block; width: 100%; height: 100%; object-fit: cover; }
.pill, em.pill { font-style: normal; font-family: var(--f-ui); font-weight: 800; font-size: 11px; letter-spacing: .06em; padding: 1px 7px; border-radius: 999px; border: 1.5px solid var(--out); background: var(--panel3); color: var(--text); }
.pill.red { background: var(--red); color: #1a0505; } .pill.amber { background: var(--amber); color: #2a1a00; }
.stars { display: inline-flex; gap: 1px; color: var(--amber); }
.empty { display: flex; flex-direction: column; gap: 4px; padding: 18px 14px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 12px; }
.empty b { font-family: var(--f-ui); font-size: 17px; color: var(--text); text-transform: uppercase; }
.bar { height: 8px; border-radius: 99px; background: rgba(0,0,0,.45); overflow: hidden; border: 1px solid var(--out); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), #7df9ff); border-radius: 99px; }
.x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; display: grid; place-items: center; background: rgba(0,0,0,.35); border: 1.5px solid var(--line); border-radius: 8px; color: var(--text); }
.x:hover { background: var(--red); color: #1a0505; }
.badge { font-style: normal; font-family: var(--f-ui); font-weight: 800; font-size: 11px; min-width: 18px; height: 18px; padding: 0 5px; display: inline-grid; place-items: center; border-radius: 99px; background: var(--magenta); color: #fff; border: 1.5px solid var(--out); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-ui); font-weight: 800; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; padding: 9px 18px; border-radius: 10px; border: 2px solid var(--out); background: var(--panel3); color: var(--text); box-shadow: 0 3px 0 var(--out), inset 0 1px 0 rgba(255,255,255,.18); transition: transform .08s, filter .15s; position: relative; }
.btn:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--out); }
.btn:disabled { opacity: .45; filter: grayscale(.4); }
.btn.primary { background: linear-gradient(180deg, #ffd35e, var(--amber2)); color: #2a1700; box-shadow: 0 3px 0 #8a4a00, 0 0 0 2px var(--out), inset 0 1px 0 rgba(255,255,255,.55); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); color: var(--muted); }
.btn.danger { background: #6a1424; border-color: #2a0610; }
.btn.small { font-size: 14px; padding: 5px 11px; border-radius: 8px; }
.btn.big { font-size: 20px; padding: 12px 24px; }
.btn small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: none; opacity: .8; margin-left: 2px; }
.ibtn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; border: 2px solid var(--out); background: var(--panel2); color: var(--muted); box-shadow: 0 2px 0 var(--out); }
.ibtn:hover { color: var(--text); background: var(--panel3); }
.ibtn.small { width: 32px; height: 32px; font-family: var(--f-ui); font-size: 13px; }

/* ---------- modals / toasts ---------- */
#modal-root { position: absolute; inset: 0; z-index: 100; pointer-events: none; }
.modal-back { position: absolute; inset: 0; pointer-events: auto; display: grid; place-items: center; padding: 14px; background: rgba(4,6,18,.72); backdrop-filter: blur(3px); animation: fadeIn .18s ease-out; overflow: auto; }
.modal-back.out { animation: fadeOut .16s ease-in forwards; }
.modal { position: relative; width: min(560px, 100%); max-height: 100%; overflow: auto; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 3px solid var(--out); border-radius: 16px; box-shadow: 0 0 0 2px var(--line), 0 14px 0 -2px rgba(0,0,0,.45), 0 24px 60px rgba(0,0,0,.6); padding: 22px; animation: popIn .22s cubic-bezier(.2,1.2,.4,1); }
.modal.small { width: min(440px, 100%); } .modal.wide { width: min(940px, 100%); }
.modal h2, .modal h3 { margin-bottom: 8px; }
.btnrow { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.confirm p { color: var(--muted); }
#toast-root { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(480px, 92vw); }
.toast { font-family: var(--f-ui); font-weight: 700; font-size: 16px; letter-spacing: .03em; padding: 8px 16px; background: var(--panel3); border: 2px solid var(--out); border-radius: 10px; box-shadow: 0 3px 0 var(--out), 0 10px 24px rgba(0,0,0,.4); animation: toastIn .28s cubic-bezier(.2,1.3,.4,1); text-align: center; }
.toast.new { background: var(--amber); color: #2a1700; } .toast.bad { background: #8a1c2c; }
.toast.out { opacity: 0; transform: translateY(-8px); transition: .3s; }
@keyframes fadeIn { from { opacity: 0; } } @keyframes fadeOut { to { opacity: 0; } }
@keyframes popIn { from { transform: translateY(14px) scale(.94); opacity: 0; } }
@keyframes toastIn { from { transform: translateY(-14px) scale(.9); opacity: 0; } }

/* ---------- scenes ---------- */
.scene { position: fixed; inset: 0; z-index: 150; pointer-events: auto; display: flex; flex-direction: column; justify-content: flex-end; outline: none; animation: fadeIn .25s; }
.scene.out { opacity: 0; transition: opacity .2s; }
.sc-dim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(14,20,60,.7), rgba(4,6,16,.94)); }
.sc-title { position: absolute; top: 7%; left: 0; right: 0; text-align: center; font-family: var(--f-disp); font-size: clamp(22px, 4.4vw, 46px); letter-spacing: .08em; color: var(--amber); text-shadow: 3px 3px 0 var(--out); animation: popIn .5s; }
.sc-stage { position: relative; display: flex; align-items: flex-end; gap: 18px; padding: 0 clamp(12px, 5vw, 80px) clamp(16px, 5vh, 54px); max-width: 1200px; width: 100%; margin: 0 auto; }
.sc-portrait { flex: none; width: clamp(130px, 22vw, 240px); height: clamp(170px, 30vw, 300px); margin-bottom: -4px; filter: drop-shadow(0 0 0 var(--c, #fff)); }
.sc-portrait.pop { animation: scIn .3s cubic-bezier(.2,1.2,.4,1); }
.sc-img { width: 100%; height: 100%; border-radius: 16px 16px 0 0; border: 3px solid var(--out); border-bottom: 0; box-shadow: 0 0 0 2px var(--c, var(--line)); object-fit: cover; }
@keyframes scIn { from { transform: translateX(-30px) scale(.92); opacity: 0; } }
.sc-box { flex: 1; min-height: 128px; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 3px solid var(--out); box-shadow: 0 0 0 2px var(--line), 0 8px 0 rgba(0,0,0,.4); border-radius: 14px; padding: 14px 20px 18px; position: relative; }
.sc-name { font-family: var(--f-ui); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.sc-text { font-size: clamp(16px, 2.2vw, 21px); line-height: 1.4; min-height: 3.6em; }
.sc-hint { position: absolute; right: 16px; bottom: 8px; font-family: var(--f-ui); font-size: 13px; color: var(--muted); letter-spacing: .05em; transition: opacity .2s; animation: blink 1.4s infinite; }
.sc-skip { position: absolute; top: 14px; right: 14px; z-index: 2; }
@keyframes blink { 50% { opacity: .4; } }

/* ---------- title ---------- */
#s-title { background: #0a0e24; }
.t-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.t-ui { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; padding: clamp(16px, 5vh, 56px) 16px 0; gap: 10px; text-align: center; overflow: auto; }
.logo { display: flex; flex-direction: column; line-height: .85; font-family: var(--f-disp); transform: rotate(-3deg); margin-top: 2vh; }
.logo span { display: block; -webkit-text-stroke: 4px var(--out); paint-order: stroke fill; letter-spacing: .03em; }
.logo .l1 { font-size: clamp(54px, 11vw, 132px); color: #fff; text-shadow: 6px 6px 0 var(--magenta), 10px 10px 0 var(--out); }
.logo .l2 { font-size: clamp(78px, 16vw, 190px); color: var(--amber); background: linear-gradient(180deg, #fff6c8, var(--amber) 45%, var(--amber2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(6px 7px 0 var(--out)) drop-shadow(0 0 22px #ffb12a66); margin-top: -.04em; }
.t-tag { font-family: var(--f-ui); font-weight: 800; letter-spacing: .4em; font-size: clamp(12px, 2.1vw, 18px); color: var(--cyan); background: rgba(0,0,0,.45); padding: 4px 14px; border: 2px solid var(--out); border-radius: 99px; margin-top: 8px; }
.t-pitch { color: var(--text); max-width: 460px; font-size: clamp(14px, 1.9vw, 17px); text-shadow: 0 2px 0 var(--out); margin-top: 4px; padding: 4px 14px; border-radius: 12px; background: rgba(6,8,24,.6); }
.t-menu { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; width: min(340px, 90vw); padding: 12px; border-radius: 18px; background: rgba(6,8,24,.7); border: 2px solid var(--out); box-shadow: 0 0 0 1px var(--line), 0 18px 40px rgba(0,0,0,.5); backdrop-filter: blur(4px); }
.t-btn { text-align: left; justify-content: flex-start; flex-direction: column; align-items: flex-start; gap: 0; width: 100%; }
.t-btn b { font-size: 24px; } .t-btn small { font-size: 12px; opacity: .85; }
.t-row { display: flex; gap: 10px; justify-content: center; }
.t-foot { position: absolute; z-index: 2; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; pointer-events: none; }

/* ---------- hub ---------- */
#s-hub { background: transparent; }
.hud { flex: none; display: flex; align-items: center; gap: 14px; padding: 8px var(--pad-x); min-height: 62px; background: linear-gradient(180deg, #0b1130, #0d1440); border-bottom: 3px solid var(--out); box-shadow: 0 1px 0 var(--line), 0 8px 18px rgba(0,0,0,.35); position: relative; z-index: 5; }
.hud-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.shift-badge { flex: none; width: 48px; height: 48px; display: grid; place-items: center; text-align: center; line-height: 1; background: var(--amber); color: #2a1700; border: 3px solid var(--out); border-radius: 10px; box-shadow: 3px 3px 0 var(--out); transform: rotate(-4deg); }
.shift-badge small { display: block; font-family: var(--f-ui); font-size: 9px; font-weight: 800; letter-spacing: .1em; margin-bottom: -6px; margin-top: 4px; } .shift-badge b { font-family: var(--f-disp); font-size: 26px; font-weight: 400; }
.shift-name { display: flex; flex-direction: column; min-width: 0; } .shift-name b { font-family: var(--f-ui); font-size: 19px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .shift-name span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-clock { flex: 1; min-width: 150px; max-width: 360px; margin: 0 auto; text-align: center; }
.clock-t { font-family: var(--f-ui); font-weight: 800; font-size: 28px; letter-spacing: .04em; line-height: 1; font-variant-numeric: tabular-nums; }
.clock-bar { height: 7px; background: rgba(0,0,0,.5); border: 1.5px solid var(--out); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.clock-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--amber)); }
.clock-bar.over i { background: var(--red); }
.clock-n { height: 14px; font-family: var(--f-ui); font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--cyan); text-transform: uppercase; line-height: 14px; }
.clock-n.paused { color: var(--amber); animation: blink 1.2s infinite; } .clock-n.ot { color: var(--red); }
.hud-speed { display: flex; gap: 4px; padding: 3px; background: rgba(0,0,0,.4); border: 2px solid var(--out); border-radius: 12px; }
.spd { width: 38px; height: 34px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); border-radius: 8px; }
.spd:hover { color: var(--text); background: var(--panel2); } .spd.on { background: var(--amber); color: #2a1700; }
.hud-right { display: flex; align-items: center; gap: 8px; }
.hud-funds, .hud-tally, .hud-rival { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-ui); font-weight: 800; font-size: 19px; padding: 5px 12px; background: rgba(0,0,0,.4); border: 2px solid var(--out); border-radius: 10px; font-variant-numeric: tabular-nums; }
.hud-funds { color: var(--amber); } .hud-tally { color: var(--lime); } .hud-rival { color: var(--red); font-size: 14px; }

.hub-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(250px, 300px) minmax(0, 1fr) minmax(330px, 400px); gap: 12px; padding: 12px var(--pad-x) 12px; }
.col-roster, .col-calls { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.col-h { flex: none; display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--muted); padding: 0 2px; letter-spacing: .1em; }
.col-h .count { margin-left: auto; background: var(--magenta); color: #fff; border-radius: 99px; padding: 0 8px; font-size: 13px; } .col-h .count:empty { display: none; }
.roster-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 4px 2px 2px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.hcard { position: relative; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 2px solid var(--out); border-radius: 12px; box-shadow: 0 0 0 1px var(--line), 0 3px 0 var(--out); transition: transform .1s, box-shadow .15s; flex: none; }
.hcard.can:hover, .hcard.st-ready:hover { transform: translateX(3px); box-shadow: 0 0 0 1px var(--amber), 0 3px 0 var(--out); }
.hcard.assigned { background: linear-gradient(180deg, #5a4513, #3a2d0e); box-shadow: 0 0 0 2px var(--amber), 0 3px 0 var(--out); }
.hcard.st-out, .hcard.st-down { opacity: .62; filter: saturate(.55); } .hcard.st-hurt { box-shadow: 0 0 0 1px #b04, 0 3px 0 var(--out); }
.hc-main { min-width: 0; flex: 1; } .hc-top { display: flex; align-items: baseline; gap: 6px; } .hc-top b { font-family: var(--f-ui); font-size: 18px; text-transform: uppercase; letter-spacing: .03em; } .hc-top .lv { font-size: 12px; color: var(--muted); font-family: var(--f-ui); font-weight: 700; } .lvup { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; background: var(--amber); color: #2a1700; font-weight: 800; display: grid; place-items: center; font-size: 14px; border: 1.5px solid var(--out); animation: blink 1.4s infinite; }
.hc-stats { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 1px; }
.ms { display: inline-flex; align-items: center; gap: 2px; font-family: var(--f-ui); font-weight: 700; font-size: 13px; color: var(--muted); opacity: .75; } .ms .ico { color: var(--c); } .ms.rel { opacity: 1; color: var(--text); background: rgba(255,255,255,.09); border-radius: 5px; padding: 0 4px; box-shadow: inset 0 -2px 0 var(--c); }
.hc-st { font-size: 12px; color: var(--muted); margin-top: 1px; } .st-hurt .hc-st { color: #ff8a9a; } .st-down .hc-st { color: var(--red); } .st-out .hc-st { color: var(--cyan); } .st-ready .hc-st { color: var(--lime); }
.hc-tags { display: flex; gap: 4px; margin-top: 3px; color: var(--dim); } .hc-tags .hit { color: var(--amber); filter: drop-shadow(0 0 4px #ffc53d88); }
.hc-badge { position: absolute; top: -7px; right: -4px; font-family: var(--f-ui); font-weight: 800; font-size: 14px; padding: 1px 9px; border-radius: 99px; border: 2px solid var(--out); background: var(--panel3); box-shadow: 0 2px 0 var(--out); display: inline-flex; gap: 4px; align-items: center; }
.hc-badge.in { background: var(--amber); color: #2a1700; font-size: 12px; } .hc-badge.up { background: var(--lime); color: #052a14; } .hc-badge.down { background: var(--red); color: #fff; }

.col-map { position: relative; min-height: 0; display: flex; flex-direction: column; }
.map-wrap { position: relative; flex: 1; min-height: 220px; border-radius: 16px; overflow: hidden; border: 3px solid var(--out); box-shadow: 0 0 0 2px var(--line), 0 10px 0 -3px rgba(0,0,0,.4); background: #0e2132; }
.map-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.routes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; } .routes line { stroke: rgba(255,197,61,.55); stroke-width: 2; stroke-dasharray: 6 6; vector-effect: non-scaling-stroke; animation: dash 1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -12; } }
.hq { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; z-index: 2; }
.hq-dot { width: 26px; height: 26px; background: var(--amber); border: 3px solid var(--out); border-radius: 7px; transform: rotate(45deg); box-shadow: 0 0 0 4px #ffc53d44, 0 0 24px #ffc53d88; }
.hq span { font-family: var(--f-ui); font-weight: 800; font-size: 11px; letter-spacing: .12em; background: rgba(0,0,0,.6); padding: 1px 6px; border-radius: 4px; color: var(--amber); }
.pins { position: absolute; inset: 0; }
.pin { position: absolute; transform: translate(-50%, -50%); width: 44px; height: 44px; padding: 0; background: var(--panel3); border: 3px solid var(--out); border-radius: 50%; display: grid; place-items: center; color: var(--text); box-shadow: 0 3px 0 var(--out), 0 0 0 2px var(--line2); z-index: 3; transition: transform .12s; }
.pin:hover, .pin.sel { transform: translate(-50%, -50%) scale(1.18); z-index: 6; }
.pin.tier-1 { background: #1f6a4a; } .pin.tier-2 { background: #26599a; } .pin.tier-3 { background: #6a3a9a; } .pin.tier-4 { background: #9a3a6a; } .pin.tier-5, .pin.tier-6 { background: #a8321f; }
.pin.cat-fight { box-shadow: 0 3px 0 var(--out), 0 0 0 3px var(--red); }
.pin.sel { box-shadow: 0 3px 0 var(--out), 0 0 0 4px var(--amber), 0 0 24px #ffc53d99; }
.pin.fresh { animation: pinDrop .7s cubic-bezier(.2,1.4,.4,1); } .pin.urgent { animation: pulse .8s infinite; }
.pin.active { opacity: .75; background: #2a3a66; box-shadow: 0 3px 0 var(--out); cursor: default; }
@keyframes pinDrop { from { transform: translate(-50%, -300%) scale(.5); opacity: 0; } } @keyframes pulse { 50% { box-shadow: 0 3px 0 var(--out), 0 0 0 7px #ff525255, 0 0 22px #ff5252aa; } }
.pin-ring, .ring { position: absolute; inset: -9px; width: calc(100% + 18px); height: calc(100% + 18px); transform: rotate(-90deg); pointer-events: none; }
.ring circle { fill: none; stroke-width: 3; } .ring .bg { stroke: rgba(0,0,0,.5); } .ring .fg { stroke: var(--amber); stroke-linecap: round; }
.pin.urgent .ring .fg, .qcard.urgent .ring .fg { stroke: var(--red); } .pin.active .ring .fg { stroke: var(--cyan); }
.pin-ic { font-size: 22px; display: grid; place-items: center; }
.pin-lb { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 8px; white-space: nowrap; font-family: var(--f-ui); font-weight: 700; font-size: 12px; background: rgba(0,0,0,.75); padding: 1px 7px; border-radius: 5px; opacity: 0; pointer-events: none; transition: opacity .12s; }
.pin:hover .pin-lb, .pin.sel .pin-lb, .pin:focus-visible .pin-lb { opacity: 1; }
.token { position: absolute; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; transition: left .25s linear, top .25s linear; }
.token .avatar { width: 34px !important; height: 34px !important; border: 3px solid var(--amber); border-radius: 50%; box-shadow: 0 3px 0 var(--out), 0 0 14px #ffc53d88; }
.token[data-phase=on] .avatar { animation: bob .6s infinite alternate; } .token[data-phase=back] .avatar { border-color: var(--lime); }
.token em { position: absolute; right: -8px; bottom: -6px; font-style: normal; font-family: var(--f-ui); font-weight: 800; font-size: 12px; background: var(--magenta); border: 2px solid var(--out); border-radius: 99px; padding: 0 5px; }
@keyframes bob { to { transform: translateY(-4px); } }
.feed { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; pointer-events: none; z-index: 5; }

.fl.new { border-color: var(--amber); } .fl.missed, .fl.bad, .fl.fail { border-color: var(--red); color: #ffb3b3; } .fl.flawless, .fl.great { border-color: var(--amber); color: #ffe39a; } .fl.success { border-color: var(--lime); } .fl.dispatch, .fl.reply { border-color: var(--cyan); }

.queue { flex: 0 1 auto; max-height: 27%; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 4px 4px 2px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

.qcard:hover { box-shadow: 0 0 0 1px var(--line2), 0 3px 0 var(--out); } .qcard.sel { box-shadow: 0 0 0 2px var(--amber), 0 3px 0 var(--out); background: linear-gradient(180deg, #3a3470, #231f4f); }
.qcard.fresh { animation: slideIn .5s cubic-bezier(.2,1.2,.4,1); } @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }
.qc-ico { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border: 2px solid var(--out); border-radius: 10px; background: #1f6a4a; font-size: 22px; }
.tier-2 .qc-ico { background: #26599a; } .tier-3 .qc-ico { background: #6a3a9a; } .tier-4 .qc-ico { background: #9a3a6a; } .tier-5 .qc-ico, .tier-6 .qc-ico { background: #a8321f; }
.qc-main { min-width: 0; flex: 1; } .qc-t { font-family: var(--f-ui); font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qc-s { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 2px 0 0; flex-wrap: wrap; } .qc-s .stars .ico { width: 11px; height: 11px; }
.rqs { display: flex; gap: 5px; flex-wrap: wrap; } .rq { display: inline-flex; align-items: center; gap: 2px; font-family: var(--f-ui); font-weight: 800; font-size: 14px; padding: 0 5px; border-radius: 5px; background: rgba(0,0,0,.35); border-bottom: 2px solid var(--c); } .rq .ico { color: var(--c); }
.qc-timer { position: relative; flex: none; width: 42px; height: 42px; display: grid; place-items: center; } .qc-timer b { font-family: var(--f-ui); font-size: 13px; font-weight: 800; position: relative; font-variant-numeric: tabular-nums; } .qc-timer .ring { inset: 0; width: 100%; height: 100%; }
.qcard.urgent { animation: pulseBorder .9s infinite; } @keyframes pulseBorder { 50% { box-shadow: 0 0 0 2px var(--red), 0 3px 0 var(--out); } }
.active-list { flex: none; display: flex; flex-direction: column; gap: 6px; } .active-list .sub { font-size: 13px; color: var(--muted); letter-spacing: .12em; }
.acard { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.3); border: 1.5px solid var(--line); } .ac-t { display: flex; flex-direction: column; min-width: 0; } .ac-t b { font-family: var(--f-ui); text-transform: uppercase; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .ac-t span { font-size: 11px; color: var(--muted); } .ac-team { display: flex; gap: 3px; } .ac-team .avatar { border-radius: 50%; } .ac-bar { grid-column: 1 / 2; height: 5px; background: rgba(0,0,0,.5); border-radius: 9px; overflow: hidden; } .ac-bar i { display: block; height: 100%; background: var(--cyan); } .ac-eta { font-size: 12px; color: var(--cyan); text-align: right; font-variant-numeric: tabular-nums; }

.callpanel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border-radius: 16px; border: 3px solid var(--out); box-shadow: 0 0 0 2px var(--line), 0 8px 0 -2px rgba(0,0,0,.4); position: relative; overflow: hidden; background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.3px), linear-gradient(180deg, var(--panel2), var(--panel)); background-size: 9px 9px, auto; }
.cp-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 10px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.cp-foot { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; background: rgba(4,6,20,.55); border-top: 2px solid var(--out); }
.cp-empty { margin: auto; flex: 1; justify-content: center; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; color: var(--muted); padding: 20px 10px 34px; } .cp-empty b { font-family: var(--f-ui); font-size: 22px; color: var(--text); text-transform: uppercase; } .cp-empty .big { color: var(--line2); }
.cp-head { display: flex; gap: 12px; align-items: center; padding-right: 34px; } .cp-ico { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 2px solid var(--out); background: #26599a; font-size: 26px; box-shadow: 0 3px 0 var(--out); }
.cp-head h2 { font-size: 20px; line-height: 1.05; } .cp-sub { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; margin-top: 2px; }
.callpanel > .x { top: 12px; right: 12px; }
.cp-blurb { font-size: 13px; color: #d4dcff; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .cp-exp { display: inline-flex; align-items: center; gap: 3px; color: var(--amber); font-family: var(--f-ui); font-weight: 800; font-size: 14px; } .cp-exp b { font-variant-numeric: tabular-nums; }
.cp-reqs { display: flex; flex-direction: column; gap: 7px; } .rrow { display: grid; grid-template-columns: 20px 74px 1fr 42px; align-items: center; gap: 6px; font-family: var(--f-ui); font-weight: 700; } .rrow .nm { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; } .rrow b { text-align: right; font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; } .rrow.met b { color: var(--lime); }
.bar-seg { display: flex; gap: 3px; height: 14px; } .bar-seg i { flex: 1; max-width: 26px; background: rgba(0,0,0,.45); border: 1.5px solid var(--out); border-radius: 4px; transition: background .2s; } .bar-seg i.on { background: var(--c); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.25); } .bar-seg i.over { background: #fff; opacity: .85; } .bar-seg i.mark { border-right: 3px solid var(--amber); }
.cp-tags, .cp-chem { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; } .cp-tags .lbl { font-size: 12px; font-family: var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-ui); font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.35); border: 1.5px solid var(--line); color: var(--dim); } .tag.lit { color: #2a1700; background: var(--amber); border-color: var(--out); } .tag i { font-style: normal; font-weight: 800; }
.chem-chip { font-family: var(--f-ui); font-size: 13px; padding: 2px 9px; border-radius: 99px; border: 1.5px solid var(--out); cursor: help; } .chem-chip.good { background: #1d6a3e; } .chem-chip.bad { background: #8a1c2c; } .chem-chip b { text-transform: uppercase; letter-spacing: .03em; }
.cp-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 6px; }
.slot { position: relative; display: flex; align-items: center; gap: 8px; padding: 5px 7px; min-height: 50px; text-align: left; border-radius: 12px; border: 2px solid var(--out); background: rgba(0,0,0,.25); } .slot.empty { border: 2px dashed var(--line2); justify-content: center; color: var(--muted); font-family: var(--f-ui); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; } .slot.empty:hover { border-color: var(--amber); color: var(--amber); } .sl-plus { font-size: 26px; line-height: 1; font-weight: 800; }
.slot.full { background: linear-gradient(180deg, #4a3a12, #2c230a); box-shadow: 0 0 0 2px var(--amber); } .sl-n { display: flex; flex-direction: column; min-width: 0; } .sl-n b { font-family: var(--f-ui); font-size: 15px; text-transform: uppercase; } .sl-n span { font-size: 11px; color: var(--muted); } .sl-x { position: absolute; top: 4px; right: 5px; color: var(--muted); }
.gauge { padding: 0; } .g-top { display: flex; align-items: center; gap: 12px; } .g-num { font-family: var(--f-disp); font-size: 36px; line-height: 1; min-width: 86px; color: var(--amber); text-shadow: 3px 3px 0 var(--out); font-variant-numeric: tabular-nums; } .gauge.safe .g-num { color: var(--lime); } .gauge.low .g-num { color: #ff8a8a; }
.g-lbl { display: flex; flex-direction: column; gap: 2px; font-family: var(--f-ui); letter-spacing: .08em; font-size: 14px; color: var(--muted); } .safe-pill { display: inline-flex; align-items: center; gap: 3px; width: fit-content; font-style: normal; font-weight: 800; font-size: 12px; padding: 0 8px; border-radius: 99px; background: var(--lime); color: #052a14; }
.g-bar { position: relative; height: 12px; margin: 4px 0 15px; background: rgba(0,0,0,.55); border: 2px solid var(--out); border-radius: 99px; } .g-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff6a6a, var(--amber) 55%, var(--lime)); transition: width .3s cubic-bezier(.2,1,.3,1); } .gauge.safe .g-bar i { background: linear-gradient(90deg, #8ad86a, var(--lime)); }
.g-bar u { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 3px dashed #fff; text-decoration: none; } .g-bar u span { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px; font-family: var(--f-ui); font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--lime); white-space: nowrap; }
.g-odds { font-size: 12px; color: var(--muted); line-height: 1.25; min-height: 15px; } .g-why { margin-top: 2px; font-size: 12px; } .g-why summary { cursor: pointer; color: var(--cyan); font-family: var(--f-ui); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; } .why { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px dotted var(--line); } .why b.neg { color: #ff8a8a; }
.cp-info { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 0; color: var(--muted); font-family: var(--f-ui); font-weight: 700; font-size: 14px; line-height: 1.25; } .cp-info span { display: inline-flex; gap: 5px; align-items: center; } .cp-info .ico { color: var(--amber); }
.cp-actions { display: flex; gap: 10px; } .cp-actions .btn { flex: 1; flex-direction: column; gap: 0; padding: 5px 10px; font-size: 18px; } .cp-actions .btn .ico { margin-bottom: -2px; }
.coach-slot { position: absolute; left: 14px; bottom: 14px; z-index: 60; max-width: min(400px, calc(100% - 28px)); pointer-events: none; }
.coach { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: linear-gradient(180deg, #3a3470, #231f4f); border: 3px solid var(--out); border-radius: 14px; box-shadow: 0 0 0 2px var(--amber), 0 10px 0 -2px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.5); animation: popIn .3s cubic-bezier(.2,1.2,.4,1); }
.co-pic .portrait { width: 58px; height: 58px; border-radius: 10px; border: 2px solid var(--out); } .coach .btn { white-space: nowrap; flex: none; } .co-b b { font-family: var(--f-ui); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--amber); } .co-b p { font-size: 14px; margin-top: 2px; }
.coach-glow { animation: glow 1s infinite alternate; } @keyframes glow { from { box-shadow: 0 0 0 2px var(--amber), 0 0 6px var(--amber); } to { box-shadow: 0 0 0 4px var(--amber), 0 0 24px var(--amber); } }
.tabs-m { display: none; }

/* picker, results, radio checks */
.picker h3 { font-size: 22px; } .picker-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; max-height: 50vh; overflow: auto; padding: 6px 8px 6px 2px; }
.pick { position: relative; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; background: var(--panel3); border: 2px solid var(--out); border-radius: 12px; } .pick:hover { box-shadow: 0 0 0 2px var(--amber); } .pk-main { flex: 1; display: flex; flex-direction: column; } .pk-main b { font-family: var(--f-ui); font-size: 18px; text-transform: uppercase; } .pk-main > span { font-size: 12px; color: var(--muted); }
.pick .hc-badge { position: static; font-size: 16px; }
.result { text-align: center; } .result h3 { font-size: 22px; } .rs-stamp { display: inline-block; margin: 0 0 12px; transform: rotate(-4deg); font-family: var(--f-disp); font-size: 46px; line-height: 1.1; color: var(--c); background: var(--ink); padding: 0 24px; border: 4px solid var(--c); border-radius: 10px; box-shadow: 0 0 0 3px var(--out), 5px 5px 0 var(--out); letter-spacing: .05em; animation: stamp .5s cubic-bezier(.2,1.6,.4,1) .1s backwards; white-space: nowrap; }
@keyframes stamp { from { transform: rotate(-14deg) scale(2.6); opacity: 0; } }
.rs-text { margin: 8px 0 14px; font-size: 16px; color: #dfe6ff; }
.rs-heroes { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; } .rs-hero { display: flex; flex-direction: column; align-items: center; gap: 3px; } .rs-hero b { font-family: var(--f-ui); text-transform: uppercase; } .rs-hero.inj .avatar { filter: grayscale(.7) sepia(.3); box-shadow: 0 0 0 3px var(--red); }
.rs-pay { display: flex; justify-content: center; gap: 22px; font-family: var(--f-ui); font-size: 22px; } .rs-pay span { display: inline-flex; gap: 6px; align-items: center; } .rs-pay .ico { color: var(--amber); } .rs-lv { margin-top: 8px; color: var(--amber); font-family: var(--f-ui); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; display: flex; gap: 6px; justify-content: center; align-items: center; }
.rs-cmd { display: flex; justify-content: center; gap: 16px; margin-bottom: 10px; color: var(--muted); font-family: var(--f-ui); } .rs-cmd b { color: var(--text); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; } .confetti i { position: absolute; top: 30%; width: 9px; height: 14px; border-radius: 2px; animation: conf 1.9s cubic-bezier(.2,.7,.3,1) forwards; } @keyframes conf { to { transform: translate(var(--dx), 70vh) rotate(var(--r)); opacity: 0; } }
.check { text-align: center; } .ck-h { display: inline-flex; gap: 8px; align-items: center; font-family: var(--f-ui); font-weight: 800; letter-spacing: .14em; color: var(--cyan); margin-bottom: 8px; } .ck-who { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 8px; text-align: left; } .ck-who b { font-family: var(--f-ui); font-size: 22px; text-transform: uppercase; display: block; } .ck-who span { font-size: 13px; color: var(--muted); } .ck-q { font-size: 17px; margin-bottom: 12px; }
.ck-opts { display: flex; flex-direction: column; gap: 8px; } .ck-opt { text-align: left; display: flex; flex-direction: column; padding: 8px 14px; border-radius: 10px; border: 2px solid var(--out); background: var(--panel3); } .ck-opt:hover:not(:disabled) { box-shadow: 0 0 0 2px var(--amber); } .ck-opt b { font-family: var(--f-ui); text-transform: uppercase; letter-spacing: .06em; font-size: 15px; color: var(--amber); } .ck-opt span { font-size: 14px; font-style: italic; }
.ck-opt.like { background: #1d6a3e; box-shadow: 0 0 0 2px var(--lime); } .ck-opt.dis { background: #8a1c2c; } .ck-bar { height: 6px; margin-top: 12px; background: rgba(0,0,0,.5); border-radius: 9px; overflow: hidden; } .ck-bar i { display: block; height: 100%; width: 100%; background: var(--amber); } .ck-res { margin-top: 10px; min-height: 22px; font-family: var(--f-ui); font-weight: 700; letter-spacing: .03em; color: var(--amber); }

/* ---------- hero sheet ---------- */
.sheet-wrap { position: relative; } .sheet h2 { font-size: 34px; line-height: 1; } .sheet h4 { margin: 14px 0 8px; font-size: 15px; color: var(--muted); letter-spacing: .12em; }
.sh-top { display: flex; gap: 18px; align-items: flex-start; } .sh-pic { flex: none; width: 150px; } .sh-img { width: 100%; height: auto; aspect-ratio: 5 / 6; border-radius: 14px; border: 3px solid var(--out); box-shadow: 0 0 0 2px var(--line); }
.sh-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; } .real { font-size: 13px; color: var(--muted); } .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; } .likes { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; } .likes b { color: var(--text); }
.temper { font-family: var(--f-ui); font-weight: 800; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 9px; border-radius: 99px; border: 1.5px solid var(--out); color: #101010; cursor: help; } .t-hype { background: #ffb84d; } .t-calm { background: #7ee8c0; } .t-joke { background: #ff8ad8; } .t-order { background: #9bb5ff; }
.xp { margin-top: 2px; } .xp-t { display: flex; justify-content: space-between; font-family: var(--f-ui); font-size: 14px; letter-spacing: .06em; margin-bottom: 3px; } .xp-t span { color: var(--muted); } .pts { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-ui); font-weight: 800; color: #2a1700; background: var(--amber); width: fit-content; padding: 2px 12px; border-radius: 99px; border: 2px solid var(--out); animation: blink 1.6s infinite; } .quote { font-style: italic; color: #cdd6ff; font-size: 14px; }
.sh-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; } .sh-col { min-width: 0; }
.sh-stat { display: grid; grid-template-columns: 22px 78px 1fr 26px auto auto; align-items: center; gap: 6px; padding: 3px 0; } .sh-stat .nm { font-family: var(--f-ui); font-weight: 700; text-transform: uppercase; font-size: 14px; letter-spacing: .04em; } .sh-stat > b { font-family: var(--f-ui); font-size: 18px; text-align: right; } .sh-stat > b.hurt { color: #ff8a9a; }
.pw { font-family: var(--f-ui); font-size: 10px; font-weight: 800; letter-spacing: .08em; background: var(--magenta); border-radius: 4px; padding: 0 5px; } .plus { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--out); background: var(--amber); color: #2a1700; font-weight: 900; font-size: 18px; line-height: 1; } .plus:disabled { opacity: .25; background: var(--panel3); color: var(--muted); }
.pips { display: flex; gap: 2px; } .pips i { flex: 1; height: 12px; max-width: 18px; border-radius: 3px; background: rgba(0,0,0,.5); border: 1.5px solid var(--out); } .pips i.on { box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3); } .pips i.new { outline: 2px solid var(--amber); outline-offset: 1px; }
.warn { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: #6a1424; border: 1.5px solid var(--out); font-size: 13px; }
.chem-list { display: flex; flex-direction: column; gap: 5px; } .chem { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 8px 3px 4px; border-radius: 8px; border: 1.5px solid var(--out); } .chem.good { background: #123d27; } .chem.bad { background: #471222; } .chem i { margin-left: auto; font-style: normal; font-family: var(--f-ui); font-weight: 800; } .chem .avatar { border-radius: 50%; }
.sh-perks { display: flex; flex-direction: column; gap: 8px; } .perk { padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.28); border: 2px solid var(--out); } .perk.has { background: #2a3a1d; box-shadow: 0 0 0 2px var(--lime); } .perk.can { box-shadow: 0 0 0 2px var(--amber); } .pk-h { display: flex; justify-content: space-between; align-items: baseline; } .pk-h b { font-family: var(--f-ui); text-transform: uppercase; font-size: 16px; letter-spacing: .03em; } .pk-own { font-family: var(--f-ui); font-size: 12px; font-weight: 800; color: var(--lime); letter-spacing: .08em; } .pk-c { font-size: 12px; color: var(--muted); } .pk-d { font-size: 13px; color: #cdd6ff; margin: 2px 0 6px; } .perk .btn { width: 100%; }
.sh-kit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .ab { display: flex; gap: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.28); border: 2px solid var(--out); } .ab.ult { background: linear-gradient(135deg, #4a2c1a, #2a1a10); box-shadow: 0 0 0 2px var(--amber2); } .ab-k { flex: none; font-family: var(--f-ui); font-weight: 800; font-size: 11px; letter-spacing: .08em; writing-mode: vertical-rl; transform: rotate(180deg); color: var(--dim); } .ab.ult .ab-k { color: var(--amber); } .ab-b b { font-family: var(--f-ui); text-transform: uppercase; font-size: 16px; } .ab-b .cd { float: right; font-size: 11px; font-family: var(--f-ui); color: var(--cyan); font-weight: 800; } .ab-d { font-size: 12px; color: var(--muted); } .ab-f { font-size: 12px; font-style: italic; color: #cdd6ff; margin-top: 2px; }
.sh-bio { margin-top: 12px; font-size: 14px; color: var(--muted); }

.switch { flex: none; width: 54px; height: 30px; border-radius: 99px; border: 2px solid var(--out); background: var(--panel); padding: 2px; transition: background .15s; position: relative; } .switch i { display: block; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; } .switch.on { background: #1d6a3e; } .switch.on i { transform: translateX(24px); background: #fff; }
.seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 10px; background: rgba(0,0,0,.4); border: 2px solid var(--out); flex-wrap: wrap; } .seg button { border: 0; background: transparent; font-family: var(--f-ui); font-weight: 800; letter-spacing: .04em; padding: 4px 12px; border-radius: 7px; color: var(--muted); } .seg button.on { background: var(--amber); color: #2a1700; }
.help h2 { margin-bottom: 10px; } .help-tabs { margin-bottom: 12px; } .help-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; } .help-item { padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,.25); border: 1.5px solid var(--line); } .help-item b { font-family: var(--f-ui); font-size: 17px; text-transform: uppercase; color: var(--amber); letter-spacing: .03em; } .help-item p { font-size: 14px; color: #d4dcff; margin-top: 3px; }

/* ---------- combat ---------- */
#s-combat { background: #0a0e24; overflow: hidden; }
.cb-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.cb-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 10px var(--pad-x); pointer-events: none; z-index: 5; } .cb-top > * { pointer-events: auto; }
.cb-left, .cb-right { display: flex; flex-direction: column; gap: 6px; flex: none; min-width: 96px; } .cb-right { align-items: flex-end; flex-direction: row; }
.cb-round { font-family: var(--f-ui); background: rgba(4,8,22,.78); border: 2px solid var(--out); border-radius: 10px; padding: 3px 10px; letter-spacing: .06em; } .cb-round b { font-size: 18px; color: var(--amber); } .cb-round span { color: var(--muted); font-size: 13px; }
.cb-tl { display: flex; gap: 6px; align-items: flex-end; padding: 6px 10px; border-radius: 14px; background: rgba(4,8,22,.78); border: 2px solid var(--out); box-shadow: 0 0 0 1px var(--line); overflow: hidden; max-width: min(760px, 100%); }

.tl-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; } .tl-hp { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 5px; background: rgba(0,0,0,.7); border-radius: 9px; overflow: hidden; } .tl-hp b { display: block; height: 100%; background: var(--lime); } .tli.foe .tl-hp b { background: var(--red); } .tl-fz { position: absolute; top: 0; right: 2px; font-style: normal; font-size: 14px; }
.cb-info { position: absolute; right: 12px; top: 84px; z-index: 6; width: 230px; padding: 10px; background: rgba(4,8,22,.88); border: 2px solid var(--out); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); display: none; pointer-events: none; } .cb-info.show { display: block; animation: fadeIn .12s; }
.ci-head { display: flex; align-items: center; gap: 8px; } .ci-head b { font-family: var(--f-ui); font-size: 19px; text-transform: uppercase; display: block; } .ci-head span { font-size: 12px; color: var(--muted); } .ci-p { width: 52px; height: 52px; border-radius: 10px; border: 2px solid var(--out); } .ci-hp { position: relative; height: 16px; margin: 8px 0 6px; background: rgba(0,0,0,.6); border-radius: 9px; overflow: hidden; border: 1.5px solid var(--out); } .ci-hp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ff6a6a, var(--amber)); } .ci-hp span { position: relative; font-family: var(--f-ui); font-weight: 800; font-size: 12px; display: block; text-align: center; line-height: 14px; }
.ci-stats { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-family: var(--f-ui); } .ci-stats b { color: var(--text); } .ci-ab { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; } .ci-ab b { font-family: var(--f-ui); text-transform: uppercase; color: var(--amber); } .ci-ab span { color: var(--muted); }
.cb-tip { position: absolute; left: 50%; top: 92px; transform: translateX(-50%) translateY(-10px); z-index: 7; display: none; align-items: center; gap: 12px; max-width: min(560px, calc(100% - 24px)); padding: 8px 14px 8px 8px; background: linear-gradient(180deg, #3a3470, #231f4f); border: 3px solid var(--out); border-radius: 14px; box-shadow: 0 0 0 2px var(--amber), 0 14px 30px rgba(0,0,0,.5); pointer-events: none; } .cb-tip.show { display: flex; animation: tipIn .3s cubic-bezier(.2,1.2,.4,1) forwards; } .cb-tip .portrait { width: 40px; height: 40px; border-radius: 8px; flex: none; } .cb-tip p { font-size: 14px; } @keyframes tipIn { to { transform: translateX(-50%) translateY(0); } }
.cb-panel { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(1000px, calc(100% - 20px)); z-index: 7; display: flex; align-items: stretch; gap: 10px; padding: 10px; border-radius: 16px; background: linear-gradient(180deg, rgba(27,38,88,.96), rgba(14,20,48,.97)); border: 3px solid var(--out); box-shadow: 0 0 0 2px var(--line), 0 10px 0 -3px rgba(0,0,0,.45), 0 20px 50px rgba(0,0,0,.6); }
.cb-panel.enemy { justify-content: center; border-color: #3a0a12; box-shadow: 0 0 0 2px #8a1c2c, 0 20px 50px rgba(0,0,0,.6); } .pn-enemy { text-align: center; padding: 18px; } .pn-enemy b { font-family: var(--f-ui); font-size: 24px; text-transform: uppercase; } .pn-eh { font-family: var(--f-disp); font-size: 26px; letter-spacing: .1em; color: var(--red); }
.pn-unit { flex: none; display: flex; gap: 10px; align-items: center; width: 220px; } .pn-id { flex: 1; min-width: 0; } .pn-id b { font-family: var(--f-ui); font-size: 22px; text-transform: uppercase; display: block; line-height: 1; margin-bottom: 4px; }
.pn-hp, .pn-hype { position: relative; height: 15px; background: rgba(0,0,0,.6); border: 1.5px solid var(--out); border-radius: 99px; overflow: hidden; margin-top: 3px; } .pn-hp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2fb86a, var(--lime)); } .pn-hype i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--amber2), var(--amber)); } .pn-hype.full i { animation: blink .6s infinite; background: #fff; } .pn-hp span, .pn-hype span { position: relative; display: block; text-align: center; font-family: var(--f-ui); font-size: 11px; font-weight: 800; line-height: 12px; letter-spacing: .05em; text-shadow: 0 1px 0 #000; }
.pn-abs { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.abtn { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 6px 8px 6px 10px; text-align: left; min-width: 0; border-radius: 12px; border: 2px solid var(--out); background: linear-gradient(180deg, var(--panel3), var(--panel2)); box-shadow: 0 3px 0 var(--out), inset 0 1px 0 rgba(255,255,255,.15); transition: transform .08s, filter .15s; } .abtn:hover:not(:disabled) { filter: brightness(1.18); transform: translateY(-2px); } .abtn:disabled { opacity: .42; filter: grayscale(.5); } .abtn.on { box-shadow: 0 0 0 3px var(--amber), 0 3px 0 var(--out); background: linear-gradient(180deg, #5a4a1a, #3a2f10); }
.abtn b { font-family: var(--f-ui); font-size: 16px; text-transform: uppercase; line-height: 1.05; letter-spacing: .02em; } .abtn small { font-size: 11px; color: var(--muted); line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .abtn kbd { position: absolute; top: 4px; right: 5px; }
.abtn.ult { background: linear-gradient(135deg, #7a3a12, #4a1f2a); border-color: #240808; } .abtn.ult:not(:disabled) { animation: ultPulse 1s infinite; } @keyframes ultPulse { 50% { box-shadow: 0 0 0 3px var(--amber), 0 0 26px #ffc53daa, 0 3px 0 var(--out); } }
.abtn.move .ico { color: var(--cyan); } .abtn .cd { position: absolute; inset: auto 6px 5px auto; font-style: normal; font-family: var(--f-disp); font-size: 20px; color: var(--cyan); text-shadow: 2px 2px 0 var(--out); }
.pn-end { flex: none; display: flex; flex-direction: column; gap: 8px; justify-content: center; } .pn-end .btn { font-size: 16px; } .endturn kbd { color: #2a1700; background: rgba(255,255,255,.4); border-color: rgba(0,0,0,.3); }
.cb-banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); z-index: 9; font-family: var(--f-disp); font-size: clamp(34px, 8vw, 100px); letter-spacing: .04em; color: #fff; -webkit-text-stroke: 3px var(--out); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--out); opacity: 0; pointer-events: none; white-space: nowrap; text-align: center; }
.cb-banner.show { animation: bannerPop 1s cubic-bezier(.2,1.2,.4,1) forwards; } .cb-banner.win { color: var(--amber); font-size: clamp(50px, 12vw, 150px); } .cb-banner.lose { color: #ff7a7a; } .cb-banner.small { font-size: clamp(26px, 5vw, 56px); top: 30%; } .cb-banner.intro { font-size: clamp(30px, 6vw, 76px); color: var(--cyan); }
@keyframes bannerPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5) rotate(-4deg); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(-2deg); } 25% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -58%) scale(1) rotate(-2deg); } }
.cb-turnlabel { position: absolute; left: 50%; top: 82px; transform: translateX(-50%); z-index: 8; font-family: var(--f-disp); font-size: clamp(20px, 3vw, 34px); letter-spacing: .08em; padding: 0 20px; border-radius: 6px; opacity: 0; pointer-events: none; -webkit-text-stroke: 2px var(--out); paint-order: stroke fill; } .cb-turnlabel.show { animation: turnIn .9s ease-out forwards; } .cb-turnlabel.hero { color: var(--amber); } .cb-turnlabel.foe { color: #ff7a7a; } @keyframes turnIn { 0% { opacity: 0; transform: translateX(-50%) translateY(-10px); } 20% { opacity: 1; transform: translateX(-50%); } 80% { opacity: 1; } 100% { opacity: 0; } }
.cb-cutin { position: absolute; inset: 0; z-index: 12; pointer-events: none; opacity: 0; overflow: hidden; } .cb-cutin.show { opacity: 1; background: rgba(0,0,10,.5); animation: fadeIn .12s; }
.ci-band { position: absolute; left: -10%; right: -10%; top: 30%; height: 40%; transform: skewY(-6deg) translateX(-110%); background: linear-gradient(90deg, #05060f 10%, var(--c) 100%); border-top: 5px solid #fff; border-bottom: 5px solid #fff; box-shadow: 0 0 60px var(--c); } .cb-cutin.show .ci-band { animation: bandIn .28s cubic-bezier(.1,.9,.3,1) forwards; }
.ci-who { position: absolute; left: 8%; top: 12%; display: flex; align-items: flex-end; gap: 20px; transform: translateX(-120%); } .cb-cutin.show .ci-who { animation: whoIn .35s .08s cubic-bezier(.2,1.1,.3,1) forwards; }
.ci-img { width: clamp(180px, 28vw, 320px); height: clamp(220px, 34vw, 380px); object-fit: cover; border: 5px solid #fff; border-radius: 16px; transform: rotate(-3deg); box-shadow: 0 0 0 4px var(--out), 8px 8px 0 4px rgba(0,0,0,.5); }
.ci-txt { display: flex; flex-direction: column; padding-bottom: 14%; } .ci-txt small { font-family: var(--f-ui); font-weight: 800; letter-spacing: .3em; font-size: clamp(14px, 2vw, 24px); color: #fff; text-transform: uppercase; } .ci-txt b { font-family: var(--f-disp); font-weight: 400; font-size: clamp(44px, 9vw, 120px); color: #fff; line-height: .95; -webkit-text-stroke: 4px var(--out); paint-order: stroke fill; text-shadow: 7px 7px 0 var(--out); white-space: nowrap; } .ci-txt em { font-style: normal; font-family: var(--f-disp); font-size: clamp(18px, 3vw, 38px); color: var(--amber); -webkit-text-stroke: 2px var(--out); paint-order: stroke fill; letter-spacing: .14em; }
@keyframes bandIn { to { transform: skewY(-6deg) translateX(0); } } @keyframes whoIn { to { transform: translateX(0); } }
.radio-pick { display: flex; flex-direction: column; gap: 10px; } .radio-pick .btn { flex-direction: column; align-items: flex-start; gap: 0; text-align: left; padding: 10px 16px; } .radio-pick .btn small { font-size: 13px; }
.battle-end { text-align: center; } .be-rank { width: 120px; height: 120px; margin: 0 auto 10px; display: grid; place-items: center; font-family: var(--f-disp); font-size: 92px; line-height: 1; color: var(--c); background: var(--ink); border: 6px solid var(--c); border-radius: 50%; box-shadow: 0 0 0 4px var(--out), 0 0 40px var(--c); animation: stamp2 .5s cubic-bezier(.2,1.6,.4,1) .1s backwards; } @keyframes stamp2 { from { transform: scale(2.6) rotate(-20deg); opacity: 0; } }
.be-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; } .be-stats div { display: flex; flex-direction: column; padding: 6px; border-radius: 10px; background: rgba(0,0,0,.3); } .be-stats span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-family: var(--f-ui); } .be-stats b { font-family: var(--f-ui); font-size: 22px; } .be-note { color: var(--muted); }

/* ---------- briefing, report, ending ---------- */
.askname input { width: 100%; font: inherit; font-family: var(--f-ui); font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: .05em; padding: 10px 14px; margin-top: 12px; border-radius: 10px; border: 3px solid var(--out); background: rgba(0,0,0,.4); color: var(--amber); box-shadow: 0 0 0 2px var(--line); } .askname input:focus { outline: none; box-shadow: 0 0 0 3px var(--amber); }
.brief { text-align: center; position: relative; } .brief .btnrow { justify-content: center; } .bf-no { display: inline-grid; place-items: center; width: 84px; height: 84px; background: var(--amber); color: #2a1700; border: 4px solid var(--out); border-radius: 14px; box-shadow: 5px 5px 0 var(--out); transform: rotate(-5deg); margin: 0 auto 8px; line-height: 1; } .bf-no small { font-family: var(--f-ui); font-weight: 800; letter-spacing: .15em; font-size: 12px; margin-bottom: -8px; } .bf-no b { font-family: var(--f-disp); font-size: 54px; font-weight: 400; }
.brief h2 { font-size: 32px; } .bf-tag { color: var(--muted); } .bf-facts { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 10px 0; font-family: var(--f-ui); font-weight: 700; } .bf-facts div { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; background: rgba(0,0,0,.3); border-radius: 99px; } .bf-facts .ico { color: var(--amber); }
.brief h4 { color: var(--muted); letter-spacing: .12em; font-size: 14px; margin: 14px 0 6px; } .bf-goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; text-align: left; max-width: 320px; margin-inline: auto; } .bf-goals li { display: flex; gap: 8px; align-items: center; font-family: var(--f-ui); font-weight: 700; font-size: 17px; } .bf-goals .ico { color: var(--amber); }
.bf-team { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; } .bf-h { display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--f-ui); font-weight: 700; text-transform: uppercase; font-size: 13px; } .bf-warn { margin-top: 10px; color: #ffb3b3; font-size: 14px; }
#s-report { align-items: center; justify-content: center; overflow: auto; padding: 14px; background: radial-gradient(ellipse at 50% 0%, #26308a66, transparent 60%); }
.rp { width: min(900px, 100%); margin: auto; padding: 22px 24px; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 3px solid var(--out); border-radius: 18px; box-shadow: 0 0 0 2px var(--line), 0 14px 0 -3px rgba(0,0,0,.45), 0 30px 80px rgba(0,0,0,.6); animation: popIn .4s cubic-bezier(.2,1.2,.4,1); }
.rp-head small { font-family: var(--f-ui); font-weight: 800; letter-spacing: .25em; color: var(--cyan); } .rp-head h1 { font-size: clamp(28px, 5vw, 44px); margin-bottom: 12px; }
.rp-grid { display: grid; grid-template-columns: 190px 1fr 1fr; gap: 14px 20px; align-items: start; } .rp-grade { grid-row: span 2; text-align: center; padding: 10px; border-radius: 16px; background: rgba(0,0,0,.35); border: 3px solid var(--out); } .rp-grade .gr { font-family: var(--f-disp); font-size: 130px; line-height: 1; text-shadow: 6px 6px 0 var(--out); animation: stamp2 .6s cubic-bezier(.2,1.6,.4,1) .3s backwards; } .rp-grade small { font-family: var(--f-ui); font-weight: 800; letter-spacing: .15em; color: var(--muted); }
.g-S .gr { color: var(--amber); } .g-A .gr { color: var(--lime); } .g-B .gr { color: var(--cyan); } .g-C .gr { color: #ffa94d; } .g-D .gr { color: var(--red); }
.rp-tally { grid-column: span 2; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; } .rp-tally div { text-align: center; padding: 8px 4px; border-radius: 12px; background: rgba(0,0,0,.3); border-bottom: 4px solid var(--line); } .rp-tally b { display: block; font-family: var(--f-disp); font-size: 34px; font-weight: 400; line-height: 1; } .rp-tally span { font-family: var(--f-ui); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tl-flawless { border-color: var(--amber) !important; } .tl-success { border-color: var(--lime) !important; } .tl-scrape { border-color: #ffa94d !important; } .tl-fail, .tl-missed { border-color: var(--red) !important; }
.rp h4 { color: var(--muted); letter-spacing: .12em; font-size: 14px; margin-bottom: 6px; } .ob { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-family: var(--f-ui); font-weight: 700; font-size: 16px; color: var(--dim); } .ob.done { color: var(--text); } .ob .ico { color: var(--dim); } .ob.done .ico { color: var(--amber); filter: drop-shadow(0 0 6px #ffc53d99); } .ob em { margin-left: auto; font-style: normal; font-size: 13px; color: var(--muted); }
.rp-pay div { display: flex; justify-content: space-between; font-family: var(--f-ui); font-weight: 700; font-size: 16px; padding: 2px 0; } .rp-pay span { color: var(--muted); } .rp-pay .tot { border-top: 2px solid var(--line); margin-top: 4px; padding-top: 4px; color: var(--amber); font-size: 19px; } .rp-pay .tot span { color: var(--amber); } .rp-pay .bank { font-size: 14px; }

<script>
/* ===== 00-core.js ===== */
'use strict';
/* =====================================================================
   SECOND SHIFT — a hero dispatch game
   00-core: helpers, RNG, storage, event bus, audio
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  bounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

const SVG_TAGS = new Set(['svg', 'circle', 'line', 'path', 'g', 'rect', 'polygon', 'ellipse']);
/* hyperscript: h('div.card#id', {onclick}, child, child...) */
function h(sel, attrs, ...kids) {
  const m = /^([a-z0-9]+)?((?:[.#][\w-]+)*)$/i.exec(sel) || [];
  const tag = m[1] || 'div';
  const el = SVG_TAGS.has(tag) ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag);
  (m[2] || '').replace(/([.#])([\w-]+)/g, (_, t, n) => { if (t === '.') el.classList.add(n); else el.id = n; });
  if (attrs != null && attrs !== false && (typeof attrs !== 'object' || attrs.nodeType || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'class') v.split(' ').filter(Boolean).forEach(c => el.classList.add(c));
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = k => {
    if (k == null || k === false) return;
    if (Array.isArray(k)) k.forEach(add);
    else el.appendChild(k.nodeType ? k : document.createTextNode(String(k)));
  };
  kids.forEach(add);
  return el;
}
const svgIcon = (html, cls = '') => { const s = document.createElement('span'); s.className = 'ico ' + cls; s.innerHTML = html; return s; };

/* seeded RNG (mulberry32) + global convenience */
function makeRng(seed) {
  let a = seed >>> 0;
  const r = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.chance = p => r() < p;
  r.shuffle = arr => { const o = arr.slice(); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; };
  return r;
}
const R = makeRng((Date.now() ^ 0x9e3779b9) >>> 0);   // gameplay rng
const hashStr = s => { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; };

const fmtMoney = n => '$' + Math.round(n).toLocaleString('en-US');
const fmtClock = m => {   // game minutes since 09:00 -> "9:05 AM"
  const t = 9 * 60 + Math.floor(m); let hh = Math.floor(t / 60), mm = t % 60;
  const ap = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12 || 12;
  return hh + ':' + String(mm).padStart(2, '0') + ' ' + ap;

const fmtDur = m => { m = Math.max(0, Math.ceil(m)); return m >= 60 ? Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm' : m + 'm'; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, a, b) => n === 1 ? a : (b || a + 's');

/* tiny event bus */
const Bus = (() => {
  const m = {};
  return {
    on(e, f) { (m[e] = m[e] || []).push(f); return () => Bus.off(e, f); },
    off(e, f) { m[e] = (m[e] || []).filter(x => x !== f); },
    emit(e, ...a) { (m[e] || []).slice().forEach(f => { try { f(...a); } catch (err) { console.error('[bus]', e, err); } }); },
  };
})();

/* safe storage */
const Store = {
  get(k, d) { try { const v = localStorage.getItem('secondshift.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('secondshift.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('secondshift.' + k); } catch (e) { /* ignore */ } },
};

/* settings */
const Settings = Object.assign({
  music: true, sfx: true, relaxed: false, autopause: false, shake: true, combatSpeed: 1,
}, Store.get('settings', {}));
Settings.save = () => Store.set('settings', { music: Settings.music, sfx: Settings.sfx, relaxed: Settings.relaxed, autopause: Settings.autopause, shake: Settings.shake, combatSpeed: Settings.combatSpeed });
const prefersReducedMotion = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

/* =====================================================================
   AUDIO — everything is synthesized with WebAudio (no assets)
   ===================================================================== */
const Snd = (() => {
  let ac = null, master, sfxBus, musBus, noiseBuf;
  let timer = null, curTrack = null, nextT = 0, stepN = 0, barN = 0, trackName = null;

  function ensure() {
    if (ac) return ac;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master = ac.createGain(); master.gain.value = 0.9;
      master.connect(comp); comp.connect(ac.destination);
      sfxBus = ac.createGain(); sfxBus.gain.value = Settings.sfx ? 0.5 : 0; sfxBus.connect(master);
      musBus = ac.createGain(); musBus.gain.value = Settings.music ? 0.2 : 0; musBus.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
    return ac;
  }
  function unlock() {
    const a = ensure(); if (!a) return;
    const go = () => { if (Settings.music && trackName && !timer) startTrack(trackName); };
    if (a.state === 'suspended') a.resume().then(go).catch(() => { }); else go();
  }

  function osc(type, f0, f1, dur, vol, t0, dest, lp) {
    if (!ac) return;
    t0 = t0 == null ? ac.currentTime : t0;
    const o = ac.createOscillator(), g = ac.createGain();

    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + Math.min(0.012, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let last = o;
    if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); last = f; }
    last.connect(g); g.connect(dest || sfxBus);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, t0, dest, kind, f0, f1) {
    if (!ac) return;
    t0 = t0 == null ? ac.currentTime : t0;
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = kind || 'lowpass'; f.frequency.setValueAtTime(f0 || 2000, t0);
    if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfxBus); s.start(t0, Math.random()); s.stop(t0 + dur + 0.05);
  }

    crit() { const t = ac.currentTime; noise(0.14, 0.35, t, null, 'lowpass', 4000, 300); osc('sine', 200, 45, 0.22, 0.5, t); osc('square', 1400, 900, 0.12, 0.1, t); },
    slam() { const t = ac.currentTime; noise(0.2, 0.4, t, null, 'lowpass', 1800, 120); osc('sine', 110, 35, 0.3, 0.55, t); },
    boom() { const t = ac.currentTime; noise(0.7, 0.55, t, null, 'lowpass', 2400, 90); osc('sine', 90, 28, 0.6, 0.6, t); },
    zap() { const t = ac.currentTime; osc('sawtooth', 1800, 160, 0.2, 0.12, t, null, 5000); noise(0.2, 0.18, t, null, 'highpass', 3000); },
    whoosh() { noise(0.28, 0.2, null, null, 'bandpass', 400, 2400); },
    shoot() { osc('square', 900, 220, 0.12, 0.1); },
    fire() { noise(0.4, 0.22, null, null, 'bandpass', 700, 300); },
    ice() { const t = ac.currentTime; arp([mtof(96), mtof(100), mtof(103), mtof(108)], 'sine', 0.035, 0.2, 0.1, t); },

  /* --- music: two tiny step-sequenced tracks --- */
  const TRACKS = {
    hub: {
      bpm: 94, swing: 0.1, prog: [
        { r: 38, c: [53, 57, 60, 64] }, { r: 31, c: [53, 59, 62, 67] }, { r: 36, c: [52, 55, 59, 64] }, { r: 33, c: [52, 55, 60, 64] }],
      bassSteps: [0, 3, 6, 8, 11, 14], chordSteps: [2, 5, 10, 13], kick: [0, 7, 10], snare: [4, 12], hat: [2, 6, 10, 14], hatQuiet: [0, 4, 8, 12],

  function scheduleStep(tr, st, bar, t, spb) {
    const ch = tr.prog[bar % tr.prog.length];
    const sw = (st % 2 === 1) ? tr.swing * spb : 0; t += sw;

      const fifth = (st === 6 || st === 11) ? 7 : (st === 3 || st === 14 ? 12 : 0);
      osc('triangle', mtof(ch.r + fifth), mtof(ch.r + fifth), spb * 1.7, 0.42, t, musBus, 900);

    if (tr.arp) { const n = ch.c[st % ch.c.length] + (st % 8 < 4 ? 12 : 24); osc('square', mtof(n), mtof(n), spb * 0.9, 0.05 + (st % 4 === 0 ? 0.03 : 0), t, musBus, 2600); }
  }
  function tick() {
    if (!ac || !curTrack) return;
    const tr = TRACKS[curTrack], spb = 60 / tr.bpm / 4;
    if (nextT < ac.currentTime - 0.5) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.25) {
      scheduleStep(tr, stepN, barN, nextT, spb);
      nextT += spb; stepN++; if (stepN >= 16) { stepN = 0; barN++; }
    }
  }
  function startTrack(name) {
    trackName = name;
    if (!ensure() || !Settings.music) return;
    if (ac.state === 'suspended') return;           // wait for a user gesture
    if (curTrack === name && timer) return;
    curTrack = name; stepN = 0; barN = 0; nextT = ac.currentTime + 0.1;
    if (!timer) timer = setInterval(tick, 60);
  }
  function stopTrack() { curTrack = null; if (timer) { clearInterval(timer); timer = null; } }

  document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend().catch(() => { }); else ac.resume().catch(() => { }); });

  return {
    unlock, ensure,
    play(name, ...a) { if (!Settings.sfx) return; if (!ensure() || ac.state !== 'running') return; try { S[name] && S[name](...a); } catch (e) { /* audio never breaks the game */ } },
    music(name) { trackName = name; if (!name) { stopTrack(); return; } if (Settings.music) { if (curTrack !== name) { stopTrack(); } startTrack(name); } },
    apply() { if (!ac) return; sfxBus.gain.value = Settings.sfx ? 0.5 : 0; musBus.gain.value = Settings.music ? 0.2 : 0; if (Settings.music && trackName) startTrack(trackName); if (!Settings.music) stopTrack(); },
  };
})();

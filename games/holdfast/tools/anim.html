<!doctype html>
<html><head><meta charset="utf-8"><title>Animation lab</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#9ab0c4}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// Filmstrips of the procedural animations: N copies of one character, each
// frozen at a successive moment, laid out in a row over a grid floor.
//   __strip({ model, st, n, span, phases | attacks | times, view, spacing, zombie })
import * as THREE from 'three';
import { loadCharacterModels, Character, randomPalette, makeWeaponMeshes } from '../src/characters.js';
import { mulberry32 } from '../src/util.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9ab0c4);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xdfe8f0, 0x6a5a48, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.0); sun.position.set(4, 8, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 6, bottom: -6 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 20), new THREE.MeshStandardMaterial({ color: 0x7d8a64 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(60, 120, 0x3a4030, 0x55604a); grid.position.y = 0.002; scene.add(grid);
await loadCharacterModels({ man: { url: '../assets/models/man.glb', height: 1.78 }, woman: { url: '../assets/models/woman.glb', height: 1.68 } });
let actors = [];
const rng = mulberry32(3);
window.__strip = (o) => {
  for (const a of actors) { scene.remove(a.c.root); if (a.w) scene.remove(a.w.group); }
  actors = [];
  const n = o.n || 8, sp = o.spacing || 1.0;
  for (let i = 0; i < n; i++) {
    const zr = mulberry32((o.seed || 7) * 31 + i * 7);
    const zlook = o.zombie ? { seed: zr() * 40, decay: zr(), blood: 0.3 + zr() * 0.7, tear: 0.35 + zr() * 0.65, build: [1, 1.15, 0.87, 1][i % 4], ...(o.zlook || {}) } : null;
    const c = new Character(o.models ? o.models[i % o.models.length] : (o.model || 'man'), randomPalette(mulberry32((o.seed || 7) + i * 13), !!o.zombie), { zombie: zlook });
    if (o.zv) Object.assign(c.zv, o.zv);
    const st = { ...o.st };
    // settle blends at this state
    c.ph = 0;
    for (let k = 0; k < 90; k++) c.animate(1 / 60, { ...st, attack: null });
    const f = i / n;
    if (o.phases) c.ph = o.phases[i] != null ? o.phases[i] : f;
    else c.ph = (o.phase0 || 0) + f * (o.span || 1);
    if (o.attacks) st.attack = o.attacks[i] != null ? o.attacks[i] : f;
    if (o.deadT) { /* dead blend: settle */ }
    if (o.landV) { c.wasAir = true; for (let k = 0; k < (o.landFrames ? o.landFrames[i] : 2); k++) c.animate(1 / 60, { ...st, air: k === 0 ? false : false, landV: k === 0 ? o.landV : 0 }); }
    c.animate(0, st);
    c.root.position.set((i - (n - 1) / 2) * sp, 0, 0);
    const faceBy = { side: Math.PI / 2, front: 0, back: Math.PI, three: Math.PI / 4, threeBack: Math.PI * 0.75 };
    c.root.rotation.y = o.facing != null ? o.facing : (faceBy[o.view || 'side'] || 0);
    if (o.fall) { const k = o.fall[i]; c.root.rotation.x = -Math.sin(k * Math.PI / 2) * Math.PI / 2 * 0.98; c.root.position.y = 0.12 * k; }
    scene.add(c.root);
    let w = null;
    if (st.weapon) {
      w = makeWeaponMeshes(); scene.add(w.group);
      c.root.updateMatrixWorld(true);
      w.group.position.copy(c.grip.pos).applyMatrix4(c.root.matrixWorld);
      w.group.quaternion.copy(c.root.quaternion).multiply(c.grip.quat);
      w.bat.visible = st.weapon === 'bat'; w.gun.visible = st.weapon === 'gun';
    }
    actors.push({ c, w });
  }
  const W = n * sp;
  const d = Math.max(4.5, W * 1.25) * (o.zoom || 1);
  cam.position.set(0, o.camY != null ? o.camY : 1.0, d);
  cam.lookAt(0, o.lookY != null ? o.lookY : 0.9, 0);
  r.render(scene, cam);
  return actors.map((a) => a.c.bones.hips.position.y.toFixed(3));
};
window.__ready = true;
</script></body></html>

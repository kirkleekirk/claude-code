<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floop the Pig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* =====================================================================
   FLOOP THE PIG - Card Wars on a 3D mat
   Chrome borrowed from the original Clash Royale menu: deep blue panels,
   gold bevelled buttons, thick ink outlines. Board palette is Card Wars.
   ===================================================================== */
:root{
  /* clash-royale chrome */
  --sky-1:#4FA3E3; --sky-2:#2D6FD6; --sky-3:#1B4F9C;
  --panel:#1E3F7A; --panel-2:#17325F; --panel-3:#0F2247;
  --gold:#F5C542; --gold-2:#E09A1E; --gold-3:#A96C0A;
  --wood:#8B5A2B; --wood-2:#6B4220; --stone:#7D93B5;
  /* card wars mat */
  --mat:#1E4034; --mat-2:#183429; --mat-3:#0E211B; --mat-4:#091612;
  --ink:#10100E; --cream:#F7EFDC; --cream-2:#E7DBC0; --cream-3:#CBBB9B;
  --candy:#E8547C; --sky-ink:#6EC6E8; --spell:#A184DB; --good:#7CD98C;
  --moss:#93AA9D; --moss-dim:#6C8579;
  /* biomes */
  --b-corn:#E9C55C; --b-blue:#8ECDE8; --b-nice:#F2A8C4;
  --b-sandy:#E5C89A; --b-swamp:#93A97C; --b-rain:#C9A8E8;
  --stroke:3px; --tilt:44deg;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden;
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 46%,var(--sky-3) 100%);
  color:var(--cream); font-family:Nunito,"Segoe UI",system-ui,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.hidden{display:none !important}

/* ---------------------------------------------------------------- shell */
#app{position:relative; width:100%; height:100dvh; overflow:hidden}
.screen{position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden}
.screen.off{display:none}

/* ------------------------------------------------- clash-royale buttons */
.cbtn{
  position:relative; border:var(--stroke) solid var(--ink); border-radius:12px;
  background:linear-gradient(180deg,#FFD866 0%,var(--gold) 42%,var(--gold-2) 100%);
  color:#4A2F04; font-family:"Lilita One",Impact,fantasy; font-weight:400;
  letter-spacing:.6px; padding:9px 20px; font-size:17px; line-height:1.2;
  box-shadow:0 5px 0 var(--gold-3), 0 8px 10px rgba(0,0,0,.35);
  transition:transform .07s, box-shadow .07s; text-shadow:0 1.5px 0 rgba(255,255,255,.45);
}
.cbtn::after{
  content:""; position:absolute; left:6px; right:6px; top:4px; height:32%;
  border-radius:8px; background:linear-gradient(180deg,rgba(255,255,255,.55),transparent);
  pointer-events:none;
}
.cbtn:hover{transform:translateY(2px); box-shadow:0 3px 0 var(--gold-3), 0 5px 8px rgba(0,0,0,.35)}
.cbtn:active{transform:translateY(5px); box-shadow:0 0 0 var(--gold-3)}
.cbtn:disabled{filter:grayscale(.7) brightness(.8); cursor:not-allowed; transform:none}
.cbtn.blue{
  background:linear-gradient(180deg,#5FA8F0 0%,#2D6FD6 45%,#1B4F9C 100%);
  color:#EAF4FF; box-shadow:0 5px 0 #123A76, 0 8px 10px rgba(0,0,0,.35);
  text-shadow:0 1.5px 0 rgba(0,0,0,.3);
}
.cbtn.blue:hover{box-shadow:0 3px 0 #123A76, 0 5px 8px rgba(0,0,0,.35)}
.cbtn.red{
  background:linear-gradient(180deg,#F5798F 0%,#D8365C 45%,#9E1E3C 100%);
  color:#FFF0F4; box-shadow:0 5px 0 #6E1029, 0 8px 10px rgba(0,0,0,.35);
  text-shadow:0 1.5px 0 rgba(0,0,0,.3);
}
.cbtn.sm{padding:6px 13px; font-size:13px; border-radius:10px; box-shadow:0 4px 0 var(--gold-3)}
.cbtn.blue.sm{box-shadow:0 4px 0 #123A76}
.cbtn.huge{font-size:31px; padding:15px 54px; border-radius:16px; letter-spacing:1.4px}

.panel{
  border:var(--stroke) solid var(--ink); border-radius:14px;
  background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14), 0 5px 0 rgba(0,0,0,.34);
}
.panel.dark{background:linear-gradient(180deg,var(--panel-2) 0%,var(--panel-3) 100%)}

/* ==================================================================== MENU */
#menu{
  background:
    radial-gradient(60% 40% at 18% 8%, rgba(255,255,255,.22), transparent 60%),
    radial-gradient(48% 34% at 84% 16%, rgba(255,255,255,.17), transparent 60%),
    linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 52%,var(--sky-3) 100%);
}
.topbar{
  display:flex; align-items:center; gap:10px; padding:8px 12px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel-3));
  border-bottom:var(--stroke) solid var(--ink); flex:none;
}
.plate{
  display:flex; align-items:center; gap:9px; padding:5px 12px 5px 6px;
  border:2.5px solid var(--ink); border-radius:999px;
  background:linear-gradient(180deg,#2A56A8,#17325F); min-width:0;
}
.lvl{
  width:36px; height:36px; flex:none; display:grid; place-items:center;
  border:2.5px solid var(--ink); border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #FFE9A0, var(--gold) 55%, var(--gold-2));
  font-family:"Lilita One",Impact,fantasy; font-size:17px; color:#4A2F04;
}
.pinfo{min-width:0}
.pinfo .nm{display:block; font-family:"Lilita One",Impact,fantasy; font-size:15px; letter-spacing:.4px; line-height:1.1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px}
.xpwrap{display:block; width:110px; height:9px; border:2px solid var(--ink); border-radius:999px; background:#0D1F3E; overflow:hidden; margin-top:2px}
.xpwrap i{display:block; height:100%; background:linear-gradient(90deg,#7CD98C,#3FA85A)}
.purse{margin-left:auto; display:flex; gap:7px}
.coin{
  display:flex; align-items:center; gap:5px; padding:4px 11px;
  border:2.5px solid var(--ink); border-radius:999px;
  background:linear-gradient(180deg,#2A56A8,#17325F);
  font-family:"JetBrains Mono",monospace; font-size:13px; font-variant-numeric:tabular-nums;
}
.coin b{font-weight:700}
.coin.gold b{color:var(--gold)} .coin.gem b{color:#8FE3B0}

.menubody{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:11px; padding:12px; overflow-y:auto}

.arenacard{
  width:min(520px,100%); padding:14px 18px; text-align:center; position:relative;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.arenacard .ico{font-size:52px; line-height:1; filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.arenacard .anm{font-family:"Lilita One",Impact,fantasy; font-size:26px; letter-spacing:.6px;
  color:var(--gold); text-shadow:0 2.5px 0 var(--ink); line-height:1.1}
.arenacard .asub{font-size:12px; color:#BBD3F2; font-weight:700; letter-spacing:.06em}
.trophybar{display:flex; align-items:center; gap:8px; margin-top:2px}
.trophybar .tro{display:flex; align-items:center; gap:5px; font-family:"Lilita One",Impact,fantasy;
  font-size:20px; color:var(--gold); text-shadow:0 2px 0 var(--ink)}
.progwrap{width:190px; height:13px; border:2.5px solid var(--ink); border-radius:999px; background:#0D1F3E; overflow:hidden}
.progwrap i{display:block; height:100%; background:linear-gradient(90deg,#FFD866,var(--gold-2))}

.chestrow{display:flex; gap:9px; width:min(520px,100%); justify-content:center}
.chest{
  flex:1; max-width:110px; aspect-ratio:1/1.05; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px; padding:6px;
  border:2.5px solid var(--ink); border-radius:12px;
  background:linear-gradient(180deg,#24478A,#122A55); position:relative;
}
.chest.full{background:linear-gradient(180deg,#3C6FBE,#1C4386); cursor:pointer}
.chest.full:hover{filter:brightness(1.13)}
.chest .cico{font-size:30px; line-height:1}
.chest .clab{font-size:9.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#A8C4E8}
.chest.full .clab{color:var(--gold)}
.chest .cempty{font-size:9.5px; color:#5C7CAE; font-weight:800; letter-spacing:.08em; text-transform:uppercase}

.navbar{
  display:flex; gap:0; flex:none; border-top:var(--stroke) solid var(--ink);
  background:linear-gradient(180deg,var(--panel-2),var(--panel-3));
}
.navtab{
  flex:1; border:0; background:transparent; padding:9px 4px 8px; display:flex; flex-direction:column;
  align-items:center; gap:2px; border-top:4px solid transparent; color:#9FBCE4;
}
.navtab .nico{font-size:21px; line-height:1}
.navtab .nlab{font-family:"Lilita One",Impact,fantasy; font-size:11.5px; letter-spacing:.5px}
.navtab.on{border-top-color:var(--gold); color:var(--gold); background:rgba(245,197,66,.10)}
.navtab:hover{color:#D6E6FF}

/* ============================================================ CARDS / DECK */
#cards{background:linear-gradient(180deg,var(--sky-2) 0%,var(--sky-3) 100%)}
.cardsbody{flex:1; min-height:0; overflow-y:auto; padding:10px 12px 14px; display:flex; flex-direction:column; gap:10px}
.sechead{
  display:flex; align-items:center; gap:9px; font-family:"Lilita One",Impact,fantasy;
  font-size:16px; letter-spacing:.5px; color:var(--gold); text-shadow:0 2px 0 var(--ink);
}
.sechead .hint{font-family:Nunito,sans-serif; font-size:11.5px; font-weight:700; color:#BBD3F2;
  letter-spacing:0; text-shadow:none; margin-left:auto}
.deckgrid{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:7px}
.collgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(82px,1fr)); gap:7px}
@media (max-width:620px){ .deckgrid{grid-template-columns:repeat(4,minmax(0,1fr))} }

/* ------------------------------------------------------------ card faces */
.gc{
  position:relative; border:2.5px solid var(--ink); border-radius:9px; overflow:hidden;
  background:linear-gradient(180deg,#F7EFDC,#DCCDAC); color:var(--ink);
  display:flex; flex-direction:column; align-items:center; padding:13px 3px 3px;
  box-shadow:0 3px 0 rgba(0,0,0,.4); aspect-ratio:3/4; min-width:0;
}
.gc .rar{position:absolute; inset:0 0 auto; height:9px; background:var(--b-corn)}
.gc.k-spell .rar{background:var(--spell)} .gc.k-structure .rar{background:var(--wood)}
.gc .cost{
  position:absolute; top:-2px; left:-2px; min-width:23px; height:23px; padding:0 4px;
  display:grid; place-items:center; border:2.5px solid var(--ink);
  border-radius:0 0 9px 0; background:linear-gradient(180deg,#8FD6F5,#3E93C8); color:#06263A;
  font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:700; z-index:2;
}
.gc .cost.deal{background:linear-gradient(180deg,#A8E9A8,#3FA85A); color:#06301A}
.gc .biome{position:absolute; top:11px; right:2px; font-size:12px; line-height:1; z-index:2;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.gc .art{font-size:26px; line-height:1.05; margin-top:2px}
.gc .nm{font-family:"Lilita One",Impact,fantasy; font-size:9.5px; line-height:1.05; text-align:center;
  letter-spacing:.2px; overflow-wrap:anywhere; padding:0 1px}
.gc .sts{display:flex; gap:3px; margin-top:auto}
.gc .lvl2{position:absolute; bottom:1px; left:2px; font-family:"JetBrains Mono",monospace;
  font-size:8.5px; font-weight:700; color:#5A4A2A}
.pip{border:2px solid var(--ink); border-radius:5px; padding:0 4px; font-family:"JetBrains Mono",monospace;
  font-size:10px; font-weight:700; background:var(--cream-2)}
.pip.atk{background:var(--b-corn)} .pip.hp{background:#F2A0B6} .pip.up{background:var(--good)}
.gc.locked{filter:grayscale(.85) brightness(.62)}
.gc.locked::after{content:"🔒"; position:absolute; inset:0; display:grid; place-items:center; font-size:20px}
.gc.picked{outline:3px solid var(--gold); outline-offset:1px}
.gc.tappable{cursor:pointer}
.gc.tappable:hover{transform:translateY(-3px); box-shadow:0 6px 0 rgba(0,0,0,.4)}
.gc .dupes{position:absolute; bottom:0; left:0; right:0; height:11px; background:#0D1F3E;
  border-top:2px solid var(--ink); display:flex; align-items:center; justify-content:center}
.gc .dupes i{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#5FA8F0,#2D6FD6)}
.gc .dupes span{position:relative; font-family:"JetBrains Mono",monospace; font-size:8px; color:#DCE9FB}
</style>
<style>
/* ================================================================= BATTLE */
#battle{
  background:
    radial-gradient(70% 45% at 50% -8%, rgba(255,255,255,.16), transparent 62%),
    linear-gradient(180deg,#3E86C8 0%,#1F4F86 38%,#0E2B4E 100%);
}
.bhud{display:flex; align-items:center; gap:8px; padding:6px 9px; flex:none; z-index:5}
.bhud.bottom{padding-top:0}
.fighter{
  display:flex; align-items:center; gap:8px; padding:4px 11px 4px 4px;
  border:2.5px solid var(--ink); border-radius:999px;
  background:linear-gradient(180deg,#24478A,#122A55); min-width:0;
}
.fighter .face{
  width:32px; height:32px; flex:none; display:grid; place-items:center; font-size:18px;
  border:2.5px solid var(--ink); border-radius:50%; background:var(--cream);
}
.fighter .fn{display:block; font-family:"Lilita One",Impact,fantasy; font-size:13.5px; line-height:1.1; letter-spacing:.3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px}
.fighter .fd{display:block; font-size:9.5px; color:#9FBCE4; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px}
.lifebar{display:flex; align-items:center; gap:6px}
.lifebar .meter{width:clamp(70px,16vw,132px); height:13px; border:2.5px solid var(--ink);
  border-radius:999px; background:#0D1F3E; overflow:hidden}
.lifebar .meter i{display:block; height:100%; background:linear-gradient(90deg,#F5798F,#D8365C); transition:width .3s}
.lifebar .n{font-family:"JetBrains Mono",monospace; font-size:14px; font-weight:700; color:#FF9FB4;
  font-variant-numeric:tabular-nums; min-width:26px}
.roundchip{
  margin-left:auto; display:flex; align-items:center; gap:6px; padding:4px 11px;
  border:2.5px solid var(--ink); border-radius:999px; background:#0D1F3E;
  font-family:"Lilita One",Impact,fantasy; font-size:12px; letter-spacing:.5px; color:#BBD3F2;
}
.roundchip.ot{background:linear-gradient(180deg,#F5798F,#9E1E3C); color:#FFF0F4}
.roundchip.you{background:linear-gradient(180deg,#FFD866,var(--gold-2)); color:#4A2F04}

/* ------------------------------------------------------------- the arena */
.arenawrap{flex:1; min-height:0; display:grid; place-items:center; position:relative; overflow:hidden}
.arena{perspective:2100px; perspective-origin:50% 46%}
.board{
  --tile-w:116px; --tile-h:74px; --gap:6px;
  width:calc(var(--tile-w)*3 + var(--gap)*2 + 22px);
  transform:translateY(var(--bdy,0px)) rotateX(var(--tilt)) scale(var(--bscale,1));
  transform-style:preserve-3d; padding:11px;
  display:flex; flex-direction:column; align-items:center; gap:0;
  border:var(--stroke) solid var(--ink); border-radius:20px;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.022) 0 3px, transparent 3px 7px),
    radial-gradient(90% 70% at 50% 50%, var(--mat) 0%, var(--mat-3) 100%);
  box-shadow:inset 0 0 70px rgba(0,0,0,.55), 0 26px 40px rgba(0,0,0,.45);
}
.side{display:grid; grid-template-columns:repeat(3,var(--tile-w)); gap:var(--gap); transform-style:preserve-3d}
.tile{
  position:relative; height:var(--tile-h); border-radius:7px; transform-style:preserve-3d;
  border:2px solid rgba(16,16,14,.62); background:var(--bio,#3A5A4C);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14), inset 0 -8px 14px rgba(0,0,0,.28);
  display:flex; align-items:flex-start; justify-content:center; padding-top:3px;
}
.tile .bico{position:absolute; top:2px; left:4px; font-size:15px; line-height:1; opacity:.95;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.45)); z-index:1}
.tile .bnm{
  position:absolute; left:0; right:0; top:22px; text-align:center;
  font-size:8px; font-weight:900; letter-spacing:.09em; text-transform:uppercase;
  color:rgba(16,16,14,.72); transform:scaleY(1.5); transform-origin:center top;
}
.tile.legal{border-color:var(--gold); box-shadow:inset 0 0 0 3px var(--gold), 0 0 22px rgba(245,197,66,.5); cursor:pointer}
.tile.legal:hover{filter:brightness(1.25)}
.tile.hittable{border-color:var(--candy); box-shadow:inset 0 0 0 3px var(--candy), 0 0 22px rgba(232,84,124,.5); cursor:pointer}
.tile.hittable:hover{filter:brightness(1.25)}
.tile.floopable{box-shadow:inset 0 0 0 3px var(--spell), 0 0 20px rgba(161,132,219,.5); cursor:pointer}
.tile.dim{filter:brightness(.62) saturate(.6)}

/* a creature standing on the mat */
.standee{
  position:absolute; left:50%; bottom:4px; width:58px;
  transform:translateX(-50%) rotateX(calc(-1 * var(--tilt)));
  transform-origin:50% 100%; transform-style:preserve-3d; cursor:pointer;
}
.standee .body{
  border:2.5px solid var(--ink); border-radius:8px 8px 5px 5px; padding:3px 2px 2px;
  background:linear-gradient(180deg,#FBF5E6,#D9C9A6); color:var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:1px;
  box-shadow:0 3px 6px rgba(0,0,0,.45);
}
.standee.structure .body{background:linear-gradient(180deg,#D9A273,#A9713F)}
.standee.foe .body{background:linear-gradient(180deg,#F6DCE3,#D7A8B6)}
.standee.foe.structure .body{background:linear-gradient(180deg,#D9A273,#A9713F)}
.standee .sart{font-size:20px; line-height:1.05}
.standee .snm{font-family:"Lilita One",Impact,fantasy; font-size:7.5px; line-height:1.02; text-align:center;
  letter-spacing:.1px; overflow-wrap:anywhere; max-width:52px}
.standee .sst{display:flex; gap:2px}
.standee .sst .pip{font-size:9px; padding:0 3px; border-width:1.5px; border-radius:4px}
.standee .shadow{
  position:absolute; left:50%; bottom:-5px; width:46px; height:11px; border-radius:50%;
  background:rgba(0,0,0,.42); transform:translateX(-50%) rotateX(var(--tilt)); filter:blur(2.5px);
}
.standee.sick{filter:saturate(.5) brightness(.9)}
.standee.tapped{transform:translateX(-50%) rotateX(calc(-1 * var(--tilt))) rotate(9deg)}
.standee.canfloop .body{box-shadow:0 3px 6px rgba(0,0,0,.45), 0 0 0 2.5px var(--spell)}
.standee.hot .body{box-shadow:0 3px 6px rgba(0,0,0,.45), 0 0 0 2.5px var(--candy)}
.standee.pickme .body{box-shadow:0 3px 6px rgba(0,0,0,.45), 0 0 0 2.5px var(--gold)}
.standee .tagline{
  position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  font-size:7.5px; font-weight:900; letter-spacing:.05em; text-transform:uppercase;
  background:var(--ink); color:var(--cream); border:2px solid var(--cream);
  border-radius:999px; padding:0 5px; white-space:nowrap;
}
.standee .tagline.zzz{background:var(--moss-dim)}
.standee .tagline.rng{background:#2D6FD6}
.standee .tagline.safe{background:var(--good); color:var(--ink)}
.standee .inhab{
  position:absolute; bottom:-4px; right:-8px; font-size:13px; line-height:1;
  filter:drop-shadow(0 1px 0 var(--ink));
}

/* --------------------------------------------------------- river+bridges */
.river{
  position:relative; width:calc(var(--tile-w)*3 + var(--gap)*2); height:62px; margin:var(--gap) 0;
  border-radius:4px; transform-style:preserve-3d;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 9px, transparent 9px 22px),
    linear-gradient(180deg,#2E7FB8,#1B5B8E 48%,#12416B);
  box-shadow:inset 0 0 0 2px rgba(16,16,14,.6), inset 0 6px 16px rgba(0,0,0,.4);
  animation:flow 7s linear infinite;
}
@keyframes flow{to{background-position:44px 0, 0 0}}
.bridge{
  position:absolute; top:-5px; bottom:-5px; width:calc(var(--tile-w) - 26px);
  border:2.5px solid var(--ink); border-radius:5px; transform-style:preserve-3d;
  background:repeating-linear-gradient(180deg,#B07B45 0 7px,#8B5A2B 7px 11px);
  box-shadow:0 5px 9px rgba(0,0,0,.45);
}
.bridge::after{
  content:""; position:absolute; inset:2px 3px; border-radius:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%); pointer-events:none;
}
.bridge.held-you{border-color:var(--gold); box-shadow:0 5px 9px rgba(0,0,0,.45), 0 0 16px rgba(245,197,66,.65)}
.bridge.held-foe{border-color:var(--candy); box-shadow:0 5px 9px rgba(0,0,0,.45), 0 0 16px rgba(232,84,124,.65)}

/* ------------------------------------------------------------- castles */
.castle{position:relative; height:26px; width:100%; transform-style:preserve-3d}
.castle .keep{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%) rotateX(calc(-1 * var(--tilt)));
  transform-origin:50% 100%; display:flex; align-items:center; gap:7px;
  border:2.5px solid var(--ink); border-radius:9px; padding:4px 11px;
  background:linear-gradient(180deg,#6E7F96,#3D4A5E); box-shadow:0 4px 8px rgba(0,0,0,.45);
}
.castle .keep .kico{font-size:19px; line-height:1}
.castle .keep .knum{font-family:"Lilita One",Impact,fantasy; font-size:19px; color:#FFD0DC; text-shadow:0 2px 0 var(--ink)}
.castle.foe .keep{background:linear-gradient(180deg,#9E6274,#5E3341)}
.castle.you .keep{background:linear-gradient(180deg,#5E7E9E,#2F4A66)}

/* --------------------------------------------------------------- the hand */
.handdock{display:flex; align-items:flex-end; gap:8px; padding:0 9px 7px; flex:none; z-index:5}
.nextslot{display:flex; flex-direction:column; align-items:center; gap:3px; flex:none}
.nextslot .lab{font-size:8.5px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:#9FBCE4}
.nextslot .gc{width:44px; opacity:.88}
.handcards{display:flex; gap:6px; flex:1; min-width:0; justify-content:center}
.handcards .gc{width:clamp(56px,10.5vw,80px); flex:none; transition:transform .12s, box-shadow .12s}
.handcards .gc.playable{cursor:pointer}
.handcards .gc.playable:hover{transform:translateY(-7px); box-shadow:0 9px 0 rgba(0,0,0,.4)}
.handcards .gc.sel{transform:translateY(-11px); box-shadow:0 12px 0 rgba(0,0,0,.4), 0 0 0 3px var(--gold)}
.handcards .gc.broke{filter:grayscale(.55) brightness(.72)}
.juicewrap{display:flex; align-items:center; gap:6px; padding:0 9px 6px}
.juicebar{
  flex:1; height:17px; border:2.5px solid var(--ink); border-radius:999px; background:#0D1F3E;
  display:flex; gap:2px; padding:2px; overflow:hidden;
}
.juicebar span{flex:1; border-radius:999px; background:#16305C}
.juicebar span.on{background:linear-gradient(180deg,#8FD6F5,#3E93C8); box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.juicebar span.ot{background:linear-gradient(180deg,#F5B8E8,#C455B0)}
.juicenum{font-family:"Lilita One",Impact,fantasy; font-size:19px; color:#8FD6F5; text-shadow:0 2px 0 var(--ink); min-width:30px}
.actrow{display:flex; gap:7px; align-items:center}

/* --------------------------------------------------------------- overlays */
.side-pop{
  position:absolute; right:9px; top:52px; width:min(288px,64vw); max-height:60%;
  display:flex; flex-direction:column; z-index:12; overflow:hidden;
}
.side-pop h4{
  margin:0; padding:6px 11px; font-family:"Lilita One",Impact,fantasy; font-size:12.5px;
  letter-spacing:.5px; color:var(--gold); background:var(--panel-3); border-bottom:2.5px solid var(--ink);
  display:flex; align-items:center; gap:7px;
}
.side-pop h4 button{margin-left:auto; background:transparent; border:0; color:#9FBCE4; font-size:15px; line-height:1}
.logfeed{overflow-y:auto; padding:7px 11px; display:flex; flex-direction:column; gap:5px; font-size:12px}
.logfeed p{margin:0; color:#C6D8F0; line-height:1.38}
.logfeed p.hit{color:#FF9FB4} .logfeed p.bmo{color:#8FD6F5; font-weight:700}
.logfeed p.foe{color:#E9D8B8}
.logfeed p.turn{color:#7D95BC; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:900;
  border-top:1px solid rgba(255,255,255,.14); padding-top:5px; margin-top:2px}

.scrim{position:fixed; inset:0; background:rgba(6,18,36,.88); backdrop-filter:blur(3px);
  display:grid; place-items:center; padding:16px; z-index:50; overflow-y:auto}
.scrim[hidden]{display:none}
.sheet{
  width:min(640px,100%); border:var(--stroke) solid var(--ink); border-radius:18px;
  background:linear-gradient(180deg,var(--panel),var(--panel-3)); padding:17px 19px; margin:auto;
  display:flex; flex-direction:column; gap:12px; box-shadow:0 12px 0 rgba(0,0,0,.42);
}
.sheet h2{margin:0; font-family:"Lilita One",Impact,fantasy; font-size:25px; letter-spacing:.6px;
  color:var(--gold); text-shadow:0 3px 0 var(--ink); text-wrap:balance}
.sheet h3{margin:5px 0 0; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#9FBCE4; font-weight:900}
.sheet p{margin:0; font-size:13.5px; color:#DCE9FB; max-width:64ch}
.sheet ol,.sheet ul{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:5px;
  font-size:13.5px; color:#DCE9FB; max-width:64ch}
.sheet b{color:#FFF}
.sheet .foot{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:4px}
.biokey{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:6px}
.biokey div{border:2.5px solid var(--ink); border-radius:9px; padding:5px 9px; color:var(--ink);
  background:var(--bio,#3A5A4C); font-size:11.5px; font-weight:700}
.biokey b{display:block; font-size:12.5px}
.biokey div.tappable{cursor:pointer}
.biokey div.tappable:hover{filter:brightness(1.15)}
.picker{display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); gap:8px}
.pick{text-align:left; border:2.5px solid var(--ink); border-radius:11px; padding:8px 11px;
  background:linear-gradient(180deg,#24478A,#122A55); color:#DCE9FB; display:flex; flex-direction:column; gap:2px}
.pick:hover{filter:brightness(1.15)}
.pick.on{background:linear-gradient(180deg,#FFD866,var(--gold-2)); color:#4A2F04}
.pick .pt{font-family:"Lilita One",Impact,fantasy; font-size:14.5px; letter-spacing:.3px}
.pick .pd{font-size:11.5px; line-height:1.32; opacity:.88}

.detail{display:flex; gap:14px; flex-wrap:wrap}
.detail .big{width:118px; flex:none}
.detail .info{flex:1; min-width:190px; display:flex; flex-direction:column; gap:7px}
.detail .tags{display:flex; gap:5px; flex-wrap:wrap}
.tag{border:2.5px solid var(--ink); border-radius:999px; padding:1px 9px; font-size:11px; font-weight:800;
  background:#0D1F3E; color:#DCE9FB}
.tag.atk{background:var(--b-corn); color:var(--ink)} .tag.hp{background:#F2A0B6; color:var(--ink)}
.tag.cost{background:#8FD6F5; color:#06263A} .tag.bio{background:var(--bio,#fff); color:var(--ink)}
.tag.kw{background:var(--spell); color:#FFF}

/* ------------------------------------------------------------- floaters */
.fxlayer{position:fixed; inset:0; pointer-events:none; z-index:60}
.float{position:absolute; transform:translate(-50%,-50%); font-family:"Lilita One",Impact,fantasy;
  font-size:23px; text-shadow:0 2.5px 0 var(--ink); animation:rise 1.05s ease-out forwards; white-space:nowrap}
.float.dmg{color:#FF7E9C} .float.heal{color:#8FE3A0} .float.juice{color:#8FD6F5}
.float.note{font-family:Nunito,sans-serif; font-weight:900; font-size:14px; color:#FFF}
.float.floop{color:#C9A8F5; font-size:30px; animation:burst .9s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes rise{to{transform:translate(-50%,-165%); opacity:0}}
@keyframes burst{
  0%{transform:translate(-50%,-50%) scale(.3) rotate(-14deg); opacity:0}
  35%{transform:translate(-50%,-50%) scale(1.25) rotate(7deg); opacity:1}
  100%{transform:translate(-50%,-95%) scale(1) rotate(-3deg); opacity:0}
}
.arenawrap.shake{animation:shk .34s}
@keyframes shk{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.toast{
  position:fixed; left:50%; top:14%; transform:translateX(-50%); z-index:70;
  border:var(--stroke) solid var(--ink); border-radius:14px; padding:9px 22px;
  background:linear-gradient(180deg,#FFD866,var(--gold-2)); color:#4A2F04;
  font-family:"Lilita One",Impact,fantasy; font-size:20px; letter-spacing:.5px;
  box-shadow:0 6px 0 var(--gold-3); animation:pop 1.9s ease forwards; pointer-events:none;
}
@keyframes pop{0%{transform:translateX(-50%) scale(.6); opacity:0}14%{transform:translateX(-50%) scale(1); opacity:1}
  78%{opacity:1}100%{opacity:0; transform:translateX(-50%) translateY(-18px)}}

@media (max-width:560px){
  .board{--tile-w:96px; --tile-h:70px}
  .nextslot{display:none}
  .fighter .fd{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}

<script>
"use strict";
/* =====================================================================

const DECKS = {

const ARENAS = [
  {t:0,    name:"Treehouse Floor", ico:"\u{1F333}"},
  {t:150,  name:"The Cornfield",   ico:"\u{1F33D}"},

  {t:900,  name:"Swamp Bottom",    ico:"\u{1FAB5}"},

];
const FOES = {
  finn:{name:"Finn", art:"\u{1F9E2}", deck:"spare", skill:"easy", tier:0,
    taunts:["Mathematical!","I have no idea what I'm doing!","Jake gave me this deck. I think it's bad.","Is that good? That felt good."]},
  jake:{name:"Jake", art:"\u{1F436}", deck:"cornlord", skill:"normal", tier:0,

  bmo:{name:"BMO", art:"\u{1F4DF}", deck:"studyhall", skill:"normal", tier:2,

    taunts:["I did the math on this deck. Twice.","Science!","You are a variable I have already solved."]},
};
const START_LIFE = 34, HAND_SIZE = 5, DECK_SIZE = 12, JUICE_CAP = 12,
      OVERTIME_TURN = 11, CALL_TURN = 18, TILE_FLOOP_COST = 2;

/* =====================================================================
   SAVE
   ===================================================================== */
const SAVE_KEY = "floopthepig.v2";
const STARTER = ["husker","sprout","silo","cooldog","scholar","school","pig","banana","archer","baldman",
                 "lurker","mushroom","cave","pancakes","teleport","sandstorm","earlings","volcano"];
let SAVE = null;

function freshSave(){
  const owned = {};
  STARTER.forEach(id => owned[id] = {copies:0, lvl:1});
  return {name:"Cornlord", lvl:1, xp:0, gold:400, corn:0, trophies:0, wins:0, losses:0,
    deck:["cooldog","sprout","banana","archer","scholar","school","pig","teleport","sandstorm","mushroom","cave","husker"],
    owned, chests:[null,null,null,null]};
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && s.owned && Array.isArray(s.deck) && s.deck.length === DECK_SIZE){
        s.deck = s.deck.filter(id => CARDS[id]);
        while(s.deck.length < DECK_SIZE) s.deck.push(STARTER.find(x => !s.deck.includes(x)) || "sprout");
        return s;
      }
    }
  }catch(e){ /* private mode, cleared storage - start fresh */ }
  return freshSave();
}
function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){ /* nothing we can do */ }
}
const arenaIndex = (t) => { let i = 0; ARENAS.forEach((a,k) => { if(t >= a.t) i = k; }); return i; };
function cardLevel(id){ const o = SAVE.owned[id]; return o ? o.lvl : 1; }
function lvlBonus(id, lvl){
  const d = CARDS[id];
  const b = {atk:0, hp:0};
  if(lvl >= 2) b.hp += 1;
  if(lvl >= 3){ if(d.kind === "unit" && d.atk > 0) b.atk += 1; else b.hp += 1; }
  return b;
}
const UPGRADE = {2:{copies:3, gold:150}, 3:{copies:8, gold:500}};

/* =====================================================================
   MATCH STATE
   ===================================================================== */
let S = null, uidSeq = 1;
const seenUnits = new Set();
const $ = (id) => document.getElementById(id);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const lane = (i) => i % 3, row = (i) => (i / 3) | 0, idx = (r, l) => r * 3 + l;

function rollTiles(){
  const t = [];
  for(let i=0;i<9;i++) t.push({bio: BIO_KEYS[(Math.random() * BIO_KEYS.length) | 0]});
  return t;
}
function makeSide(side, who, deckIds, levels){
  const cycle = shuffle(deckIds.slice());
  return {
    side, name:who.name, art:who.art, skill:who.skill || null, deckName:who.deckName || "",
    taunts:who.taunts || null, levels:levels || {},
    life:START_LIFE, juice:0, turns:0, tileFlooped:false,
    tiles:rollTiles(), units:new Array(9).fill(null),
    hand:cycle.slice(0, HAND_SIZE), next:cycle[HAND_SIZE], rest:cycle.slice(HAND_SIZE + 1),
  };
}
function newMatch(foeKey){
  const foe = FOES[foeKey];
  const ai = arenaIndex(SAVE.trophies);
  const aiLvl = Math.min(3, 1 + Math.floor(ai / 2));
  const foeLevels = {};
  DECKS[foe.deck].cards.forEach(id => foeLevels[id] = aiLvl);
  const myLevels = {};
  SAVE.deck.forEach(id => myLevels[id] = cardLevel(id));
  seenUnits.clear(); aiActions = 0;
  S = {round:1, active:"you", over:null, pending:null, focus:null, log:[], foeKey};
  S.you = makeSide("you", {name:SAVE.name, art:"\u{1F0CF}", deckName:"Your deck"}, SAVE.deck, myLevels);
  S.foe = makeSide("foe", Object.assign({deckName:DECKS[foe.deck].name}, foe), DECKS[foe.deck].cards, foeLevels);
  logLine("bmo", "BMO: Card Wars! " + SAVE.name + " versus " + foe.name + ". Thirty-four life, three bridges. Begin!");
  beginTurn("you");
}
const opp = (side) => side === "you" ? S.foe : S.you;
const isOvertime = () => S.round >= OVERTIME_TURN;
function juiceGain(){ return isOvertime() ? 12 : Math.min(3 + S.round, 8); }
function juiceCap(){ return isOvertime() ? 16 : JUICE_CAP; }

/* =====================================================================
   STAT MATH - biome blessings are computed live so units can move
   ===================================================================== */
function base(u){ return CARDS[u.id]; }
function bioAt(P, i){ return i >= 0 ? P.tiles[i].bio : null; }
function unitTile(P, u){ return P.units.indexOf(u); }
function maxHpOf(P, u, i){
  const d = base(u);
  let h = d.hp + (u.bonusHp || 0);
  const b = i >= 0 ? P.tiles[i].bio : null;
  if(b === "blue") h += 2;
  if(b === "rain") h += 1;
  return Math.max(1, h);
}
function hpOf(P, u, i){ return maxHpOf(P, u, i) - (u.dmg || 0); }
function atkOf(P, u, i){
  const d = base(u);
  if(d.kind === "structure") return 0;
  let a = d.atk + (u.bonusAtk || 0);
  const b = i >= 0 ? P.tiles[i].bio : null;
  if(b === "corn") a += 1;
  if(b === "rain") a += 1;
  if(d.special === "husker") a += P.tiles.filter(t => t.bio === "corn").length;
  return Math.max(0, a - (u.wither || 0));
}
const atkAt = (P, i) => P.units[i] ? atkOf(P, P.units[i], i) : 0;
const hpAt  = (P, i) => P.units[i] ? hpOf(P, P.units[i], i) : 0;
function isRanged(u){ return (base(u).tags || []).includes("ranged"); }
function homeTileFor(P, def, i){ const b = P.tiles[i].bio; return b === def.bio || b === "rain"; }
function controlsBiome(P, bio){ return P.tiles.some(t => t.bio === bio || t.bio === "rain"); }
function costOf(P, id, i){
  const d = CARDS[id];
  let c = d.cost;
  if(d.kind === "spell"){ if(controlsBiome(P, d.bio)) c -= 1; }
  else if(i !== undefined && i >= 0 && homeTileFor(P, d, i)) c -= 1;
  return Math.max(1, c);
}
function bestCost(P, id){
  const d = CARDS[id];
  if(d.kind === "spell") return costOf(P, id);
  let best = d.cost;
  for(let i=0;i<9;i++) if(!P.units[i]) best = Math.min(best, costOf(P, id, i));
  return best;
}
function spellPower(P, def, n){ return n + (controlsBiome(P, def.bio) ? 1 : 0); }
/* the frontmost tile index holding anything in a lane (row 0 is the river edge) */
function frontIdx(P, l){ for(let r=0;r<3;r++){ const i = idx(r,l); if(P.units[i]) return i; } return -1; }
function spellSafe(P, i){
  const u = P.units[i];
  if(!u) return false;
  if(P.tiles[i].bio === "swamp") return true;
  return (base(u).tags || []).includes("spellproof");
}
function canFloopUnit(P, i){
  const u = P.units[i];
  return !!(u && base(u).floop && !u.tapped && !u.flooped);
}
function houseTakes(structDef, u){
  const h = structDef.houses || [];
  if(h.includes("any")) return true;
  const tags = base(u).tags || [];
  return h.some(t => tags.includes(t));
}

function spawn(P, i, id){
  const d = CARDS[id];
  const lv = P.levels[id] || 1, lb = lvlBonus(id, lv);
  const u = {uid:uidSeq++, id, dmg:0, bonusAtk:lb.atk, bonusHp:lb.hp,
    tapped:false, flooped:false, sick:d.kind !== "structure", wither:0, guest:null, study:0};
  if(homeTileFor(P, d, i)){ u.bonusAtk += 1; u.bonusHp += 1; }
  if(P.tiles[i].bio === "sandy" || (d.tags || []).includes("rush")) u.sick = false;
  if(d.special === "wander") u.wander = 2;
  P.units[i] = u;
  return u;
}
const tileSel = (P, i) => "#tile-" + P.side + "-" + i;

function damage(P, i, n, opts){
  opts = opts || {};
  const u = P.units[i];
  if(!u || n <= 0) return 0;
  const hp = hpOf(P, u, i);
  u.dmg += n;
  if(opts.reap) u.dmg = maxHpOf(P, u, i);
  fx(tileSel(P, i), "-" + n, "dmg");
  const over = Math.max(0, n - hp);
  if(u.dmg >= maxHpOf(P, u, i)) kill(P, i);
  return over;
}
function kill(P, i){
  const u = P.units[i];
  if(!u) return;
  const d = base(u);
  P.units[i] = null;
  logLine("hit", d.name + " is destroyed.");
  if(u.guest){                       // a collapsing structure turns its lodger out
    const l = lane(i);
    let out = -1;
    for(let r=0;r<3;r++){ const k = idx(r,l); if(!P.units[k]){ out = k; break; } }
    if(out >= 0){ P.units[out] = u.guest; u.guest.sick = true;
      logLine("", base(u.guest).name + " is turned out of the wreckage."); }
    else logLine("hit", base(u.guest).name + " goes down with it.");
  }
  if(d.special === "spores"){
    const E = opp(P.side), t = frontIdx(E, lane(i));
    if(t >= 0){ logLine("hit", "Spores burst over " + base(E.units[t]).name + "."); damage(E, t, 2); }
  }
}
function hurtFace(P, n){
  P.life = Math.max(0, P.life - n);
  fx("#keep-" + P.side, "-" + n, "dmg");
  shake();
}
function healFace(P, n){
  const b = P.life;
  P.life = Math.min(START_LIFE, P.life + n);
  if(P.life > b) fx("#keep-" + P.side, "+" + (P.life - b), "heal");
}
function addJuice(P, n){
  P.juice = Math.min(juiceCap(), P.juice + n);
  fx("#juicenum", "+" + n, "juice");
}
function healUnit(P, u, n, i){
  const before = u.dmg;
  u.dmg = Math.max(0, u.dmg - n);
  if(u.dmg < before && i >= 0) fx(tileSel(P, i), "+" + (before - u.dmg), "heal");
}

<script>
"use strict";
/* =====================================================================
   TURN FLOW
   ===================================================================== */
function beginTurn(side){
  const P = S[side], E = opp(side);
  S.active = side; S.pending = null;
  P.turns++; P.tileFlooped = false;
  addJuice(P, juiceGain() + (side === "foe" && P.turns === 1 ? 2 : 0));

  for(let i=0;i<9;i++){
    const u = P.units[i];
    if(!u) continue;
    u.tapped = false; u.flooped = false; u.sick = false;
    if(P.tiles[i].bio === "nice") healUnit(P, u, 1, i);
  }
  for(let i=0;i<9;i++){
    const u = P.units[i];
    if(!u) continue;
    const d = base(u);
    if(d.trigger === "silo"){
      addJuice(P, u.guest ? 3 : 2);
      if(u.guest) healUnit(P, u.guest, 2, -1);
    }
    if(d.trigger === "cave" && u.guest) healUnit(P, u.guest, 2, -1);
    if(d.trigger === "school" && u.guest){
      addJuice(P, 3);
      if(u.guest.study < 4){
        u.guest.study++; u.guest.bonusAtk++; u.guest.bonusHp++;
        fx(tileSel(P, i), "STUDY +1/+1", "juice");
        logLine(side === "you" ? "bmo" : "foe", base(u.guest).name + " studies. It comes back bigger.");
      }
    }
  }
  logLine("turn", (side === "you" ? "Your turn" : P.name + "'s turn") + " · round " + S.round +
    (isOvertime() ? " · double juice" : ""));
  render();
  if(side === "foe") setTimeout(aiStep, 650);
}

function endTurn(){
  if(S.over) return;
  const side = S.active, P = S[side], E = opp(side);
  S.pending = null;

  for(let l=0;l<3;l++) fightLane(P, E, l);

  for(let i=0;i<9;i++){
    const u = P.units[i];
    if(!u) continue;
    if(u.wither) u.wither = 0;
    if(u.wander !== undefined && --u.wander <= 0){
      P.units[i] = null;
      logLine("", "Wandering Bald Man wanders off. He had somewhere to be.");
    }
  }
  if(checkOver()) return;
  if(side === "foe") S.round++;
  if(S.round > CALL_TURN){ finish(null, true); return; }
  beginTurn(side === "you" ? "foe" : "you");
}

/* every rested creature in a lane swings across the bridge. The defending
   front creature counter-hits for half, but only against melee. */
function fightLane(P, E, l){
  const di = frontIdx(E, l);
  const defU = di >= 0 ? E.units[di] : null;
  const back = defU && base(defU).kind !== "structure" ? Math.floor(atkOf(E, defU, di) / 2) : 0;
  const backReap = defU ? (base(defU).tags || []).includes("reap") : false;
  const fi = frontIdx(P, l);
  let swung = false;


  const shots = [];
  for(let r=0;r<3;r++){
    const i = idx(r, l), u = P.units[i];
    if(!u || u.tapped || u.sick) continue;
    const d = base(u);
    if(d.kind === "structure"){
      if(d.trigger === "tower" && u.guest && isRanged(u.guest)){
        const g = u.guest;
        shots.push({i, n: CARDS[g.id].atk + (g.bonusAtk || 0) + 3, reap:false, nm:"Spirit Tower"});
      }
      continue;
    }
    shots.push({i, n:atkOf(P, u, i), reap:(d.tags || []).includes("reap"), nm:d.name});
    swung = true;
  }

  for(const sh of shots){
    if(sh.n <= 0 || !P.units[sh.i]) continue;
    const ti = frontIdx(E, l);
    if(ti < 0){
      logLine("hit", sh.nm + " crosses bridge " + (l+1) + " for " + sh.n + ".");
      hurtFace(E, sh.n);
      continue;
    }
    const tn = base(E.units[ti]).name;
    logLine("hit", sh.nm + " hits " + tn + " for " + sh.n + ".");
    const over = damage(E, ti, sh.n, {reap:sh.reap});
    if(over > 0){
      const nxt = frontIdx(E, l);
      if(nxt >= 0){ logLine("hit", "It breaks through into " + base(E.units[nxt]).name + " for " + over + "."); damage(E, nxt, over); }
      else { logLine("hit", "It breaks through for " + over + "."); hurtFace(E, over); }
    }
  }

  if(back > 0 && swung){
    const mf = frontIdx(P, l);
    if(mf >= 0 && P.units[mf]){
      logLine("hit", base(P.units[mf]).name + " takes " + back + " back.");
      damage(P, mf, back, {reap:backReap});
    }
  }
}

function checkOver(){
  if(S.you.life <= 0 || S.foe.life <= 0){
    finish(S.foe.life <= 0 && S.you.life > 0 ? "you" : (S.you.life <= 0 && S.foe.life > 0 ? "foe" : null));
    return true;
  }
  return false;
}
function finish(winner, byCall){
  if(byCall) winner = S.you.life === S.foe.life ? null : (S.you.life > S.foe.life ? "you" : "foe");
  S.over = winner === null ? "draw" : winner;
  awardMatch();
  render();
  showEnd(byCall);
}

/* =====================================================================
   PLAYING CARDS
   ===================================================================== */
function cycleOut(P, h){
  const played = P.hand[h];
  P.hand[h] = P.next;
  P.next = P.rest.shift();
  P.rest.push(played);
}
function playCard(P, h, target, extra){
  const id = P.hand[h], d = CARDS[id];
  const who = P.side === "you" ? "You" : P.name;
  if(d.kind === "spell"){
    P.juice -= costOf(P, id);
    logLine(P.side === "you" ? "" : "foe", who + " cast" + (P.side === "you" ? "" : "s") + " " + d.name + ".");
    castSpell(P, d, target, extra);
  } else if(d.special === "swarm"){
    const first = P.units.findIndex(u => !u);
    P.juice = Math.max(0, P.juice - costOf(P, id, first < 0 ? 0 : first));
    let n = 0;
    for(let i=0;i<9 && n<3;i++) if(!P.units[i]){ spawn(P, i, id); n++; }
    logLine(P.side === "you" ? "" : "foe", who + " unleash" + (P.side === "you" ? "" : "es") + " " + n + " Earlings.");
  } else {
    P.juice -= costOf(P, id, target);
    spawn(P, target, id);
    logLine(P.side === "you" ? "" : "foe", who + " play" + (P.side === "you" ? "" : "s") + " " + d.name +
      " on " + BIO[P.tiles[target].bio].name + ", lane " + (lane(target) + 1) + ".");
  }
  cycleOut(P, h);
  checkOver();
}

function castSpell(P, d, target, extra){
  const E = opp(P.side), sp = d.spell;
  const n = sp.n ? spellPower(P, d, sp.n) : 0;
  if(sp.id === "volcano"){
    const ti = frontIdx(E, target);
    if(ti < 0) hurtFace(E, n);
    else if(spellSafe(E, ti)) logLine("", "The spell slides off " + base(E.units[ti]).name + ".");
    else damage(E, ti, n);
  } else if(sp.id === "lane"){
    for(let r=0;r<3;r++){ const i = idx(r, target); if(E.units[i] && !spellSafe(E, i)) damage(E, i, n); }
  } else if(sp.id === "sweep"){
    for(let i=8;i>=0;i--) if(E.units[i] && !spellSafe(E, i)) damage(E, i, n);
  } else if(sp.id === "front"){
    for(let l=0;l<3;l++){ const i = frontIdx(E, l); if(i >= 0 && !spellSafe(E, i)) damage(E, i, n); }
  } else if(sp.id === "heal"){
    healFace(P, n);
  } else if(sp.id === "wither"){
    for(let i=0;i<9;i++) if(E.units[i] && !spellSafe(E, i)) E.units[i].wither = n;
  } else if(sp.id === "teleport"){
    const u = P.units[target];
    P.units[target] = null; P.units[extra] = u; u.sick = false;
    fx(tileSel(P, extra), "blorp", "juice");
  } else if(sp.id === "buff"){
    const u = P.units[target];
    if(u){ u.bonusAtk += n; u.bonusHp += n; fx(tileSel(P, target), "+" + n + "/+" + n, "heal"); }
  } else if(sp.id === "reclaim"){
    const tl = Array.isArray(target) ? target : [target];
    const bl = Array.isArray(extra) ? extra : [extra];
    tl.forEach((ti, k) => {
      const nb = bl[k] || bl[0];
      if(ti === undefined || ti < 0 || !nb) return;
      P.tiles[ti].bio = nb;
      logLine("", "A tile in lane " + (lane(ti) + 1) + " is retilled into " + BIO[nb].name + ".");
    });
  } else if(sp.id === "frenzy"){
    for(let i=0;i<9;i++) if(P.units[i] && base(P.units[i]).floop && !P.units[i].flooped) doFloop(P, i, {free:true});
  }
}

/* ------------------------------------------------------------ flooping */
function doFloop(P, i, opts){
  opts = opts || {};
  const u = P.units[i], d = base(u), f = d.floop;
  if(!f) return;
  u.flooped = true;
  if(!opts.free) u.tapped = true;
  fx(tileSel(P, i), "FLOOP!", "floop");
  logLine(P.side === "you" ? "bmo" : "foe", (P.side === "you" ? "You floop " : P.name + " floops ") + d.name + ".");
  const E = opp(P.side);
  if(f.id === "heal") healFace(P, f.n);
  else if(f.id === "juice") addJuice(P, f.n);
  else if(f.id === "healall"){
    for(let k=0;k<9;k++) if(P.units[k]) healUnit(P, P.units[k], f.n, k);
  } else if(f.id === "snipe"){
    let t = opts.target;
    if(t === undefined || !E.units[t]){
      t = -1; let best = -1;
      for(let k=0;k<9;k++) if(E.units[k] && hpAt(E,k) > best){ best = hpAt(E,k); t = k; }
    }
    if(t >= 0 && E.units[t]) damage(E, t, f.n);
  } else if(f.id === "move"){
    let dest = opts.target;
    if(dest === undefined || P.units[dest]) dest = P.units.findIndex(x => !x);
    if(dest >= 0 && dest !== i && !P.units[dest]){ P.units[dest] = u; P.units[i] = null; }
  } else if(f.id === "mend"){
    const t = opts.target !== undefined ? opts.target : i;
    if(P.units[t]) healUnit(P, P.units[t], 99, t);
  } else if(f.id === "cycle"){
    P.rest.push(P.next); P.next = P.rest.shift();
    fx("#nextcard", "swapped", "juice");
  }
  checkOver();
}

/* ------------------------------------------------- tiles and structures */
function floopTile(P, i, bio){
  P.juice -= TILE_FLOOP_COST;
  P.tileFlooped = true;
  P.tiles[i].bio = bio;
  fx(tileSel(P, i), BIO[bio].icon + " " + BIO[bio].name, "note");
  logLine(P.side === "you" ? "bmo" : "foe",
    (P.side === "you" ? "You floop " : P.name + " floops ") + "a tile into " + BIO[bio].name + ".");
}
function moveIn(P, si, ui){
  const st = P.units[si], g = P.units[ui];
  st.guest = g; P.units[ui] = null; g.tapped = true; g.sick = false;
  fx(tileSel(P, si), "inside", "heal");
  logLine(P.side === "you" ? "bmo" : "foe", base(g).name + " goes inside " + base(st).name + ".");
}
function moveOut(P, si, ti){
  const st = P.units[si], g = st.guest;
  st.guest = null; P.units[ti] = g; g.tapped = true; g.sick = false;
  logLine(P.side === "you" ? "bmo" : "foe", base(g).name + " steps back out.");
}
function garrisonTargets(P, si){
  const st = P.units[si], d = base(st), out = [];
  if(!d.houses || st.guest) return out;
  const l = lane(si);
  for(let r=0;r<3;r++){
    const i = idx(r, l), u = P.units[i];
    if(!u || i === si || base(u).kind === "structure") continue;
    if(houseTakes(d, u)) out.push(i);
  }
  return out;
}

<script>
"use strict";
/* =====================================================================
   THE OPPONENT
   ===================================================================== */
let aiActions = 0;
/* How keen the opponent is to act. Tuned by simulation - see README. */
/* Simulation-tuned. The opponent's old thresholds made it act ~1.3 times a turn
   against a bot doing 6, which was the whole of its weakness; see README. */
const TUNE = {floorHard:-8, floorNorm:-6, floorEasy:2, slot:1.25, cost:1.35};

function aiStep(){
  if(S.over || S.active !== "foe") return;
  const P = S.foe;
  const moves = aiMoves();
  let floor = P.skill === "hard" ? TUNE.floorHard : P.skill === "easy" ? TUNE.floorEasy : TUNE.floorNorm;
  if(P.juice >= 9) floor -= 2;
  let pick = null;
  if(moves.length){
    moves.sort((a,b) => b.score - a.score);
    if(P.skill === "easy"){
      const ok = moves.filter(m => m.score > floor);
      if(ok.length && Math.random() < 0.7) pick = ok[(Math.random() * Math.min(4, ok.length)) | 0];
    } else if(moves[0].score > floor) pick = moves[0];
  }
  if(pick && aiActions < 12){
    aiActions++;
    pick.run();
    render();
    setTimeout(aiStep, 520);
  } else {
    aiActions = 0;
    if(P.taunts && Math.random() < 0.45) logLine("foe", P.name + ": " + P.taunts[(Math.random() * P.taunts.length) | 0]);
    setTimeout(endTurn, 460);
  }
}

function lanePower(X, l){
  let p = 0;
  const f = frontIdx(X, l);
  for(let r=0;r<3;r++){
    const i = idx(r, l), u = X.units[i];
    if(!u || base(u).kind === "structure") continue;
    if(isRanged(u) || i === f) p += atkOf(X, u, i);
  }
  return p;
}

function aiMoves(){
  const P = S.foe, E = S.you, out = [];
  const hard = P.skill === "hard";
  const threat = [0,1,2].map(l => lanePower(E, l));
  const openLane = [0,1,2].map(l => frontIdx(E, l) < 0);
  const mineIn = [0,1,2].map(l => [0,1,2].filter(r => P.units[idx(r,l)]).length);

  /* ---- garrisoning: the single best thing this deck does ---- */
  for(let si=0; si<9; si++){
    const st = P.units[si];
    if(!st || base(st).kind !== "structure") continue;
    const d = base(st);
    if(st.guest || !d.houses) continue;
    for(const gi of garrisonTargets(P, si)){
      const g = P.units[gi];
      let v = 4;
      if(d.trigger === "school") v = 13;
      else if(d.trigger === "tower") v = 10 + CARDS[g.id].atk;
      else if(d.trigger === "cave") v = 5 + (g.dmg > 0 ? 5 : 0) + CARDS[g.id].cost;
      else if(d.trigger === "silo") v = 6 + (g.dmg > 0 ? 3 : 0);
      v -= atkOf(P, g, gi) * 0.8;
      out.push({score:v, run:() => moveIn(P, si, gi)});
    }
  }

  /* ---- cards ---- */
  for(let h=0; h<HAND_SIZE; h++){
    const id = P.hand[h], d = CARDS[id];
    const c = bestCost(P, id);
    if(c > P.juice) continue;

    if(d.kind === "spell"){
      const sp = d.spell, n = sp.n ? spellPower(P, d, sp.n) : 0;
      if(sp.id === "volcano"){
        let bl = -1, bv = 0;
        for(let l=0;l<3;l++){
          const ti = frontIdx(E, l);
          let v;
          if(ti < 0) v = E.life <= n ? 999 : n * 2.0;
          else if(spellSafe(E, ti)) continue;
          else v = n >= hpAt(E, ti) ? 9 + atkOf(E, E.units[ti], ti) * 1.6 + lanePower(P, l) * 1.2 : 4 + n * 0.4;
          if(v > bv){ bv = v; bl = l; }
        }
        if(bl >= 0) out.push({score:bv - c, run:() => playCard(P, h, bl)});
      } else if(sp.id === "lane"){
        let bl = -1, bv = 0;
        for(let l=0;l<3;l++){
          let v = 0;
          for(let r=0;r<3;r++){
            const i = idx(r,l);
            if(!E.units[i] || spellSafe(E,i)) continue;
            v += n >= hpAt(E,i) ? 7 + atkOf(E,E.units[i],i) * 1.3 : n * 1.05;
          }
          if(v > bv){ bv = v; bl = l; }
        }
        if(bl >= 0) out.push({score:bv - c, run:() => playCard(P, h, bl)});
      } else if(sp.id === "sweep" || sp.id === "front"){
        let v = 0;
        const list = sp.id === "sweep" ? [0,1,2,3,4,5,6,7,8] : [0,1,2].map(l => frontIdx(E,l)).filter(i => i >= 0);
        for(const i of list){
          if(i < 0 || !E.units[i] || spellSafe(E,i)) continue;
          v += n >= hpAt(E,i) ? 7 + atkOf(E,E.units[i],i) * 1.3 + lanePower(P, lane(i)) * 1.1 : n * 1.05;
        }
        if(v > 0) out.push({score:v - c, run:() => playCard(P, h, 0)});
      } else if(sp.id === "heal"){
        const gain = Math.min(n, START_LIFE - P.life);
        const urg = P.life <= 12 ? 2.5 : P.life <= 20 ? 1.4 : 0.25;
        out.push({score:gain * urg - c, run:() => playCard(P, h, 0)});
      } else if(sp.id === "wither"){
        let v = 0;
        for(let i=0;i<9;i++) if(E.units[i] && !spellSafe(E,i)) v += Math.min(n, atkOf(E,E.units[i],i)) * 1.7;
        if(v > 0) out.push({score:v - c, run:() => playCard(P, h, 0)});
      } else if(sp.id === "teleport"){
        let bs = 0, from = -1, to = -1;
        for(let i=0;i<9;i++){
          const u = P.units[i];
          if(!u || base(u).kind === "structure" || isRanged(u)) continue;
          if(openLane[lane(i)] && frontIdx(P, lane(i)) === i) continue;
          for(let l=0;l<3;l++){
            if(!openLane[l]) continue;
            const t = idx(0, l);
            if(P.units[t]) continue;
            const v = atkOf(P, u, i) * 1.9;
            if(v > bs){ bs = v; from = i; to = t; }
          }
        }
        if(from >= 0) out.push({score:bs - c, run:() => playCard(P, h, from, to)});
      } else if(sp.id === "buff"){
        let bi = -1, bv = 0;
        for(let i=0;i<9;i++){
          const u = P.units[i];
          if(!u || base(u).kind === "structure") continue;
          const v = 4 + atkOf(P, u, i) * 1.2 + (isRanged(u) ? 3 : 0);
          if(v > bv){ bv = v; bi = i; }
        }
        if(bi >= 0) out.push({score:bv - c, run:() => playCard(P, h, bi)});
      } else if(sp.id === "reclaim"){
        const want = {};
        for(let hh=0; hh<HAND_SIZE; hh++){
          const hd = CARDS[P.hand[hh]];
          if(hd.kind !== "spell") want[hd.bio] = (want[hd.bio] || 0) + 1;
        }
        const wish = Object.keys(want).sort((x, y) => want[y] - want[x])[0];
        const tl = [], bl = [];
        if(wish){
          for(let i=0;i<9 && tl.length < (sp.n || 1);i++){
            const b2 = P.tiles[i].bio;
            if(b2 === "rain" || b2 === wish) continue;
            const u = P.units[i];
            if(u && base(u).kind === "structure") continue;
            tl.push(i); bl.push(u ? base(u).bio : wish);
          }
        }
        if(tl.length) out.push({score:3 + tl.length * 2.5 - c, run:() => playCard(P, h, tl, bl)});
      } else if(sp.id === "frenzy"){
        let n2 = 0;
        for(let i=0;i<9;i++) if(P.units[i] && base(P.units[i]).floop) n2++;
        if(n2 > 0) out.push({score:n2 * 3.2 - c, run:() => playCard(P, h, 0)});
      }
      continue;
    }

    if(d.special === "swarm"){
      let v = 0, filled = 0;
      for(let i=0;i<9 && filled<3;i++){
        if(P.units[i]) continue;
        filled++;
        v += openLane[lane(i)] ? 4.2 : Math.min(threat[lane(i)] * 1.6, 7);
      }
      if(filled) out.push({score:3 + v - c * 1.2, run:() => playCard(P, h, 0)});
      continue;
    }

    for(let i=0;i<9;i++){
      if(P.units[i]) continue;
      const cost = costOf(P, id, i);
      if(cost > P.juice) continue;
      const b = P.tiles[i].bio, l = lane(i), r = row(i);
      const ranged = (d.tags || []).includes("ranged"), struct = d.kind === "structure";
      let s = 5 + (d.atk || 0) * 2 + (d.hp || 0) * 1.1;
      if(b === d.bio || b === "rain") s += 3;
      if(b === "corn") s += 2; else if(b === "blue") s += 2; else if(b === "sandy") s += 2.5;
      else if(b === "nice") s += 1.5; else if(b === "swamp") s += 1.5;
      if(b === "rain") s += 2;
      if(d.special === "husker") s += P.tiles.filter(t => t.bio === "corn").length * 2;
      // everything in the lane swings, so the front row is simply the one that gets hit
      if(r === 0) s += (d.hp || 0) * 0.5 - (d.atk || 0) * 0.3 + (struct ? 5 : 0) - (ranged ? 3 : 0);
      else s += (d.atk || 0) * 0.35 + (ranged ? 3.5 : 1);
      if(openLane[l]) s += (d.atk || 0) * 2.0 - (struct ? 5 : 0);
      else s += Math.min(threat[l] * 1.7, 11) + (struct ? 3 : 0);
      // hold all three bridges: an empty lane of yours is a free run at your castle
      s -= mineIn[l] * 2.1;
      if(mineIn[l] === 0) s += 5 + threat[l] * 1.4;
      if(d.houses) s += 2;                                    // structures that take lodgers earn their slot
      s -= cost * TUNE.cost;
      s -= (9 - P.units.filter(u => !u).length) * TUNE.slot;   // the last tiles are worth holding
      const after = P.juice - cost;
      for(let k=0;k<HAND_SIZE;k++){
        if(k !== h && bestCost(P, P.hand[k]) <= after){ s += 2; break; }
      }
      if(P.juice >= 9) s += 4;
      out.push({score:s, run:() => playCard(P, h, i)});
    }
  }

  /* ---- flooping creatures ---- */
  for(let i=0;i<9;i++){
    if(!canFloopUnit(P, i)) continue;
    const u = P.units[i], f = base(u).floop, lost = atkOf(P, u, i) * 1.4;
    if(f.id === "heal"){
      const g = Math.min(f.n, START_LIFE - P.life);
      out.push({score:g * (P.life <= 16 ? 2.3 : 1.1) - lost, run:() => doFloop(P, i)});
    } else if(f.id === "juice"){
      out.push({score:(P.juice < 6 ? 5 : 2.4) - lost, run:() => doFloop(P, i)});
    } else if(f.id === "healall"){
      let v = 0;
      for(let k=0;k<9;k++) if(P.units[k]) v += Math.min(f.n, P.units[k].dmg) * 1.3;
      out.push({score:v - lost, run:() => doFloop(P, i)});
    } else if(f.id === "snipe"){
      let bt = -1, bv = 0;
      for(let k=0;k<9;k++){
        if(!E.units[k]) continue;
        const v = f.n >= hpAt(E,k) ? 9 + atkOf(E,E.units[k],k) * 1.4 : f.n * 1.1;
        if(v > bv){ bv = v; bt = k; }
      }
      if(bt >= 0) out.push({score:bv - lost, run:() => doFloop(P, i, {target:bt})});
    } else if(f.id === "mend"){
      let bt = -1, bv = 0;
      for(let k=0;k<9;k++){
        if(!P.units[k] || !P.units[k].dmg) continue;
        const v = P.units[k].dmg * 1.25;
        if(v > bv){ bv = v; bt = k; }
      }
      if(bt >= 0) out.push({score:bv - lost, run:() => doFloop(P, i, {target:bt})});
    } else if(f.id === "move"){
      if(!openLane[lane(i)]){
        for(let l=0;l<3;l++){
          if(!openLane[l]) continue;
          const t = idx(0, l);
          if(!P.units[t]){ out.push({score:atkOf(P, u, i) * 1.7, run:() => doFloop(P, i, {target:t})}); break; }
        }
      }
    } else if(f.id === "cycle"){
      out.push({score:2.2 - lost, run:() => doFloop(P, i)});
    }
  }

  /* ---- retilling a tile under a card it would rather stand on ---- */
  if(!P.tileFlooped && P.juice >= TILE_FLOOP_COST + 3){
    let bi = -1, bb = null, bv = 0;
    for(let i=0;i<9;i++){
      if(P.tiles[i].bio === "rain") continue;
      const u = P.units[i];
      if(u){
        const d2 = base(u);
        if(d2.kind === "structure" || P.tiles[i].bio === d2.bio) continue;
        const v = 3 + (d2.bio === "corn" ? 2 : d2.bio === "blue" ? 1.5 : 1);
        if(v > bv){ bv = v; bi = i; bb = d2.bio; }
      } else {
        for(let hh=0; hh<HAND_SIZE; hh++){
          const hd = CARDS[P.hand[hh]];
          if(hd.kind === "spell" || P.tiles[i].bio === hd.bio) continue;
          if(hd.cost > P.juice) continue;
          const v = 2.5;
          if(v > bv){ bv = v; bi = i; bb = hd.bio; }
        }
      }
    }
    if(bi >= 0) out.push({score:bv, run:() => floopTile(P, bi, bb)});
  }
  return out;
}

<script>
"use strict";
/* =====================================================================
   FLOATERS, LOG, SHARED BITS
   ===================================================================== */
const fxq = [];
function fx(sel, text, cls){ fxq.push({sel, text, cls}); }
function flushFx(){
  const layer = $("fx");
  let n = 0;
  while(fxq.length){
    const f = fxq.shift();
    const el = document.querySelector(f.sel);
    if(!el) continue;
    const r = el.getBoundingClientRect();
    if(!r.width && !r.height) continue;
    const d = document.createElement("div");
    d.className = "float " + f.cls;
    d.textContent = f.text;
    d.style.left = (r.left + r.width / 2) + "px";
    d.style.top = (r.top + r.height / 2 - (n % 4) * 16) + "px";
    layer.appendChild(d);
    setTimeout(() => d.remove(), 1200);
    n++;
  }
}
function shake(){
  const w = $("arenawrap");
  if(!w) return;
  w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake");
  setTimeout(() => w.classList.remove("shake"), 380);
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}
function logLine(cls, text){
  if(!S) return;
  S.log.push({cls, text});
  if(S.log.length > 80) S.log.shift();
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function flash(msg){ fx("#handcards", msg, "note"); }

/* =====================================================================
   CARD FACES
   ===================================================================== */
function cardFace(id, opts){
  opts = opts || {};
  const d = CARDS[id], lv = opts.lvl || 1, lb = lvlBonus(id, lv);
  const cls = ["gc", "k-" + d.kind];
  if(opts.cls) cls.push(opts.cls);
  let cost = opts.cost !== undefined ? opts.cost : d.cost;
  const stats = d.kind === "spell" ? "" :
    '<span class="sts">' +
      (d.kind === "unit" ? '<span class="pip atk' + (lb.atk ? " up" : "") + '">' + (d.atk + lb.atk) + "</span>" : "") +
      '<span class="pip hp' + (lb.hp ? " up" : "") + '">' + (d.hp + lb.hp) + "</span></span>";
  let dupes = "";
  if(opts.dupes){
    const need = UPGRADE[lv + 1] ? UPGRADE[lv + 1].copies : 0;
    const have = opts.copies || 0;
    const pct = need ? Math.min(100, have / need * 100) : 100;
    dupes = '<span class="dupes"><i style="width:' + pct + '%"></i><span>' +
      (need ? have + "/" + need : "MAX") + "</span></span>";
  }
  return '<div class="' + cls.join(" ") + '"' + (opts.attrs || "") + '>' +
    '<span class="rar"></span>' +
    '<span class="cost' + (opts.deal ? " deal" : "") + '">' + cost + "</span>" +
    '<span class="biome" title="' + esc(BIO[d.bio].name) + '">' + BIO[d.bio].icon + "</span>" +
    '<span class="art">' + d.art + "</span>" +
    '<span class="nm">' + esc(d.name) + "</span>" + stats +
    (lv > 1 ? '<span class="lvl2">lv' + lv + "</span>" : "") + dupes + "</div>";
}
function kindWord(d){ return d.kind === "unit" ? "Creature" : d.kind === "structure" ? "Structure" : "Spell"; }
function cardBlurb(id){
  const d = CARDS[id];
  const kws = [];

/* Creatures and castles are counter-rotated children that stand out past the
   board's own box, so fit to the union of what is actually drawn. */
function fitBoard(){
  const b = $("board"), w = $("arenawrap");
  if(!b || !w || !w.clientHeight) return;
  const prev = b.style.getPropertyValue("--bscale") || "1";
  b.style.setProperty("--bdy", "0px");
  b.style.setProperty("--bscale", "1");
  let top = Infinity, bot = -Infinity, left = Infinity, right = -Infinity;
  const parts = [b].concat(Array.prototype.slice.call(b.querySelectorAll(".keep, .standee")));
  for(const e of parts){
    const r = e.getBoundingClientRect();
    if(!r.width || !r.height) continue;
    top = Math.min(top, r.top); bot = Math.max(bot, r.bottom);
    left = Math.min(left, r.left); right = Math.max(right, r.right);
  }
  const h = bot - top, wd = right - left;
  if(!(h > 0) || !(wd > 0)){ b.style.setProperty("--bscale", prev); return; }
  const s = Math.max(.34, Math.min(1, Math.min((w.clientWidth - 16) / wd, (w.clientHeight - 12) / h)));
  // ignore hair-thin changes so the board doesn't twitch as creatures come and go
  b.style.setProperty("--bscale", (Math.abs(s - parseFloat(prev)) < 0.02 ? parseFloat(prev) : s).toFixed(3));
  // a transform doesn't move the layout box, so centre on what is actually drawn
  let t2 = Infinity, b2 = -Infinity;
  for(const e of parts){
    const r = e.getBoundingClientRect();
    if(!r.width || !r.height) continue;
    t2 = Math.min(t2, r.top); b2 = Math.max(b2, r.bottom);
  }
  if(b2 > t2){
    const wr = w.getBoundingClientRect();
    b.style.setProperty("--bdy", ((wr.top + wr.bottom) / 2 - (t2 + b2) / 2).toFixed(1) + "px");
  }
}
function targets(){
  const t = {mine:new Set(), foes:new Set(), tiles:new Set(), kind:null};
  if(!S || S.over || S.active !== "you" || !S.pending) return t;
  const p = S.pending, P = S.you, E = S.foe;
  t.kind = p.kind;
  if(p.kind === "place"){
    const id = P.hand[p.h];
    for(let i=0;i<9;i++) if(!P.units[i] && costOf(P, id, i) <= P.juice) t.mine.add(i);
  } else if(p.kind === "myEmptyTile"){
    for(let i=0;i<9;i++) if(!P.units[i] && (p.laneLock === undefined || lane(i) === p.laneLock)) t.mine.add(i);
  } else if(p.kind === "myUnit" || p.kind === "garrison"){
    (p.list || P.units.map((u, i) => u && base(u).kind !== "structure" ? i : -1).filter(i => i >= 0))
      .forEach(i => t.mine.add(i));
  } else if(p.kind === "myTile"){
    for(let i=0;i<9;i++) t.mine.add(i);
  } else if(p.kind === "enemyLane"){
    for(let l=0;l<3;l++){ const i = frontIdx(E, l); for(let r=0;r<3;r++) t.foes.add(idx(r, l)); }
  } else if(p.kind === "enemyUnit"){
    for(let i=0;i<9;i++) if(E.units[i]) t.foes.add(i);
  }
  return t;
}
function standeeHTML(P, i, hot){
  const u = P.units[i];
  if(!u) return "";
  const d = base(u), a = atkOf(P, u, i), hp = hpOf(P, u, i), mx = maxHpOf(P, u, i);
  const cls = ["standee"];
  if(P.side === "foe") cls.push("foe");
  if(d.kind === "structure") cls.push("structure");
  if(u.sick) cls.push("sick");
  if(u.tapped) cls.push("tapped");
  if(!seenUnits.has(u.uid)) seenUnits.add(u.uid);
  if(P.side === "you" && canFloopUnit(P, i) && S.active === "you" && !S.over && !S.pending) cls.push("canfloop");
  if(hot) cls.push(P.side === "foe" ? "hot" : "pickme");
  let tag = "";
  if(u.sick) tag = '<span class="tagline zzz">zzz</span>';
  else if(u.wither) tag = '<span class="tagline">−' + u.wither + "</span>";
  else if(u.wander !== undefined) tag = '<span class="tagline">leaves</span>';
  else if(isRanged(u)) tag = '<span class="tagline rng">ranged</span>';
  else if(d.houses && u.guest) tag = '<span class="tagline safe">occupied</span>';
  const sts = d.kind === "structure"
    ? '<span class="pip hp">' + hp + "/" + mx + "</span>"
    : '<span class="pip atk">' + a + '</span><span class="pip hp">' + hp + "/" + mx + "</span>";
  return '<div class="' + cls.join(" ") + '" data-card="' + u.id + '">' + tag +
    '<span class="shadow"></span>' +
    '<span class="body"><span class="sart">' + d.art + "</span>" +
    '<span class="snm">' + esc(d.name) + "</span>" +
    '<span class="sst">' + sts + "</span></span>" +
    (u.guest ? '<span class="inhab" title="' + esc(base(u.guest).name + " is inside") + '">' + base(u.guest).art + "</span>" : "") +
    "</div>";
}
function renderSide(P, elId, isFoe, t){

    for(let l=0;l<3;l++){
      const i = idx(r, l), b = BIO[P.tiles[i].bio], on = hot.has(i);
      const unitHot = on && (t.kind === "enemyUnit" || t.kind === "myUnit" || t.kind === "garrison") && !!P.units[i];
      const cls = ["tile"];
      if(on && !unitHot) cls.push(isFoe ? "hittable" : (t.kind === "myTile" ? "floopable" : "legal"));
      if(S.pending && !on && !unitHot) cls.push("dim");
      html += '<div class="' + cls.join(" ") + '" id="tile-' + P.side + "-" + i + '" style="--bio:' + b.color +
        '" data-side="' + P.side + '" data-i="' + i + '" title="' + esc(b.name + " — " + b.note) + '">' +
        '<span class="bico">' + b.icon + "</span>" +

function renderRiver(){

function renderPlate(P, elId){

function render(){

      cls:(broke ? "broke" : "playable") + (S.pending && S.pending.h === h ? " sel" : ""),
      attrs:' data-act="hand" data-h="' + h + '" tabindex="0"'});
  }
  $("handcards").innerHTML = hand;

  $("btn-end").disabled = S.active !== "you" || !!S.over;

  const ft = $("btn-floop-tile");
  ft.disabled = S.active !== "you" || !!S.over || P.tileFlooped || P.juice < TILE_FLOOP_COST;
  ft.textContent = P.tileFlooped ? "Tile flooped" : "Floop a tile · " + TILE_FLOOP_COST;

  const hint = $("cardhint");
  if(hint){
    const id = S.focus || (S.pending && S.pending.h !== undefined ? P.hand[S.pending.h] : null);

    else if(S.pending){ hint.classList.remove("off"); hint.innerHTML = PEND_HINT[S.pending.kind] || "Pick a target."; }
    else hint.classList.add("off");

  $("logfeed").innerHTML = S.log.map(l => '<p class="' + l.cls + '">' + esc(l.text) + "</p>").join("");
  $("logfeed").scrollTop = $("logfeed").scrollHeight;

function onHandClick(h){
  if(!myTurn()) return;
  const P = S.you, id = P.hand[h], d = CARDS[id];
  S.focus = id;
  if(S.pending && S.pending.h === h){ S.pending = null; render(); return; }
  S.pending = null;
  if(bestCost(P, id) > P.juice){ flash("Not enough juice"); render(); return; }

  if(d.kind === "spell"){
    const tg = d.spell.target;
    if(tg === "enemyLane") S.pending = {kind:"enemyLane", h};
    else if(tg === "myTile"){
      P.juice -= costOf(P, id);
      cycleOut(P, h);
      logLine("", "You cast " + d.name + ".");
      S.pending = {kind:"myTile", mode:"reclaim", def:d, left:d.spell.n || 1};
    }
    else if(tg === "myUnit"){
      const list = P.units.map((u, i) => u && base(u).kind !== "structure" ? i : -1).filter(i => i >= 0);
      if(!list.length){ flash("No creature to target"); render(); return; }
      if(d.spell.id === "teleport" && P.units.every(u => u)){ flash("Nowhere to land"); render(); return; }
      S.pending = {kind:"myUnit", h, then:d.spell.id, list};
    } else { playCard(P, h, 0); render(); return; }
  } else if(d.special === "swarm"){
    if(P.units.every(u => u)){ flash("Every tile is full"); render(); return; }
    playCard(P, h, 0); render(); return;
  } else {
    if(!P.units.some((u, i) => !u && costOf(P, id, i) <= P.juice)){ flash("No tile you can afford"); render(); return; }
    S.pending = {kind:"place", h};
  }
  render();
}

function onTileClick(side, i){

    if(p.kind === "place" && side === "you" && !P.units[i] && costOf(P, P.hand[p.h], i) <= P.juice){
      S.pending = null; playCard(P, p.h, i); render(); return;
    }
    if(p.kind === "enemyLane" && side === "foe"){

  const u = (side === "you" ? P : E).units[i];

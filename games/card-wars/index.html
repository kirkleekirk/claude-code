<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floop the Pig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* ---------------------------------------------------------------
   FLOOP THE PIG - a fan-made Card Wars battle mat
   Single visual world: a felt playmat under treehouse lamplight.
   Every colour is painted explicitly so the page holds on any host.
   --------------------------------------------------------------- */
:root{
  --mat:#1E4034; --mat-2:#183429; --mat-3:#0E211B; --mat-4:#0A1814;
  --ink:#16130F; --ink-soft:rgba(22,19,15,.55);
  --cream:#F7EFDC; --cream-2:#E7DBC0; --cream-3:#CFC0A0;
  --corn:#F5C542; --corn-deep:#C8971F;
  --candy:#E8547C; --sky:#6EC6E8; --spell:#A184DB; --wood:#C98B5A;
  --moss:#93AA9D; --moss-dim:#6C8579; --good:#7CD98C;
  --stroke:2.5px; --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100dvh; padding:10px;
  background:
    radial-gradient(120% 90% at 50% -10%, #2A5443 0%, var(--mat-3) 62%, var(--mat-4) 100%);
  color:var(--cream);
  font-family:Nunito,"Segoe UI",system-ui,sans-serif;
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky); outline-offset:2px; border-radius:4px}

/* ------------------------------ shell ------------------------------ */
.app{max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:10px; min-height:calc(100dvh - 20px)}

.topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand h1{
  margin:0; font-family:"Luckiest Guy",Impact,fantasy; font-weight:400;
  font-size:clamp(21px,3.6vw,30px); letter-spacing:.6px; line-height:1;
  color:var(--corn);
  text-shadow:2.5px 2.5px 0 var(--ink), 0 0 22px rgba(245,197,66,.28);
}
.brand .sub{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--moss-dim); font-weight:700; white-space:nowrap;
}
.topbar-actions{margin-left:auto; display:flex; gap:8px}
.btn{
  background:var(--cream); color:var(--ink); border:var(--stroke) solid var(--ink);
  border-radius:999px; padding:7px 15px; font-weight:800; cursor:pointer;
  box-shadow:0 3px 0 var(--ink); transition:transform .08s, box-shadow .08s;
}
.btn:hover{transform:translateY(1px); box-shadow:0 2px 0 var(--ink)}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:transparent; color:var(--cream); border-color:rgba(247,239,220,.34); box-shadow:none}
.btn.ghost:hover{background:rgba(247,239,220,.10); transform:none}
.btn.hero{background:var(--corn); font-family:"Luckiest Guy",Impact,fantasy; font-weight:400; letter-spacing:.5px; font-size:16px; padding:9px 22px}
.btn:disabled{opacity:.42; cursor:not-allowed; box-shadow:0 3px 0 var(--ink); transform:none}

.table{display:grid; grid-template-columns:minmax(0,1fr) 286px; gap:10px; align-items:stretch; flex:1; min-height:0}

/* ------------------------------ the mat ------------------------------ */
.mat{
  position:relative; border:var(--stroke) solid var(--ink); border-radius:18px;
  padding:10px; display:flex; flex-direction:column; gap:8px; min-height:0;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.020) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 5px),
    radial-gradient(90% 70% at 50% 50%, var(--mat) 0%, var(--mat-2) 100%);
  box-shadow:inset 0 0 60px rgba(0,0,0,.42), 0 8px 0 rgba(0,0,0,.32);
}

/* player bars */
.pbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.pbar .who{display:flex; align-items:center; gap:8px; min-width:0}
.avatar{
  width:34px; height:34px; flex:none; display:grid; place-items:center; font-size:19px;
  border:var(--stroke) solid var(--ink); border-radius:50%; background:var(--cream);
}
.pname{font-family:"Luckiest Guy",Impact,fantasy; font-weight:400; letter-spacing:.4px; font-size:15px; line-height:1.1}
.pdeck{font-size:10.5px; color:var(--moss); letter-spacing:.08em; text-transform:uppercase; font-weight:700}
.gauge{display:flex; align-items:center; gap:7px}
.gauge .cap{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--moss-dim); font-weight:800}
.meter{width:104px; height:11px; border:2px solid var(--ink); border-radius:999px; background:var(--mat-4); overflow:hidden}
.meter i{display:block; height:100%; border-radius:999px; transition:width .3s ease}
.meter.life i{background:linear-gradient(90deg,#B8365C,var(--candy))}
.meter.juice i{background:linear-gradient(90deg,#3E93B8,var(--sky))}
.num{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:15px; font-weight:700}
.num.life{color:var(--candy)} .num.juice{color:var(--sky)}
.turnchip{
  margin-left:auto; display:flex; align-items:center; gap:6px; padding:4px 11px;
  border:2px solid var(--ink); border-radius:999px; background:var(--mat-4);
  font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--moss);
}
.turnchip.on{background:var(--corn); color:var(--ink)}
.turnchip.ot{background:var(--candy); color:var(--cream)}

/* lanes */
.lanes{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; flex:1 1 0; min-height:0}
.lane{display:flex; flex-direction:column; gap:5px}
.lane.foe{flex-direction:column}          /* land on top, unit toward the seam */
.lane.you{flex-direction:column-reverse}  /* unit toward the seam, land on bottom */

.land{
  border:2px solid var(--ink); border-radius:8px; padding:4px 7px;
  display:flex; align-items:center; gap:6px; min-height:34px;
  background:var(--land,#3A5A4C); color:var(--ink);
}
.land .lico{font-size:14px; line-height:1; flex:none}
.land .ltext{min-width:0}
.land .lname{display:block; font-size:10.5px; font-weight:800; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.land .lbuff{display:block; font-size:9.5px; font-weight:700; opacity:.72; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.slot{
  position:relative; min-height:104px; border-radius:var(--r); padding:3px;
  border:2px dashed rgba(247,239,220,.20); background:rgba(0,0,0,.16); flex:1;
  display:flex; transition:border-color .15s, background .15s, transform .1s;
}
.slot.legal{border-style:solid; border-color:var(--corn); background:rgba(245,197,66,.13); cursor:pointer; animation:pulse 1.3s ease-in-out infinite}
.slot.legal:hover{background:rgba(245,197,66,.26); transform:translateY(-2px)}
.slot.hittable{border-style:solid; border-color:var(--candy); background:rgba(232,84,124,.15); cursor:pointer; animation:pulse 1.3s ease-in-out infinite}
.slot.hittable:hover{background:rgba(232,84,124,.3)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(245,197,66,.14)}}

/* a creature on the mat */
.unit{
  position:relative; flex:1; min-width:0; border:var(--stroke) solid var(--ink); border-radius:9px;
  background:var(--cream); color:var(--ink); padding:5px 5px 4px;
  display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.4);
}
.unit.fresh{animation:slam .22s cubic-bezier(.2,1.5,.5,1)}
@keyframes slam{from{transform:scale(1.3) rotate(-6deg); opacity:0}}
.unit.structure{background:var(--wood)}
.unit.sick{filter:saturate(.55)}
.unit.tapped{transform:rotate(6deg); filter:brightness(.86)}
.unit.can-floop{box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 0 3px rgba(161,132,219,.65)}
.unit.targetable{box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 0 3px var(--candy)}
.unit .uart{font-size:22px; line-height:1.1}
.unit .uname{
  font-family:"Luckiest Guy",Impact,fantasy; font-weight:400; font-size:10px; line-height:1.05;
  text-align:center; letter-spacing:.2px; overflow-wrap:anywhere;
}
.unit .ustats{display:flex; gap:4px; margin-top:auto; font-family:"JetBrains Mono",monospace; font-size:11px; font-variant-numeric:tabular-nums}
.pip{border:2px solid var(--ink); border-radius:6px; padding:0 5px; font-weight:700; background:var(--cream-2)}
.pip.atk{background:var(--corn)} .pip.hp{background:#F2A0B6}
.pip.buffed{background:var(--good)}
.utag{
  position:absolute; top:-8px; right:-6px; font-size:8.5px; font-weight:800; letter-spacing:.05em;
  text-transform:uppercase; background:var(--ink); color:var(--cream);
  border-radius:999px; padding:2px 6px; border:2px solid var(--cream);
}
.utag.zzz{background:var(--moss-dim)} .utag.rush{background:var(--candy)}

.seam{
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:1px 0;
  border-top:2px dashed rgba(247,239,220,.20); border-bottom:2px dashed rgba(247,239,220,.20);
  padding:3px 0;
}
.seam span{
  text-align:center; font-size:9.5px; font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; color:var(--moss-dim);
}
.seam span.open{color:var(--candy)}

/* ------------------------------ hand ------------------------------ */
.handbar{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap}
.hand{display:flex; gap:7px; flex:1; min-width:0}
.card{
  flex:1 1 0; min-width:0; max-width:120px; border:var(--stroke) solid var(--ink); border-radius:10px;
  background:var(--cream); color:var(--ink); padding:6px 5px 5px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px; position:relative;
  box-shadow:0 4px 0 rgba(0,0,0,.42); transition:transform .12s, box-shadow .12s;
}
.card:hover{transform:translateY(-5px) rotate(-1deg); box-shadow:0 8px 0 rgba(0,0,0,.42)}
.card.sel{transform:translateY(-9px); box-shadow:0 10px 0 rgba(0,0,0,.42), 0 0 0 3px var(--corn)}
.card.broke{opacity:.5; cursor:not-allowed}
.card.broke:hover{transform:none; box-shadow:0 4px 0 rgba(0,0,0,.42)}
.card .band{position:absolute; inset:0 0 auto; height:5px; border-radius:6px 6px 0 0; background:var(--corn)}
.card.spell .band{background:var(--spell)} .card.structure .band{background:var(--wood)}
.card .cost{
  position:absolute; top:-9px; left:-7px; width:25px; height:25px; display:grid; place-items:center;
  border:var(--stroke) solid var(--ink); border-radius:50%; background:var(--sky); color:var(--ink);
  font-family:"JetBrains Mono",monospace; font-weight:700; font-size:12px;
}
.card .cost.deal{background:var(--good)}
.card .cart{font-size:26px; line-height:1.15; margin-top:5px}
.card .cname{
  font-family:"Luckiest Guy",Impact,fantasy; font-weight:400; font-size:10.5px; line-height:1.06;
  text-align:center; letter-spacing:.2px; overflow-wrap:anywhere;
}
.card .cstats{display:flex; gap:4px; font-family:"JetBrains Mono",monospace; font-size:11px}
.card .chome{font-size:11px; line-height:1}
.card .ckind{font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}

.nextup{display:flex; flex-direction:column; align-items:center; gap:4px; flex:none}
.nextup .cap{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--moss-dim); font-weight:800}
.nextup .card{width:62px; max-width:62px; flex:none; cursor:default; opacity:.9; transform:scale(.92)}
.nextup .card:hover{transform:scale(.92)}

/* ------------------------------ sidebar ------------------------------ */
.rail{display:flex; flex-direction:column; gap:10px; min-width:0}
.panel{
  border:var(--stroke) solid var(--ink); border-radius:14px; background:var(--mat-2);
  box-shadow:0 5px 0 rgba(0,0,0,.32); overflow:hidden;
}
.panel > h2{
  margin:0; padding:7px 11px; font-family:"Luckiest Guy",Impact,fantasy; font-weight:400;
  font-size:12.5px; letter-spacing:.1em; text-transform:uppercase;
  background:var(--ink); color:var(--corn);
}
.inspect{padding:10px 11px; display:flex; flex-direction:column; gap:7px; min-height:172px}
.inspect .ihead{display:flex; align-items:center; gap:9px}
.inspect .iart{font-size:28px; line-height:1; flex:none}
.inspect .iname{font-family:"Luckiest Guy",Impact,fantasy; font-weight:400; font-size:15px; line-height:1.1; color:var(--corn)}
.inspect .imeta{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--moss); font-weight:800}
.inspect .irow{display:flex; gap:6px; flex-wrap:wrap}
.tag{
  border:2px solid var(--ink); border-radius:999px; padding:1px 8px; font-size:10.5px; font-weight:800;
  background:var(--mat-4); color:var(--cream);
}
.tag.atk{background:var(--corn); color:var(--ink)} .tag.hp{background:#F2A0B6; color:var(--ink)}
.tag.cost{background:var(--sky); color:var(--ink)} .tag.home{background:var(--cream); color:var(--ink)}
.inspect .itext{font-size:12.5px; line-height:1.42; color:var(--cream)}
.inspect .iflavor{font-size:11.5px; font-style:italic; color:var(--moss); margin-top:auto}
.inspect .ihint{font-size:11.5px; color:var(--moss); line-height:1.4}

.log{display:flex; flex-direction:column; flex:1 1 auto; min-height:180px}
.logfeed{overflow-y:auto; padding:8px 11px; display:flex; flex-direction:column; gap:6px; font-size:12.5px}
.logfeed p{margin:0; color:var(--cream-3); line-height:1.4}
.logfeed p b{color:var(--corn); font-weight:800}
.logfeed p.bmo{color:var(--sky); font-weight:700}
.logfeed p.hit{color:var(--candy)}
.logfeed p.foe{color:var(--cream-2)}
.logfeed p.turn{
  color:var(--moss-dim); font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-weight:800;
  border-top:1px solid rgba(247,239,220,.14); padding-top:6px; margin-top:2px;
}

/* ------------------------------ overlays ------------------------------ */
.scrim{
  position:fixed; inset:0; background:rgba(10,24,20,.86); backdrop-filter:blur(3px);
  display:grid; place-items:center; padding:18px; z-index:40; overflow-y:auto;
}
.scrim[hidden]{display:none}
.sheet{
  width:min(620px,100%); border:var(--stroke) solid var(--ink); border-radius:18px;
  background:var(--mat); box-shadow:0 10px 0 rgba(0,0,0,.44); padding:18px 20px;
  display:flex; flex-direction:column; gap:13px; margin:auto;
}
.sheet h2{
  margin:0; font-family:"Luckiest Guy",Impact,fantasy; font-weight:400; font-size:24px;
  letter-spacing:.5px; color:var(--corn); text-shadow:2px 2px 0 var(--ink); text-wrap:balance;
}
.sheet h3{
  margin:6px 0 0; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--moss); font-weight:800;
}
.sheet p{margin:0; max-width:62ch; color:var(--cream-2); font-size:13.5px}
.sheet ol,.sheet ul{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:5px; font-size:13.5px; color:var(--cream-2); max-width:62ch}
.sheet b{color:var(--cream)}
.sheet .foot{display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; margin-top:3px}
.landkey{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:7px}
.landkey div{
  border:2px solid var(--ink); border-radius:8px; padding:5px 9px; color:var(--ink);
  background:var(--land,#3A5A4C); font-size:11.5px; font-weight:700;
}
.landkey b{display:block; font-size:12px; color:var(--ink)}

.picker{display:grid; grid-template-columns:repeat(auto-fit,minmax(136px,1fr)); gap:9px}
.pick{
  text-align:left; border:var(--stroke) solid var(--ink); border-radius:12px; background:var(--mat-2);
  color:var(--cream); padding:9px 11px; cursor:pointer; display:flex; flex-direction:column; gap:3px;
  box-shadow:0 4px 0 rgba(0,0,0,.36);
}
.pick:hover{background:var(--mat)}
.pick.on{background:var(--corn); color:var(--ink); border-color:var(--ink)}
.pick .pt{font-family:"Luckiest Guy",Impact,fantasy; font-weight:400; font-size:14px; letter-spacing:.3px}
.pick .pd{font-size:11.5px; opacity:.86; line-height:1.34}
.pick .pl{font-size:14px; letter-spacing:2px}
.pick.on .pd{opacity:.78}

/* floating combat text */
.fxlayer{position:fixed; inset:0; pointer-events:none; z-index:60}
.float{
  position:absolute; transform:translate(-50%,-50%);
  font-family:"Luckiest Guy",Impact,fantasy; font-weight:400; font-size:24px;
  text-shadow:2.5px 2.5px 0 var(--ink); animation:rise 1s ease-out forwards; white-space:nowrap;
}
.float.dmg{color:var(--candy)} .float.heal{color:var(--good)} .float.juice{color:var(--sky)}
.float.note{font-family:Nunito,sans-serif; font-weight:800; font-size:14px; color:var(--cream); text-shadow:1.5px 1.5px 0 var(--ink)}
.float.floop{color:var(--spell); font-size:31px; animation:burst .85s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes rise{to{transform:translate(-50%,-160%); opacity:0}}
@keyframes burst{
  0%{transform:translate(-50%,-50%) scale(.3) rotate(-14deg); opacity:0}
  35%{transform:translate(-50%,-50%) scale(1.25) rotate(6deg); opacity:1}
  100%{transform:translate(-50%,-95%) scale(1) rotate(-3deg); opacity:0}
}

.mat.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* ------------------------------ responsive ------------------------------ */
@media (max-width:980px){
  .table{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row; flex-wrap:wrap}
  .rail .panel{flex:1 1 260px}
  .log{max-height:210px}
}
@media (max-width:560px){
  body{padding:6px}
  .slot{min-height:88px}
  .card{padding:5px 3px 4px}
  .card .cart{font-size:21px}
  .land .lbuff{display:none}
  .nextup{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Floop the Pig</h1>
      <span class="sub">Card Wars &middot; fan-made</span>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost" id="btn-rules" type="button">How to play</button>
      <button class="btn ghost" id="btn-new" type="button">New match</button>
    </div>
  </header>

  <main class="table">
    <section class="mat" id="mat">
      <div class="pbar" id="foe-bar"></div>
      <div class="lanes" id="foe-lanes"></div>
      <div class="seam" id="seam"></div>
      <div class="lanes" id="you-lanes"></div>
      <div class="pbar" id="you-bar"></div>
      <div class="handbar">
        <div class="hand" id="hand"></div>
        <div class="nextup">
          <span class="cap">Next</span>
          <div id="next"></div>
        </div>
        <button class="btn hero" id="btn-end" type="button">End turn</button>
      </div>
    </section>

    <aside class="rail">
      <div class="panel">
        <h2>Card</h2>
        <div class="inspect" id="inspect"></div>
      </div>
      <div class="panel log">
        <h2>BMO is keeping score</h2>
        <div class="logfeed" id="logfeed"></div>
      </div>
    </aside>
  </main>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet"></div></div>
<div class="fxlayer" id="fx"></div>

<script>
"use strict";
/* =====================================================================
   LANDSCAPES
   Six terrains from the show. The blessing applies to whoever stands
   there; a creature played on its *home* terrain also costs 1 less.
   ===================================================================== */
const LAND = {
  corn:  {name:"Cornfields",    icon:"\u{1F33D}", buff:"+1 ATK",        color:"#E9C55C", note:"Creatures here get +1 ATK."},
  blue:  {name:"Blue Plains",   icon:"\u{1F4A7}", buff:"+2 HP",         color:"#8ECDE8", note:"Creatures here get +2 max HP."},
  nice:  {name:"Nice Lands",    icon:"\u{1F338}", buff:"Heal 1 / turn", color:"#F2A8C4", note:"Creatures here heal 1 at the start of your turn."},
  sandy: {name:"SandyLands",    icon:"\u{1F3DC}", buff:"Rush",          color:"#E5C89A", note:"Creatures here can attack the turn they land."},
  swamp: {name:"Useless Swamp", icon:"\u{1FAB5}", buff:"Spell-proof",   color:"#9AA97E", note:"No stats. But nobody aims a spell at the swamp — creatures here can't be targeted by enemy spells."},
  rain:  {name:"Rainbow",       icon:"\u{1F308}", buff:"+1/+1, any home",color:"#C9A8E8", note:"+1/+1, and it counts as every creature's home terrain."},
};
const LAND_KEYS = Object.keys(LAND);

/* =====================================================================
   CARDS
   Names in quotes are the fourteen-odd cards actually named on screen in
   Adventure Time S4E14; the rest are built in the same spirit.
   ===================================================================== */
const CARDS = {
  husker: {name:"Husker Knights", kind:"unit", cost:4, atk:2, hp:4, home:"corn", art:"\u{1F33D}",
    text:"+1 ATK for each Cornfields you control.", flavor:"“Husker Knights, attack!”", special:"husker"},

<script>
"use strict";
/* =====================================================================
   STATE
   ===================================================================== */
let S = null;
let uidSeq = 1;
const seenUnits = new Set();
const $ = (id) => document.getElementById(id);

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const clamp = (n,lo,hi) => Math.max(lo, Math.min(hi, n));

function makePlayer(side, deckKey, who){
  const d = DECKS[deckKey];
  const cycle = shuffle(d.cards.slice());
  return {
    side, name:who.name, art:who.art, skill:who.skill || null,
    deckKey, deckName:d.name, taunts:who.taunts || null,
    life:START_LIFE, juice:0, turns:0,
    lands:d.lands.slice(),
    lanes:[null,null,null,null],
    hand:cycle.slice(0,HAND_SIZE), next:cycle[HAND_SIZE], rest:cycle.slice(HAND_SIZE+1),
  };
}

function newGame(youDeck, foeKey){
  const foe = FOES[foeKey];
  seenUnits.clear();
  aiActions = 0;
  S = {
    round:1, active:"you", over:null, sel:null, pending:null, focus:null,
    youDeck, foeKey, log:[], busy:false,
  };
  S.you = makePlayer("you", youDeck, {name:"You", art:"\u{1F0CF}"});
  S.foe = makePlayer("foe", foe.deck, foe);
  logLine("bmo", "BMO: Card Wars! " + S.you.deckName + " versus " + S.foe.name + "'s " + S.foe.deckName + ". Twenty-five life each. Begin!");
  beginTurn("you");
}

const opp = (side) => side === "you" ? S.foe : S.you;
const me  = (side) => S[side];
const isOvertime = () => S.round >= OVERTIME_TURN;

/* =====================================================================
   RULES HELPERS
   ===================================================================== */
function juiceGain(){ return isOvertime() ? 11 : Math.min(3 + S.round, 7); }
function juiceCap(){ return isOvertime() ? 14 : JUICE_CAP; }

function unitCost(P, def, lane){
  const land = P.lands[lane];
  const home = def.home && (land === def.home || land === "rain");
  return Math.max(1, def.cost - (home ? 1 : 0));
}
function bestCost(P, def){
  let best = def.cost;
  for(let i=0;i<4;i++) if(!P.lanes[i]) best = Math.min(best, unitCost(P, def, i));
  return best;
}
function atkOf(P, i){
  const u = P.lanes[i];
  if(!u || u.kind === "structure") return 0;
  const def = CARDS[u.id];
  let a = u.atk;
  const land = P.lands[i];
  if(land === "corn") a += 1;
  if(land === "rain") a += 1;
  if(def.special === "husker") a += P.lands.filter(l => l === "corn").length;
  return Math.max(0, a - (u.wither || 0));
}
function spellSafe(P, i){
  const u = P.lanes[i];
  if(!u) return false;
  if(P.lands[i] === "swamp") return true;
  return (CARDS[u.id].keys || []).includes("spellproof");
}
function canFloop(P, i){
  const u = P.lanes[i];
  return !!(u && CARDS[u.id].floop && !u.tapped && !u.flooped);
}

function placeUnit(P, lane, id){
  const def = CARDS[id];
  const land = P.lands[lane];
  const keys = (def.keys || []).slice();
  const u = {
    uid: uidSeq++, id, kind: def.kind,
    atk: def.atk, hp: def.hp, maxHp: def.hp,
    sick: def.kind !== "structure", tapped:false, flooped:false, keys, wither:0,
  };
  if(land === "blue"){ u.maxHp += 2; u.hp += 2; }
  if(land === "rain"){ u.maxHp += 1; u.hp += 1; u.atk += 1; }
  if(land === "sandy" || keys.includes("rush")) u.sick = false;
  if(def.special === "wander") u.wander = 2;
  P.lanes[lane] = u;
  return u;
}
function slotSel(P, i){ return "#slot-" + P.side + "-" + i; }

function hurtUnit(P, i, n, opts){
  const u = P.lanes[i];
  if(!u) return;
  u.hp -= n;
  fx(slotSel(P,i), "-" + n, "dmg");
  if(opts && opts.reap) u.hp = 0;
  if(u.hp <= 0){
    P.lanes[i] = null;
    logLine("hit", CARDS[u.id].name + " is destroyed.");
  }
}
function hurtFace(P, n){
  P.life = Math.max(0, P.life - n);
  fx("#" + P.side + "-bar", "-" + n, "dmg");
  shake();
}
function healFace(P, n){
  const before = P.life;
  P.life = Math.min(START_LIFE, P.life + n);
  if(P.life > before) fx("#" + P.side + "-bar", "+" + (P.life - before), "heal");
}
function addJuice(P, n){
  P.juice = Math.min(juiceCap(), P.juice + n);
  fx("#" + P.side + "-bar", "+" + n + " juice", "juice");
}

/* ------------------------------ turn flow ------------------------------ */
function beginTurn(side){
  const P = me(side), E = opp(side);
  S.active = side; S.sel = null; S.pending = null;
  P.turns++;
  addJuice(P, juiceGain() + (side === "foe" && P.turns === 1 ? 2 : 0));
  for(let i=0;i<4;i++){
    const u = P.lanes[i];
    if(!u) continue;
    u.tapped = false; u.flooped = false; u.sick = false;
    if(P.lands[i] === "nice" && u.hp < u.maxHp){ u.hp = Math.min(u.maxHp, u.hp + 1); fx(slotSel(P,i), "+1", "heal"); }
  }
  for(let i=0;i<4;i++){
    const u = P.lanes[i];
    if(!u) continue;
    const t = CARDS[u.id].trigger;
    if(t === "silo") addJuice(P, 2);
    if(t === "tower" && E.lanes[i]){
      logLine("hit", "Spirit Tower hums at " + CARDS[E.lanes[i].id].name + ".");
      hurtUnit(E, i, 2);
    }
  }
  logLine("turn", (side === "you" ? "Your turn" : S.foe.name + "'s turn") + " · round " + S.round + (isOvertime() ? " · double juice" : ""));
  render();
  if(side === "foe") setTimeout(aiStep, 700);
}

function endTurn(){
  if(S.over) return;
  const side = S.active, P = me(side), E = opp(side);
  S.sel = null; S.pending = null;

  // combat: every rested, awake creature swings down its own lane
  for(let i=0;i<4;i++){
    const u = P.lanes[i];
    if(!u || u.tapped || u.sick || u.kind === "structure") continue;
    const a = atkOf(P, i);
    if(a <= 0) continue;
    if(E.lanes[i]){
      const dName = CARDS[E.lanes[i].id].name;
      const dHp = E.lanes[i].hp;
      const back = Math.floor(atkOf(E, i) / 2);
      const backReap = (E.lanes[i].keys || []).includes("reap");
      logLine("hit", CARDS[u.id].name + " hits " + dName + " for " + a + (back ? ", and takes " + back + " back." : "."));
      hurtUnit(E, i, a, {reap:(u.keys || []).includes("reap")});
      if(!E.lanes[i] && a > dHp){
        logLine("hit", CARDS[u.id].name + " breaks through for " + (a - dHp) + ".");
        hurtFace(E, a - dHp);
      }
      if(back > 0 && P.lanes[i]) hurtUnit(P, i, back, {reap:backReap});
    } else {
      logLine("hit", CARDS[u.id].name + " breaks through lane " + (i+1) + " for " + a + ".");
      hurtFace(E, a);
    }
  }
  // upkeep: wandering men wander, nightmares fade
  for(let i=0;i<4;i++){
    const u = P.lanes[i];
    if(!u) continue;
    if(u.wither) u.wither = 0;
    if(u.wander !== undefined && --u.wander <= 0){
      P.lanes[i] = null;
      logLine("", "Wandering Bald Man wanders off. He had somewhere to be.");
    }
  }
  if(checkOver()) return;
  if(side === "foe") S.round++;
  if(S.round > CALL_TURN){ finish(null, true); return; }
  beginTurn(side === "you" ? "foe" : "you");
}

function checkOver(){
  if(S.you.life <= 0 || S.foe.life <= 0){
    finish(S.foe.life <= 0 && S.you.life > 0 ? "you" : (S.you.life <= 0 && S.foe.life > 0 ? "foe" : null));
    return true;
  }
  return false;
}
function finish(winner, byCall){
  if(byCall) winner = S.you.life === S.foe.life ? null : (S.you.life > S.foe.life ? "you" : "foe");
  S.over = winner === null ? "draw" : winner;
  render();
  showEnd(byCall);
}

/* =====================================================================
   PLAYING CARDS
   ===================================================================== */
function cycleOut(P, handIdx){
  const played = P.hand[handIdx];
  P.hand[handIdx] = P.next;
  P.next = P.rest.shift();
  P.rest.push(played);
}

function playCard(P, handIdx, lane, extra){
  const id = P.hand[handIdx], def = CARDS[id];
  if(def.kind === "spell"){
    P.juice -= def.cost;
    logLine(P.side === "you" ? "" : "foe", (P.side === "you" ? "You cast " : P.name + " casts ") + def.name + ".");
    castSpell(P, def, lane, extra);
  } else if(def.special === "swarm"){
    P.juice -= def.cost;
    let n = 0;
    for(let i=0;i<4 && n<3;i++) if(!P.lanes[i]){ placeUnit(P, i, id); n++; }
    logLine(P.side === "you" ? "" : "foe", (P.side === "you" ? "You " : P.name + " ") + "unleash" + (P.side === "you" ? "" : "es") + " " + n + " Earlings.");
  } else {
    P.juice -= unitCost(P, def, lane);
    placeUnit(P, lane, id);
    logLine(P.side === "you" ? "" : "foe", (P.side === "you" ? "You play " : P.name + " plays ") + def.name + " in lane " + (lane+1) + ".");
  }
  cycleOut(P, handIdx);
  checkOver();
}

function castSpell(P, def, lane, extra){
  const E = opp(P.side), sp = def.spell;
  if(sp.id === "volcano"){
    if(E.lanes[lane]){
      if(spellSafe(E, lane)) logLine("", "The spell slides off " + CARDS[E.lanes[lane].id].name + ".");
      else hurtUnit(E, lane, sp.n);
    } else hurtFace(E, sp.n);
  } else if(sp.id === "sweep"){
    for(let i=0;i<4;i++) if(E.lanes[i] && !spellSafe(E,i)) hurtUnit(E, i, sp.n);
  } else if(sp.id === "heal"){
    healFace(P, sp.n);
  } else if(sp.id === "wither"){
    for(let i=0;i<4;i++) if(E.lanes[i] && !spellSafe(E,i)) E.lanes[i].wither = sp.n;
  } else if(sp.id === "reclaim"){
    P.lands[lane] = extra;
    logLine("", "Lane " + (lane+1) + " is retilled into " + LAND[extra].name + ".");
    const u = P.lanes[lane];
    if(u){ P.lanes[lane] = null; const nu = placeUnit(P, lane, u.id); nu.sick = u.sick; nu.tapped = u.tapped; nu.flooped = u.flooped; nu.hp = Math.min(nu.maxHp, u.hp); }
  } else if(sp.id === "teleport"){
    const u = P.lanes[lane];
    P.lanes[lane] = null;
    const dest = extra;
    const nu = placeUnit(P, dest, u.id);
    nu.hp = Math.min(nu.maxHp, u.hp); nu.sick = false; nu.tapped = u.tapped; nu.flooped = u.flooped;
    fx(slotSel(P,dest), "blorp", "juice");
  } else if(sp.id === "frenzy"){
    for(let i=0;i<4;i++) if(P.lanes[i] && CARDS[P.lanes[i].id].floop && !P.lanes[i].flooped) doFloop(P, i, {free:true, auto:true});
  }
}

/* ------------------------------ flooping ------------------------------ */
function doFloop(P, i, opts){
  opts = opts || {};
  const u = P.lanes[i], def = CARDS[u.id], f = def.floop;
  if(!f) return;
  u.flooped = true;
  if(!opts.free) u.tapped = true;
  fx(slotSel(P,i), "FLOOP!", "floop");
  logLine(P.side === "you" ? "bmo" : "foe", (P.side === "you" ? "You floop " : P.name + " floops ") + def.name + ".");
  if(f.id === "heal") healFace(P, f.n);
  else if(f.id === "juice") addJuice(P, f.n);
  else if(f.id === "snipe"){
    const E = opp(P.side);
    let t = opts.target;
    if(t === undefined || !E.lanes[t]){
      t = -1; let best = -1;
      for(let k=0;k<4;k++) if(E.lanes[k] && E.lanes[k].hp > best){ best = E.lanes[k].hp; t = k; }
    }
    if(t >= 0 && E.lanes[t]) hurtUnit(E, t, f.n);
  } else if(f.id === "move"){
    let dest = opts.target;
    if(dest === undefined || P.lanes[dest]) dest = P.lanes.findIndex(x => !x);
    if(dest >= 0 && dest !== i && !P.lanes[dest]){
      P.lanes[i] = null;
      const nu = placeUnit(P, dest, u.id);
      nu.hp = Math.min(nu.maxHp, u.hp); nu.sick = u.sick; nu.tapped = u.tapped; nu.flooped = true;
    }
  }
  checkOver();
}

<script>
"use strict";
/* =====================================================================
   THE OPPONENT
   One scored action at a time, on a delay, so you can watch it think.
   ===================================================================== */
let aiActions = 0;

function aiStep(){
  if(S.over || S.active !== "foe") return;
  const P = S.foe;
  const moves = aiMoves();
  let floor = P.skill === "hard" ? 1 : P.skill === "easy" ? 3 : 2;
  if(P.juice >= 9) floor -= 2;
  let pick = null;
  if(moves.length){
    moves.sort((a,b) => b.score - a.score);
    if(P.skill === "easy"){
      const ok = moves.filter(m => m.score > floor);
      if(ok.length && Math.random() < 0.9) pick = ok[(Math.random() * Math.min(2, ok.length)) | 0];
    } else if(moves[0].score > floor) pick = moves[0];
  }
  if(pick && aiActions < 8){
    aiActions++;
    pick.run();
    render();
    setTimeout(aiStep, 640);
  } else {
    aiActions = 0;
    if(P.taunts && Math.random() < 0.5) logLine("foe", P.name + ": " + P.taunts[(Math.random() * P.taunts.length) | 0]);
    setTimeout(endTurn, 520);
  }
}

function aiMoves(){
  const P = S.foe, E = S.you, out = [];
  const hard = P.skill === "hard";

  for(let h=0; h<HAND_SIZE; h++){
    const id = P.hand[h], def = CARDS[id];
    if(def.cost > P.juice + 1) continue;

    if(def.kind === "spell"){
      if(def.cost > P.juice) continue;
      const sp = def.spell;
      if(sp.id === "volcano"){
        let bi = -1, bv = 0;
        for(let i=0;i<4;i++){
          let v = 0;
          const eu = E.lanes[i];
          if(eu){
            if(spellSafe(E,i)) continue;
            v = sp.n >= eu.hp ? 9 + atkOf(E,i) * 1.6 + (P.lanes[i] ? atkOf(P,i) * 1.6 : 0) : 4 + sp.n * 0.4;
          } else { v = E.life <= sp.n ? 999 : sp.n * 2.1; }
          if(v > bv){ bv = v; bi = i; }
        }
        if(bi >= 0) out.push({score: bv - def.cost, run: () => playCard(P, h, bi)});
      } else if(sp.id === "sweep"){
        let v = 0;
        for(let i=0;i<4;i++){
          if(!E.lanes[i] || spellSafe(E,i)) continue;
          v += sp.n >= E.lanes[i].hp ? 8 + atkOf(E,i) * 1.4 + (P.lanes[i] ? atkOf(P,i) * 1.4 : 0) : sp.n * 1.1;
        }
        if(v > 0) out.push({score: v - def.cost, run: () => playCard(P, h, 0)});
      } else if(sp.id === "heal"){
        const gain = Math.min(sp.n, START_LIFE - P.life);
        const urgency = P.life <= 10 ? 2.6 : P.life <= 17 ? 1.5 : 0.3;
        out.push({score: gain * urgency - def.cost, run: () => playCard(P, h, 0)});
      } else if(sp.id === "wither"){
        let v = 0;
        for(let i=0;i<4;i++) if(E.lanes[i] && !spellSafe(E,i)) v += Math.min(sp.n, atkOf(E,i)) * 1.9;
        if(v > 0) out.push({score: v - def.cost, run: () => playCard(P, h, 0)});
      } else if(sp.id === "teleport"){
        let bs = 0, from = -1, to = -1;
        for(let i=0;i<4;i++){
          if(!P.lanes[i] || P.lanes[i].kind === "structure" || !E.lanes[i]) continue;
          for(let j=0;j<4;j++){
            if(P.lanes[j] || E.lanes[j]) continue;
            const v = atkOf(P,i) * 1.9;
            if(v > bs){ bs = v; from = i; to = j; }
          }
        }
        if(from >= 0) out.push({score: bs - def.cost, run: () => playCard(P, h, from, to)});
      } else if(sp.id === "reclaim" && hard){
        let bi = -1, bl = null, bv = 0;
        for(let i=0;i<4;i++){
          if(P.lands[i] !== "swamp" || P.lanes[i]) continue;
          for(const k of ["corn","blue","sandy","nice"]){
            const v = k === "corn" ? 5 : 4;
            if(v > bv){ bv = v; bi = i; bl = k; }
          }
        }
        if(bi >= 0) out.push({score: bv - def.cost, run: () => playCard(P, h, bi, bl)});
      } else if(sp.id === "frenzy"){
        let n = 0;
        for(let i=0;i<4;i++) if(P.lanes[i] && CARDS[P.lanes[i].id].floop) n++;
        if(n > 0) out.push({score: n * 3.4 - def.cost, run: () => playCard(P, h, 0)});
      }
      continue;
    }

    if(def.special === "swarm"){
      if(def.cost > P.juice) continue;
      let v = 0, filled = 0;
      for(let i=0;i<4 && filled<3;i++){
        if(P.lanes[i]) continue;
        filled++;
        v += E.lanes[i] ? Math.min(atkOf(E,i) * 2.1, 9) : 4.5;
      }
      if(filled) out.push({score: 3 + v - def.cost * 1.2, run: () => playCard(P, h, 0)});
      continue;
    }

    for(let i=0;i<4;i++){
      if(P.lanes[i]) continue;
      const c = unitCost(P, def, i);
      if(c > P.juice) continue;
      const land = P.lands[i];
      let s = 6 + (def.atk || 0) * 2 + (def.hp || 0) * 1.1;
      if(land === def.home || land === "rain") s += 3;
      if(land === "corn") s += 2;
      if(land === "blue") s += 2;
      if(land === "sandy") s += 2.5;
      if(land === "swamp") s += 1.5;
      if(land === "nice") s += 1.5;
      if(def.special === "husker") s += P.lands.filter(l => l === "corn").length * 2;
      if(E.lanes[i]) s += Math.min(atkOf(E,i) * 1.9, 11) + (def.kind === "structure" ? 4 : 0);
      else s += (def.atk || 0) * 2.1 * (E.life <= 10 ? 1.6 : 1) - (def.kind === "structure" ? 4 : 0);
      s -= c * 1.35;
      if(P.juice >= 8) s += 4;
      out.push({score: s, run: () => playCard(P, h, i)});
    }
  }

  for(let i=0;i<4;i++){
    if(!canFloop(P, i)) continue;
    const def = CARDS[P.lanes[i].id], f = def.floop, lost = atkOf(P, i) * 1.5;
    if(f.id === "heal"){
      const gain = Math.min(f.n, START_LIFE - P.life);
      out.push({score: gain * (P.life <= 14 ? 2.4 : 1.2) - lost, run: () => doFloop(P, i)});
    } else if(f.id === "juice"){
      out.push({score: (P.juice < 6 ? 5 : 2.5) - lost, run: () => doFloop(P, i)});
    } else if(f.id === "snipe"){
      let bt = -1, bv = 0;
      for(let k=0;k<4;k++){
        const eu = E.lanes[k];
        if(!eu) continue;
        const v = f.n >= eu.hp ? 9 + atkOf(E,k) * 1.5 : f.n * 1.15;
        if(v > bv){ bv = v; bt = k; }
      }
      if(bt >= 0) out.push({score: bv - lost, run: () => doFloop(P, i, {target: bt})});
    } else if(f.id === "move"){
      if(E.lanes[i]){
        let bt = -1;
        for(let j=0;j<4;j++) if(!P.lanes[j] && !E.lanes[j]){ bt = j; break; }
        if(bt >= 0) out.push({score: atkOf(P,i) * 1.7, run: () => doFloop(P, i, {target: bt})});
      }
    }
  }
  return out;
}
</script>
<script>
"use strict";
/* =====================================================================
   FLOATING TEXT + LOG
   ===================================================================== */
const fxq = [];
function fx(sel, text, cls){ fxq.push({sel, text, cls}); }
function flushFx(){
  const layer = $("fx");
  let n = 0;
  while(fxq.length){
    const f = fxq.shift();
    const el = document.querySelector(f.sel);
    if(!el) continue;
    const r = el.getBoundingClientRect();
    const d = document.createElement("div");
    d.className = "float " + f.cls;
    d.textContent = f.text;
    d.style.left = (r.left + r.width / 2) + "px";
    d.style.top = (r.top + r.height / 2 - (n % 4) * 15) + "px";
    layer.appendChild(d);
    setTimeout(() => d.remove(), 1150);
    n++;
  }
}
function shake(){
  const m = $("mat");
  m.classList.remove("shake"); void m.offsetWidth; m.classList.add("shake");
  setTimeout(() => m.classList.remove("shake"), 360);
}
function logLine(cls, text){
  if(!S) return;
  S.log.push({cls, text});
  if(S.log.length > 70) S.log.shift();
}

/* =====================================================================
   TARGET HIGHLIGHTS
   ===================================================================== */
function targets(){
  const t = {mine:new Set(), foes:new Set(), kind:null};
  if(!S || S.over || S.active !== "you" || !S.pending) return t;
  const p = S.pending, P = S.you, E = S.foe;
  t.kind = p.kind;
  if(p.kind === "placeUnit"){
    const def = CARDS[P.hand[p.handIdx]];
    for(let i=0;i<4;i++) if(!P.lanes[i] && unitCost(P, def, i) <= P.juice) t.mine.add(i);
  } else if(p.kind === "enemyLane"){
    for(let i=0;i<4;i++) if(!E.lanes[i] || !spellSafe(E, i)) t.foes.add(i);
  } else if(p.kind === "myLane"){
    for(let i=0;i<4;i++) t.mine.add(i);
  } else if(p.kind === "myUnit"){
    for(let i=0;i<4;i++) if(P.lanes[i]) t.mine.add(i);
  } else if(p.kind === "myEmptyLane"){
    for(let i=0;i<4;i++) if(!P.lanes[i]) t.mine.add(i);
  } else if(p.kind === "enemyUnit"){
    for(let i=0;i<4;i++) if(E.lanes[i]) t.foes.add(i);
  }
  return t;
}

/* =====================================================================
   RENDER
   ===================================================================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderBar(P, elId, isFoe){
  const active = S.active === P.side && !S.over;
  const chip = S.over ? "" :
    '<span class="turnchip' + (active ? " on" : "") + (isOvertime() && active ? " ot" : "") + '">' +
      (active ? (isOvertime() ? "Double juice" : "Playing") : "Waiting") + "</span>";
  $(elId).innerHTML =
    '<div class="who"><span class="avatar">' + P.art + '</span><span>' +
      '<span class="pname">' + esc(P.name) + '</span><br><span class="pdeck">' + esc(P.deckName) + "</span></span></div>" +
    '<div class="gauge"><span class="cap">Life</span><span class="num life">' + P.life + "</span>" +
      '<span class="meter life"><i style="width:' + (P.life / START_LIFE * 100) + '%"></i></span></div>' +
    '<div class="gauge"><span class="cap">Juice</span><span class="num juice">' + P.juice + "</span>" +
      '<span class="meter juice"><i style="width:' + (P.juice / juiceCap() * 100) + '%"></i></span></div>' +
    chip;
}

function unitHTML(P, i, hot){
  const u = P.lanes[i];
  if(!u) return "";
  const def = CARDS[u.id];
  const a = atkOf(P, i);
  const cls = ["unit"];
  if(u.kind === "structure") cls.push("structure");
  if(u.sick) cls.push("sick");
  if(u.tapped) cls.push("tapped");
  if(!seenUnits.has(u.uid)){ cls.push("fresh"); seenUnits.add(u.uid); }
  if(P.side === "you" && canFloop(P, i) && S.active === "you" && !S.over && !S.pending) cls.push("can-floop");
  if(hot) cls.push("targetable");
  let tag = "";
  if(u.sick) tag = '<span class="utag zzz">zzz</span>';
  else if(u.wither) tag = '<span class="utag">−' + u.wither + " atk</span>";
  else if(u.wander !== undefined) tag = '<span class="utag rush">leaves</span>';
  const stats = u.kind === "structure"
    ? '<span class="pip hp">' + u.hp + "/" + u.maxHp + "</span>"
    : '<span class="pip atk' + (a > def.atk ? " buffed" : "") + '">' + a + "</span>" +
      '<span class="pip hp">' + u.hp + "/" + u.maxHp + "</span>";
  return '<div class="' + cls.join(" ") + '" data-card="' + u.id + '">' + tag +
    '<span class="uart">' + def.art + "</span>" +
    '<span class="uname">' + esc(def.name) + "</span>" +
    '<span class="ustats">' + stats + "</span></div>";
}

function renderLanes(P, elId, isFoe, t){
  const hot = isFoe ? t.foes : t.mine;
  let html = "";
  for(let i=0;i<4;i++){
    const L = LAND[P.lands[i]];
    const legal = hot.has(i);
    const unitHot = legal && (t.kind === "enemyUnit" || t.kind === "myUnit") && !!P.lanes[i];
    const slotCls = ["slot"];
    if(legal && !unitHot) slotCls.push(isFoe ? "hittable" : "legal");
    html +=
      '<div class="lane ' + (isFoe ? "foe" : "you") + '">' +
        '<div class="land" style="--land:' + L.color + '" title="' + esc(L.name + " — " + L.note) + '">' +
          '<span class="lico">' + L.icon + "</span>" +
          '<span class="ltext"><span class="lname">' + esc(L.name) + "</span>" +
          '<span class="lbuff">' + esc(L.buff) + "</span></span></div>" +
        '<div class="' + slotCls.join(" ") + '" id="slot-' + P.side + "-" + i + '" data-side="' + P.side + '" data-lane="' + i + '">' +
          unitHTML(P, i, unitHot) +
        "</div></div>";
  }
  $(elId).innerHTML = html;
}

function renderSeam(){
  let html = "";
  for(let i=0;i<4;i++){
    const youUp = S.you.lanes[i] && !S.you.lanes[i].tapped && S.you.lanes[i].kind !== "structure" && atkOf(S.you, i) > 0;
    const foeUp = S.foe.lanes[i] && S.foe.lanes[i].kind !== "structure" && atkOf(S.foe, i) > 0;
    const youOpen = youUp && !S.foe.lanes[i];
    const foeOpen = foeUp && !S.you.lanes[i];
    let label = "lane " + (i + 1), cls = "";
    if(youOpen && foeOpen){ label = "open both ways"; cls = "open"; }
    else if(youOpen){ label = "open ↑"; cls = "open"; }
    else if(foeOpen){ label = "open ↓"; cls = "open"; }
    html += '<span class="' + cls + '">' + label + "</span>";
  }
  $("seam").innerHTML = html;
}

function cardHTML(id, P, opts){
  opts = opts || {};
  const def = CARDS[id];
  const cls = ["card", def.kind];
  let cost = def.cost, deal = false;
  if(P && def.kind !== "spell"){
    const b = bestCost(P, def);
    if(b < def.cost){ cost = b; deal = true; }
  }
  if(opts.sel) cls.push("sel");
  if(opts.broke) cls.push("broke");
  const stats = def.kind === "spell" ? '<span class="ckind">Spell</span>' :
    def.kind === "structure" ? '<span class="cstats"><span class="pip hp">' + def.hp + "</span></span>" :
    '<span class="cstats"><span class="pip atk">' + def.atk + '</span><span class="pip hp">' + def.hp + "</span></span>";
  return '<div class="' + cls.join(" ") + '"' + (opts.attrs || "") + '>' +
    '<span class="band"></span>' +
    '<span class="cost' + (deal ? " deal" : "") + '">' + cost + "</span>" +
    '<span class="cart">' + def.art + "</span>" +
    '<span class="cname">' + esc(def.name) + "</span>" +
    stats +
    (def.home ? '<span class="chome" title="' + esc("Home: " + LAND[def.home].name) + '">' + LAND[def.home].icon + "</span>" : "") +
    "</div>";
}

function renderHand(){
  const P = S.you;
  let html = "";
  for(let i=0;i<HAND_SIZE;i++){
    const def = CARDS[P.hand[i]];
    const cost = def.kind === "spell" ? def.cost : bestCost(P, def);
    const broke = cost > P.juice || S.active !== "you" || !!S.over;
    html += cardHTML(P.hand[i], P, {
      sel: S.pending && S.pending.handIdx === i,
      broke,
      attrs: ' data-hand="' + i + '" tabindex="0" role="button" aria-label="' + esc(def.name) + '"',
    });
  }
  $("hand").innerHTML = html;
  $("next").innerHTML = cardHTML(P.next, null, {attrs: ' data-peek="' + P.next + '"'});
}

function renderInspect(){
  const id = S.focus || S.you.hand[0];
  const def = CARDS[id];
  const bits = [];
  if(def.kind !== "spell"){
    if(def.kind === "unit") bits.push('<span class="tag atk">' + def.atk + " ATK</span>");
    bits.push('<span class="tag hp">' + def.hp + " HP</span>");
  }
  bits.unshift('<span class="tag cost">' + def.cost + " juice</span>");
  if(def.home) bits.push('<span class="tag home">' + LAND[def.home].icon + " " + esc(LAND[def.home].name) + "</span>");
  const hint = S.pending ? PENDING_HINT[S.pending.kind] : null;
  $("inspect").innerHTML =
    '<div class="ihead"><span class="iart">' + def.art + "</span><span>" +
      '<span class="iname">' + esc(def.name) + "</span><br>" +
      '<span class="imeta">' + (def.kind === "unit" ? "Creature" : def.kind === "structure" ? "Structure" : "Spell") +
      (def.home ? " · home " + esc(LAND[def.home].name) : "") + "</span></span></div>" +
    '<div class="irow">' + bits.join("") + "</div>" +
    '<p class="itext">' + esc(def.text) + "</p>" +
    (hint ? '<p class="ihint">' + esc(hint) + "</p>" : '<p class="iflavor">' + esc(def.flavor || "") + "</p>");
}
const PENDING_HINT = {
  placeUnit: "Pick one of your glowing lanes. Its home terrain knocks 1 off the cost.",
  enemyLane: "Pick an enemy lane. An empty one takes it in the face.",
  myLane: "Pick one of your lanes to retill.",
  myUnit: "Pick the creature you want to move.",
  myEmptyLane: "Pick an empty lane of yours.",
  enemyUnit: "Pick the enemy creature to shoot.",
};

function renderLog(){
  const feed = $("logfeed");
  feed.innerHTML = S.log.map(l => '<p class="' + l.cls + '">' + esc(l.text) + "</p>").join("");
  feed.scrollTop = feed.scrollHeight;
}

function render(){
  if(!S) return;
  const t = targets();
  renderBar(S.foe, "foe-bar", true);
  renderBar(S.you, "you-bar", false);
  renderLanes(S.foe, "foe-lanes", true, t);
  renderLanes(S.you, "you-lanes", false, t);
  renderSeam(); renderHand(); renderInspect(); renderLog();
  $("btn-end").disabled = S.active !== "you" || !!S.over;
  $("btn-end").textContent = S.over ? "Match over" : S.active === "you" ? "End turn" : S.foe.name + " is thinking…";
  flushFx();
}
</script>
<script>
"use strict";
/* =====================================================================
   INPUT
   ===================================================================== */
function flash(msg){ fx("#hand", msg, "note"); }
function myTurn(){ return S && !S.over && S.active === "you"; }

function onHandClick(i){
  if(!myTurn()) return;
  const P = S.you, id = P.hand[i], def = CARDS[id];
  S.focus = id;
  if(S.pending && S.pending.handIdx === i){ S.pending = null; render(); return; }
  S.pending = null;
  const cost = def.kind === "spell" ? def.cost : bestCost(P, def);
  if(cost > P.juice){ flash("Not enough juice"); render(); return; }

  if(def.kind === "spell"){
    const tgt = def.spell.target;
    if(tgt === "enemyLane") S.pending = {kind:"enemyLane", handIdx:i};
    else if(tgt === "myLane") S.pending = {kind:"myLane", handIdx:i};
    else if(tgt === "myUnit"){
      if(!P.lanes.some(u => u)){ flash("Nothing to teleport"); render(); return; }
      if(P.lanes.every(u => u)){ flash("Nowhere to land"); render(); return; }
      S.pending = {kind:"myUnit", handIdx:i};
    } else { playCard(P, i, 0); render(); return; }
  } else if(def.special === "swarm"){
    if(P.lanes.every(u => u)){ flash("Every lane is full"); render(); return; }
    playCard(P, i, 0); render(); return;
  } else {
    if(!P.lanes.some((u, k) => !u && unitCost(P, def, k) <= P.juice)){ flash("No open lane you can afford"); render(); return; }
    S.pending = {kind:"placeUnit", handIdx:i};
  }
  render();
}

function onSlotClick(side, lane){
  if(!myTurn()) return;
  const P = S.you, E = S.foe, p = S.pending;
  if(p){
    if(p.kind === "placeUnit" && side === "you" && !P.lanes[lane] && unitCost(P, CARDS[P.hand[p.handIdx]], lane) <= P.juice){
      S.pending = null; playCard(P, p.handIdx, lane); render(); return;
    }
    if(p.kind === "enemyLane" && side === "foe" && (!E.lanes[lane] || !spellSafe(E, lane))){
      S.pending = null; playCard(P, p.handIdx, lane); render(); return;
    }
    if(p.kind === "myLane" && side === "you"){ openLandPicker(p.handIdx, lane); return; }
    if(p.kind === "myUnit" && side === "you" && P.lanes[lane]){
      S.pending = {kind:"myEmptyLane", handIdx:p.handIdx, from:lane}; render(); return;
    }
    if(p.kind === "myEmptyLane" && side === "you" && !P.lanes[lane]){
      S.pending = null;
      if(p.handIdx !== undefined) playCard(P, p.handIdx, p.from, lane);
      else doFloop(P, p.floopLane, {target:lane});
      render(); return;
    }
    if(p.kind === "enemyUnit" && side === "foe" && E.lanes[lane]){
      S.pending = null; doFloop(P, p.floopLane, {target:lane}); render(); return;
    }
    S.pending = null; render(); return;
  }
  const here = (side === "you" ? P : E).lanes[lane];
  if(here) S.focus = here.id;
  if(side === "you" && canFloop(P, lane)){
    const f = CARDS[here.id].floop;
    if(f.target === "enemyUnit"){
      if(!E.lanes.some(u => u)){ flash("Nothing to shoot"); render(); return; }
      S.pending = {kind:"enemyUnit", floopLane:lane};
    } else if(f.target === "myEmptyLane"){
      if(P.lanes.every(u => u)){ flash("No empty lane to roll into"); render(); return; }
      S.pending = {kind:"myEmptyLane", floopLane:lane};
    } else doFloop(P, lane);
  }
  render();
}

document.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if(act){ handleAct(act.dataset.act, act.dataset); return; }
  const hand = e.target.closest("[data-hand]");
  if(hand){ onHandClick(+hand.dataset.hand); return; }
  const slot = e.target.closest(".slot");
  if(slot){ onSlotClick(slot.dataset.side, +slot.dataset.lane); return; }
});
document.addEventListener("mouseover", (e) => {
  const c = e.target.closest("[data-hand],[data-peek],[data-card]");
  if(!c || !S) return;
  const id = c.dataset.peek || c.dataset.card || S.you.hand[+c.dataset.hand];
  if(id && id !== S.focus){ S.focus = id; renderInspect(); }
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    if(!$("scrim").hidden){ hideSheet(); return; }
    if(S && S.pending){ S.pending = null; render(); }
    return;
  }
  if(!$("scrim").hidden || !myTurn()) return;
  if(e.key >= "1" && e.key <= "4"){ onHandClick(+e.key - 1); }
  else if(e.key === "e" || e.key === "E"){ endTurn(); }
});
$("btn-end").addEventListener("click", () => { if(myTurn()) endTurn(); });
$("btn-rules").addEventListener("click", showRules);
$("btn-new").addEventListener("click", () => showSetup());

/* =====================================================================
   SHEETS
   ===================================================================== */
function showSheet(html){ $("sheet").innerHTML = html; $("scrim").hidden = false; }
function hideSheet(){ $("scrim").hidden = true; }

function handleAct(act, data){
  if(act === "close"){ hideSheet(); if(S) render(); }
  else if(act === "rules"){ showRules(); }
  else if(act === "setup"){ showSetup(); }
  else if(act === "pickdeck"){ setup.deck = data.key; showSetup(); }
  else if(act === "pickfoe"){ setup.foe = data.key; showSetup(); }
  else if(act === "start"){ hideSheet(); newGame(setup.deck, setup.foe); }
  else if(act === "rematch"){ hideSheet(); newGame(S.youDeck, S.foeKey); }
  else if(act === "land"){
    if(!landPick) return;
    const {handIdx, lane} = landPick;
    landPick = null;
    hideSheet();
    S.pending = null;
    playCard(S.you, handIdx, lane, data.key);
    render();
  }
}

let landPick = null;
function openLandPicker(handIdx, lane){
  landPick = {handIdx, lane};
  showSheet(
    "<h2>Retill lane " + (lane + 1) + "</h2>" +
    "<p>It's <b>" + esc(LAND[S.you.lands[lane]].name) + "</b> right now. Pick what it becomes for the rest of the match.</p>" +
    '<div class="landkey">' + LAND_KEYS.map(k =>
      '<div data-act="land" data-key="' + k + '" style="--land:' + LAND[k].color + '; cursor:pointer"><b>' +
      LAND[k].icon + " " + esc(LAND[k].name) + "</b>" + esc(LAND[k].note) + "</div>").join("") + "</div>" +
    '<div class="foot"><button class="btn ghost" data-act="close" type="button">Cancel</button></div>'
  );
}

const setup = {deck:"blitz", foe:"jake"};
function showSetup(){
  const decks = Object.keys(DECKS).map(k => {
    const d = DECKS[k];
    return '<button class="pick' + (setup.deck === k ? " on" : "") + '" data-act="pickdeck" data-key="' + k + '" type="button">' +
      '<span class="pt">' + esc(d.name) + "</span>" +
      '<span class="pl">' + d.lands.map(l => LAND[l].icon).join(" ") + "</span>" +
      '<span class="pd">' + esc(d.blurb) + "</span></button>";
  }).join("");
  const foes = Object.keys(FOES).map(k => {
    const f = FOES[k];
    return '<button class="pick' + (setup.foe === k ? " on" : "") + '" data-act="pickfoe" data-key="' + k + '" type="button">' +
      '<span class="pt">' + f.art + " " + esc(f.name) + "</span>" +
      '<span class="pd">' + esc(f.blurb) + "</span>" +
      '<span class="pd"><b>' + esc(DECKS[f.deck].name) + "</b> · " + f.skill + "</span></button>";
  }).join("");
  showSheet(
    "<h2>Shuffle up</h2>" +
    "<h3>Your deck &amp; landscapes</h3>" + '<div class="picker">' + decks + "</div>" +
    "<h3>Across the mat</h3>" + '<div class="picker">' + foes + "</div>" +
    '<div class="foot"><button class="btn ghost" data-act="rules" type="button">How to play</button>' +
    (S ? '<button class="btn ghost" data-act="close" type="button">Keep playing</button>' : "") +
    '<button class="btn hero" data-act="start" type="button">Deal me in</button></div>'
  );
}

function showRules(){
  showSheet(
    "<h2>How to play</h2>" +
    "<p>Four lanes, twenty-five life, and a deck of eight. Get them to zero before they get you — or be ahead when BMO calls it on round " + CALL_TURN + ".</p>" +
    "<h3>The cycle</h3>" +
    "<ol><li>You hold <b>four cards</b>. Play one and the <b>next</b> card slides straight into its slot; the card you played goes to the back of the deck. There is no drawing and no shuffling — you always know what's coming around.</li>" +
    "<li><b>Juice</b> arrives at the top of your turn and it ramps: 4, 5, 6, up to 7 a turn. Unspent juice carries over. On round " + OVERTIME_TURN + " it goes <b>double</b>. Whoever plays second gets 2 extra juice to start.</li></ol>" +
    "<h3>The mat</h3>" +
    "<ol><li>Creatures go into <b>your</b> lanes. One per lane.</li>" +
    "<li>A creature is asleep the turn it lands (<b>zzz</b>) unless it has Rush.</li>" +
    "<li>When you end your turn, every rested creature hits the lane opposite it. <b>If the lane is empty, your opponent takes it in the face.</b> If a creature is in the way they fight: yours deals its full attack, and the defender hits back for <b>half of its own attack, rounded down</b>. Nothing with 0 attack ever hits back, which is what makes a wall a wall.</li><li><b>Break through.</b> Kill a defender with damage to spare and the leftover carries straight into your opponent's life. Chump-blocking a big creature only buys you the difference.</li>" +
    "<li>Structures never attack. They just stand there and soak a lane.</li></ol>" +
    "<h3>Flooping</h3>" +
    "<p>Click one of your creatures with a purple ring to <b>floop</b> it. You get the ability, but it taps — no attack from that one this turn. That's the whole trade. FLOOP THE PIG.</p>" +
    "<h3>Landscapes</h3>" +
    "<p>Your four terrains are fixed by your deck (unless you retill one). Every creature standing on a terrain gets its blessing, and a creature played on <b>its own home terrain costs 1 less juice</b>.</p>" +
    '<div class="landkey">' + LAND_KEYS.map(k =>
      '<div style="--land:' + LAND[k].color + '"><b>' + LAND[k].icon + " " + esc(LAND[k].name) + "</b>" + esc(LAND[k].note) + "</div>").join("") + "</div>" +
    "<h3>Shortcuts</h3><p><b>1–4</b> pick a card · <b>E</b> ends your turn · <b>Esc</b> cancels.</p>" +
    '<div class="foot"><button class="btn hero" data-act="close" type="button">Got it</button></div>'
  );
}

function showEnd(byCall){
  const won = S.over === "you", draw = S.over === "draw";
  const head = draw ? "A dead heat" : won ? "You win" : S.foe.name + " wins";
  const verdict = draw
    ? "BMO: Twenty-five rounds and you both look the same. BMO is calling it a draw and going to bed."
    : won
      ? (byCall ? "BMO: Time! You were ahead on life, so the mat is yours." : "BMO: " + S.foe.name + " is out of life points. You are the Cornlord now.")
      : (byCall ? "BMO: Time! " + S.foe.name + " was ahead. Better luck next mat." : "BMO: You are out of life points. " + S.foe.name + " is undefeated. Still.");
  showSheet(
    "<h2>" + esc(head) + "</h2>" +
    "<p>" + esc(verdict) + "</p>" +
    "<h3>Final score</h3>" +
    '<div class="picker"><div class="pick"><span class="pt">You · ' + S.you.life + " life</span>" +
      '<span class="pd">' + esc(S.you.deckName) + "</span></div>" +
      '<div class="pick"><span class="pt">' + esc(S.foe.name) + " · " + S.foe.life + " life</span>" +
      '<span class="pd">' + esc(S.foe.deckName) + "</span></div></div>" +
    '<div class="foot"><button class="btn ghost" data-act="setup" type="button">Change decks</button>' +
    '<button class="btn hero" data-act="rematch" type="button">Rematch</button></div>'
  );
}

   GO
   ===================================================================== */
newGame("blitz", "jake");
</script>

      if(--p.left <= 0) S.pending = null;
    }
    pendBio = null; render();
  }
  else if(act === "deckslot"){ deckPick = deckPick === +data.i ? -1 : +data.i; renderCards(); }
  else if(act === "collcard"){
    const id = data.id;
    if(deckPick >= 0){
      const at = SAVE.deck.indexOf(id);
      if(at >= 0) SAVE.deck[at] = SAVE.deck[deckPick];
      SAVE.deck[deckPick] = id;
      deckPick = -1; persist(); renderCards();
    } else showCardDetail(id);
  }
  else if(act === "upgrade"){
    const id = data.id, o = SAVE.owned[id], need = UPGRADE[o.lvl + 1];
    if(!need){ toast("Already maxed"); return; }
    if(o.copies < need.copies || SAVE.gold < need.gold){ toast("Not enough yet"); return; }
    o.copies -= need.copies; SAVE.gold -= need.gold; o.lvl++;
    persist(); hideSheet(); renderCards(); renderMenu();
    toast(CARDS[id].name + " is level " + o.lvl + "!");
  }
  else if(act === "chest"){ openChest(+data.i); }
  else if(act === "reallyreset"){ SAVE = freshSave(); persist(); hideSheet(); renderMenu(); renderCards(); toast("Fresh mat"); }
  else if(act === "rematch"){ hideSheet(); startBattle(); }
  else if(act === "tomenu"){ hideSheet(); go("menu"); }
}

function showBiomePicker(){
  showSheet("<h2>Pick a biome</h2><p>Retilling is permanent for the rest of the match. Creatures standing there " +
    "take the new blessing immediately.</p>" +
    '<div class="biokey">' + BIO_KEYS.map(k =>
      '<div class="tappable" data-act="bio" data-key="' + k + '" style="--bio:' + BIO[k].color + '"><b>' +
      BIO[k].icon + " " + esc(BIO[k].name) + "</b>" + esc(BIO[k].note) + "</div>").join("") + "</div>" +
    '<div class="foot"><button class="cbtn blue" data-act="close" type="button">Cancel</button></div>');
}
function showCardDetail(id){
  const d = CARDS[id], o = SAVE.owned[id], lv = o ? o.lvl : 1, need = UPGRADE[lv + 1];
  const tags = [];
  (d.tags || []).forEach(t => tags.push('<span class="tag kw">' + esc(t) + "</span>"));
  if(d.houses) tags.push('<span class="tag kw">houses ' + esc(d.houses.join("/")) + "</span>");
  if(d.floop) tags.push('<span class="tag kw">floop</span>');
  showSheet("<h2>" + esc(d.name) + "</h2>" +
    '<div class="detail"><div class="big">' + cardFace(id, {lvl:lv}) + "</div>" +
    '<div class="info"><div class="tags">' +
      '<span class="tag cost">' + d.cost + " juice</span>" +
      (d.kind === "unit" ? '<span class="tag atk">' + (d.atk + lvlBonus(id,lv).atk) + " ATK</span>" : "") +
      (d.kind !== "spell" ? '<span class="tag hp">' + (d.hp + lvlBonus(id,lv).hp) + " HP</span>" : "") +
      '<span class="tag bio" style="--bio:' + BIO[d.bio].color + '">' + BIO[d.bio].icon + " " + esc(BIO[d.bio].name) + "</span>" +
      tags.join("") + "</div>" +
    "<p>" + esc(d.text) + "</p><p style=\"font-style:italic;color:#9FBCE4\">" + esc(d.flavor || "") + "</p>" +
    (o && need ? "<p><b>" + o.copies + " / " + need.copies + "</b> copies · <b>" + need.gold + "</b> gold to reach level " + (lv + 1) + "</p>" : "") +
    "</div></div>" +
    '<div class="foot">' +
      (o && need ? '<button class="cbtn" data-act="upgrade" data-id="' + id + '" type="button">Upgrade</button>' : "") +
      '<button class="cbtn blue" data-act="close" type="button">Close</button></div>');
}
function showRules(){
  showSheet("<h2>How to play</h2>" +
    "<p>Two sides of a mat, a river between them and three bridges across it. Get your opponent from 34 life to 0, " +
    "or be ahead when BMO calls it on round " + CALL_TURN + ".</p>" +
    "<h3>The mat</h3><ol>" +
    "<li>Your half is <b>three lanes by three rows</b>. Every tile is one of six biomes, rolled at random when the match starts.</li>" +
    "<li>Play a creature onto any empty tile of yours. On <b>its own home biome</b> (the little icon on the card) it costs 1 less juice and arrives with +1/+1.</li>" +
    "<li>Spells cost 1 less and hit 1 harder while you control a tile of their home biome.</li>" +
    "<li><b>Floop a tile</b> for " + TILE_FLOOP_COST + " juice, once a turn, to retill it into any biome you like. That's how you bend the mat toward your deck.</li>" +
    "</ol><h3>The fight</h3><ol>" +
    "<li>At the end of your turn, each lane fights across its bridge. <b>Every rested creature in the lane swings</b> — stack a lane and the whole push lands at once.</li><li>All of that damage goes at the enemy's <b>frontmost</b> creature in that lane. Whoever you leave in your own front row is the one who gets hit, so put your tough creatures there.</li>" +
    "<li><b>Ranged</b> creatures reach across from any row, so they can shoot from safety in the back. Melee creatures swing from anywhere too — they just have nowhere to hide.</li>" +
    "<li>The defender hits back for <b>half its attack, rounded down</b>, and that lands on whoever is in <b>your</b> front row — whatever they are. Nothing with 0 attack ever hits back, which is why structures make such good front-row tanks.</li>" +
    "<li>Kill a defender with damage to spare and the rest <b>breaks through</b> into whatever is behind it — and into their life if the lane is empty.</li>" +
    "<li>Structures never swing, but they make excellent front-row tanks — and nothing with 0 attack ever takes a counter-hit.</li>" +
    "</ol><h3>Flooping</h3>" +
    "<p>Tap a creature ringed in purple to <b>floop</b> it: you get its ability, but it doesn't attack this turn. FLOOP THE PIG.</p>" +
    "<h3>Going indoors</h3>" +
    "<p>Some structures take lodgers. Tap a structure, then a creature in the same lane, and it moves in:</p><ul>" +
    "<li><b>The Cave of Solitude</b> — whatever naps inside is invulnerable to all harm, exactly as Finn used it.</li>" +
    "<li><b>The Schoolhouse</b> — a scholar studies: 3 juice a turn and a permanent +1/+1 each time, up to +4/+4.</li>" +
    "<li><b>Spirit Tower</b> — a ranged creature shoots from inside at +3 attack and cannot be touched.</li>" +
    "<li><b>Silo of Truth</b> — pays 2 juice a turn, 3 with a corn creature inside, and heals its lodger.</li>" +
    "</ul><p>If the structure falls, the lodger is turned out into an empty tile in that lane — or goes down with it if there's nowhere to stand.</p>" +
    "<h3>Biomes</h3>" +
    '<div class="biokey">' + BIO_KEYS.map(k =>
      '<div style="--bio:' + BIO[k].color + '"><b>' + BIO[k].icon + " " + esc(BIO[k].name) + "</b>" + esc(BIO[k].note) + "</div>").join("") + "</div>" +
    "<h3>Shortcuts</h3><p><b>1–5</b> pick a card · <b>F</b> floop a tile · <b>E</b> end turn · <b>Esc</b> cancel.</p>" +
    '<div class="foot"><button class="cbtn" data-act="close" type="button">Got it</button></div>');
}

/* =====================================================================
   PROGRESSION
   ===================================================================== */
const CHEST_TIERS = [
  {name:"Wooden", gold:[60,110], cards:[3,5]},
  {name:"Corn", gold:[110,180], cards:[5,8]},
  {name:"Golden", gold:[180,280], cards:[8,13]},
];
const rnd = (a, b) => a + ((Math.random() * (b - a + 1)) | 0);

function awardMatch(){
  const won = S.over === "you", draw = S.over === "draw";
  if(won){
    SAVE.trophies += 30; SAVE.gold += 90; SAVE.xp += 20; SAVE.wins++;
    const slot = SAVE.chests.indexOf(null);
    if(slot >= 0){
      const tier = Math.min(2, Math.floor(arenaIndex(SAVE.trophies) / 2));
      SAVE.chests[slot] = {tier, name:CHEST_TIERS[tier].name};
    }
  } else if(draw){
    SAVE.gold += 40; SAVE.xp += 10;
  } else {
    SAVE.trophies = Math.max(0, SAVE.trophies - 22); SAVE.gold += 25; SAVE.xp += 8; SAVE.losses++;
  }
  SAVE.lvl = 1 + Math.floor(SAVE.xp / xpNeed());
  persist();
}
function openChest(i){
  const c = SAVE.chests[i];
  if(!c) return;
  const t = CHEST_TIERS[c.tier];
  const gold = rnd(t.gold[0], t.gold[1]);
  let left = rnd(t.cards[0], t.cards[1]);
  SAVE.gold += gold;
  const got = {};
  const locked = CARD_KEYS.filter(id => !SAVE.owned[id]);
  if(locked.length && Math.random() < 0.55){
    const nid = locked[(Math.random() * locked.length) | 0];
    SAVE.owned[nid] = {copies:0, lvl:1};
    got[nid] = (got[nid] || 0) + 1;
    left = Math.max(0, left - 1);
  }
  const pool = Object.keys(SAVE.owned);
  while(left > 0){
    const id = pool[(Math.random() * pool.length) | 0];
    const n = Math.min(left, rnd(1, 3));
    SAVE.owned[id].copies += n;
    got[id] = (got[id] || 0) + n;
    left -= n;
  }
  SAVE.chests[i] = null;
  persist();
  showSheet("<h2>" + esc(t.name) + " chest</h2>" +
    "<p>🪙 <b>" + gold + " gold</b></p>" +
    '<div class="collgrid">' + Object.keys(got).map(id =>
      cardFace(id, {lvl:SAVE.owned[id].lvl, copies:SAVE.owned[id].copies, dupes:true})).join("") + "</div>" +
    "<p>" + Object.keys(got).map(id => "+" + got[id] + " " + CARDS[id].name).join(" · ") + "</p>" +
    '<div class="foot"><button class="cbtn" data-act="close" type="button">Nice</button></div>');
  renderMenu();
}
function showEnd(byCall){
  const won = S.over === "you", draw = S.over === "draw";
  const head = draw ? "A dead heat" : won ? "You win!" : S.foe.name + " wins";
  const verdict = draw
    ? "BMO: Eighteen rounds and you both look the same. BMO is calling it a draw and going to bed."
    : won
      ? (byCall ? "BMO: Time! You were ahead on life, so the mat is yours." : "BMO: " + S.foe.name + " is out of life points. You are the Cornlord now.")
      : (byCall ? "BMO: Time! " + S.foe.name + " was ahead." : "BMO: You are out of life points. Rough one.");
  const dTro = won ? "+30" : draw ? "0" : "−22";
  const dGold = won ? "+90" : draw ? "+40" : "+25";
  showSheet("<h2>" + esc(head) + "</h2><p>" + esc(verdict) + "</p>" +
    '<div class="picker">' +
      '<div class="pick"><span class="pt">🏆 ' + dTro + "</span><span class=\"pd\">now " + SAVE.trophies + "</span></div>" +
      '<div class="pick"><span class="pt">🪙 ' + dGold + "</span><span class=\"pd\">now " + SAVE.gold + "</span></div>" +
      '<div class="pick"><span class="pt">' + S.you.life + " vs " + S.foe.life + "</span><span class=\"pd\">life left</span></div>" +
    "</div>" + (won && SAVE.chests.some(c => c) ? "<p>A chest is waiting on the menu.</p>" : "") +
    '<div class="foot"><button class="cbtn blue" data-act="tomenu" type="button">Menu</button>' +
    '<button class="cbtn" data-act="rematch" type="button">Again</button></div>');
}
